سيلة لحماية كبار السن من الكسور، خصوصًا كسر الحوض الخطير.","Sherrington et al., Cochrane Database 2019"],["f","هل تلوث الهواء يضر القلب؟","وش سووا: دراسات كبيرة في أوروبا وأمريكا تابعت ملايين الناس وقاست تلوث الهواء حول بيوتهم سنوات طويلة، أشهرها «دراسة المدن الست» في هارفارد.\nوش لقوا: كل ما زاد تلوث الجسيمات الدقيقة (PM2.5) زادت الوفيات وأمراض القلب والرئة.\nوش استفدنا: صارت منظمة الصحة العالمية تضع حدودًا صارمة للتلوث، وتعده من أكبر أسباب الوفاة في العالم.","Dockery et al., NEJM 1993 (Harvard Six Cities)؛ WHO"],["f","كيف نعرف إن الدواء يشتغل فعلًا؟ (الدواء الوهمي)","وش سووا: في تجارب كثيرة يعطون مرضى حبة بدون أي مادة فعالة، ويقولون لهم إنها علاج.\nوش لقوا: بعض المرضى يتحسنون فعلًا، خصوصًا في الألم والغثيان، لأن التوقع يأثر في الدماغ.\nوش استفدنا: صار أي دواء جديد لازم يتفوق على الدواء الوهمي في تجربة «عمياء»، ما يعرف فيها المريض ولا الطبيب مين أخذ الحقيقي.","Kaptchuk & Miller, NEJM 2015"],["f","هل الصيام المتقطع ينزّل الوزن أكثر؟","وش سووا: تجربة صينية سنة 2022 على 139 شخصًا عندهم سمنة لمدة سنة. المجموعتان أكلتا نفس السعرات، لكن مجموعة أكلت فقط بين 8 الصبح و4 العصر.\nوش لقوا: المجموعتان نزل وزنهما بشكل متقارب، وما كان فيه فرق مهم بينهما.\nوش استفدنا: السر في كمية السعرات أكثر من التوقيت. والصيام المتقطع ينفع اللي يساعده يقلل أكله.","Liu et al., NEJM 2022"],["f","هل النوم يغسل الدماغ؟","وش سووا: الباحثة مايكن نيدرغارد وفريقها صوّروا أدمغة الفئران وهي نايمة ومستيقظة سنة 2013.\nوش لقوا: أثناء النوم تتسع المسافات بين خلايا الدماغ بنحو 60%، ويتدفق سائل ينظف الفضلات مثل بروتين الأميلويد المرتبط بالزهايمر.\nوش استفدنا: فهمنا أن النوم وقت «تنظيف» للدماغ، وهذا من أسباب ربط قلة النوم بأمراض الدماغ.","Xie et al., Science 2013"],["f","هل الكلام مع الأطفال يزيد ذكاءهم؟","وش سووا: الباحثان هارت وريزلي سجلوا كلام 42 أسرة أمريكية مع أطفالهم ساعة شهريًا لأكثر من سنتين.\nوش لقوا: أطفال بعض الأسر سمعوا ملايين الكلمات أكثر من غيرهم قبل سن الرابعة، وكانت حصيلتهم اللغوية أعلى لاحقًا. والدراسات الأحدث وجدت أن المحادثة المتبادلة أهم من مجرد عدد الكلمات.\nوش استفدنا: التحدث والقراءة مع الطفل من الصغر يقوي لغته وتعلمه.","Hart & Risley 1995؛ Romeo et al., Psychological Science 2018"],["f","هل التمر في آخر الحمل يسهل الولادة؟","وش سووا: دراسة في الأردن (2011) على 69 امرأة أكلن 6 تمرات يوميًا في آخر 4 أسابيع من الحمل، وقارنوهن بـ45 امرأة ما أكلن.\nوش لقوا: اللواتي أكلن التمر كان عنق الرحم عندهن أكثر استعدادًا للولادة، واحتجن تحريضًا للولادة أقل.\nوش استفدنا: نتيجة مشجعة، لكن الدراسة صغيرة وتحتاج تأكيدًا بدراسات أكبر.","Al-Kuran et al., Journal of Obstetrics and Gynaecology 2011"],["f","كيف اكتُشف أن البعوض ينقل الملاريا؟","وش سووا: الطبيب البريطاني رونالد روس في الهند سنة 1897 شرّح بعوضًا تغذى على دم مرضى الملاريا.\nوش لقوا: وجد طفيل الملاريا في معدة نوع معين من البعوض (الأنوفيلس).\nوش استفدنا: صارت مكافحة البعوض والناموسيات أهم وسيلة لمحاربة الملاريا، ونال روس نوبل 1902.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف وُجد علاج الملاريا من الطب الصيني؟","وش سووا: العالمة الصينية تو يويو راجعت في السبعينيات وصفات الطب الصيني القديم، وجربت مستخلص نبات الشيح الحلو.\nوش لقوا: مادة الأرتيميسينين في النبات تقتل طفيل الملاريا بسرعة.\nوش استفدنا: صار الأرتيميسينين أساس علاج الملاريا عالميًا وأنقذ ملايين، ونالت نوبل 2015.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف اكتشفوا أن فيروسًا يسبب سرطان عنق الرحم؟","وش سووا: العالم الألماني هارالد تسور هاوزن بحث في الثمانينيات عن فيروسات في أورام عنق الرحم.\nوش لقوا: وجد فيروس الورم الحليمي البشري (HPV) في أغلب هذه الأورام.\nوش استفدنا: طُوّر لقاح HPV الذي يمنع أغلب حالات سرطان عنق الرحم، ونال نوبل 2008.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف صار عندنا جهاز الرنين المغناطيسي؟","وش سووا: العالمان لوتربر ومانسفيلد طوّرا في السبعينيات طريقة لتحويل إشارات ذرات الهيدروجين في الجسم داخل مجال مغناطيسي إلى صور.\nوش لقوا: يمكن تصوير الأنسجة الرخوة كالدماغ والأربطة بدقة عالية بدون أشعة ضارة.\nوش استفدنا: صار الرنين من أهم أدوات التشخيص في الطب، ونالا نوبل 2003.","مؤسسة نوبل (NobelPrize.org)"],["f","من أين جاءت الأشعة السينية؟","وش سووا: الفيزيائي الألماني رونتغن سنة 1895 كان يجرب أنبوبًا كهربائيًا في غرفة مظلمة.\nوش لقوا: أشعة غير مرئية تخترق الجسم وتصور العظام، وصوّر يد زوجته بخاتمها.\nوش استفدنا: بداية التصوير الطبي كله، ونال أول جائزة نوبل في الفيزياء عام 1901.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف بدأت زراعة الكلى؟","وش سووا: الجراح جوزيف موراي في بوسطن سنة 1954 نقل كلية بين توأمين متطابقين، فلا يرفضها الجسم.\nوش لقوا: نجحت العملية وعاش المريض سنوات.\nوش استفدنا: أول زراعة أعضاء ناجحة في التاريخ، وبعدها مع أدوية المناعة صارت الزراعة ممكنة بين غير الأقارب. ونال نوبل 1990.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف بدأت تقنية أطفال الأنابيب؟","وش سووا: روبرت إدواردز وزميله ستيبتو طوروا طريقة تخصيب البويضة خارج الجسم وإرجاعها للرحم.\nوش لقوا: وُلدت لويز براون، أول طفلة أنابيب، في 25 يوليو 1978 في بريطانيا.\nوش استفدنا: وُلد بعدها أكثر من 10 ملايين طفل بهذي التقنية، ونال إدواردز نوبل 2010.","مؤسسة نوبل (NobelPrize.org)"]],"tawhid":[["q","ما أركان الإيمان؟","ستة: الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره.","صحيح مسلم (حديث جبريل)"],["q","ما مراتب القدر؟","أربع: العلم، أي أن الله علم كل شيء. والكتابة، أي أنه كتبه في اللوح المحفوظ. والمشيئة، أي أنه لا يكون شيء إلا بمشيئته. والخلق، أي أنه خالق كل شيء.","شفاء العليل لابن القيم؛ شرح العقيدة الواسطية لابن عثيمين"],["f","العبادة","عرّفها ابن تيمية بأنها اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الظاهرة والباطنة.","العبودية لابن تيمية"],["q","ما شرطا قبول العبادة؟","الإخلاص لله، والمتابعة للنبي ﷺ. ودليل الأول حديث «إنما الأعمال بالنيات»، والثاني حديث «من عمل عملًا ليس عليه أمرنا فهو رد».","صحيح البخاري ومسلم؛ جامع العلوم والحكم لابن رجب"],["f","الأصول الثلاثة","رسالة للشيخ محمد بن عبدالوهاب تقوم على ثلاثة أسئلة في القبر: من ربك؟ وما دينك؟ ومن نبيك؟","ثلاثة الأصول لمحمد بن عبدالوهاب"],["q","ما أنواع التوحيد التي دعا إليها الرسل؟","أصل دعوة الرسل توحيد الألوهية، أي إفراد الله بالعبادة، لقوله تعالى: ﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾.","سورة النحل 36؛ كتاب التوحيد لمحمد بن عبدالوهاب"],["f","الطاغوت","قال ابن القيم: الطاغوت ما تجاوز به العبد حده من معبود أو متبوع أو مطاع.","إعلام الموقعين لابن القيم"],["q","ما نواقض الإسلام العشرة؟","رسالة للشيخ محمد بن عبدالوهاب ذكر فيها عشرة نواقض، أعظمها الشرك في عبادة الله، ومنها السحر، والاستهزاء بالدين، وبغض شيء مما جاء به الرسول ﷺ.","نواقض الإسلام لمحمد بن عبدالوهاب"],["f","الولاء والبراء","محبة المؤمنين ونصرتهم، والبراءة من الشرك وأهله، وهو من لوازم «لا إله إلا الله» عند أهل السنة، مع العدل والإحسان لغير المحاربين.","سورة الممتحنة 4 و8؛ الولاء والبراء لمحمد القحطاني"],["q","ما الفرق بين الإسلام والإيمان والإحسان؟","الإسلام: الأعمال الظاهرة كالشهادتين والصلاة. والإيمان: الاعتقاد الباطن بالأركان الستة. والإحسان: أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك. وهي مراتب متصاعدة.","صحيح مسلم (حديث جبريل)"],["f","الإيمان بالملائكة","من الإيمان بهم: الإيمان بوجودهم، وبمن عُلم اسمه كجبريل وميكائيل وإسرافيل ومالك، وبما عُلم من صفاتهم وأعمالهم كالموكلين بالوحي والمطر والموت.","شرح ثلاثة الأصول لابن عثيمين"],["q","كم عدد الرسل المذكورين في القرآن؟","خمسة وعشرون نبيًا ورسولًا، ذكر منهم ثمانية عشر في سورة الأنعام في الآيات 83 إلى 86.","تفسير ابن كثير؛ سورة الأنعام 83–86"],["f","أولو العزم من الرسل","خمسة: نوح، وإبراهيم، وموسى، وعيسى، ومحمد ﷺ، وذُكروا مجتمعين في سورة الأحزاب الآية 7 وسورة الشورى الآية 13.","تفسير ابن كثير"],["q","ما الكتب السماوية المذكورة في القرآن؟","صحف إبراهيم وموسى، والتوراة على موسى، والزبور على داود، والإنجيل على عيسى، والقرآن على محمد ﷺ، وهو الناسخ لما قبله والمهيمن عليه.","سورة الأعلى 19؛ سورة المائدة 48"],["f","الإيمان باليوم الآخر","يشمل الإيمان بفتنة القبر ونعيمه وعذابه، والبعث، والحشر، والحساب، والميزان، والصراط، والحوض، والشفاعة، والجنة والنار.","شرح العقيدة الواسطية لابن عثيمين"],["q","ما أنواع الشفاعة يوم القيامة؟","أعظمها الشفاعة العظمى للنبي ﷺ في فصل القضاء، وهي المقام المحمود. ومنها الشفاعة لأهل الجنة في دخولها، والشفاعة في أهل الكبائر من الموحدين أن يخرجوا من النار.","صحيح البخاري ومسلم؛ شرح العقيدة الطحاوية"],["f","شروط الشفاعة","إذن الله للشافع، ورضاه عن المشفوع له، لقوله تعالى: ﴿مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ﴾ وقوله: ﴿وَلَا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَىٰ﴾.","سورة البقرة 255؛ سورة الأنبياء 28"],["q","ما حكم تعليق التمائم؟","حرام، وهو من الشرك الأصغر إذا اعتقد أنها سبب، ومن الأكبر إن اعتقد أنها تنفع بذاتها، لحديث «من علق تميمة فقد أشرك». والخلاف بين العلماء في التمائم من القرآن، والأحوط تركها.","مسند أحمد؛ فتح المجيد"],["f","الرقية الشرعية","جائزة بثلاثة شروط: أن تكون بكلام الله أو أسمائه وصفاته أو الأدعية المأثورة، وبلسان عربي أو مفهوم المعنى، وأن يُعتقد أنها سبب والشافي هو الله.","فتح الباري لابن حجر؛ صحيح مسلم «لا بأس بالرقى ما لم يكن فيه شرك»"],["q","ما حكم الذهاب إلى الكهان والعرافين؟","محرم. قال ﷺ: «من أتى عرافًا فسأله عن شيء لم تُقبل له صلاة أربعين ليلة» رواه مسلم. ومن صدّقه فيما يقول فقد كفر بما أُنزل على محمد ﷺ كما في حديث آخر.","صحيح مسلم؛ مسند أحمد"],["f","التطير","التشاؤم بالطيور أو الأيام أو الأرقام ونحوها، وهو من الشرك الأصغر لحديث «الطيرة شرك». وكفارته أن يقول: «اللهم لا خير إلا خيرك ولا طير إلا طيرك ولا إله غيرك».","سنن أبي داود؛ مسند أحمد"],["q","ما حكم الحلف بغير الله؟","محرم، وهو من الشرك الأصغر لحديث «من حلف بغير الله فقد كفر أو أشرك». رواه الترمذي وحسنه. ويكون أكبر إن عظّم المحلوف به كتعظيم الله.","سنن الترمذي؛ القول المفيد لابن عثيمين"],["f","الرياء","أن يعمل العبادة ليراه الناس فيمدحوه، وهو من الشرك الأصغر، وسماه النبي ﷺ «الشرك الخفي». وإذا طرأ على العبادة فدافعه لم يضره.","مسند أحمد؛ جامع العلوم والحكم"],["q","ما أنواع الخوف؟","خوف العبادة والسر: لا يكون إلا لله، وصرفه لغيره شرك. والخوف المحرم: أن يترك واجبًا خوفًا من الناس. والخوف الطبيعي: كالخوف من عدو أو سبع، وهو جائز.","القول المفيد لابن عثيمين"],["f","التوكل","صدق اعتماد القلب على الله في جلب المنافع ودفع المضار، مع الأخذ بالأسباب المشروعة. ولا ينافي العمل، لقوله ﷺ: «اعقلها وتوكل».","سنن الترمذي؛ جامع العلوم والحكم"],["q","ما معنى «لا حول ولا قوة إلا بالله»؟","لا تحوّل من حال إلى حال ولا قدرة على شيء إلا بعون الله، وهي كنز من كنوز الجنة كما في الحديث المتفق عليه.","صحيح البخاري ومسلم (حديث أبي موسى)"],["f","عقيدة أهل السنة في الصفات","إثبات ما أثبته الله لنفسه وأثبته له رسوله ﷺ، من غير تحريف ولا تعطيل، و  وكل رسول نبي، وليس كل نبي رسولًا.","النبوات لابن تيمية؛ شرح العقيدة الطحاوية"],["f","ختم النبوة","محمد ﷺ خاتم النبيين، قال تعالى: ﴿مَّا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾.","سورة الأحزاب 40"],["q","ما أشراط الساعة الكبرى؟","منها: الدخان، والدجال، والدابة، وطلوع الشمس من مغربها، ونزول عيسى ابن مريم، ويأجوج ومأجوج، وثلاثة خسوف، ونار تحشر الناس. كما في حديث حذيفة بن أسيد.","صحيح مسلم"],["f","الإيمان بالغيب","من صفات المتقين في أول سورة البقرة: ﴿الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ﴾، ويشمل كل ما أخبر الله به ورسوله مما لا يُرى كالملائكة والجنة والنار.","سورة البقرة 3؛ تفسير ابن كثير"],["q","ما حكم سب الدهر؟","محرم، لحديث «لا تسبوا الدهر فإن الله هو الدهر»، أي المقلب للأيام، فسبّه يرجع إلى من قدّر الأحداث.","صحيح مسلم؛ القول المفيد لابن عثيمين"],["f","قول «ما شاء الله وشئت»","منهي عنه لما فيه من التسوية، والصواب «ما شاء الله ثم شئت»، كما في حديث الطفيل وحذيفة.","سنن أبي داود؛ مسند أحمد؛ كتاب التوحيد"],["q","ما الدعاء الذي يعد عبادة؟","قال ﷺ: «الدعاء هو العبادة». رواه الترمذي وصححه. وصرف دعاء المسألة لغير الله فيما لا يقدر عليه إلا الله شرك أكبر.","سنن الترمذي؛ فتح المجيد"],["f","الاستعاذة بالله","من التوحيد الاستعاذة بالله وحده، وفي الحديث: «من نزل منزلًا فقال: أعوذ بكلمات الله التامات من شر ما خلق، لم يضره شيء حتى يرتحل منه».","صحيح مسلم (حديث خولة بنت حكيم)"],["q","ما حكم تعظيم القبور بالبناء عليها؟","منهي عنه، لحديث جابر: نهى رسول الله ﷺ أن يُجصص القبر وأن يُقعد عليه وأن يُبنى عليه. رواه مسلم.","صحيح مسلم"],["f","فضل التوحيد","من فضائله أنه يكفر الذنوب، لحديث «يا ابن آدم لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئًا لأتيتك بقرابها مغفرة». رواه الترمذي وحسنه.","سنن الترمذي؛ كتاب التوحيد، باب فضل التوحيد"]]};

const norm=s=>String(s).replace(/<[^>]+>/g,"").replace(/[ً-ْٰـ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي").toLowerCase();

let cur="home", listMode=false, ord={}, pos={}, endNote="", filt="all", query="", opened=new Set(), aiAns=null, busy="";

function buildNav(){

}
function hl(html){
  if(!query)return html;
  // highlight on plain text segments only (outside tags), matching normalized query loosely by words
  const words=query.trim().split(/\s+/).filter(w=>w.length>1);
  if(!words.length)return html;
  return html.replace(/(^|>)([^<]+)(?=<|$)/g,(m,p,txt)=>{
    let out=txt;
    words.forEach(w=>{
      const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(ch=>{
        if("اأإآٱ".includes(ch))return"[اأإآٱ]"; if("هة".includes(ch))return"[هة]"; if("يىئ".includes(ch))return"[يىئ]"; if("وؤ".includes(ch))return"[وؤ]"; return ch;
      }).join("[\\u064B-\\u0652\\u0640]*")+")","gi");
      out=out.replace(re,"<mark>$1</mark>");
    });
    return p+out;
  });
}
function card(it,showCat){

  return `<article class="card" id="k-${it.key}">
    <div class="meta"><span class="tag ${isQ?"q":"f"}">${isQ?"سؤال":"معلومة"}</span>${showCat?`<span class="tag c">${it.cat.n}</span>`:""}${it.ai?'<span class="tag ai">أُضيفت بالذكاء الاصطناعي</span>':""}</div>
    <h3>${hl(Q)}</h3>
    ${open?`<div class="ans">${isQ?'<span class="lead">الجواب:</span>':""}${hl(A)}</div><div class="src"><b>المصدر:</b> ${hl(S)}</div>`
          :`<button class="reveal" data-k="${it.key}">اكشف الجواب</button>`}
  </article>`;
}

let SEEN=new Set();try{SEEN=new Set(JSON.parse(localStorage.getItem("mf-seen")||"[]"))}catch(e){}
function markSeen(k){if(SEEN.has(k))return;SEEN.add(k);try{localStorage.setItem("mf-seen",JSON.stringify([...SEEN]))}catch(e){}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderFor(c){
  const keys=c.all.filter(i=>filt==="all"||i.t===filt).map(i=>i.key);
  const k=c.id+"|"+filt;let o=ord[k];
  if(!o){o=shuffle(keys.filter(x=>!SEEN.has(x))).concat(shuffle(keys.filter(x=>SEEN.has(x))));ord[k]=o;pos[k]=0}
  else{shuffle(keys.filter(x=>!o.includes(x))).forEach(x=>o.push(x))}
  return k;
}

  const c=CATS.find(x=>x.id===cur);
  if(query||listMode){
    let items,title,sub;
    if(query){const nq=norm(query).trim().split(/\s+/).filter(Boolean);items=ALL.filter(it=>nq.every(w=>it.blob.includes(w)));title="نتائج البحث";sub=`«${query}» في كل الأقسام`}
    else{items=c.all;title=c.n;sub="كل بطاقات القسم"}
    if(filt!=="all")items=items.filter(i=>i.t===filt);
    $("#title").textContent=title;$("#sub").textContent=query?`${items.length} بطاقة مطابقة. ${sample?"اضغط «اسأل» لجواب مفصّل.":""}`:sub;
    $("#gen").hidden=!sample||!!query;$("#gen").disabled=!!busy;$("#gen").textContent=busy==="gen"?"جاري التوليد…":"＋ زِد 15 بطاقة جديدة";
    $("#mode").textContent="واحدة واحدة";$("#mode").hidden=!!query;
    const genNote=busy==="gen"?`<div class="aibox"><p class="muted">جاري تجهيز بطاقات جديدة لقسم ${c.n}… قد يأخذ دقيقة.</p></div>`:"";
    $("#list").innerHTML=(query?aiCard():genNote)+(items.length?items.map(it=>card(it,!!query)).join(""):`<div class="empty">ما فيه بطاقات مطابقة${sample?". اضغط «اسأل» ويجيك جواب مفصّل.":". جرّب كلمة أقصر."}</div>`);
    return;
  }
  // focus mode: one card at a time
  const k=orderFor(c),o=ord[k];let i=Math.min(pos[k]||0,Math.max(o.length-1,0));pos[k]=i;
  $("#title").textContent=c.n;
  $("#gen").hidden=true;$("#mode").textContent="عرض الكل كقائمة";$("#mode").hidden=false;
  const it=ALL.find(x=>x.key===o[i]);if(it)markSeen(it.key);
  const unseen=o.filter(x=>!SEEN.has(x)).length;
  const last=i>=o.length-1;
  $("#sub").textContent=`${o.length.toLocaleString("ar-SA")} بطاقة — باقي لك ${unseen.toLocaleString("ar-SA")} ما قرأتها`;
  const nextLbl=busy&&last?"جاري تجهيز معلومات جديدة…":last?(sample?"معلومات جديدة ←":"ابدأ من جديد ↺"):"التالية ←";
  $("#list").innerHTML=(it?card(it,false).replace('class="card"','class="card focus"'):`<div class="empty">ما فيه بطاقات.</div>`)+
    `<div class="pager"><button class="btn" id="prev" ${i===0?"disabled":""}>→ السابقة</button><button class="askbtn" id="next" ${busy&&last?"disabled":""}>${nextLbl}</button></div>`+
    (endNote?`<p class="muted center">${endNote}</p>`:"");
}
async function nextCard(){
  const c=CATS.find(x=>x.id===cur);const k=orderFor(c),o=ord[k];endNote="";
  if((pos[k]||0)<o.length-1){pos[k]++;render();if(sample&&!busy&&o.length-pos[k]<=10)gen();return}
  if(sample){const before=o.length;if(busy){for(let t=0;t<400&&busy;t++)await new Promise(r=>setTimeout(r,300))}else await gen();for(let t=0;t<15&&c.all.length<=before&&sample;t++)await new Promise(r=>setTimeout(r,300));orderFor(c);if(ord[k].length>before){pos[k]=before;}else endNote="ما قدرت أجيب معلومات جديدة الحين. جرّب بعد شوي.";render();return}
  pos[k]=0;endNote="خلصت بطاقات القسم، رجعنا من البداية.";render();
}
let dayOff=0;
function today(){
  const el=$("#today");if(query){el.hidden=true;return}el.hidden=false;
  const pool=ALL.filter(i=>!i.ai);const d=Math.floor(Date.now()/864e5)+dayOff;
  const it=pool[((d*7919)%pool.length+pool.length)%pool.length];
  el.innerHTML=`<div class="tl"><span>${dayOff?"معلومة أخرى":"معلومة اليوم"}</span><span class="muted">من قسم ${it.cat.n}</span></div>
   <h3>${it.q}</h3><p>${it.a}</p><div class="src"><b>المصدر:</b> ${it.s}</div>
   <button class="btn" id="nextT">معلومة ثانية</button>`;
}
function go(id,push=true){cur=id;listMode=false;endNote="";query="";aiAns=null;$("#q").value="";$("#clr").hidden=true;render();if(push){try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}}window.scrollTo({top:0})}

// ---- Claude: detailed answer + growing the library ----
const RULES=`أنت مرجع موسوعي متخصص يكتب بالعربية الفصحى الواضحة. الدقة أهم شيء:
- اعتمد على المراجع المعروفة والكتب المعتمدة والجهات العلمية الرسمية، واذكر المرجع باسمه (كتاب ومؤلفه، أو جهة).
- لا تخترع رقمًا ولا تاريخًا ولا مرجعًا ولا نصًا. إن لم تكن متأكدًا فقل ذلك صراحة.
- في المسائل الشرعية: اعتمد ما عليه جمهور أهل السنة، واذكر الدليل من القرآن (مع اسم السورة ورقم الآية) أو من السنة مع العزو ودرجة الحديث، ولا تذكر حديثًا ضعيفًا إلا مع بيان ضعفه، واذكر خلاف المذاهب الأربعة إن وجد.
- في المسائل الطبية: معلومات عامة موثقة، وليست وصفة علاجية.
- في السياسة: حقائق محايدة بلا رأي.
- في الأنظمة السعودية: اذكر اسم النظام ورقم المادة كما في هيئة الخبراء بمجلس الوزراء، ونبّه إن كانت المادة قد تكون عُدّلت.`;
const CATLIST=CATS.map(c=>`${c.id}=${c.n}`).join("، ");
let ctl=null;
async function ask(){
  if(!sample||!query||busy)return;
  busy="ask";aiAns=null;render();ctl=new AbortController();
  try{
    const r=await sample.json(`${RULES}

سؤال المستخدم: «${query}»
الأقسام المتاحة: ${CATLIST}
طريقة الجواب:
- ابدأ بالجواب المباشر في سطر قصير جدًا (مثال: لو السؤال «كم عدد أركان الصلاة» فالجواب «14 ركنًا»).
- ثم إن كان الجواب له عناصر (أركان، شروط، أنواع، خطوات) اذكرها كاملة في points، كل عنصر قصير بدون شرح.
- detail: اكتبه فقط إذا كان السؤال يحتاج توضيحًا ضروريًا (خلاف مهم، تنبيه)، في جملة أو جملتين، وإلا اتركه فارغًا "".
- لا تزيد ولا تنقص عن حاجة السؤال، ولا مقدمات.
أرجع JSON فقط:
{"cat":"معرف القسم","title":"السؤال مصاغًا باختصار","direct":"الجواب المباشر","points":[],"detail":"","sources":["المرجع"]}`,{modelTier:"complex",signal:ctl.signal,onText:()=>{const el=$("#aistream");if(el)el.textContent="يكتب الجواب…"}});
    aiAns=r&&typeof r==="object"?r:{err:"ما وصل جواب واضح. جرّب تعيد صياغة السؤال."};
  }catch(e){
    if(e.code==="not_granted"||e.code==="sampling_disabled"){sample=null;aiAns=null}
    else aiAns=e.code==="cancelled"?null:{err:e.code==="rate_limited"?"وصلت الحد المسموح مؤقتًا. جرّب بعد شوي.":"صار خطأ في جلب الجواب. جرّب مرة ثانية."};
  }
  busy="";render();
}
async function gen(){
  if(!sample||busy)return;
  const c=CATS.find(x=>x.id===cur);busy="gen";render();
  const titles=c.all.map(i=>norm(i.q)).join(" | ").slice(0,9000);
  try{
    const arr=await sample.json(`${RULES}

اكتب 15 بطاقة جديدة لقسم «${c.n}» في موسوعة معارف متقدمة للقارئ العربي.
- نوّع المواضيع داخل القسم، واختر معلومات دقيقة وعميقة يعرفها المختصون لا الشائع المكرر.
- نحو نصفها معلومات (t="f") ونصفها أسئلة بأجوبتها (t="q").
- q: عنوان المعلومة أو نص السؤال. a: الشرح أو الجواب في 2 إلى 4 جمل دقيقة. s: مرجع محدد معروف (كتاب ومؤلفه أو جهة رسمية).
- لا تكرر أي موضوع من هذه العناوين الموجودة: ${titles}
أرجع JSON فقط: مصفوفة من 15 عنصرًا بالشكل {"t":"f","q":"...","a":"...","s":"..."}`,{modelTier:"complex"});
    const items=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.q&&x.a).map(x=>({t:x.t==="q"?"q":"f",q:String(x.q),a:String(x.a),s:String(x.s||"")}))
      .filter(x=>!c.all.some(i=>norm(i.q)===norm(x.q)));
    if(items.length){
      if(db){try{await db.collection("batches").add({cat:c.id,items,at:Date.now()})}catch(e){addLocal(c,items)}}
      else addLocal(c,items);
    }
  }catch(e){if(e.code==="not_granted"||e.code==="sampling_disabled")sample=null}
  busy="";render();
}
function addLocal(c,items){items.forEach((x,i)=>c.extra.push({...x,ai:true,cat:c,key:c.id+"-l"+Date.now()+i,blob:norm(x.q+" "+x.a+" "+x.s)}));rebuild()}
async function saveAns(){
  const c=CATS.find(x=>x.id===aiAns.cat);if(!db||!c)return;
  const a=[aiAns.direct||aiAns.answer||"",...(aiAns.points||[]).map((p,i)=>(i+1)+". "+p),aiAns.detail||""].filter(Boolean).join("\n");
  try{await db.collection("batches").add({cat:c.id,items:[{t:"q",q:String(aiAns.title||query),a,s:(aiAns.sources||[]).join("، ")}],at:Date.now()});aiAns.saved=true}catch(e){}
  render();
}
function hookClaude(){
  if(!window.claude||!window.claude.use)return;
  claude.use("sample").then(s=>{sample=s;render()});
  claude.use("db").then(d=>{db=d;if(!d)return;
    d.collection("batches").limit(1000).onSnapshot(snap=>{
      CATS.forEach(c=>c.extra=c.extra.filter(x=>String(x.key).includes("-l")));
      snap.docs.forEach(doc=>{const v=doc.data()||{};const c=CATS.find(x=>x.id===v.cat);if(!c||!Array.isArray(v.items))return;
        v.items.forEach((x,i)=>{if(!x||!x.q)return;c.extra.push({t:x.t==="q"?"q":"f",q:String(x.q),a:String(x.a||""),s:String(x.s||""),ai:true,cat:c,key:doc.id+"-"+i,blob:norm(x.q+" "+x.a+" "+x.s)})})});
      rebuild();render();
    },()=>{});
  });
}

$("#nav").addEventListener("click",e=>{const b=e.target.closest("button[data-c]");if(b)go(b.dataset.c)});
$("#list").addEventListener("click",e=>{
  const cb=e.target.closest(".catbtn[data-c]");if(cb){go(cb.dataset.c);return}
  if(e.target.closest("#next")){nextCard();return}
  if(e.target.closest("#prev")){const c=CATS.find(x=>x.id===cur);const k=orderFor(c);pos[k]=Math.max(0,(pos[k]||0)-1);endNote="";render();return}
  const ch=e.target.closest(".chip[data-c]");if(ch){go(ch.dataset.c);return}
  if(e.target.closest("#saveAns")){saveAns();return}
  if(e.target.closest("#stop")){ctl&&ctl.abort();return}
  const b=e.target.closest(".reveal");if(!b)return;opened.add(b.dataset.k);const it=ALL.find(x=>x.key===b.dataset.k);b.closest(".card").outerHTML=card(it,!!query)});
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;filt=b.dataset.f;try{localStorage.setItem("mf-filter",filt)}catch(_){}render()});
let tmr;$("#q").addEventListener("input",e=>{clearTimeout(tmr);tmr=setTimeout(()=>{query=e.target.value.trim();aiAns=null;$("#clr").hidden=!query;render()},150)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){clearTimeout(tmr);query=e.target.value.trim();$("#clr").hidden=!query;aiAns=null;if(sample&&query)ask();else render()}});
$("#ask").addEventListener("click",()=>{query=$("#q").value.trim();$("#clr").hidden=!query;if(query)ask();else $("#q").focus()});
$("#clr").addEventListener("click",()=>{query="";aiAns=null;$("#q").value="";$("#clr").hidden=true;render();$("#q").focus()});
$("#gen").addEventListener("click",gen);
$("#mode").addEventListener("click",()=>{listMode=!listMode;render();window.scrollTo({top:0})});
$("#today").addEventListener("click",e=>{if(e.target.closest("#nextT")){dayOff++;today()}});
$("#rnd").addEventListener("click",()=>{
  const pool=ALL.filter(i=>i.t==="q");const it=pool[Math.floor(Math.random()*pool.length)];
  filt="all";opened.delete(it.key);go(it.cat.id);
  const k=orderFor(it.cat);pos[k]=ord[k].indexOf(it.key);render();
});
function fromHash(){const h=location.hash.slice(1);if(CATS.some(c=>c.id===h))go(h,false);else{cur="home";render()}}
window.addEventListener("hashchange",fromHash);
rebuild();fromHash();hookClaude();
</script>
