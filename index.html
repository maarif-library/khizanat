ية","تُعد رواية «زينب» لمحمد حسين هيكل (1913) من أوائل الروايات العربية الحديثة، مع خلاف حول أعمال أسبق.","Britannica؛ دراسات الأدب العربي الحديث"],["q","لماذا يُسمى الحاسوب «كمبيوتر»؟","من الفعل الإنجليزي compute أي «يحسب»، وكان اللقب يطلق قبل الأجهزة على الأشخاص الذين يجرون الحسابات يدويًا.","Oxford English Dictionary"],["f","أول مبرمجة في التاريخ","آدا لوفليس كتبت عام 1843 خوارزمية لآلة تشارلز باباج التحليلية، وتعد أول برنامج حاسوبي منشور.","Britannica؛ Science Museum London"],["q","ما معنى «بت» و«بايت»؟","البت أصغر وحدة معلومات: 0 أو 1. والبايت ثمانية بتات، ويكفي لتمثيل حرف واحد في الترميزات البسيطة.","Britannica؛ IEC"],["f","الذكاء الاصطناعي مصطلح قديم","صيغ مصطلح «الذكاء الاصطناعي» في مؤتمر دارتموث عام 1956 بمبادرة جون مكارثي.","Britannica؛ Dartmouth College"],["q","من أسس شركة أبل؟","ستيف جوبز وستيف وزنياك ورونالد واين في 1 أبريل 1976. وأُطلق أول آيفون عام 2007.","Britannica؛ Apple"],["f","الإنترنت في السعودية","أُتيح الإنترنت للعامة في المملكة عام 1999م، بعد أن كان مقصورًا على الجهات الأكاديمية والبحثية.","هيئة الاتصالات والفضاء والتقنية"],["q","ما سبب تسمية «البلوتوث»؟","نسبة إلى ملك دنماركي من القرن العاشر اسمه هارالد «بلوتوث» الذي وحّد قبائل الدنمارك والنرويج، كما توحد التقنية الأجهزة.","Bluetooth SIG"],["f","رمز @","يسمى بالعربية «آت»، وكان يستخدم في التجارة بمعنى «بسعر»، ثم اختاره راي توملينسون للبريد الإلكتروني عام 1971.","Smithsonian؛ Britannica"],["q","ما أغلى معدن ثمين؟","الروديوم في أغلب السنوات الأخيرة أغلى من الذهب والبلاتين، ويستخدم في المحولات الحفازة للسيارات.","Britannica؛ Johnson Matthey"],["f","الذهب لا يصدأ","الذهب من أقل العناصر تفاعلًا كيميائيًا، فلا يصدأ ولا يتآكل، ولهذا تبقى القطع الذهبية القديمة لامعة آلاف السنين.","Britannica؛ مجلس الذهب العالمي"],["q","كم عيار الذهب الخالص؟","عيار 24 هو الذهب الخالص تقريبًا (99.9%)، وعيار 21 نحو 87.5%، وعيار 18 نحو 75%.","مجلس الذهب العالمي (World Gold Council)"],["f","الألماس كربون","الألماس والجرافيت (رصاص القلم) كلاهما كربون نقي، لكن اختلاف ترتيب الذرات يجعل الأول أصلب مادة طبيعية والثاني لينًا.","Britannica؛ GIA"]],"geography":[["q","ما أكبر دولة في العالم مساحة؟","روسيا، بمساحة نحو 17.1 مليون كم²، وتمتد على 11 منطقة زمنية.","CIA World Factbook"],["q","ما أصغر دولة في العالم؟","الفاتيكان، مساحتها نحو 0.44 كم² فقط، وتقع داخل مدينة روما.","CIA World Factbook"],["f","مساحة السعودية","تبلغ مساحة المملكة العربية السعودية نحو 2.15 مليون كم²، وهي أكبر دولة في الشرق الأوسط وثاني أكبر دولة عربية بعد الجزائر.","الهيئة العامة للإحصاء؛ CIA World Factbook"],["q","ما أكبر دولة عربية وأفريقية مساحة؟","الجزائر، بمساحة نحو 2.38 مليون كم².","CIA World Factbook"],["f","أطول نهر في العالم","النيل بطول نحو 6,650 كم يُعد تقليديًا أطول نهر، ويقاربه الأمازون، وبعض القياسات الحديثة ترى الأمازون أطول حسب تحديد منبعه.","Britannica؛ National Geographic"],["q","ما أكبر محيط في العالم؟","المحيط الهادئ، مساحته نحو 165 مليون كم²، أي أكبر من مساحة اليابسة كلها.","NOAA"],["f","أعلى جبل في العالم","إيفرست في جبال الهيمالايا بين نيبال والصين، ارتفاعه 8,848.86 مترًا حسب القياس الرسمي المشترك عام 2020.","National Geographic؛ حكومتا نيبال والصين 2020"],["q","ما أكبر جزيرة في العالم؟","غرينلاند، بمساحة نحو 2.16 مليون كم²، وتتبع الدنمارك. وأستراليا تُصنف قارة لا جزيرة.","CIA World Factbook"],["f","أكبر بحيرة في العالم","بحر قزوين، مساحته نحو 371 ألف كم²، وماؤه مالح قليلًا. وأكبر بحيرة عذبة بالمساحة هي بحيرة سوبيريور في أمريكا الشمالية.","Britannica"],["q","ما أعمق بحيرة في العالم؟","بحيرة بايكال في روسيا، عمقها نحو 1,642 مترًا، وفيها نحو 20% من المياه العذبة السطحية غير المتجمدة في العالم.","اليونسكو؛ Britannica"],["f","عدد قارات العالم","المعتمد في أغلب المناهج سبع قارات: آسيا، أفريقيا، أمريكا الشمالية، أمريكا الجنوبية، القارة القطبية الجنوبية، أوروبا، أستراليا (أوقيانوسيا). وبعض الدول تعدها ستًا أو خمسًا.","National Geographic"],["q","ما أكبر قارة مساحة وسكانًا؟","آسيا، مساحتها نحو 44.6 مليون كم²، ويعيش فيها نحو 60% من سكان العالم.","الأمم المتحدة؛ Britannica"],["f","أعلى قمة في السعودية","تُعد قمة جبل السودة في منطقة عسير، قرب أبها، أعلى قمة في المملكة، بارتفاع يقارب 3,000 متر.","هيئة المساحة الجيولوجية السعودية"],["q","كم عدد مناطق السعودية الإدارية؟","13 منطقة إدارية، منها الرياض ومكة المكرمة والمدينة المنورة والمنطقة الشرقية والقصيم وعسير.","الهيئة العامة للإحصاء"],["f","حرة رهاط وحرات السعودية","في غرب المملكة حقول بركانية واسعة تسمى «الحَرّات»، أكبرها حرة رهاط قرب المدينة المنورة. وآخر ثوران فيها كان سنة 654هـ (1256م) قرب المدينة.","هيئة المساحة الجيولوجية السعودية؛ Camp et al., GSA Bulletin 1987"],["q","ما أكبر واحة نخيل في العالم؟","واحة الأحساء في السعودية، فيها أكثر من 2.5 مليون نخلة، وسُجلت في التراث العالمي لليونسكو عام 2018، ودخلت موسوعة غينيس كأكبر واحة نخيل.","اليونسكو؛ موسوعة غينيس"],["f","خط الاستواء","خط وهمي يقسم الأرض إلى نصفين شمالي وجنوبي، طوله نحو 40,075 كم، ويمر بـ13 دولة منها الإكوادور التي سُميت باسمه.","National Geographic؛ NOAA"],["q","ما مدار السرطان؟","خط عرض 23.4 درجة شمالًا تقريبًا، وتتعامد عليه الشمس نحو 21 يونيو، ويمر في وسط المملكة العربية السعودية جنوب مدينة الرياض.","NOAA؛ Britannica"],["f","لماذا توجد فصول السنة؟","بسبب ميل محور الأرض بنحو 23.4 درجة، لا بسبب قربها وبعدها عن الشمس. فالأرض تكون أقرب للشمس في يناير، أي في شتاء نصفها الشمالي.","NASA"],["q","ما أكثر دول العالم سكانًا؟","الهند، تجاوزت الصين في عدد السكان عام 2023 حسب تقديرات الأمم المتحدة، وكلاهما فوق 1.4 مليار نسمة.","صندوق الأمم المتحدة للسكان (UNFPA) 2023"],["f","أكثر الدول عددًا في الجزر","السويد فيها أكثر من 267 ألف جزيرة حسب إحصاء رسمي، وهي من أكثر دول العالم جزرًا.","هيئة الإحصاء السويدية (SCB) 2013"],["q","ما أكثر مكان مطرًا على الأرض؟","ماوسينرام في ولاية ميغالايا بالهند، متوسط أمطارها السنوي نحو 11,800 ملم.","موسوعة غينيس؛ المنظمة العالمية للأرصاد الجوية (WMO)"],["f","أعلى حرارة مسجلة","سجلت أعلى حرارة رسمية للهواء 56.7 °م في وادي الموت بكاليفورنيا في 10 يوليو 1913م، ولا يزال الرقم معتمدًا لدى المنظمة العالمية للأرصاد.","المنظمة العالمية للأرصاد الجوية (WMO)"],["q","ما أبرد درجة حرارة سجلت على الأرض؟","−89.2 °م في محطة فوستوك بالقارة القطبية الجنوبية في 21 يوليو 1983م.","المنظمة العالمية للأرصاد الجوية (WMO)"],["f","الصحراء الكبرى","أكبر صحراء حارة في العالم، مساحتها نحو 9.2 مليون كم²، أي قرابة مساحة الولايات المتحدة، وتمتد على 11 دولة.","Britannica؛ National Geographic"],["q","ما أخفض نقطة على اليابسة؟","شاطئ البحر الميت، نحو 430 مترًا تحت سطح البحر، وينخفض نحو متر سنويًا بسبب تراجع منسوب الماء.","USGS؛ Britannica"],["f","مضيق باب المندب","يفصل بين اليمن وجيبوتي، عرضه نحو 30 كم، ويربط البحر الأحمر بخليج عدن، ويمر عبره جزء كبير من تجارة النفط العالمية.","إدارة معلومات الطاقة الأمريكية (EIA)"],["q","ما أهم مضيق لنقل النفط في العالم؟","مضيق هرمز بين إيران وعُمان، يمر عبره نحو خُمس استهلاك العالم من النفط.","إدارة معلومات الطاقة الأمريكية (EIA)"],["f","البحر الأحمر يتسع","البحر الأحمر يقع على حدود صفيحتين تكتونيتين تتباعدان ببطء، بمعدل نحو 1 إلى 2 سم سنويًا، وقد يصبح يومًا ما محيطًا.","USGS؛ Britannica"],["q","ما أكبر شعاب مرجانية في العالم؟","الحاجز المرجاني العظيم قبالة أستراليا، بطول نحو 2,300 كم، وهو أكبر بنية صنعتها كائنات حية ويُرى من الفضاء.","هيئة الحاجز المرجاني الأسترالية؛ اليونسكو"],["f","أطول سلسلة جبلية على اليابسة","جبال الأنديز في أمريكا الجنوبية، بطول نحو 7,000 كم، تمر بسبع دول.","Britannica؛ National Geographic"],["q","كم عدد دول العالم؟","193 دولة عضوًا في الأمم المتحدة، إضافة إلى دولتين بصفة مراقب هما الفاتيكان وفلسطين.","الأمم المتحدة (un.org)"],["f","أكثر الدول حدودًا مع غيرها","الصين وروسيا تحدّ كل منهما 14 دولة برًا.","CIA World Factbook"],["q","ما الدولة الوحيدة التي تقع في أربعة نصفي كرة؟","كيريباتي في المحيط الهادئ، يقطعها خط الاستواء وخط الطول 180 فتقع في النصف الشمالي والجنوبي والشرقي والغربي.","CIA World Factbook؛ National Geographic"],["f","خط التاريخ الدولي","خط وهمي قرب خط الطول 180 في المحيط الهادئ، عند عبوره غربًا تضيف يومًا وشرقًا تنقص يومًا، وهو متعرج ليتجنب تقسيم الدول.","NOAA؛ Royal Observatory Greenwich"],["f","جزر فرسان","أرخبيل سعودي في البحر الأحمر قبالة جازان، يضم نحو 84 جزيرة، وفيه محمية طبيعية للغزال الفرساني.","المركز الوطني لتنمية الحياة الفطرية"],["q","ما أطول ساحل للسعودية؟","الساحل الغربي على البحر الأحمر، بطول نحو 1,760 كم، مقابل نحو 650 كم على الخليج العربي.","الهيئة العامة للإحصاء؛ CIA World Factbook"],["f","النفود الكبير","صحراء رملية حمراء في شمال المملكة، مساحتها نحو 65 ألف كم²، وتربطها بالربع الخالي صحراء الدهناء على شكل قوس.","Britannica؛ هيئة المساحة الجيولوجية السعودية"],["q","ما أعمق نقطة في البحر الأحمر؟","نحو 3,000 متر تقريبًا في منخفض سوكن، ومتوسط عمقه نحو 490 مترًا.","Britannica"],["q","ما عاصمة أستراليا؟","كانبرا، وليست سيدني أو ملبورن. واختيرت حلًا وسطًا بين المدينتين المتنافستين، وصارت العاصمة عام 1913.","الحكومة الأسترالية؛ Britannica"],["q","ما عاصمة كندا؟","أوتاوا، وليست تورنتو أو مونتريال.","الحكومة الكندية؛ Britannica"],["q","ما عاصمة تركيا؟","أنقرة منذ عام 1923، وليست إسطنبول.","Britannica"],["q","ما عاصمة البرازيل؟","برازيليا، بُنيت خصيصًا وصارت العاصمة عام 1960 بدل ريو دي جانيرو.","Britannica"],["f","دولة لها ثلاث عواصم","جنوب أفريقيا: بريتوريا عاصمة تنفيذية، وكيب تاون عاصمة تشريعية، وبلومفونتين عاصمة قضائية.","حكومة جنوب أفريقيا؛ Britannica"],["q","ما الدولة الأكثر سكانًا في أفريقيا؟","نيجيريا، بأكثر من 220 مليون نسمة.","الأمم المتحدة — World Population Prospects"],["f","أكبر دولة إسلامية سكانًا","إندونيسيا، بأكثر من 270 مليون نسمة، أغلبهم مسلمون.","الأمم المتحدة؛ Pew Research Center"],["q","ما أكبر مدينة في العالم سكانًا؟","طوكيو الكبرى بنحو 37 مليون نسمة حسب تقديرات الأمم المتحدة لعام 2018، مع تقارب جاكرتا ودلهي في التقديرات الأحدث.","الأمم المتحدة — World Urbanization Prospects"],["f","عدد سكان السعودية","بلغ عدد سكان المملكة نحو 32.2 مليون نسمة حسب تعداد 2022، منهم نحو 58% سعوديون.","الهيئة العامة للإحصاء — تعداد السعودية 2022"],["q","ما أكثر مدن السعودية سكانًا؟","الرياض بنحو 7 ملايين نسمة، ثم جدة ثم مكة المكرمة، حسب تعداد 2022.","الهيئة العامة للإحصاء — تعداد 2022"],["f","مكة المكرمة في وادٍ","تقع مكة في وادٍ بين جبال، وقال تعالى على لسان إبراهيم: ﴿بِوَادٍ غَيْرِ ذِي زَرْعٍ﴾، وأشهر جبالها جبل النور وفيه غار حراء، وجبل ثور.","سورة إبراهيم 37؛ هيئة المساحة الجيولوجية السعودية"],["q","ما وادي حنيفة؟","وادٍ يمر بمدينة الرياض بطول نحو 120 كم، كان مصدر الحياة في المنطقة، وأُعيد تأهيله بيئيًا وصار منتزهًا.","الهيئة الملكية لمدينة الرياض"],["f","جبال طويق","سلسلة جبلية على شكل قوس في وسط نجد بطول نحو 800 كم، وفيها «حافة العالم» قرب الرياض.","هيئة المساحة الجيولوجية السعودية"],["q","ما منطقة نيوم؟","مشروع في شمال غرب المملكة على البحر الأحمر وخليج العقبة، مساحته نحو 26,500 كم²، أُعلن عام 2017 ضمن رؤية 2030.","نيوم (neom.com)"],["f","العلا","محافظة في منطقة المدينة المنورة، فيها الحِجر وآثار دادان ولحيان، وجبال وصخور بأشكال طبيعية مثل «جبل الفيل».","الهيئة الملكية لمحافظة العلا"],["q","ما جزيرة تاروت؟","جزيرة في الخليج العربي قرب القطيف، من أقدم المواقع المأهولة في الجزيرة العربية، وفيها قلعة تاروت.","هيئة التراث السعودية"],["f","أمطار جنوب غرب المملكة","منطقة عسير وجازان والباحة أكثر مناطق المملكة أمطارًا، بسبب الارتفاعات والرياح الموسمية الصيفية.","المركز الوطني للأرصاد"],["q","لماذا يسمى البحر الأحمر بهذا الاسم؟","الأشهر أنه من ازدهار طحالب تميل للحمرة أحيانًا، وقيل من لون الجبال على سواحله، وقيل من دلالة الألوان على الجهات عند القدماء، فالأحمر للجنوب.","Britannica"],["f","مضيق جبل طارق","يفصل بين أوروبا وأفريقيا، عرضه في أضيق نقطة نحو 14 كم، ويربط البحر المتوسط بالمحيط الأطلسي.","Britannica"],["q","ما أعلى شلال في العالم؟","شلال أنجل في فنزويلا بارتفاع نحو 979 مترًا.","Britannica؛ National Geographic"],["f","أكبر شلالات في العالم حجمًا","شلالات إيغوازو بين الأرجنتين والبرازيل تتكون من نحو 275 شلالًا، وشلالات فيكتوريا بين زامبيا وزيمبابوي من أكبر الستائر المائية المتصلة.","اليونسكو"],["q","أين يقع أعمق خانق في العالم؟","خانق يارلونغ تسانغبو في التبت، ويتجاوز عمقه 5 كم في بعض المواضع، أعمق من الأخدود العظيم في أمريكا.","Britannica"],["f","الأخدود العظيم","في ولاية أريزونا الأمريكية، حفره نهر كولورادو على ملايين السنين، طوله نحو 446 كم وعمقه نحو 1.8 كم.","National Park Service الأمريكية"],["q","ما أكبر دلتا نهرية في العالم؟","دلتا نهري الغانج وبراهمابوترا في بنغلاديش والهند، وفيها غابات سونداربان أكبر غابات المانغروف في العالم.","اليونسكو؛ Britannica"],["f","غابات المانغروف في السعودية","تنمو أشجار الشورى (المانغروف) على سواحل البحر الأحمر والخليج العربي، وتعمل المملكة على زراعة ملايين الشتلات منها ضمن مبادرة السعودية الخضراء.","مبادرة السعودية الخضراء؛ المركز الوطني لتنمية الغطاء النباتي"]],"hadith":[["q","ما الحديث الحسن؟","هو ما اتصل سنده بنقل عدل خفّ ضبطه عن مثله، من غير شذوذ ولا علة. فهو كالصحيح إلا أن ضبط بعض رواته أقل.","نزهة النظر لابن حجر"],["q","ما الحديث الضعيف؟","ما لم تجتمع فيه صفات الصحيح ولا الحسن، بفقد شرط أو أكثر من شروط القبول، كانقطاع السند أو ضعف الراوي.","مقدمة ابن الصلاح؛ نزهة النظر"],["f","الحديث الموضوع","هو المكذوب المختلق المنسوب إلى النبي ﷺ، وهو شر أنواع الضعيف، ولا تجوز روايته إلا مع بيان أنه موضوع.","مقدمة ابن الصلاح؛ تدريب الراوي للسيوطي"],["q","ما الفرق بين المرفوع والموقوف والمقطوع؟","المرفوع: ما أضيف إلى النبي ﷺ. والموقوف: ما أضيف إلى الصحابي. والمقطوع: ما أضيف إلى التابعي فمن دونه.","نزهة النظر لابن حجر"],["f","الحديث المرسل","هو ما رفعه التابعي إلى النبي ﷺ مباشرة دون ذكر الصحابي. وجمهور المحدثين يعدونه من الضعيف للجهل بالساقط.","مقدمة ابن الصلاح"],["q","ما الحديث المعلّق؟","ما حُذف من أول إسناده راوٍ أو أكثر من جهة المصنف. وفي صحيح البخاري معلقات كثيرة، وأغلبها موصول في مواضع أخرى من الصحيح أو عند غيره.","نزهة النظر؛ تغليق التعليق لابن حجر"],["f","الآحاد","كل حديث لم يبلغ حد التواتر، وينقسم إلى مشهور: رواه ثلاثة فأكثر في كل طبقة، وعزيز: لا يقل عن اثنين، وغريب: تفرد به راوٍ واحد.","نزهة النظر لابن حجر"],["q","ما مثال الحديث الغريب الصحيح؟","حديث «إنما الأعمال بالنيات»، تفرد به عمر بن الخطاب، ثم علقمة، ثم محمد بن إبراهيم التيمي، ثم يحيى بن سعيد الأنصاري، ثم اشتهر بعده.","فتح الباري لابن حجر"],["f","شرط البخاري في اللقاء","يشترط البخاري لاتصال السند المعنعن أن يثبت لقاء الراوي بشيخه ولو مرة، أما مسلم فيكتفي بالمعاصرة مع إمكان اللقاء. ولهذا قُدّم البخاري في الصحة.","مقدمة صحيح مسلم؛ فتح الباري"],["q","ما اسم صحيح البخاري الكامل؟","«الجامع المسند الصحيح المختصر من أمور رسول الله ﷺ وسننه وأيامه»، وقضى البخاري في جمعه نحو 16 سنة.","هدي الساري مقدمة فتح الباري لابن حجر"],["f","البخاري","هو محمد بن إسماعيل البخاري، وُلد في بخارى سنة 194هـ وتوفي سنة 256هـ. ويُروى أنه كان يحفظ مئات الآلاف من الأحاديث بأسانيدها.","سير أعلام النبلاء للذهبي؛ هدي الساري"],["q","من الإمام مسلم؟","مسلم بن الحجاج القشيري النيسابوري (ت 261هـ)، تلميذ البخاري، وصحيحه يتميز بجمع طرق الحديث الواحد في موضع واحد وحسن الترتيب.","سير أعلام النبلاء للذهبي"],["f","أشهر شروح صحيح البخاري","«فتح الباري» لابن حجر العسقلاني، وهو أشهرها وأوسعها. ومن شروحه أيضًا «عمدة القاري» للعيني، و«إرشاد الساري» للقسطلاني.","كشف الظنون لحاجي خليفة"],["q","ما أشهر شرح لصحيح مسلم؟","«المنهاج شرح صحيح مسلم بن الحجاج» للإمام النووي (ت 676هـ).","كشف الظنون"],["f","الأربعون النووية","مجموعة من 42 حديثًا جمعها الإمام النووي، كل حديث منها قاعدة عظيمة من قواعد الدين، وأولها «إنما الأعمال بالنيات».","الأربعين النووية؛ جامع العلوم والحكم لابن رجب"],["q","ما كتاب «رياض الصالحين»؟","كتاب للإمام النووي جمع فيه نحو 1900 حديث في الآداب والأخلاق والرقائق، مرتبة على أبواب، وهو من أكثر كتب الحديث انتشارًا.","رياض الصالحين للنووي"],["f","بلوغ المرام","كتاب لابن حجر العسقلاني جمع فيه أحاديث الأحكام الفقهية مع بيان درجتها ومن رواها، ومن أشهر شروحه «سبل السلام» للصنعاني.","بلوغ المرام لابن حجر"],["q","ما مسند الإمام أحمد؟","من أكبر دواوين السنة، فيه نحو 27 ألف حديث بالمكرر مرتبة على أسماء الصحابة لا على الأبواب.","المسند بتحقيق الأرناؤوط، مؤسسة الرسالة"],["f","حديث جبريل","فيه سؤال جبريل عليه السلام للنبي ﷺ عن الإسلام والإيمان والإحسان وأشراط الساعة، وقال ﷺ في آخره: «هذا جبريل أتاكم يعلمكم دينكم». رواه مسلم.","صحيح مسلم (حديث عمر)"],["q","ما أركان الإسلام كما في الحديث؟","خمسة: شهادة أن لا إله إلا الله وأن محمدًا رسول الله، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع إليه سبيلًا.","صحيح البخاري ومسلم (حديث ابن عمر)"],["f","«من حسن إسلام المرء»","قال ﷺ: «من حسن إسلام المرء تركه ما لا يعنيه». رواه الترمذي وحسّنه النووي، وهو من أحاديث الأربعين النووية.","سنن الترمذي؛ الأربعين النووية"],["q","ما حديث «الدين النصيحة»؟","قال ﷺ: «الدين النصيحة» قلنا: لمن؟ قال: «لله ولكتابه ولرسوله ولأئمة المسلمين وعامتهم». رواه مسلم.","صحيح مسلم (حديث تميم الداري)"],["f","حديث «لا يؤمن أحدكم»","قال ﷺ: «لا يؤمن أحدكم حتى يحب لأخيه ما يحب لنفسه». متفق عليه.","صحيح البخاري ومسلم (حديث أنس)"],["q","ما حديث «الحلال بيّن والحرام بيّن»؟","قال ﷺ: «إن الحلال بيّن وإن الحرام بيّن، وبينهما مشتبهات لا يعلمهن كثير من الناس، فمن اتقى الشبهات استبرأ لدينه وعرضه». متفق عليه.","صحيح البخاري ومسلم (حديث النعمان بن بشير)"],["f","حديث «احفظ الله يحفظك»","وصية النبي ﷺ لابن عباس: «احفظ الله يحفظك، احفظ الله تجده تجاهك، إذا سألت فاسأل الله، وإذا استعنت فاستعن بالله». رواه الترمذي وقال: حسن صحيح.","سنن الترمذي؛ جامع العلوم والحكم"],["q","ما حديث «لا ضرر ولا ضرار»؟","رواه ابن ماجه والدارقطني وغيرهما، وحسّنه النووي، وصار قاعدة فقهية كبرى: الضرر يُزال.","سنن ابن ماجه؛ جامع العلوم والحكم لابن رجب"],["f","حديث «إذا مات ابن آدم»","قال ﷺ: «إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له». رواه مسلم.","صحيح مسلم (حديث أبي هريرة)"],["q","ما حديث «السبعة الذين يظلهم الله»؟","إمام عادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق بالمساجد، ورجلان تحابا في الله، ورجل دعته امرأة ذات منصب وجمال فقال إني أخاف الله، ورجل تصدق بصدقة فأخفاها، ورجل ذكر الله خاليًا ففاضت عيناه. متفق عليه.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","حديث الكبائر السبع","قال ﷺ: «اجتنبوا السبع الموبقات»: الشرك بالله، والسحر، وقتل النفس التي حرم الله إلا بالحق، وأكل الربا، وأكل مال اليتيم، والتولي يوم الزحف، وقذف المحصنات الغافلات المؤمنات. متفق عليه.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ما معنى «صحيح على شرط الشيخين»؟","أن رجال الإسناد ممن روى لهم البخاري ومسلم في صحيحيهما بالطريقة نفسها، ولم يخرجاه. ويكثر هذا الوصف في «المستدرك» للحاكم.","تدريب الراوي للسيوطي"],["f","أطول حديث في صحيح البخاري","من أطولها حديث كعب بن مالك في قصة تخلفه عن غزوة تبوك وتوبة الله عليه.","صحيح البخاري، كتاب المغازي"],["q","ما علم «العلل»؟","علم يبحث في الأسباب الخفية القادحة في صحة الحديث مع أن ظاهره السلامة، وهو أدق علوم الحديث، ومن كتبه «العلل» للدارقطني و«علل الحديث» لابن أبي حاتم.","مقدمة ابن الصلاح"],["f","الإسناد من الدين","قال عبدالله بن المبارك: «الإسناد من الدين، ولولا الإسناد لقال من شاء ما شاء». رواه مسلم في مقدمة صحيحه.","مقدمة صحيح مسلم"],["q","ما «الصحيفة الصادقة»؟","صحيفة كتبها عبدالله بن عمرو بن العاص من حديث النبي ﷺ في حياته بإذنه، وهي من أقدم ما دُوّن من الحديث.","سنن أبي داود؛ تقييد العلم للخطيب البغدادي"],["f","تدوين السنة رسميًا","أمر الخليفة عمر بن عبدالعزيز (ت 101هـ) بجمع الحديث وتدوينه رسميًا خشية ضياعه، وكتب بذلك إلى أبي بكر بن حزم والإمام الزهري.","صحيح البخاري (كتاب العلم، معلقًا)؛ فتح الباري"],["f","حديث «إن الله كتب الإحسان»","قال ﷺ: «إن الله كتب الإحسان على كل شيء، فإذا قتلتم فأحسنوا القتلة، وإذا ذبحتم فأحسنوا الذبحة، وليحد أحدكم شفرته وليرح ذبيحته». رواه مسلم.","صحيح مسلم (حديث شداد بن أوس)"],["q","ما حديث «اتق الله حيثما كنت»؟","قال ﷺ: «اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها، وخالق الناس بخلق حسن». رواه الترمذي وقال: حسن صحيح.","سنن الترمذي (حديث أبي ذر ومعاذ)؛ الأربعين النووية"],["f","حديث «لا تغضب»","أن رجلًا قال للنبي ﷺ: أوصني، قال: «لا تغضب»، فردد مرارًا، قال: «لا تغضب». رواه البخاري.","صحيح البخاري (حديث أبي هريرة)"],["q","ما حديث «من كان يؤمن بالله واليوم الآخر»؟","«من كان يؤمن بالله واليوم الآخر فليقل خيرًا أو ليصمت، ومن كان يؤمن بالله واليوم الآخر فليكرم جاره، ومن كان يؤمن بالله واليوم الآخر فليكرم ضيفه». متفق عليه.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","حديث «الكلمة الطيبة صدقة»","من حديث أبي هريرة المتفق عليه: «...والكلمة الطيبة صدقة، وكل خطوة يمشيها إلى الصلاة صدقة، ويميط الأذى عن الطريق صدقة».","صحيح البخاري ومسلم"],["q","ما حديث «المسلم من سلم المسلمون من لسانه ويده»؟","قال ﷺ: «المسلم من سلم المسلمون من لسانه ويده، والمهاجر من هجر ما نهى الله عنه». رواه البخاري.","صحيح البخاري (حديث عبدالله بن عمرو)"],["f","حديث «تبسمك في وجه أخيك صدقة»","رواه الترمذي من حديث أبي ذر، وصححه الألباني.","سنن الترمذي"],["q","ما حديث «إن الله لا ينظر إلى صوركم»؟","قال ﷺ: «إن الله لا ينظر إلى صوركم وأموالكم، ولكن ينظر إلى قلوبكم وأعمالكم». رواه مسلم.","صحيح مسلم (حديث أبي هريرة)"],["f","حديث «أحب الأعمال إلى الله»","قال ﷺ: «أحب الأعمال إلى الله أدومها وإن قل». متفق عليه.","صحيح البخاري ومسلم (حديث عائشة)"],["q","ما حديث «من دل على خير»؟","قال ﷺ: «من دل على خير فله مثل أجر فاعله». رواه مسلم.","صحيح مسلم (حديث أبي مسعود الأنصاري)"],["f","حديث «ليس الشديد بالصُّرعة»","قال ﷺ: «ليس الشديد بالصرعة، إنما الشديد الذي يملك نفسه عند الغضب». متفق عليه.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ما حديث «المؤمن القوي خير»؟","قال ﷺ: «المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كل خير، احرص على ما ينفعك واستعن بالله ولا تعجز». رواه مسلم.","صحيح مسلم (حديث أبي هريرة)"],["f","حديث «كلكم راع»","قال ﷺ: «كلكم راع وكلكم مسؤول عن رعيته». متفق عليه.","صحيح البخاري ومسلم (حديث ابن عمر)"],["q","ما حديث «يسروا ولا تعسروا»؟","قال ﷺ: «يسروا ولا تعسروا، وبشروا ولا تنفروا». متفق عليه.","صحيح البخاري ومسلم (حديث أنس)"],["f","حديث «الطهور شطر الإيمان»","قال ﷺ: «الطهور شطر الإيمان، والحمد لله تملأ الميزان، وسبحان الله والحمد لله تملآن ما بين السماوات والأرض». رواه مسلم.","صحيح مسلم (حديث أبي مالك الأشعري)"],["q","ما حديث «لا تحاسدوا»؟","قال ﷺ: «لا تحاسدوا، ولا تناجشوا، ولا تباغضوا، ولا تدابروا، ولا يبع بعضكم على بيع بعض، وكونوا عباد الله إخوانًا». رواه مسلم.","صحيح مسلم (حديث أبي هريرة)"],["f","ثلاث يرضاها الله وثلاث يكرهها","قال ﷺ: «إن الله يرضى لكم ثلاثًا ويكره لكم ثلاثًا: فيرضى لكم أن تعبدوه ولا تشركوا به شيئًا، وأن تعتصموا بحبل الله جميعًا ولا تفرقوا، ويكره لكم: قيل وقال، وكثرة السؤال، وإضاعة المال».","صحيح مسلم (حديث أبي هريرة)"],["f","الرجل الذي سقى كلبًا","أخبر النبي ﷺ عن رجل اشتد عليه العطش فنزل بئرًا فشرب، ثم رأى كلبًا يلهث من العطش، فنزل وملأ خفه ماءً وسقاه، فشكر الله له فغفر له. قالوا: يا رسول الله وإن لنا في البهائم أجرًا؟ قال: «في كل كبد رطبة أجر».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","المرأة التي دخلت النار في هرة","قال ﷺ: «دخلت امرأة النار في هرة ربطتها، فلم تطعمها، ولم تدعها تأكل من خشاش الأرض».","صحيح البخاري ومسلم (حديث ابن عمر وأبي هريرة)"],["q","ما الحديث في فضل إزالة الأذى عن الطريق؟","قال ﷺ: «لقد رأيت رجلًا يتقلب في الجنة في شجرة قطعها من ظهر الطريق كانت تؤذي الناس».","صحيح مسلم (حديث أبي هريرة)"],["f","أجر الزرع والغرس","قال ﷺ: «ما من مسلم يغرس غرسًا أو يزرع زرعًا فيأكل منه طير أو إنسان أو بهيمة إلا كان له به صدقة».","صحيح البخاري ومسلم (حديث أنس)"],["f","الكلمة لا يلقي لها بالًا","قال ﷺ: «إن العبد ليتكلم بالكلمة من رضوان الله لا يلقي لها بالًا يرفعه الله بها درجات، وإن العبد ليتكلم بالكلمة من سخط الله لا يلقي لها بالًا يهوي بها في جهنم».","صحيح البخاري (حديث أبي هريرة)"],["q","ما البردان في حديث «من صلى البردين دخل الجنة»؟","صلاة الفجر وصلاة العصر، وسُميتا بالبردين لأنهما في طرفي النهار وقت البرد.","صحيح البخاري ومسلم (حديث أبي موسى)؛ فتح الباري"],["f","أجر المريض والمسافر","قال ﷺ: «إذا مرض العبد أو سافر كُتب له مثل ما كان يعمل مقيمًا صحيحًا». فلا ينقطع أجر عمله المعتاد بالعذر.","صحيح البخاري (حديث أبي موسى)"],["f","حتى الشوكة","قال ﷺ: «ما يصيب المسلم من نصب ولا وصب ولا هم ولا حزن ولا أذى ولا غم، حتى الشوكة يشاكها، إلا كفّر الله بها من خطاياه».","صحيح البخاري ومسلم (حديث أبي سعيد وأبي هريرة)"],["q","ما حديث «الدنيا سجن المؤمن»؟","قال ﷺ: «الدنيا سجن المؤمن وجنة الكافر». رواه مسلم.","صحيح مسلم (حديث أبي هريرة)"],["f","انظر إلى من هو أسفل منك","قال ﷺ: «انظروا إلى من أسفل منكم، ولا تنظروا إلى من هو فوقكم، فهو أجدر أن لا تزدروا نعمة الله عليكم».","صحيح مسلم (حديث أبي هريرة)"],["q","ما تعريف الكِبر في الحديث؟","قال ﷺ: «إن الله جميل يحب الجمال، الكبر بطر الحق وغمط الناس»، أي رد الحق واحتقار الناس.","صحيح مسلم (حديث ابن مسعود)"],["f","الرفق","قال ﷺ: «إن الله رفيق يحب الرفق، ويعطي على الرفق ما لا يعطي على العنف»، وقال: «إن الرفق لا يكون في شيء إلا زانه، ولا ينزع من شيء إلا شانه».","صحيح مسلم (حديث عائشة)"],["q","من هم «المفرّدون» الذين سبقوا؟","قال ﷺ: «سبق المفرّدون» قالوا: وما المفرّدون يا رسول الله؟ قال: «الذاكرون الله كثيرًا والذاكرات».","صحيح مسلم (حديث أبي هريرة)"],["f","أحب الكلام إلى الله","قال ﷺ: «أحب الكلام إلى الله أربع: سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر، لا يضرك بأيهن بدأت».","صحيح مسلم (حديث سمرة بن جندب)"],["f","مثل الحي والميت","قال ﷺ: «مثل الذي يذكر ربه والذي لا يذكر ربه مثل الحي والميت».","صحيح البخاري (حديث أبي موسى)"],["q","ما حديث «أنا عند ظن عبدي بي»؟","حديث قدسي: «يقول الله تعالى: أنا عند ظن عبدي بي، وأنا معه إذا ذكرني، فإن ذكرني في نفسه ذكرته في نفسي، وإن ذكرني في ملأ ذكرته في ملأ خير منهم».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","ملائكة تلتمس مجالس الذكر","أخبر النبي ﷺ أن لله ملائكة يطوفون في الطرق يلتمسون أهل الذكر، فإذا وجدوا قومًا يذكرون الله حفّوهم بأجنحتهم إلى السماء الدنيا، وفي آخره: «هم الجلساء لا يشقى بهم جليسهم».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","متى يُستجاب الدعاء ومتى لا؟","قال ﷺ: «يُستجاب لأحدكم ما لم يعجل، يقول: دعوت فلم يُستجب لي». فالاستعجال وترك الدعاء من موانع الإجابة.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","الدعاء بظهر الغيب","قال ﷺ: «دعوة المرء المسلم لأخيه بظهر الغيب مستجابة، عند رأسه ملك موكل، كلما دعا لأخيه بخير قال الملك الموكل به: آمين ولك بمثل».","صحيح مسلم (حديث أبي الدرداء)"],["f","أقرب ما يكون العبد من ربه","قال ﷺ: «أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء».","صحيح مسلم (حديث أبي هريرة)"],["q","ما الحديث في فضل الفقه في الدين؟","قال ﷺ: «من يرد الله به خيرًا يفقهه في الدين».","صحيح البخاري ومسلم (حديث معاوية)"],["f","لا حسد إلا في اثنتين","قال ﷺ: «لا حسد إلا في اثنتين: رجل آتاه الله مالًا فسلطه على هلكته في الحق، ورجل آتاه الله الحكمة فهو يقضي بها ويعلمها». والحسد هنا بمعنى الغبطة.","صحيح البخاري ومسلم (حديث ابن مسعود)"],["q","ما النعمتان اللتان يُغبن فيهما كثير من الناس؟","قال ﷺ: «نعمتان مغبون فيهما كثير من الناس: الصحة والفراغ».","صحيح البخاري (حديث ابن عباس)"],["f","كن في الدنيا كأنك غريب","أخذ النبي ﷺ بمنكب ابن عمر فقال: «كن في الدنيا كأنك غريب أو عابر سبيل»، وكان ابن عمر يقول: إذا أمسيت فلا تنتظر الصباح، وإذا أصبحت فلا تنتظر المساء.","صحيح البخاري"],["f","ما نقصت صدقة من مال","قال ﷺ: «ما نقصت صدقة من مال، وما زاد الله عبدًا بعفو إلا عزًا، وما تواضع أحد لله إلا رفعه الله».","صحيح مسلم (حديث أبي هريرة)"],["q","ما دعاء الملكين كل صباح؟","قال ﷺ: «ما من يوم يصبح العباد فيه إلا ملكان ينزلان، فيقول أحدهما: اللهم أعط منفقًا خلفًا، ويقول الآخر: اللهم أعط ممسكًا تلفًا».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","الساعي على الأرملة والمسكين","قال ﷺ: «الساعي على الأرملة والمسكين كالمجاهد في سبيل الله، أو القائم الليل الصائم النهار».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","كافل اليتيم","قال ﷺ: «أنا وكافل اليتيم في الجنة هكذا» وأشار بالسبابة والوسطى وفرّج بينهما شيئًا.","صحيح البخاري (حديث سهل بن سعد)"],["q","ما الحديث في أثر صلة الرحم على الرزق والعمر؟","قال ﷺ: «من سره أن يُبسط له في رزقه، وأن يُنسأ له في أثره، فليصل رحمه».","صحيح البخاري ومسلم (حديث أنس)"],["f","الواصل الحقيقي","قال ﷺ: «ليس الواصل بالمكافئ، ولكن الواصل الذي إذا قُطعت رحمه وصلها».","صحيح البخاري (حديث عبدالله بن عمرو)"],["f","وصية جبريل بالجار","قال ﷺ: «ما زال جبريل يوصيني بالجار حتى ظننت أنه سيورّثه».","صحيح البخاري ومسلم (حديث عائشة وابن عمر)"],["q","كم يجوز للمسلم أن يهجر أخاه؟","قال ﷺ: «لا يحل لمسلم أن يهجر أخاه فوق ثلاث ليال، يلتقيان فيُعرض هذا ويُعرض هذا، وخيرهما الذي يبدأ بالسلام».","صحيح البخاري ومسلم (حديث أبي أيوب)"],["f","حقوق المسلم الست","قال ﷺ: «حق المسلم على المسلم ست: إذا لقيته فسلّم عليه، وإذا دعاك فأجبه، وإذا استنصحك فانصح له، وإذا عطس فحمد الله فشمّته، وإذا مرض فعُده، وإذا مات فاتبعه».","صحيح مسلم (حديث أبي هريرة)"],["q","كيف يوضع القبول للعبد في الأرض؟","قال ﷺ: «إذا أحب الله العبد نادى جبريل: إن الله يحب فلانًا فأحبه، فيحبه جبريل، فينادي جبريل في أهل السماء: إن الله يحب فلانًا فأحبوه، فيحبه أهل السماء، ثم يوضع له القبول في الأرض».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","فرح الله بتوبة عبده","أخبر النبي ﷺ أن الله أشد فرحًا بتوبة عبده من رجل أضل راحلته وعليها طعامه وشرابه في أرض فلاة، فأيس منها ونام، ثم استيقظ فإذا هي عنده، فقال من شدة الفرح: «اللهم أنت عبدي وأنا ربك، أخطأ من شدة الفرح».","صحيح مسلم (حديث أنس)؛ ونحوه في البخاري"],["f","باب التوبة مفتوح","قال ﷺ: «إن الله عز وجل يبسط يده بالليل ليتوب مسيء النهار، ويبسط يده بالنهار ليتوب مسيء الليل، حتى تطلع الشمس من مغربها».","صحيح مسلم (حديث أبي موسى)"],["q","ما قصة قاتل المئة نفس؟","رجل من بني إسرائيل قتل تسعة وتسعين نفسًا، ثم سأل راهبًا هل له توبة فقال لا، فقتله فأكمل المئة. ثم سأل عالمًا فقال: نعم، ومن يحول بينك وبين التوبة؟ اذهب إلى أرض كذا فإن بها قومًا صالحين. فمات في الطريق، فقبضته ملائكة الرحمة لأنه كان أقرب إلى الأرض الصالحة.","صحيح البخاري ومسلم (حديث أبي سعيد الخدري)"],["f","من همّ بحسنة","قال ﷺ في الحديث القدسي: من همّ بحسنة فلم يعملها كتبها الله عنده حسنة كاملة، فإن عملها كتبها عشر حسنات إلى سبعمئة ضعف إلى أضعاف كثيرة، ومن همّ بسيئة فلم يعملها كتبها الله حسنة كاملة، فإن عملها كتبها سيئة واحدة.","صحيح البخاري ومسلم (حديث ابن عباس)"],["q","ما الحديث في التحذير من الظن؟","قال ﷺ: «إياكم والظن، فإن الظن أكذب الحديث، ولا تحسسوا، ولا تجسسوا».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","الصدق يهدي إلى البر","قال ﷺ: «إن الصدق يهدي إلى البر، وإن البر يهدي إلى الجنة، وإن الرجل ليصدق حتى يُكتب عند الله صديقًا، وإن الكذب يهدي إلى الفجور، وإن الفجور يهدي إلى النار».","صحيح البخاري ومسلم (حديث ابن مسعود)"],["q","ما الحديث في السماحة في البيع والشراء؟","قال ﷺ: «رحم الله رجلًا سمحًا إذا باع، وإذا اشترى، وإذا اقتضى».","صحيح البخاري (حديث جابر)"],["f","الأكل من عمل اليد","قال ﷺ: «ما أكل أحد طعامًا قط خيرًا من أن يأكل من عمل يده، وإن نبي الله داود عليه السلام كان يأكل من عمل يده».","صحيح البخاري (حديث المقدام)"],["q","ما أفضل الصيام بعد رمضان؟","قال ﷺ: «أفضل الصيام بعد رمضان شهر الله المحرم، وأفضل الصلاة بعد الفريضة صلاة الليل».","صحيح مسلم (حديث أبي هريرة)"],["f","النزول الإلهي في ثلث الليل","قال ﷺ: «ينزل ربنا تبارك وتعالى كل ليلة إلى السماء الدنيا حين يبقى ثلث الليل الآخر، يقول: من يدعوني فأستجيب له؟ من يسألني فأعطيه؟ من يستغفرني فأغفر له؟».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ما الحديث في نفض الفراش قبل النوم؟","قال ﷺ: «إذا أوى أحدكم إلى فراشه فلينفض فراشه بداخلة إزاره، فإنه لا يدري ما خلفه عليه».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","الاستنثار بعد الاستيقاظ","قال ﷺ: «إذا استيقظ أحدكم من منامه فتوضأ فليستنثر ثلاثًا، فإن الشيطان يبيت على خيشومه».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ماذا يفعل من تثاءب؟","قال ﷺ: «التثاؤب من الشيطان، فإذا تثاءب أحدكم فليرده ما استطاع». وفي رواية مسلم: «فليمسك بيده على فيه».","صحيح البخاري ومسلم (حديث أبي هريرة وأبي سعيد)"],["f","الحجر الصحي في الطاعون","قال ﷺ: «إذا سمعتم بالطاعون بأرض فلا تدخلوها، وإذا وقع بأرض وأنتم بها فلا تخرجوا منها». وهو أصل الحجر الصحي.","صحيح البخاري ومسلم (حديث أسامة بن زيد)"],["q","ما معنى «لا يورد ممرض على مصح»؟","نهي النبي ﷺ أن يُورد صاحب الإبل المريضة إبله على الإبل الصحيحة، وفيه الأخذ بأسباب الوقاية من العدوى.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","لكل داء دواء","قال ﷺ: «ما أنزل الله داء إلا أنزل له شفاء».","صحيح البخاري (حديث أبي هريرة)"],["q","ما الحديث في الحبة السوداء؟","قال ﷺ: «في الحبة السوداء شفاء من كل داء إلا السام»، والسام الموت.","صحيح البخاري ومسلم (حديث أبي هريرة وعائشة)"],["f","حديث الذباب","قال ﷺ: «إذا وقع الذباب في شراب أحدكم فليغمسه ثم لينزعه، فإن في إحدى جناحيه داء والأخرى شفاء».","صحيح البخاري (حديث أبي هريرة)"],["q","ما الحديث في فضل تمر العجوة؟","قال ﷺ: «من تصبّح كل يوم سبع تمرات عجوة لم يضره في ذلك اليوم سم ولا سحر».","صحيح البخاري ومسلم (حديث سعد بن أبي وقاص)"],["f","شجرة في الجنة","قال ﷺ: «إن في الجنة لشجرة يسير الراكب في ظلها مئة عام لا يقطعها».","صحيح البخاري ومسلم (حديث أبي هريرة وسهل بن سعد)"],["q","ما باب الريان؟","قال ﷺ: «إن في الجنة بابًا يقال له الريان، يدخل منه الصائمون يوم القيامة، لا يدخل منه أحد غيرهم».","صحيح البخاري ومسلم (حديث سهل بن سعد)"],["f","موضع سوط في الجنة","قال ﷺ: «موضع سوط في الجنة خير من الدنيا وما فيها».","صحيح البخاري (حديث سهل بن سعد)"],["f","لا تحقرن من المعروف شيئًا","قال ﷺ: «لا تحقرن من المعروف شيئًا، ولو أن تلقى أخاك بوجه طلق».","صحيح مسلم (حديث أبي ذر)"],["q","ما الحديث في الحث على التصدق ولو بالقليل؟","قال ﷺ: «اتقوا النار ولو بشق تمرة، فمن لم يجد فبكلمة طيبة».","صحيح البخاري ومسلم (حديث عدي بن حاتم)"],["f","آية المنافق","قال ﷺ: «آية المنافق ثلاث: إذا حدث كذب، وإذا وعد أخلف، وإذا اؤتمن خان».","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ما حكم الغش في البيع؟","مرّ النبي ﷺ على صُبرة طعام فأدخل يده فيها فنالت أصابعه بللًا، فقال: «من غشنا فليس منا».","صحيح مسلم (حديث أبي هريرة)"],["f","اليد العليا","قال ﷺ: «اليد العليا خير من اليد السفلى»، واليد العليا المنفقة والسفلى السائلة.","صحيح البخاري ومسلم (حديث ابن عمر وحكيم بن حزام)"],["q","ما الحديث في فضل من مات له ولد فصبر؟","قال ﷺ: «ما من مسلم يتوفى له ثلاثة لم يبلغوا الحنث إلا أدخله الله الجنة بفضل رحمته إياهم»، وفي رواية: «أو اثنان».","صحيح البخاري ومسلم (حديث أنس وأبي سعيد)"]],"history":[["f","بداية التاريخ الهجري","جعل عمر بن الخطاب رضي الله عنه هجرة النبي ﷺ بداية للتقويم الإسلامي سنة 17هـ تقريبًا بمشورة الصحابة، وجعلوا أول السنة شهر المحرم.","تاريخ الطبري؛ البداية والنهاية لابن كثير"],["q","متى فُتحت مكة؟","في رمضان من السنة الثامنة للهجرة (630م)، ودخلها النبي ﷺ بعشرة آلاف من أصحابه، وعفا عن أهلها.","سيرة ابن هشام؛ صحيح البخاري"],["f","معركة اليرموك","وقعت سنة 15هـ (636م) بقيادة خالد بن الوليد ثم أبي عبيدة بن الجراح ضد الروم البيزنطيين، وفتحت الشام للمسلمين.","تاريخ الطبري؛ فتوح البلدان للبلاذري"],["q","ما معركة القادسية؟","معركة بين المسلمين بقيادة سعد بن أبي وقاص والفرس الساسانيين سنة 15هـ تقريبًا (636م)، قُتل فيها قائد الفرس رستم، وفتحت العراق.","تاريخ الطبري"],["f","فتح الأندلس","عبر طارق بن زياد المضيق سنة 92هـ (711م)، فسُمّي الجبل باسمه «جبل طارق»، ثم لحقه موسى بن نصير.","نفح الطيب للمقري؛ Britannica"],["q","من مؤسس الدولة الأموية؟","معاوية بن أبي سفيان رضي الله عنه سنة 41هـ (661م)، وجعل دمشق عاصمة لها، واستمرت حتى 132هـ.","تاريخ الطبري؛ البداية والنهاية"],["f","سقوط الدولة الأموية وقيام العباسية","سقطت الدولة الأموية سنة 132هـ (750م) بعد معركة الزاب، وقامت الدولة العباسية وأول خلفائها أبو العباس السفاح، ونجا عبدالرحمن الداخل إلى الأندلس وأسس فيها دولة أموية.","تاريخ الطبري؛ Britannica"],["q","من بنى مدينة بغداد؟","الخليفة العباسي أبو جعفر المنصور، بدأ بناءها سنة 145هـ (762م) وسماها «مدينة السلام»، وكانت مدورة الشكل.","تاريخ بغداد للخطيب البغدادي"],["f","سقوط بغداد بيد المغول","دخل هولاكو بغداد سنة 656هـ (1258م)، وقتل الخليفة المستعصم بالله، وانتهت الخلافة العباسية في بغداد، ودُمرت مكتباتها.","البداية والنهاية لابن كثير؛ Britannica"],["q","من حرر القدس من الصليبيين؟","صلاح الدين الأيوبي بعد انتصاره في معركة حطين، ودخل القدس في 27 رجب 583هـ (2 أكتوبر 1187م).","النوادر السلطانية لابن شداد؛ Britannica"],["f","فتح القسطنطينية","فتحها السلطان العثماني محمد الثاني (الفاتح) في 20 جمادى الأولى 857هـ (29 مايو 1453م)، وكان عمره نحو 21 سنة، وأنهى الدولة البيزنطية.","Britannica؛ تاريخ الدولة العلية العثمانية لمحمد فريد بك"],["q","متى أُلغيت الخلافة العثمانية؟","ألغاها المجلس الوطني التركي في 3 مارس 1924م، بعد إلغاء السلطنة عام 1922.","Britannica"],["f","الدولة السعودية الأولى","أسسها الإمام محمد بن سعود حين تولى الحكم في الدرعية سنة 1139هـ (1727م)، ثم تحالف مع الشيخ محمد بن عبدالوهاب سنة 1157هـ (1744م)، وانتهت سنة 1233هـ (1818م) بسقوط الدرعية.","دارة الملك عبدالعزيز"],["q","متى يوم التأسيس في السعودية؟","22 فبراير من كل عام، ذكرى تأسيس الإمام محمد بن سعود للدولة السعودية الأولى عام 1727م، وأُقرّ بأمر ملكي عام 2022.","دارة الملك عبدالعزيز؛ الأمر الملكي (أ/371) 1443هـ"],["f","الدولة السعودية الثانية","أسسها الإمام تركي بن عبدالله سنة 1240هـ (1824م) وجعل الرياض عاصمتها، وانتهت سنة 1309هـ (1891م).","دارة الملك عبدالعزيز"],["q","متى اكتُشف النفط في السعودية؟","في بئر الدمام رقم 7 عام 1938م، بعد سنوات من الحفر، وكانت بداية الإنتاج التجاري للنفط في المملكة.","أرامكو السعودية"],["f","الحضارة السومرية","يُعد السومريون في جنوب العراق أصحاب أقدم كتابة معروفة، وهي الكتابة المسمارية، نحو 3200 قبل الميلاد.","Britannica؛ The British Museum"],["q","ما أقدم قانون مكتوب معروف كاملًا تقريبًا؟","شريعة حمورابي ملك بابل، نحو 1754 قبل الميلاد، فيها 282 مادة منقوشة على مسلة محفوظة في متحف اللوفر.","متحف اللوفر؛ Britannica"],["f","الأهرامات","هرم خوفو الأكبر في الجيزة بني نحو 2560 قبل الميلاد، وكان أعلى بناء صنعه الإنسان لنحو 3800 سنة، وهو الوحيد الباقي من عجائب الدنيا السبع القديمة.","Britannica؛ اليونسكو"],["q","من فك رموز الهيروغليفية؟","الفرنسي جان فرانسوا شامبليون عام 1822م، اعتمادًا على حجر رشيد الذي يحمل النص نفسه بالهيروغليفية والديموطيقية واليونانية.","المتحف البريطاني"],["f","مدائن صالح (الحِجر)","أول موقع سعودي يُسجَّل في قائمة اليونسكو للتراث العالمي عام 2008، وفيه أكثر من 100 مقبرة منحوتة في الصخر من الحضارة النبطية.","اليونسكو"],["q","ما حضارة الأنباط؟","حضارة عربية ازدهرت بين القرن الرابع قبل الميلاد والقرن الأول الميلادي، عاصمتها البتراء في الأردن، ومن مدنها الحِجر في العلا، وأتقنوا نحت الصخر وإدارة المياه.","اليونسكو؛ Britannica"],["f","الحرب العالمية الأولى","بدأت عام 1914 بعد اغتيال ولي عهد النمسا فرانز فرديناند في سراييفو، وانتهت عام 1918، وقُتل فيها نحو 15 إلى 20 مليون إنسان.","Britannica؛ Imperial War Museum"],["q","متى بدأت الحرب العالمية الثانية وانتهت؟","بدأت في 1 سبتمبر 1939 بغزو ألمانيا لبولندا، وانتهت في 2 سبتمبر 1945 باستسلام اليابان. وهي أكثر الحروب دموية، بأكثر من 60 مليون قتيل.","Britannica؛ National WWII Museum"],["f","القنبلة الذرية","أُلقيت أول قنبلة ذرية على هيروشيما في 6 أغسطس 1945، والثانية على ناغازاكي في 9 أغسطس، وهما الاستخدام الوحيد للسلاح النووي في الحروب.","Britannica"],["q","متى سقط جدار برلين؟","في 9 نوفمبر 1989م، وتوحدت ألمانيا رسميًا في 3 أكتوبر 1990م.","Britannica"],["f","تفكك الاتحاد السوفيتي","انتهى رسميًا في 26 ديسمبر 1991م، وانقسم إلى 15 دولة مستقلة.","Britannica"],["q","متى وصل الإنسان إلى القمر؟","في 20 يوليو 1969م بمركبة أبولو 11، وكان نيل آرمسترونغ أول من مشى عليه، ثم باز ألدرين.","وكالة ناسا (NASA)"],["f","أول رائد فضاء عربي ومسلم","الأمير سلطان بن سلمان بن عبدالعزيز، شارك في رحلة المكوك ديسكفري في يونيو 1985م.","وكالة ناسا (NASA)؛ هيئة الفضاء السعودية"],["q","من أول إنسان صعد إلى الفضاء؟","السوفيتي يوري غاغارين في 12 أبريل 1961م على المركبة فوستوك 1، ودار حول الأرض مرة واحدة في نحو 108 دقائق.","Britannica؛ ESA"],["f","الثورة الصناعية","بدأت في بريطانيا في أواخر القرن الثامن عشر، وكان من أبرز محركاتها تحسين جيمس واط للمحرك البخاري عام 1769م.","Britannica"],["q","متى اختُرعت الطباعة بالحروف المتحركة في أوروبا؟","نحو عام 1440م على يد يوهان غوتنبرغ في ألمانيا، وأول كتاب كبير طبعه كان نحو 1455م.","Britannica"],["f","الصين سبقت بالطباعة","عرفت الصين الطباعة بالألواح الخشبية قبل غوتنبرغ بقرون، وأقدم كتاب مطبوع مؤرخ معروف هو «سوترا الماس» عام 868م، محفوظ في المكتبة البريطانية.","المكتبة البريطانية (British Library)"],["q","ما طريق الحرير؟","شبكة طرق تجارية ربطت الصين بالشرق الأوسط وأوروبا منذ القرن الثاني قبل الميلاد تقريبًا، ونُقل عبرها الحرير والتوابل والورق والأفكار.","اليونسكو؛ Britannica"],["f","الورق انتقل للعالم الإسلامي من الصين","عرف المسلمون صناعة الورق بعد معركة طلاس سنة 751م، وأُسس أول مصنع ورق في بغداد في عهد هارون الرشيد، ومنها انتقل إلى أوروبا عبر الأندلس.","Bloom J., Paper Before Print 2001؛ Britannica"],["q","من أول خليفة عباسي في القاهرة؟","بعد سقوط بغداد أحيا الظاهر بيبرس الخلافة العباسية في القاهرة سنة 659هـ (1261م) بمبايعة المستنصر بالله أحمد، وكانت خلافة رمزية.","البداية والنهاية لابن كثير"],["f","الدولة الأيوبية","أسسها صلاح الدين الأيوبي في مصر سنة 567هـ (1171م) بعد إنهاء الدولة الفاطمية، وامتدت إلى الشام واليمن.","Britannica؛ النوادر السلطانية"],["q","من هو ابن بطوطة؟","رحالة مغربي من طنجة (ت 779هـ/1377م)، قطع نحو 120 ألف كم في نحو 30 سنة، ودوّن رحلته في كتاب «تحفة النظار في غرائب الأمصار».","رحلة ابن بطوطة؛ Britannica"],["f","الإدريسي وخريطة العالم","رسم الشريف الإدريسي سنة 1154م خريطة للعالم لملك صقلية روجر الثاني، مع كتابه «نزهة المشتاق في اختراق الآفاق»، وظلت مرجعًا لقرون.","Britannica؛ المكتبة الوطنية الفرنسية"],["q","متى وصل كولومبوس إلى أمريكا؟","في 12 أكتوبر 1492م، في السنة نفسها التي سقطت فيها غرناطة.","Britannica"],["f","الثورة الفرنسية","بدأت عام 1789م باقتحام سجن الباستيل في 14 يوليو، وأنهت الملكية المطلقة في فرنسا.","Britannica"],["q","متى استقلت الولايات المتحدة؟","أُعلن استقلالها عن بريطانيا في 4 يوليو 1776م، واعترفت بريطانيا به في معاهدة باريس 1783م.","Britannica؛ الأرشيف الوطني الأمريكي"],["f","قناة السويس","افتُتحت عام 1869م، وتربط البحر المتوسط بالبحر الأحمر بطول نحو 193 كم، وأممتها مصر عام 1956م.","هيئة قناة السويس؛ Britannica"],["q","متى افتُتحت قناة بنما؟","عام 1914م، وتربط المحيط الأطلسي بالهادئ بطول نحو 82 كم.","هيئة قناة بنما؛ Britannica"],["f","الإمبراطورية البريطانية","وصلت في ذروتها بعد الحرب العالمية الأولى إلى نحو ربع مساحة اليابسة وربع سكان العالم، ولهذا قيل «الإمبراطورية التي لا تغيب عنها الشمس».","Britannica"],["q","ما بيعة العقبة الأولى والثانية؟","الأولى في السنة الثانية عشرة من البعثة بايع فيها اثنا عشر رجلًا من الأنصار. والثانية في السنة الثالثة عشرة بايع فيها نحو ثلاثة وسبعين رجلًا وامرأتان على النصرة، ومهدت للهجرة.","سيرة ابن هشام؛ الرحيق المختوم"],["f","عام الحزن","السنة العاشرة من البعثة، توفيت فيها خديجة رضي الله عنها وأبو طالب عم النبي ﷺ.","سيرة ابن هشام؛ الرحيق المختوم"],["q","ما حروب الردة؟","حروب خاضها أبو بكر الصديق بعد وفاة النبي ﷺ سنة 11هـ ضد القبائل التي ارتدت أو منعت الزكاة، وأشهر معاركها اليمامة ضد مسيلمة الكذاب.","تاريخ الطبري؛ البداية والنهاية"],["f","فتح مصر","فتحها عمرو بن العاص بين سنتي 20 و21هـ (640–641م) في خلافة عمر، وأسس مدينة الفسطاط.","فتوح مصر لابن عبدالحكم؛ Britannica"],["q","متى فُتحت بيت المقدس أول مرة؟","سنة 15هـ تقريبًا (637م)، وتسلّم عمر بن الخطاب مفاتيحها بنفسه، وكتب لأهلها «العهدة العمرية».","تاريخ الطبري"],["f","معركة نهاوند","سنة 21هـ (642م)، سماها المسلمون «فتح الفتوح»، وانهارت بعدها الدولة الساسانية الفارسية.","تاريخ الطبري"],["q","ما معركة بلاط الشهداء (بواتييه)؟","معركة سنة 114هـ (732م) في فرنسا بين المسلمين بقيادة عبدالرحمن الغافقي والفرنجة بقيادة شارل مارتل، استشهد فيها الغافقي وتوقف التوسع الإسلامي في غرب أوروبا.","Britannica؛ نفح الطيب"],["f","هارون الرشيد","الخليفة العباسي الخامس (170–193هـ)، بلغت بغداد في عهده ذروة الازدهار، وأرسل ساعة مائية هدية لشارلمان ملك الفرنجة.","تاريخ الطبري؛ Britannica"],["q","ما الدولة الفاطمية؟","دولة إسماعيلية شيعية قامت في تونس سنة 297هـ ثم انتقلت لمصر وبنت القاهرة سنة 358هـ والجامع الأزهر، وأنهاها صلاح الدين سنة 567هـ.","Britannica؛ اتعاظ الحنفا للمقريزي"],["f","تأسيس القاهرة والأزهر","بنى جوهر الصقلي القاهرة سنة 358هـ (969م)، وبدأ بناء الجامع الأزهر سنة 359هـ (970م)، وصار من أقدم الجامعات في العالم.","Britannica؛ جامعة الأزهر"],["q","ما الحملات الصليبية؟","حملات عسكرية أوروبية على المشرق الإسلامي بين 1096 و1291م تقريبًا، احتلت القدس سنة 1099م، وانتهت بسقوط عكا آخر معاقلهم سنة 1291م على يد المماليك.","Britannica"],["f","المماليك","حكموا مصر والشام من 648هـ (1250م) إلى 923هـ (1517م)، وهزموا المغول في عين جالوت، وطردوا الصليبيين من الشام.","Britannica؛ السلوك لمعرفة دول الملوك للمقريزي"],["q","متى ضم العثمانيون مصر والشام؟","في عهد السلطان سليم الأول بعد معركتي مرج دابق (1516م) والريدانية (1517م)، وانتهت دولة المماليك.","Britannica"],["f","سليمان القانوني","أطول السلاطين العثمانيين حكمًا (1520–1566م)، بلغت الدولة في عهده ذروة اتساعها، وسُمّي القانوني لكثرة القوانين التي سنّها.","Britannica"],["q","ما حصار فيينا؟","حاصر العثمانيون فيينا مرتين: سنة 1529م بقيادة سليمان القانوني، وسنة 1683م وانتهى بهزيمتهم، وكان بداية تراجعهم في أوروبا.","Britannica"],["f","الدولة الصفوية","قامت في إيران سنة 1501م على يد إسماعيل الصفوي، وفرضت المذهب الشيعي الاثني عشري على إيران.","Britannica"],["q","ما إمبراطورية المغول في الهند؟","أسسها بابر سنة 1526م بعد معركة بانيبات، ومن ملوكها أكبر وشاه جهان الذي بنى تاج محل.","Britannica"],["f","تاج محل","ضريح بناه شاه جهان لزوجته ممتاز محل في أغرا بالهند بين 1632 و1653م تقريبًا، ومسجل في التراث العالمي لليونسكو.","اليونسكو"],["q","ما الحملة الفرنسية على مصر؟","حملة نابليون بونابرت سنة 1798م، احتلت مصر ثلاث سنوات، ورافقها علماء دونوا «وصف مصر»، واكتُشف خلالها حجر رشيد.","Britannica"],["f","محمد علي باشا","حكم مصر من 1805 إلى 1848م، ويُعد مؤسس مصر الحديثة، وأرسل حملة على الدولة السعودية الأولى أسقطت الدرعية سنة 1818م.","Britannica؛ دارة الملك عبدالعزيز"],["q","متى استقلت الهند؟","في 15 أغسطس 1947م، وانقسمت إلى الهند وباكستان.","Britannica"],["f","حرب أكتوبر 1973","شنت مصر وسوريا هجومًا على إسرائيل في 6 أكتوبر 1973م، وعبر الجيش المصري قناة السويس. واستخدمت الدول العربية بقيادة السعودية سلاح النفط بحظر تصديره للدول الداعمة لإسرائيل.","Britannica"],["q","ما معركة السبلة؟","معركة سنة 1347هـ (1929م) انتصر فيها الملك عبدالعزيز على المتمردين من الإخوان، وثبتت بعدها سلطة الدولة.","دارة الملك عبدالعزيز"],["f","لقاء الملك عبدالعزيز وروزفلت","التقى الملك عبدالعزيز الرئيس الأمريكي فرانكلين روزفلت على متن الطراد كوينسي في البحيرات المرة بقناة السويس في 14 فبراير 1945م.","دارة الملك عبدالعزيز؛ مكتبة روزفلت الرئاسية"],["q","من ملوك السعودية بالترتيب؟","الملك عبدالعزيز، ثم سعود، ثم فيصل، ثم خالد، ثم فهد، ثم عبدالله، ثم سلمان.","دارة الملك عبدالعزيز"],["f","الملك فيصل وحظر النفط","في عهد الملك فيصل بن عبدالعزيز (1964–1975م) قادت السعودية حظر النفط عام 1973م، وأدخل التعليم النظامي للبنات عام 1960م حين كان وليًا للعهد.","دارة الملك عبدالعزيز؛ Britannica"],["q","متى توسعة الحرمين الكبرى في عهد الملك فهد؟","بدأت عام 1409هـ (1988م) للمسجد الحرام والمسجد النبوي، وكانت من أكبر التوسعات في تاريخهما، وتلقب الملك فهد بخادم الحرمين الشريفين عام 1986م.","الهيئة العامة للعناية بشؤون المسجد الحرام والمسجد النبوي"],["f","حرب الخليج الثانية","غزا العراق الكويت في 2 أغسطس 1990م، وحررها تحالف دولي بقيادة الولايات المتحدة ومشاركة السعودية في عملية «عاصفة الصحراء» في فبراير 1991م.","Britannica"],["q","ما الحضارة الإسلامية في صقلية؟","حكم المسلمون صقلية نحو قرنين ونصف (827–1091م تقريبًا)، وتركوا أثرًا في الزراعة والعمارة واللغة، واستمر نفوذهم الثقافي في بلاط النورمان بعد ذلك.","Britannica"],["f","حضارة سبأ","مملكة في جنوب الجزيرة العربية، عاصمتها مأرب، اشتهرت بسد مأرب العظيم وتجارة البخور، وذُكرت في القرآن في قصة ملكة سبأ وسيل العرم.","Britannica؛ سورة سبأ"],["q","ما مملكة كندة؟","مملكة عربية قديمة في وسط الجزيرة العربية عاصمتها قرية الفاو جنوب غرب الرياض، ازدهرت قبل الإسلام بقرون، ومن ملوكها امرؤ القيس الشاعر من نسلهم.","هيئة التراث السعودية؛ Britannica"],["f","قرية الفاو","موقع أثري على حافة الربع الخالي، كانت محطة تجارية مهمة، وسُجلت في قائمة التراث العالمي لليونسكو عام 2024.","اليونسكو؛ هيئة التراث السعودية"],["q","ما مواقع التراث العالمي في السعودية؟","منها: الحِجر في العلا، والدرعية التاريخية (حي الطريف)، وجدة التاريخية، والرسوم الصخرية في حائل، وواحة الأحساء، ومنطقة حمى الثقافية، وعروق بني معارض، والفاو.","اليونسكو"],["f","حي الطريف بالدرعية","عاصمة الدولة السعودية الأولى، مبني من الطين بطراز نجدي، وسُجل في التراث العالمي لليونسكو عام 2010.","اليونسكو"]],"law":[["q","كم ساعة العمل الإضافي يُدفع عنها؟","يدفع صاحب العمل للعامل عن ساعات العمل الإضافية أجرًا إضافيًا يوازي أجر الساعة مضافًا إليه 50% من أجره الأساسي.","نظام العمل، المادة 107"],["q","كم مدة إجازة الوضع للمرأة العاملة؟","12 أسبوعًا بأجر كامل حسب نظام العمل بعد تعديلاته، توزعها كيف تشاء بحد أقصى 4 أسابيع قبل التاريخ المرجح للولادة.","نظام العمل، المادة 151 بعد التعديل"],["f","إجازة الزواج والوفاة","يستحق العامل إجازة بأجر كامل 5 أيام عند زواجه، و5 أيام عند وفاة زوجه أو أحد أصوله أو فروعه، وأيامًا عند ولادة مولود له (رُفعت إلى 3 أيام في التعديلات الأخيرة).","نظام العمل، المادة 113"],["q","كم مدة إجازة المرض للعامل؟","30 يومًا بأجر كامل، ثم 60 يومًا بثلاثة أرباع الأجر، ثم 30 يومًا بدون أجر، خلال السنة الواحدة سواء كانت متصلة أو متقطعة.","نظام العمل، المادة 117"],["f","إجازة الحج","يستحق العامل إجازة بأجر كامل لأداء الحج مرة واحدة طوال خدمته، مدتها لا تقل عن 10 أيام ولا تزيد على 15 يومًا، بشرط أن يكون أمضى سنتين متصلتين على الأقل في الخدمة.","نظام العمل، المادة 114"],["q","كم يوم راحة أسبوعية للعامل؟","يوم كامل بأجر على الأقل في الأسبوع، والأصل أن يكون الجمعة، ويجوز إبداله بيوم آخر بعد إبلاغ مكتب العمل.","نظام العمل، المادة 104"],["f","مدة إشعار إنهاء العقد غير المحدد","60 يومًا إذا كان أجر العامل شهريًا، و30 يومًا لغيره، ما لم يتفق على مدة أطول.","نظام العمل، المادة 75"],["q","متى يحق لصاحب العمل فسخ العقد بلا مكافأة؟","في حالات محددة حصرًا، منها: الاعتداء على صاحب العمل أو رؤسائه أثناء العمل، والإخلال بالالتزامات الجوهرية رغم الإنذار، والتزوير للحصول على العمل، والغياب بلا سبب مشروع أكثر من المدد المحددة في النظام بعد الإنذار، وإفشاء أسرار العمل.","نظام العمل، المادة 80"],["f","سن الحدث في العمل","لا يجوز تشغيل من يقل عمره عن 15 سنة، ولا يُسمح بدخولهم أماكن العمل، ويجوز بقرار من الوزير السماح لمن بين 13 و15 سنة بأعمال خفيفة بشروط.","نظام العمل، المادة 162"],["f","قطع الإشارة الحمراء","مخالفة مرورية عقوبتها غرامة من 3000 إلى 6000 ريال، مع إمكانية حجز المركبة، وتُعد من المخالفات الجسيمة.","نظام المرور، جدول المخالفات رقم 6"],["q","ما عقوبة استخدام الجوال أثناء القيادة؟","غرامة من 500 إلى 900 ريال.","نظام المرور، جدول المخالفات؛ الإدارة العامة للمرور"],["f","حزام الأمان","عدم ربط حزام الأمان مخالفة غرامتها من 150 إلى 300 ريال، ويُلزم بها السائق والراكب في المقعد الأمامي.","نظام المرور؛ الإدارة العامة للمرور"],["q","ما عقوبة التفحيط؟","في المرة الأولى: حجز المركبة 15 يومًا وغرامة 20 ألف ريال وإحالة للمحكمة. وتتضاعف في الثانية والثالثة وقد تصل إلى مصادرة المركبة والسجن.","نظام المرور، المادة 69 مكرر"],["f","نظام مكافحة التستر التجاري","يُعاقب المتستر والمتستر عليه بالسجن حتى 5 سنوات، وغرامة حتى 5 ملايين ريال، أو بإحداهما، مع مصادرة الأموال غير المشروعة.","نظام مكافحة التستر (1442هـ)، المادة 9"],["q","ما مدة تقادم الدعاوى العمالية؟","لا تُسمع أمام المحاكم العمالية الدعاوى المتعلقة بالمطالبة بحقوق نظام العمل بعد مضي 12 شهرًا من تاريخ انتهاء علاقة العمل.","نظام العمل، المادة 222"],["f","المحاكم العمالية","بدأت المحاكم العمالية المتخصصة العمل في المملكة عام 1440هـ (2018م)، بعد أن كانت القضايا تُنظر في هيئات تسوية الخلافات العمالية.","وزارة العدل"],["q","ما محكمة الأحوال الشخصية؟","محكمة متخصصة تنظر في قضايا الزواج والطلاق والخلع والنفقة والحضانة والزيارة والإرث وإثبات الوفاة والنسب والوصاية.","نظام المرافعات الشرعية، المادة 33؛ وزارة العدل"],["f","سن الرشد في الأحوال الشخصية","حدد نظام الأحوال الشخصية سن الرشد بتمام 18 سنة هجرية لمن كان عاقلًا غير محجور عليه.","نظام الأحوال الشخصية (1443هـ)"],["q","ما ديوان المظالم؟","جهة القضاء الإداري المستقلة في المملكة، تنظر في الدعاوى ضد الجهات الحكومية، مثل إلغاء القرارات الإدارية ودعاوى التعويض والعقود الإدارية.","نظام ديوان المظالم (1428هـ)"],["f","هيئة التحقيق والادعاء العام صارت النيابة العامة","تحول اسمها إلى «النيابة العامة» بأمر ملكي عام 1438هـ (2017م)، وارتبطت مباشرة بالملك، وتتولى التحقيق في الجرائم والادعاء أمام المحاكم الجزائية.","الأمر الملكي (أ/240) 1438هـ"],["q","ما مدة التوقيف للتحقيق؟","للمحقق توقيف المتهم 5 أيام، ويجوز التمديد بأوامر مسببة حتى 40 يومًا، ثم يحتاج الإحالة للمحكمة أو الإفراج، ولا تتجاوز 6 أشهر إلا بأمر قضائي.","نظام الإجراءات الجزائية، المواد 113 و114"],["f","حق المتهم في محامٍ","للمتهم حق الاستعانة بوكيل أو محامٍ للدفاع عنه في مرحلتي التحقيق والمحاكمة.","نظام الإجراءات الجزائية، المادة 4"],["q","ما عقوبة الشيك بدون رصيد؟","السجن مدة لا تزيد على 5 سنوات، وغرامة لا تزيد على 500 ألف ريال، أو بإحداهما.","نظام الأوراق التجارية، المادة 118"],["f","حماية المستهلك وضمان المنتج","وزارة التجارة تتولى حماية المستهلك، ويحق للمستهلك تقديم البلاغات عبر تطبيق «بلاغ تجاري» أو الرقم 1900.","وزارة التجارة"],["q","ما مدة حق المستهلك في الاستبدال والاسترجاع؟","وفق ضوابط وزارة التجارة: 7 أيام للاسترجاع و15 يومًا للاستبدال من تاريخ الشراء، ما لم يكن المنتج مستخدمًا أو من المستثنيات.","وزارة التجارة — ضوابط الاستبدال والاسترجاع"],["f","نظام التجارة الإلكترونية","صدر عام 1440هـ (2019م)، ويلزم المتاجر الإلكترونية بالإفصاح عن هويتها وعنوانها وتفاصيل المنتج والسعر، ويعطي المستهلك حق فسخ العقد خلال 7 أيام من الاستلام إذا لم يستخدم المنتج.","نظام التجارة الإلكترونية، المادة 13"],["q","ما عقوبة الرشوة؟","السجن حتى 10 سنوات، وغرامة حتى مليون ريال، أو بإحداهما، للموظف العام الذي يطلب أو يقبل رشوة.","نظام مكافحة الرشوة، المادة 1"],["f","هيئة الرقابة ومكافحة الفساد (نزاهة)","تأسست عام 1432هـ (2011م)، ودُمجت معها هيئة الرقابة والتحقيق عام 1441هـ، وتستقبل البلاغات عن الفساد عبر الرقم 980.","هيئة الرقابة ومكافحة الفساد"],["q","ما عقوبة غسل الأموال؟","السجن من 2 إلى 10 سنوات، وغرامة حتى 5 ملايين ريال، أو بإحداهما، وتشدد في حالات منها الجريمة المنظمة.","نظام مكافحة غسل الأموال (1439هـ)، المادة 26"],["f","حماية الطفل","صدر نظام حماية الطفل عام 1436هـ، ويعرّف الطفل بمن لم يتجاوز 18 سنة، ويجرم إيذاءه وإهماله، ويلزم كل من يطلع على حالة إيذاء بالإبلاغ.","نظام حماية الطفل (1436هـ)"],["q","ما رقم الإبلاغ عن العنف الأسري؟","1919، رقم مركز بلاغات العنف الأسري التابع لوزارة الموارد البشرية والتنمية الاجتماعية.","وزارة الموارد البشرية والتنمية الاجتماعية"],["f","نظام الحماية من الإيذاء","صدر عام 1434هـ، ويعاقب على الإيذاء الجسدي أو النفسي أو الجنسي بالسجن من شهر إلى سنة، وغرامة من 5 آلاف إلى 50 ألف ريال، أو بإحداهما.","نظام الحماية من الإيذاء، المادة 13"],["q","ما وثيقة نظام الإثبات؟","نظام صدر عام 1443هـ (2022م) ينظم وسائل الإثبات أمام المحاكم: الإقرار، والاستجواب، والشهادة، والكتابة، والدليل الرقمي، والقرائن، والخبرة، واليمين، والمعاينة.","نظام الإثبات (1443هـ)"],["f","الدليل الرقمي","اعتبر نظام الإثبات الدليل الرقمي، مثل الرسائل الإلكترونية والمحادثات، وسيلة إثبات ذات حجية كالكتابة الرسمية أو العادية بحسب مصدرها.","نظام الإثبات، المواد 53 إلى 58"],["q","ما نظام المعاملات المدنية؟","أول نظام مدني مقنن في المملكة، صدر عام 1444هـ (2023م) وبدأ العمل به في ديسمبر 2023، ينظم العقود والالتزامات والتعويض والملكية.","نظام المعاملات المدنية — هيئة الخبراء بمجلس الوزراء"],["f","الإقامة المميزة","نظام يتيح لغير السعوديين الإقامة الطويلة بمزايا خاصة، أُطلق عام 2019، وتوسع لاحقًا بمنتجات منها إقامة الكفاءات الاستثنائية والموهوبين والمستثمرين.","المركز السعودي للإقامة المميزة"],["q","ما نظام نزع ملكية العقارات للمنفعة العامة؟","يجيز للدولة نزع ملكية عقار للمصلحة العامة مقابل تعويض عادل يقدر بقيمة السوق، ويُصرف قبل الإخلاء.","نظام نزع ملكية العقارات للمنفعة العامة (1424هـ)"]],"medical":[["f","أكبر عضو في جسم الإنسان","الجلد هو أكبر عضو في الجسم، مساحته عند البالغ نحو 1.5 إلى 2 متر مربع، ووزنه نحو 15% من وزن الجسم تقريبًا مع طبقاته.","Gray's Anatomy"],["q","كم عظمة في جسم الإنسان البالغ؟","206 عظمة عند البالغ. ويولد الطفل بنحو 270 إلى 300 عظمة، يلتحم بعضها مع النمو.","Gray's Anatomy"],["f","أصغر عظمة في الجسم","الرِّكاب في الأذن الوسطى هي أصغر عظمة في الجسم، طولها نحو 3 ملم، وتنقل اهتزازات الصوت إلى الأذن الداخلية.","Gray's Anatomy"],["q","ما أطول عظمة في جسم الإنسان؟","عظمة الفخذ، وطولها نحو ربع طول الجسم، وهي أيضًا أقوى عظمة فيه.","Gray's Anatomy"],["f","كمية الدم في الجسم","يحتوي جسم البالغ على نحو 5 لترات من الدم، أي قرابة 7% إلى 8% من وزن الجسم.","Guyton and Hall Textbook of Medical Physiology"],["q","كم يعيش كريّة الدم الحمراء؟","نحو 120 يومًا، ثم يزيلها الطحال والكبد، ويصنع نخاع العظم بدلها باستمرار.","Guyton and Hall Textbook of Medical Physiology"],["f","ما الذي يعطي الدم لونه الأحمر","الهيموغلوبين، وهو بروتين يحتوي على الحديد ويرتبط بالأكسجين وينقله من الرئتين إلى الأنسجة.","Guyton and Hall Textbook of Medical Physiology"],["q","ما معدل نبض القلب الطبيعي للبالغ في الراحة؟","من 60 إلى 100 نبضة في الدقيقة. وقد يكون أقل عند الرياضيين المدربين دون أن يكون مرضًا.","جمعية القلب الأمريكية (AHA)"],["q","ما ضغط الدم الطبيعي؟","أقل من 120/80 ملم زئبق. ويبدأ تشخيص ارتفاع الضغط عند 130/80 فأعلى حسب الإرشادات الأمريكية لعام 2017.","الكلية الأمريكية لأمراض القلب وجمعية القلب الأمريكية (ACC/AHA) 2017"],["f","الرقم الأعلى والأدنى في ضغط الدم","الرقم الأعلى (الانقباضي) هو الضغط وقت انقباض القلب، والأدنى (الانبساطي) هو الضغط وقت ارتخائه بين النبضات.","جمعية القلب الأمريكية (AHA)"],["q","ما معدل السكر الطبيعي في الدم وأنت صائم؟","من 70 إلى 99 ملغم/دسل. ومن 100 إلى 125 يعد مرحلة ما قبل السكري، و126 فأكثر في قياسين يشخَّص سكريًا.","الجمعية الأمريكية للسكري (ADA)"],["f","فحص التراكمي HbA1c","يعطي متوسط السكر في الدم خلال الشهرين أو الثلاثة الماضية تقريبًا، لأن السكر يلتصق بكريات الدم الحمراء طوال عمرها. ويُشخَّص السكري إذا كان 6.5% فأعلى.","الجمعية الأمريكية للسكري (ADA)"],["q","ما الفرق بين السكري من النوع الأول والثاني؟","النوع الأول: الجهاز المناعي يدمر خلايا البنكرياس المنتجة للأنسولين، فيحتاج المريض الأنسولين دائمًا. النوع الثاني: الجسم يقاوم الأنسولين أو لا ينتج ما يكفي، ويرتبط غالبًا بالوزن والوراثة، ويعالج بالغذاء والرياضة والأدوية.","منظمة الصحة العالمية (WHO)"],["f","البنكرياس غدتان في عضو واحد","البنكرياس يفرز الإنزيمات الهاضمة إلى الأمعاء (وظيفة خارجية)، ويفرز الأنسولين والجلوكاغون إلى الدم من جزر لانغرهانس (وظيفة داخلية).","Gray's Anatomy؛ Guyton and Hall"],["q","أين يُمتص معظم الغذاء؟","في الأمعاء الدقيقة، وطولها عند الإنسان نحو 6 إلى 7 أمتار، وجدارها مليء بالزغابات التي تضاعف مساحة الامتصاص.","Gray's Anatomy"],["f","حمض المعدة","حمض المعدة هو حمض الهيدروكلوريك، ودرجة حموضته بين 1.5 و3.5. وتحمي المعدة نفسها منه بطبقة مخاط سميكة تتجدد باستمرار.","Guyton and Hall Textbook of Medical Physiology"],["q","ما البكتيريا المسببة لأغلب قرح المعدة؟","الملوية البوابية (Helicobacter pylori). اكتشف دورها مارشال ووارن، ونالا جائزة نوبل في الطب عام 2005.","مؤسسة نوبل (NobelPrize.org)"],["f","أول مضاد حيوي","اكتشف ألكسندر فلمنج البنسلين عام 1928 مصادفة حين لاحظ أن عفن البنسيليوم قتل البكتيريا في طبق مختبره، ونال نوبل عام 1945 مع فلوري وتشين.","مؤسسة نوبل (NobelPrize.org)"],["q","من اكتشف الدورة الدموية الصغرى (الرئوية)؟","ابن النفيس (ت 687هـ/1288م) وصفها في «شرح تشريح القانون» قبل ويليام هارفي بنحو ثلاثة قرون.","شرح تشريح القانون لابن النفيس؛ Encyclopaedia Britannica"],["f","القانون في الطب","كتاب ابن سينا «القانون في الطب» ظل مرجعًا أساسيًا لتدريس الطب في جامعات أوروبا لعدة قرون بعد ترجمته إلى اللاتينية في القرن الثاني عشر.","Encyclopaedia Britannica"],["q","ما أول لقاح في التاريخ؟","لقاح الجدري الذي طوّره إدوارد جينر عام 1796 باستخدام جدري البقر. وأعلنت منظمة الصحة العالمية القضاء على الجدري عام 1980.","منظمة الصحة العالمية (WHO)"],["f","المرض الوحيد الذي قُضي عليه","الجدري هو المرض البشري الوحيد الذي استُؤصل تمامًا من العالم، وأعلنت ذلك منظمة الصحة العالمية رسميًا عام 1980.","منظمة الصحة العالمية (WHO)"],["q","ما الفرق بين الشريان والوريد؟","الشريان يحمل الدم من القلب إلى الجسم وجداره سميك مرن، والوريد يعيد الدم إلى القلب وفيه صمامات تمنع رجوعه. والشريان الرئوي استثناء: يحمل دمًا فقير الأكسجين إلى الرئتين.","Gray's Anatomy"],["f","عدد غرف القلب","للقلب أربع غرف: أذينان في الأعلى يستقبلان الدم، وبطينان في الأسفل يضخانه. والبطين الأيسر أسمك جدارًا لأنه يضخ الدم إلى الجسم كله.","Gray's Anatomy"],["q","كم مرة ينبض القلب في اليوم؟","نحو 100 ألف مرة يوميًا تقريبًا، ويضخ في اليوم ما يقارب 7 آلاف لتر من الدم.","جمعية القلب الأمريكية (AHA)"],["f","الكليتان مرشح الجسم","ترشّح الكليتان نحو 180 لترًا من الدم يوميًا، ويُعاد امتصاص معظمه، ويخرج منه نحو 1 إلى 2 لتر بولًا.","المؤسسة الوطنية للكلى (NKF)؛ Guyton and Hall"],["q","ما الوحدة الوظيفية في الكلية؟","النفرون، وفي كل كلية نحو مليون نفرون، كل واحد يرشّح الدم ويعيد امتصاص المفيد منه.","Guyton and Hall Textbook of Medical Physiology"],["f","الرئتان ليستا متساويتين","الرئة اليمنى ثلاثة فصوص، واليسرى فصّان فقط، لأنها تترك مكانًا للقلب.","Gray's Anatomy"],["q","كم حويصلة هوائية في الرئتين؟","نحو 300 إلى 500 مليون حويصلة، ومساحتها لو فُردت تقارب ملعب تنس، نحو 70 مترًا مربعًا.","Guyton and Hall Textbook of Medical Physiology"],["f","الغدة الدرقية","تقع أسفل مقدمة الرقبة على شكل فراشة، وتفرز هرمونات تتحكم في سرعة الأيض (الحرق) في الجسم، وتحتاج اليود لإنتاجها.","جمعية الغدة الدرقية الأمريكية (ATA)"],["q","لماذا يضاف اليود إلى ملح الطعام؟","لمنع نقص اليود الذي يسبب تضخم الغدة الدرقية (الدراق) وضعف النمو العقلي عند الأطفال. وتوصي به منظمة الصحة العالمية واليونيسف عالميًا.","منظمة الصحة العالمية (WHO)"],["f","فيتامين د يصنعه الجلد","يصنع الجلد فيتامين د عند تعرضه للأشعة فوق البنفسجية (UVB) من الشمس، وهو ضروري لامتصاص الكالسيوم وصحة العظام.","المعاهد الوطنية للصحة، مكتب المكملات الغذائية (NIH ODS)"],["q","ما الفيتامين الذي يسبب نقصه الإسقربوط؟","فيتامين C. نقصه يسبب نزف اللثة وضعف التئام الجروح. وكان يصيب البحارة قديمًا حتى أثبت جيمس ليند عام 1747 أن الحمضيات تعالجه.","المعاهد الوطنية للصحة (NIH ODS)؛ Britannica"],["f","فيتامين ك والتجلط","فيتامين K ضروري لتصنيع عوامل تخثر الدم في الكبد، ولهذا يُعطى للمواليد حقنة منه بعد الولادة لمنع النزيف.","الأكاديمية الأمريكية لطب الأطفال (AAP)"],["q","ما الفرق بين الحساسية وعدم التحمل الغذائي؟","الحساسية رد فعل من جهاز المناعة قد يكون خطيرًا كصدمة الحساسية. أما عدم التحمل، كعدم تحمل اللاكتوز، فمشكلة في الهضم لا علاقة لها بالمناعة، وأعراضه هضمية غالبًا.","المعهد الوطني للحساسية والأمراض المعدية (NIAID)"],["f","صدمة الحساسية","تفاعل تحسسي شديد مفاجئ قد يهدد الحياة، وعلاجه الأول حقنة الأدرينالين (الإبينفرين) في العضل فورًا ثم الإسعاف.","الأكاديمية الأمريكية للحساسية والربو والمناعة (AAAAI)"],["q","ما الأعراض السريعة للسكتة الدماغية؟","اختصارها BE FAST: اختلال التوازن، مشكلة في الرؤية، ميلان الوجه، ضعف الذراع، صعوبة الكلام، والوقت يعني الاتصال بالإسعاف فورًا.","جمعية السكتة الدماغية الأمريكية (ASA)"],["f","الإنعاش القلبي الرئوي","يُضغط على منتصف الصدر بعمق 5 إلى 6 سم وبمعدل 100 إلى 120 ضغطة في الدقيقة، مع ترك الصدر يرتد كاملًا بين الضغطات.","إرشادات جمعية القلب الأمريكية للإنعاش (AHA CPR Guidelines)"],["q","ما مناورة هايمليك؟","إسعاف لمن يختنق بجسم عالق في مجرى التنفس: تقف خلفه وتلف يديك حول بطنه فوق السرة وتضغط بقوة للداخل والأعلى حتى يخرج الجسم.","الصليب الأحمر الأمريكي"],["f","الصداع النصفي","الشقيقة ليست صداعًا عاديًا، بل اضطراب عصبي قد يسبقه «أورة» بصرية، ويصاحبه غثيان وحساسية للضوء والصوت، وتصيب النساء نحو ثلاثة أضعاف الرجال.","منظمة الصحة العالمية (WHO)"],["q","ما الفرق بين الفيروس والبكتيريا في العلاج؟","البكتيريا تعالج بالمضادات الحيوية، أما الفيروسات فلا تتأثر بها، ولبعضها أدوية مضادة للفيروسات خاصة، والأهم الوقاية باللقاحات.","مراكز السيطرة على الأمراض (CDC)"],["f","الأنسولين أُعطي لأول مرة 1922","استُخلص الأنسولين في جامعة تورنتو على يد بانتنج وبست، وأُعطي لأول مريض سكري عام 1922، ونال بانتنج وماكلاود نوبل عام 1923.","مؤسسة نوبل (NobelPrize.org)"],["q","ما وظيفة الزائدة الدودية؟","كان يُظن أنها بلا فائدة، لكن الدراسات تشير إلى أنها مخزن للبكتيريا النافعة يعيد تعمير الأمعاء بعد الإسهال الشديد، وفيها نسيج لمفاوي مناعي.","Bollinger et al., Journal of Theoretical Biology 2007"],["f","العين ترى مقلوبًا","العدسة تكوّن صورة مقلوبة على الشبكية، والدماغ هو الذي يقلبها لتبدو معتدلة.","الأكاديمية الأمريكية لطب العيون (AAO)"],["q","ما الفرق بين قصر النظر وطوله؟","قصر النظر: ترى القريب بوضوح والبعيد مشوشًا، لأن الصورة تتكون أمام الشبكية. طول النظر: العكس، والصورة تتكون خلفها.","الأكاديمية الأمريكية لطب العيون (AAO)"],["f","البقعة العمياء","في كل عين نقطة لا ترى فيها شيئًا، وهي مكان خروج العصب البصري من الشبكية، ولا نلاحظها لأن الدماغ يملأ الفراغ والعين الأخرى تعوّضه.","الأكاديمية الأمريكية لطب العيون (AAO)"],["q","لماذا تفرقع الأصابع؟","الصوت ناتج عن تكوّن فقاعة غاز داخل سائل المفصل عند شده، كما أظهر تصوير الرنين المغناطيسي سنة 2015. ولا يوجد دليل قوي على أنه يسبب التهاب المفاصل.","Kawchuk et al., PLOS ONE 2015"],["f","التثاؤب","سبب التثاؤب غير محسوم علميًا، ومن أقوى الفرضيات أنه يساعد على تبريد الدماغ. وهو «معدٍ» بين البشر وبعض الحيوانات.","Gallup & Gallup, Evolutionary Psychology 2007"],["q","كم ساعة نوم يحتاج البالغ؟","7 ساعات فأكثر كل ليلة حسب توصية الأكاديمية الأمريكية لطب النوم، والمراهقون من 8 إلى 10 ساعات.","الأكاديمية الأمريكية لطب النوم (AASM)"],["f","الماء في الجسم","يشكّل الماء نحو 60% من وزن جسم الرجل البالغ، وأقل قليلًا عند المرأة، وأكثر عند الرضع.","Guyton and Hall Textbook of Medical Physiology"],["q","ما الفرق بين النوبة القلبية والذبحة الصدرية؟","الذبحة الصدرية ألم في الصدر بسبب نقص مؤقت في تروية القلب، ويزول بالراحة أو الدواء دون موت في العضلة. أما النوبة القلبية فانسداد يسبب موت جزء من عضلة القلب.","جمعية القلب الأمريكية (AHA)"],["f","الكوليسترول الجيد والسيئ","LDL يُسمى «السيئ» لأنه يترسب في جدران الشرايين، وHDL «الجيد» لأنه ينقل الكوليسترول من الأنسجة إلى الكبد للتخلص منه.","جمعية القلب الأمريكية (AHA)"],["q","ما مؤشر كتلة الجسم الطبيعي؟","من 18.5 إلى 24.9. ويُحسب بقسمة الوزن بالكيلوغرام على مربع الطول بالمتر. و25 إلى 29.9 زيادة وزن، و30 فأكثر سمنة.","منظمة الصحة العالمية (WHO)"],["f","محيط الخصر مؤشر خطر","دهون البطن أخطر من دهون باقي الجسم. ويرتفع خطر أمراض القلب والسكري إذا زاد محيط الخصر على 102 سم للرجل و88 سم للمرأة تقريبًا.","المعاهد الوطنية للصحة (NIH)؛ WHO"],["q","ما أعراض نقص السكر في الدم؟","رجفة، وتعرق، وجوع شديد، وخفقان، ودوخة، وتشوش. وإذا كان السكر أقل من 70 ملغم/دسل يُعالج بسرعة بـ15 غرامًا من سكر سريع كعصير، ثم يعاد القياس بعد 15 دقيقة.","الجمعية الأمريكية للسكري (ADA)"],["f","قاعدة 15–15 لهبوط السكر","تناول 15 غرامًا من سكر سريع الامتصاص، وانتظر 15 دقيقة، ثم أعد القياس. وكرّر إذا بقي منخفضًا.","الجمعية الأمريكية للسكري (ADA)"],["q","ما الفرق بين الالتهاب البكتيري والفيروسي في الحلق؟","أغلب التهابات الحلق فيروسية وتشفى وحدها. أما التهاب الحلق العقدي البكتيري فيصاحبه غالبًا حرارة وتضخم اللوزتين وصديد بلا سعال، ويُشخص بمسحة ويعالج بالمضاد الحيوي.","مراكز السيطرة على الأمراض (CDC)"],["f","الإنفلونزا ليست زكامًا","الإنفلونزا تبدأ فجأة بحرارة عالية وآلام عضلات وإرهاق شديد، وقد تسبب مضاعفات خطيرة، ولها لقاح سنوي. أما الزكام فأخف ويتركز في الأنف.","مراكز السيطرة على الأمراض (CDC)"],["q","لماذا يتغير لقاح الإنفلونزا كل سنة؟","لأن فيروس الإنفلونزا يتحور باستمرار، فتختار منظمة الصحة العالمية كل سنة السلالات المتوقع انتشارها ويُحدّث اللقاح بناءً عليها.","منظمة الصحة العالمية (WHO)"],["f","الحمى ليست عدوًا","ارتفاع الحرارة رد فعل دفاعي يساعد المناعة على مقاومة العدوى. وتعتبر حمى عند البالغ إذا وصلت 38 °م فأكثر.","مراكز السيطرة على الأمراض (CDC)؛ Mayo Clinic"],["q","متى تكون حرارة الطفل خطيرة؟","أي حرارة 38 °م فأكثر عند رضيع أقل من 3 أشهر تستدعي مراجعة الطبيب فورًا. وفي الأكبر يُراجع إذا صاحبها خمول شديد أو صعوبة تنفس أو تشنج أو طفح لا يختفي بالضغط.","الأكاديمية الأمريكية لطب الأطفال (AAP)"],["f","الجفاف عند الأطفال","من علاماته قلة البول، وجفاف الفم، وغياب الدموع، والخمول، وانخفاض اليافوخ عند الرضيع. ومحلول الإرواء الفموي أفضل علاج للإسهال الخفيف والمتوسط.","منظمة الصحة العالمية (WHO)؛ اليونيسف"],["q","ما محلول الإرواء الفموي ولماذا هو مهم؟","محلول من الماء والأملاح والسكر بنسب محددة، يعوض سوائل الإسهال. وتقدّر منظمة الصحة العالمية أنه أنقذ ملايين الأطفال، وتصفه مجلة لانسيت بأنه من أهم الاكتشافات الطبية في القرن العشرين.","منظمة الصحة العالمية (WHO)؛ The Lancet 1978"],["f","الربو","مرض مزمن تلتهب فيه الشعب الهوائية وتضيق، فيسبب صفيرًا وضيق نفس وسعالًا خاصة ليلًا. ويُعالج ببخاخات وقائية ومسعفة، ومعظم المرضى يعيشون حياة طبيعية.","المبادرة العالمية للربو (GINA)"],["q","ما الفرق بين بخاخ الربو الوقائي والمسعف؟","المسعف، كالسالبيوتامول، يوسع الشعب بسرعة وقت النوبة. والوقائي، كالكورتيزون المستنشق، يقلل الالتهاب ويؤخذ يوميًا ولو لم توجد أعراض.","المبادرة العالمية للربو (GINA)"],["f","هشاشة العظام","مرض صامت تقل فيه كثافة العظام فتنكسر بسهولة، وأكثر عند النساء بعد سن اليأس. ويُشخص بفحص كثافة العظام (DEXA).","المؤسسة الدولية لهشاشة العظام (IOF)"],["q","ما مصادر الكالسيوم غير الحليب؟","الأجبان واللبن، والسردين بعظامه، والسمسم والطحينة، واللوز، والخضار الورقية كالبروكلي، والأغذية المدعمة.","المعاهد الوطنية للصحة (NIH ODS)"],["f","فقر الدم بنقص الحديد","أشهر أنواع فقر الدم في العالم، ومن أعراضه الإرهاق وشحوب الجلد وضيق النفس وتساقط الشعر. وفيتامين C يزيد امتصاص الحديد، والشاي مع الأكل يقلله.","منظمة الصحة العالمية (WHO)؛ NIH ODS"],["q","ما مرض فقر الدم المنجلي؟","مرض وراثي تتحول فيه كريات الدم الحمراء إلى شكل منجل، فتسد الأوعية وتسبب نوبات ألم وفقر دم. ومنتشر في بعض مناطق السعودية، ولهذا يُفحص في برنامج الزواج الصحي.","وزارة الصحة السعودية؛ NHLBI"],["f","فحص ما قبل الزواج في السعودية","إلزامي منذ 2004 تقريبًا، ويشمل أمراض الدم الوراثية (الأنيميا المنجلية والثلاسيميا) والأمراض المعدية مثل التهاب الكبد ب وج والإيدز.","وزارة الصحة السعودية — برنامج الزواج الصحي"],["q","ما فحص المواليد؟","فحص بنقطة دم من كعب المولود في الأيام الأولى، يكشف أمراضًا وراثية واستقلابية وهرمونية قابلة للعلاج مبكرًا، مثل قصور الغدة الدرقية الخلقي.","وزارة الصحة السعودية؛ CDC"],["f","التهاب الكبد الوبائي ب","فيروس ينتقل بالدم وسوائل الجسم ومن الأم لطفلها، وقد يسبب تليف الكبد وسرطانه. وله لقاح فعال يُعطى للمواليد منذ أول يوم.","منظمة الصحة العالمية (WHO)"],["q","هل التهاب الكبد ج يُعالج؟","نعم. أدوية مضادة للفيروس تُؤخذ 8 إلى 12 أسبوعًا تشفي أكثر من 95% من المرضى، لكن لا يوجد له لقاح حتى الآن.","منظمة الصحة العالمية (WHO)"],["f","الكبد الدهني","تراكم الدهون في الكبد، وأشهر أسبابه اليوم السمنة والسكري وليس الكحول. وقد يتطور إلى تليف. وأفضل علاج له خسارة الوزن.","AASLD الجمعية الأمريكية لدراسة أمراض الكبد"],["q","ما حصى الكلى وكيف نقي منها؟","ترسبات صلبة من الأملاح في الكلية. وأهم وقاية شرب ماء كافٍ ليكون البول فاتح اللون، وتقليل الملح، وعدم الإكثار من البروتين الحيواني.","المؤسسة الوطنية للكلى (NKF)"],["f","المرارة","كيس صغير تحت الكبد يخزن العصارة الصفراوية لهضم الدهون. ويمكن العيش بدونها بعد استئصالها.","Gray's Anatomy؛ Mayo Clinic"],["q","ما القولون العصبي؟","اضطراب مزمن في وظيفة الأمعاء يسبب ألم البطن مع إسهال أو إمساك أو كليهما، دون مرض عضوي ظاهر. ويتأثر بالأكل والتوتر.","المعهد الوطني للسكري وأمراض الجهاز الهضمي والكلى (NIDDK)"],["f","الألياف الغذائية","تساعد على انتظام الهضم، وتقلل الكوليسترول، وتبطئ امتصاص السكر. ويُنصح البالغ بنحو 25 إلى 38 غرامًا يوميًا من الحبوب الكاملة والخضار والفواكه والبقوليات.","الأكاديمية الوطنية للطب الأمريكية؛ NIH"],["q","ما الغلوتين وما مرض السيلياك؟","الغلوتين بروتين في القمح والشعير والجاودار. ومرض السيلياك مناعي يهاجم فيه الجسم الأمعاء عند تناول الغلوتين، وعلاجه حمية خالية منه مدى الحياة.","المعهد الوطني للسكري وأمراض الجهاز الهضمي والكلى (NIDDK)"],["f","الصرع","اضطراب عصبي تتكرر فيه نوبات بسبب نشاط كهربائي مفاجئ في الدماغ. ونحو 70% من المرضى يمكن السيطرة على نوباتهم بالأدوية.","منظمة الصحة العالمية (WHO)"],["q","ماذا تفعل إذا رأيت شخصًا في نوبة صرع؟","أبعد الأشياء الخطرة عنه، وضع شيئًا ليّنًا تحت رأسه، ولا تضع شيئًا في فمه ولا تمسكه بقوة، وبعد النوبة اجعله على جنبه. واتصل بالإسعاف إذا طالت أكثر من 5 دقائق.","مؤسسة الصرع (Epilepsy Foundation)؛ CDC"],["f","الزهايمر","أشهر أسباب الخرف، يبدأ غالبًا بنسيان الأحداث القريبة ثم يتطور. وتتراكم في الدماغ بروتينات تسمى «الأميلويد» و«تاو».","المعهد الوطني للشيخوخة (NIA)"],["q","ما مرض باركنسون؟","مرض عصبي تموت فيه خلايا تنتج الدوبامين، فتظهر رجفة في الراحة وبطء وتصلب في الحركة. ويُعالج بأدوية تعوض الدوبامين.","المعهد الوطني للاضطرابات العصبية والسكتة (NINDS)"],["f","الغدة الكظرية","غدتان فوق الكليتين، تفرزان الأدرينالين في حالات الخطر، والكورتيزول الذي ينظم الضغط والسكر والاستجابة للتوتر.","Guyton and Hall Textbook of Medical Physiology"],["q","لماذا يجب عدم إيقاف الكورتيزون فجأة؟","لأن تناوله فترة طويلة يجعل الغدة الكظرية تتوقف عن إنتاجه، فإيقافه المفاجئ قد يسبب قصورًا خطيرًا. ولهذا يُخفض تدريجيًا حسب تعليمات الطبيب.","Mayo Clinic؛ المعهد الوطني للسكري (NIDDK)"],["f","المضادات الحيوية وإكمال الجرعة","إيقاف المضاد الحيوي مبكرًا دون استشارة قد يسمح ببقاء البكتيريا. واتبع دائمًا مدة الطبيب، وبعض الإرشادات الحديثة صارت تفضّل مددًا أقصر لبعض الالتهابات.","منظمة الصحة العالمية (WHO)؛ CDC"],["q","ما مقاومة المضادات الحيوية؟","قدرة البكتيريا على النجاة من المضادات التي كانت تقتلها، بسبب الإفراط وسوء الاستخدام. وتعدها منظمة الصحة العالمية من أكبر التهديدات للصحة العالمية.","منظمة الصحة العالمية (WHO)"],["f","الباراسيتامول والكبد","الباراسيتامول آمن بالجرعة الصحيحة، لكن الجرعة الزائدة من أشهر أسباب فشل الكبد الحاد. والحد الأقصى المعتاد للبالغ 4 غرامات يوميًا ما لم يحدد الطبيب أقل.","إدارة الغذاء والدواء الأمريكية (FDA)؛ NHS"],["q","لماذا لا يُعطى الأسبرين للأطفال؟","لارتباطه بمتلازمة راي النادرة والخطيرة التي تصيب الكبد والدماغ عند إعطائه لطفل مصاب بعدوى فيروسية كالإنفلونزا والجديري.","هيئة الخدمات الصحية البريطانية (NHS)؛ FDA"],["f","الجلطة الوريدية العميقة","تجلط في أوردة الساق غالبًا بعد الجلوس الطويل أو العمليات، وقد ينتقل للرئة. والحركة وشرب الماء في الرحلات الطويلة من وسائل الوقاية.","جمعية القلب الأمريكية (AHA)؛ CDC"],["q","كم كوب ماء يحتاج الإنسان يوميًا؟","لا يوجد رقم ثابت للجميع. وتقدّر الأكاديمية الوطنية الأمريكية مجموع السوائل من الشرب والطعام بنحو 3.7 لترات للرجل و2.7 للمرأة، وتزيد في الحر والرياضة.","الأكاديميات الوطنية للعلوم والهندسة والطب الأمريكية"],["f","ضربة الشمس","حالة طارئة ترتفع فيها حرارة الجسم فوق 40 °م مع تشوش أو إغماء. وعلاجها تبريد سريع بالماء والظل والاتصال بالإسعاف.","مراكز السيطرة على الأمراض (CDC)؛ وزارة الصحة السعودية"],["q","ما الفرق بين الإجهاد الحراري وضربة الشمس؟","الإجهاد الحراري: تعرق غزير وتعب ودوخة وصداع والوعي سليم، ويتحسن بالراحة والسوائل. ضربة الشمس: حرارة عالية جدًا مع تشوش، وقد يتوقف التعرق، وهي طارئة تهدد الحياة.","مراكز السيطرة على الأمراض (CDC)"],["f","لدغة العقرب","أغلب لدغات العقارب مؤلمة لكنها غير قاتلة للبالغين، والخطر أعلى عند الأطفال. ويُثبت العضو ويُراجع الطوارئ، ولا يُمص الجرح ولا يُشق.","وزارة الصحة السعودية؛ منظمة الصحة العالمية"],["q","ماذا تفعل عند لدغة الثعبان؟","اتصل بالإسعاف، وأبقِ المصاب هادئًا وثبّت العضو تحت مستوى القلب، وانزع الخواتم. ولا تقطع الجرح ولا تمصه ولا تربط رباطًا ضاغطًا.","منظمة الصحة العالمية (WHO)"],["f","الحروق البسيطة","ضع الحرق تحت ماء جارٍ فاتر أو بارد (لا مثلج) لمدة 20 دقيقة، ثم غطِّه بضماد نظيف. ولا تضع معجون أسنان أو زبدة.","الصليب الأحمر البريطاني؛ NHS"],["q","ماذا تفعل عند الرعاف (نزيف الأنف)؟","اجلس ومل رأسك للأمام قليلًا، واضغط على الجزء اللين من الأنف 10 إلى 15 دقيقة دون انقطاع. ولا ترجع رأسك للخلف لأن الدم ينزل للحلق.","هيئة الخدمات الصحية البريطانية (NHS)"],["f","التسمم بأول أكسيد الكربون","غاز بلا لون ولا رائحة، ينتج من الدفايات والمولدات في الأماكن المغلقة. أعراضه صداع ودوخة وغثيان، وقد يقتل أثناء النوم. وأجهزة كشفه في البيت تنقذ الأرواح.","مراكز السيطرة على الأمراض (CDC)"]],"physics":[["q","كم سرعة الضوء في الفراغ؟","299,792,458 مترًا في الثانية بالضبط، أي نحو 300 ألف كم في الثانية. وهي ثابتة بالتعريف منذ 1983، ويُعرَّف المتر على أساسها.","المكتب الدولي للأوزان والمقاييس (BIPM)"],["f","كم يحتاج ضوء القمر ليصلنا","نحو 1.3 ثانية، لأن القمر يبعد عنا نحو 384 ألف كم في المتوسط.","وكالة ناسا (NASA)"],["q","ما سرعة الصوت في الهواء؟","نحو 343 مترًا في الثانية عند 20 °م، وتزيد مع ارتفاع الحرارة. وهي في الماء أسرع بنحو أربع مرات، وفي الحديد أسرع بنحو 15 مرة.","HyperPhysics؛ مراجع الفيزياء العامة"],["f","لماذا نرى البرق قبل سماع الرعد","لأن الضوء أسرع من الصوت بنحو مليون مرة. وكل 3 ثوانٍ بين البرق والرعد تعني تقريبًا كيلومترًا واحدًا من المسافة.","المنظمة العالمية للأرصاد الجوية (WMO)؛ NOAA"],["q","ما قوانين نيوتن الثلاثة للحركة؟","الأول: الجسم يبقى ساكنًا أو متحركًا بسرعة ثابتة ما لم تؤثر عليه قوة. الثاني: القوة = الكتلة × التسارع. الثالث: لكل فعل رد فعل مساوٍ له في المقدار ومعاكس في الاتجاه.","Newton, Principia 1687؛ مراجع الفيزياء العامة"],["f","تسارع الجاذبية الأرضية","نحو 9.8 متر/ثانية² عند سطح الأرض، أي أن سرعة الجسم الساقط تزيد نحو 9.8 م/ث كل ثانية إذا أُهملت مقاومة الهواء.","المكتب الدولي للأوزان والمقاييس (BIPM)؛ NIST"],["q","هل يسقط الجسم الثقيل أسرع من الخفيف؟","في غياب مقاومة الهواء يسقطان معًا بالتسارع نفسه. وأثبت ذلك رائد الفضاء ديفيد سكوت على القمر عام 1971 حين أسقط مطرقة وريشة فوصلتا معًا.","وكالة ناسا (NASA)، رحلة أبولو 15"],["f","معادلة أينشتاين E=mc²","تعني أن الكتلة يمكن أن تتحول إلى طاقة هائلة: الطاقة = الكتلة × مربع سرعة الضوء. وغرام واحد من المادة لو تحول كله لطاقة يعادل نحو 21 كيلوطن من مادة TNT.","Einstein A., Annalen der Physik 1905"],["q","ما الفرق بين الانشطار والاندماج النووي؟","الانشطار: نواة ثقيلة كاليورانيوم تنقسم لنوى أصغر وتطلق طاقة، ويستخدم في المفاعلات. الاندماج: نوى خفيفة كالهيدروجين تندمج لنواة أثقل، وهو مصدر طاقة الشمس والنجوم.","الوكالة الدولية للطاقة الذرية (IAEA)"],["f","الشمس تحرق 4 ملايين طن في الثانية","تحول الشمس في نواتها نحو 600 مليون طن من الهيدروجين إلى هيليوم كل ثانية، ويتحول من ذلك نحو 4 ملايين طن من الكتلة إلى طاقة.","وكالة ناسا (NASA)"],["q","لماذا يطفو الجليد على الماء؟","لأن الماء عند تجمده يتمدد وتقل كثافته بنحو 9%، فالجليد أخف من الماء السائل. وهذا نادر في المواد، ويحمي الحياة في البحيرات لأن الجليد يبقى فوق والماء تحته سائل.","USGS؛ مراجع الكيمياء العامة"],["f","مبدأ أرخميدس","الجسم المغمور في سائل يدفعه السائل لأعلى بقوة تساوي وزن السائل الذي أزاحه. ولهذا تطفو السفن الحديدية الضخمة.","مراجع الفيزياء العامة؛ HyperPhysics"],["q","ما الفرق بين الحرارة ودرجة الحرارة؟","درجة الحرارة مقياس لمتوسط حركة جزيئات الجسم، والحرارة كمية الطاقة المنتقلة بسبب فرق درجة الحرارة. فكوب ماء مغلي حرارته أعلى درجة، لكن حوض سباحة دافئ يحمل طاقة حرارية أكبر بكثير.","مراجع الديناميكا الحرارية"],["f","لماذا يغلي الماء أسرع في الجبال","لأن الضغط الجوي أقل، فيغلي الماء بدرجة أقل من 100 °م. على قمة إيفرست يغلي عند نحو 70 °م، ولهذا يصعب طهي الطعام هناك.","HyperPhysics؛ USGS"],["q","ما مبدأ عمل قدر الضغط؟","يحبس البخار فيرتفع الضغط داخله، فيغلي الماء عند نحو 120 °م بدل 100، فينضج الطعام أسرع.","مراجع الفيزياء العامة"],["f","الانحناء في الماء (الانكسار)","القلم في كوب الماء يبدو مكسورًا لأن الضوء يغير سرعته واتجاهه عند انتقاله من الماء للهواء. وهذا ما يسمى انكسار الضوء.","HyperPhysics"],["q","كيف يتكون قوس قزح؟","ضوء الشمس يدخل قطرات المطر فينكسر ويرتد داخلها ثم يخرج، وكل لون ينكسر بزاوية مختلفة قليلًا، فيتفرق الضوء الأبيض لألوانه. ويظهر دائمًا في الجهة المقابلة للشمس.","NOAA؛ HyperPhysics"],["f","ألوان الطيف","الضوء الأبيض مزيج من ألوان: الأحمر والبرتقالي والأصفر والأخضر والأزرق والنيلي والبنفسجي. أثبت نيوتن ذلك بالمنشور عام 1666 تقريبًا، وسبقه ابن الهيثم في دراسة انكسار الضوء.","Newton, Opticks 1704؛ Britannica"],["q","لماذا تبدو الشمس حمراء وقت الغروب؟","لأن ضوءها يقطع مسافة أطول في الغلاف الجوي، فيتشتت الأزرق والبنفسجي ولا يصلنا إلا الأحمر والبرتقالي.","NOAA؛ HyperPhysics"],["f","الكهرباء الساكنة","عند فرك جسمين تنتقل إلكترونات من أحدهما للآخر فيُشحنان، ولهذا قد تصعقك قبضة الباب في الجو الجاف. والبرق شرارة كهرباء ساكنة ضخمة.","NOAA؛ HyperPhysics"],["q","كم حرارة البرق؟","نحو 30,000 °م، أي أسخن من سطح الشمس بنحو خمس مرات، لكنه يدوم جزءًا من الثانية.","الإدارة الوطنية للمحيطات والغلاف الجوي (NOAA)"],["f","قانون أوم","الجهد = التيار × المقاومة (V = I × R). يربط بين الفولت والأمبير والأوم، ووضعه جورج أوم عام 1827.","مراجع الكهرباء العامة؛ Britannica"],["q","ما الفرق بين التيار المستمر والمتردد؟","المستمر (DC) يسير في اتجاه واحد مثل البطاريات. المتردد (AC) يغير اتجاهه عشرات المرات في الثانية، 60 مرة في السعودية، ويستخدم في شبكات الكهرباء لسهولة نقله لمسافات طويلة.","الشركة السعودية للكهرباء؛ مراجع الكهرباء العامة"],["f","جهد الكهرباء في بيوت السعودية","اعتمدت المملكة جهد 230 فولت بتردد 60 هرتز للمنازل، مع بقاء 127 فولت في بعض المباني القديمة.","الهيئة السعودية للمواصفات والمقاييس والجودة؛ الشركة السعودية للكهرباء"],["q","لماذا تشير البوصلة إلى الشمال؟","لأن الأرض مغناطيس ضخم، وإبرة البوصلة المغناطيسية تتجه مع مجالها نحو القطب الشمالي المغناطيسي، وهو يختلف قليلًا عن القطب الجغرافي ويتحرك سنويًا.","NOAA؛ British Geological Survey"],["f","المجال المغناطيسي يحمي الأرض","يصدّ المجال المغناطيسي الأرضي معظم الجسيمات المشحونة القادمة من الشمس، ومن تفاعلها قرب القطبين يتكون الشفق القطبي.","وكالة ناسا (NASA)"],["q","ما الفرق بين الذرة والجزيء؟","الذرة أصغر وحدة من العنصر، مثل ذرة أكسجين. والجزيء مجموعة ذرات مترابطة، مثل جزيء الماء H₂O من ذرتي هيدروجين وذرة أكسجين.","IUPAC؛ مراجع الكيمياء العامة"],["f","حجم الذرة","قطر الذرة نحو عُشر نانومتر، والنواة أصغر منها بنحو 100 ألف مرة. لو كبرت الذرة لحجم ملعب كرة قدم لكانت النواة بحجم حبة بازلاء في وسطه.","CERN؛ مراجع الفيزياء الذرية"],["q","ما أكثر عنصر في الكون؟","الهيدروجين، يشكل نحو 74% من كتلة المادة العادية في الكون، ثم الهيليوم نحو 24%.","وكالة ناسا (NASA)"],["f","أكثر عنصر في القشرة الأرضية","الأكسجين، يشكل نحو 46% من وزن القشرة الأرضية، ثم السيليكون نحو 28%.","هيئة المسح الجيولوجي الأمريكية (USGS)"],["q","كم عدد العناصر في الجدول الدوري؟","118 عنصرًا معترفًا بها رسميًا، آخرها أوغانيسون (118) الذي اعتُمد اسمه عام 2016.","الاتحاد الدولي للكيمياء البحتة والتطبيقية (IUPAC)"],["f","مندلييف والجدول الدوري","رتب ديمتري مندلييف العناصر عام 1869 حسب أوزانها وخصائصها، وترك فراغات لعناصر لم تكتشف، وتنبأ بخصائصها، ثم اكتُشفت فعلًا.","IUPAC؛ Britannica"],["q","ما الفرق بين السرعة والتسارع؟","السرعة مقدار تغير المكان مع الزمن. والتسارع مقدار تغير السرعة مع الزمن. فالسيارة على سرعة ثابتة 100 كم/س تسارعها صفر.","مراجع الفيزياء العامة"],["f","انعدام الوزن في محطة الفضاء","رواد محطة الفضاء ليسوا بلا جاذبية، فالجاذبية هناك نحو 90% من الأرض، لكنهم في سقوط حر مستمر حول الأرض، فيشعرون بانعدام الوزن.","وكالة ناسا (NASA)"],["q","كم سرعة محطة الفضاء الدولية؟","نحو 28,000 كم/س، وتدور حول الأرض كل نحو 90 دقيقة، فيرى روادها نحو 16 شروقًا و16 غروبًا كل يوم.","وكالة ناسا (NASA)"],["f","الثقب الأسود في مركز مجرتنا","في مركز درب التبانة ثقب أسود هائل اسمه «القوس A*» كتلته نحو 4 ملايين كتلة شمسية. وصُوّر لأول مرة عام 2022، ونال غينزل وغيز نوبل 2020 لإثبات وجوده.","Event Horizon Telescope 2022؛ مؤسسة نوبل"],["q","كم عمر الكون؟","نحو 13.8 مليار سنة حسب قياسات القمر الصناعي بلانك لإشعاع الخلفية الكونية.","Planck Collaboration, Astronomy & Astrophysics 2020"],["f","السنة الضوئية مسافة لا زمن","السنة الضوئية هي المسافة التي يقطعها الضوء في سنة، نحو 9.46 تريليون كم.","الاتحاد الفلكي الدولي (IAU)"],["q","ما أقرب نجم إلى الأرض بعد الشمس؟","بروكسيما سنتوري، على بعد نحو 4.24 سنة ضوئية.","وكالة ناسا (NASA)؛ ESO"],["f","المادة المظلمة","نحو 85% من مادة الكون «مظلمة»: لا نراها ولا تبعث ضوءًا، لكن نعرف وجودها من أثر جاذبيتها على حركة المجرات. وطبيعتها ما زالت لغزًا.","وكالة ناسا (NASA)؛ CERN"],["q","ما الطاقة المظلمة؟","قوة غامضة تشكل نحو 68% من طاقة الكون وتسرّع تمدده. اكتُشف تسارع التمدد عام 1998 ونال مكتشفوه نوبل 2011.","مؤسسة نوبل (NobelPrize.org)؛ NASA"],["f","مبدأ عدم التحديد لهايزنبرغ","لا يمكن معرفة موقع الجسيم وسرعته بدقة تامة في الوقت نفسه؛ كلما زادت دقة أحدهما قلت دقة الآخر. وهي خاصية في الطبيعة لا عيب في أجهزة القياس.","Heisenberg W., Zeitschrift für Physik 1927"],["q","كم كوكبًا في المجموعة الشمسية؟","ثمانية: عطارد، الزهرة، الأرض، المريخ، المشتري، زحل، أورانوس، نبتون. وأُخرج بلوتو من قائمة الكواكب إلى «كوكب قزم» عام 2006.","الاتحاد الفلكي الدولي (IAU)"],["f","أكبر كوكب","المشتري، كتلته أكثر من ضعف كتلة باقي الكواكب مجتمعة، ويمكن أن تتسع داخله أكثر من 1,300 أرض.","وكالة ناسا (NASA)"],["q","ما أسخن كوكب في المجموعة الشمسية؟","الزهرة، حرارة سطحه نحو 465 °م، أسخن من عطارد الأقرب للشمس، بسبب غلافه الجوي الكثيف من ثاني أكس
