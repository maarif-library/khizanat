يد الكربون.","وكالة ناسا (NASA)"],["f","يوم الزهرة أطول من سنتها","يدور الزهرة حول نفسه في نحو 243 يومًا أرضيًا، ويدور حول الشمس في نحو 225 يومًا، ويدور عكس اتجاه أغلب الكواكب.","وكالة ناسا (NASA)"],["q","لماذا لون المريخ أحمر؟","بسبب أكسيد الحديد (الصدأ) في تربته وغباره.","وكالة ناسا (NASA)"],["f","أعلى جبل في المجموعة الشمسية","أوليمبوس مونس على المريخ، بركان خامد ارتفاعه نحو 22 كم، أي أكثر من ضعفي ونصف إيفرست.","وكالة ناسا (NASA)"],["q","ما حلقات زحل؟","حلقات من قطع الجليد والصخور، بعضها بحجم حبة الرمل وبعضها بحجم بيت، وسمكها في الغالب أقل من كيلومتر رغم اتساعها الهائل.","وكالة ناسا (NASA)"],["f","القمر يبتعد عن الأرض","يبتعد القمر عن الأرض نحو 3.8 سم كل سنة، وقيس ذلك بانعكاس الليزر على مرايا تركها رواد أبولو.","وكالة ناسا (NASA)"],["q","لماذا نرى وجهًا واحدًا من القمر دائمًا؟","لأن القمر يدور حول نفسه في نفس مدة دورانه حول الأرض (نحو 27.3 يومًا)، وهذا ما يسمى «الانقفال المدّي».","وكالة ناسا (NASA)"],["f","المد والجزر","سببهما الرئيسي جاذبية القمر على مياه المحيطات، ثم الشمس بدرجة أقل. ويحدث في أغلب السواحل مدّان وجزران كل يوم تقريبًا.","NOAA"],["q","كيف يحدث كسوف الشمس؟","عندما يمر القمر بين الأرض والشمس فيحجب ضوءها. والكسوف الكلي ممكن لأن الشمس أكبر من القمر بنحو 400 مرة وأبعد منه بنحو 400 مرة أيضًا.","وكالة ناسا (NASA)"],["f","خسوف القمر","يحدث عندما تقع الأرض بين الشمس والقمر فيقع القمر في ظلها، ويظهر غالبًا بلون أحمر نحاسي لأن الغلاف الجوي يكسر الضوء الأحمر نحوه.","وكالة ناسا (NASA)"],["q","ما أبعد جسم صنعه الإنسان؟","المركبة فوياجر 1، أُطلقت عام 1977، وتجاوزت حدود الغلاف الشمسي عام 2012، وتبعد أكثر من 24 مليار كم.","وكالة ناسا (NASA)"],["f","تلسكوب جيمس ويب","أقوى تلسكوب فضائي، أُطلق في 25 ديسمبر 2021، ويرصد بالأشعة تحت الحمراء، ويرى مجرات تكونت بعد مئات ملايين السنين فقط من الانفجار العظيم.","وكالة ناسا (NASA)؛ ESA"],["q","ما الذي يجعل النجوم تتلألأ؟","اضطراب الهواء في الغلاف الجوي يغير مسار ضوئها قليلًا وبسرعة. والكواكب تلمع بثبات أكثر لأنها أقرب وتظهر كأقراص صغيرة لا نقاط.","وكالة ناسا (NASA)"],["f","الصوت لا ينتقل في الفضاء","الصوت يحتاج وسطًا ماديًا كالهواء أو الماء، والفضاء شبه فارغ، فلا صوت فيه.","مراجع الفيزياء العامة؛ NASA"],["q","ما الفرق بين التوصيل والحمل والإشعاع؟","التوصيل: انتقال الحرارة بالتلامس كملعقة في شاي. الحمل: بحركة السوائل والغازات كغليان الماء. الإشعاع: بالموجات دون وسط كحرارة الشمس.","مراجع الديناميكا الحرارية"],["f","لماذا يبدو المعدن أبرد من الخشب","في الغرفة نفسها يكونان بنفس الحرارة، لكن المعدن ينقل الحرارة من يدك أسرع فتحسه أبرد.","HyperPhysics"],["q","لماذا يتكون الندى؟","في الليل تبرد الأسطح فيبرد الهواء الملامس لها حتى نقطة الندى، فيتكثف بخار الماء على شكل قطرات.","NOAA؛ المنظمة العالمية للأرصاد"],["f","الرعد صوت تمدد الهواء","البرق يسخّن الهواء حوله في جزء من الثانية فيتمدد بعنف، وهذا التمدد المفاجئ هو صوت الرعد.","الإدارة الوطنية للمحيطات والغلاف الجوي (NOAA)"],["q","ما الموجات الكهرومغناطيسية؟","موجات تنتقل بسرعة الضوء، تشمل من الأطول للأقصر: الراديو، والميكروويف، وتحت الحمراء، والضوء المرئي، وفوق البنفسجية، والسينية، وأشعة غاما.","وكالة ناسا (NASA)"],["f","كيف يسخن الميكروويف الطعام","موجاته تجعل جزيئات الماء في الطعام تهتز وتدور بسرعة، فيحتك بعضها ببعض وتتولد الحرارة.","إدارة الغذاء والدواء الأمريكية (FDA)"],["q","لماذا لا يُوضع المعدن في الميكروويف؟","لأن المعدن يعكس الموجات، والحواف الحادة قد تسبب شرارات كهربائية تتلف الجهاز أو تسبب حريقًا.","إدارة الغذاء والدواء الأمريكية (FDA)"],["f","الألياف الضوئية","تنقل البيانات بنبضات ضوئية داخل ألياف زجاجية رفيعة بالانعكاس الداخلي الكلي، وعليها يقوم الإنترنت السريع. ونال تشارلز كاو نوبل 2009 لتطويرها.","مؤسسة نوبل (NobelPrize.org)"],["q","كيف تعمل الألواح الشمسية؟","بالتأثير الكهروضوئي: الضوء يحرر إلكترونات في مادة شبه موصلة كالسيليكون فيتولد تيار كهربائي. وفسّر أينشتاين هذا التأثير ونال به نوبل 1921.","مؤسسة نوبل (NobelPrize.org)؛ وزارة الطاقة الأمريكية"],["f","الترانزستور","اختُرع عام 1947 في مختبرات بيل، وهو مفتاح إلكتروني صغير تقوم عليه كل الأجهزة الحديثة. وفي معالجات الجوالات اليوم مليارات منه.","مؤسسة نوبل (NobelPrize.org) 1956"],["q","ما الليزر؟","ضوء مركز بلون واحد وموجاته منتظمة الخطوة، يُصنع بتحفيز الذرات لإطلاق الضوء معًا. وأول ليزر عمل عام 1960، ويستخدم في جراحة العيون والقراءة الضوئية والاتصالات.","Britannica؛ APS"],["f","المغناطيس الكهربائي","سلك يمر فيه تيار ملفوف حول حديد يصبح مغناطيسًا يمكن تشغيله وإيقافه. ويُستخدم في المحركات والسماعات وأجهزة الرنين.","مراجع الكهرباء العامة"],["q","كيف تُولد الكهرباء في المحطات؟","أغلبها بتدوير توربين متصل بمولد فيه ملفات داخل مجال مغناطيسي، بالبخار أو الماء أو الرياح، وهذا مبدأ الحث الكهرومغناطيسي لفاراداي.","وزارة الطاقة الأمريكية؛ Britannica"],["f","أعلى كثافة للماء عند 4 درجات","أعلى كثافة للماء عند نحو 4 °م. ولهذا يبقى الماء في قاع البحيرات المتجمدة عند 4 °م تقريبًا فتعيش الأسماك.","USGS؛ مراجع الكيمياء العامة"]],"politics":[["q","كم عدد أعضاء مجلس الأمن؟","15 عضوًا: 5 دائمون لهم حق النقض، و10 غير دائمين تنتخبهم الجمعية العامة لمدة سنتين.","ميثاق الأمم المتحدة، المادة 23"],["f","مقر الأمم المتحدة","يقع المقر الرئيسي في نيويورك، ولها مكاتب رئيسية في جنيف وفيينا ونيروبي. ومحكمة العدل الدولية في لاهاي.","الأمم المتحدة (un.org)"],["q","ما محكمة العدل الدولية؟","الجهاز القضائي الرئيسي للأمم المتحدة، مقرها لاهاي في هولندا، وتتكون من 15 قاضيًا، وتفصل في النزاعات بين الدول لا الأفراد.","النظام الأساسي لمحكمة العدل الدولية"],["f","الفرق بين محكمة العدل الدولية والمحكمة الجنائية الدولية","الأولى تفصل بين الدول وهي جهاز أممي. والثانية تحاكم الأفراد على جرائم الإبادة والحرب والجرائم ضد الإنسانية، وأُنشئت بنظام روما 1998، وليست كل الدول أعضاء فيها.","المحكمة الجنائية الدولية؛ الأمم المتحدة"],["q","كم عدد الدول الأعضاء في جامعة الدول العربية؟","22 دولة، ومقرها القاهرة.","جامعة الدول العربية"],["f","منظمة التعاون الإسلامي","تأسست عام 1969 في الرباط، ومقر أمانتها العامة في جدة، وتضم 57 دولة، وهي ثاني أكبر منظمة حكومية دولية بعد الأمم المتحدة.","منظمة التعاون الإسلامي (oic-oci.org)"],["q","ما مجموعة العشرين؟","منتدى لأكبر 19 اقتصادًا في العالم مع الاتحاد الأوروبي، وانضم الاتحاد الأفريقي عام 2023. والسعودية العضو العربي الوحيد، واستضافت قمتها عام 2020.","مجموعة العشرين (G20)"],["f","مجلس الشورى السعودي","يتكون من رئيس و150 عضوًا يعينهم الملك لمدة أربع سنوات، ويدرس الأنظمة واللوائح ويبدي الرأي فيها. وتشارك فيه المرأة منذ 2013 بنسبة لا تقل عن 20%.","نظام مجلس الشورى؛ مجلس الشورى"],["q","ما هيئة البيعة؟","هيئة أُنشئت عام 1427هـ (2006م) بنظام هيئة البيعة، تضم أبناء الملك المؤسس وأحفاده، وتشارك في اختيار ولي العهد.","نظام هيئة البيعة (1427هـ)"],["f","رؤية السعودية 2030","أُعلنت في 25 أبريل 2016، وتقوم على ثلاثة محاور: مجتمع حيوي، واقتصاد مزدهر، ووطن طموح، وتهدف إلى تنويع الاقتصاد بعيدًا عن النفط.","رؤية المملكة 2030 (vision2030.gov.sa)"],["q","ما الفرق بين الملكية المطلقة والدستورية؟","في الملكية الدستورية يملك الملك رمزيًا وتحكم حكومة منتخبة، مثل بريطانيا واليابان. وفي الملكية التي يجمع فيها الملك السلطات يكون هو مرجع السلطات التنفيذية والتنظيمية والقضائية.","Britannica"],["f","فصل السلطات","فكرة صاغها مونتسكيو في كتابه «روح القوانين» عام 1748: تقسيم السلطة إلى تشريعية وتنفيذية وقضائية لمنع الاستبداد.","Montesquieu, The Spirit of the Laws 1748؛ Britannica"],["q","ما العقد الاجتماعي؟","نظرية تقول إن الحكومة تقوم على اتفاق بين الناس للتنازل عن بعض حرياتهم مقابل الحماية والنظام. ومن أبرز منظريها هوبز ولوك وروسو.","Stanford Encyclopedia of Philosophy"],["f","حلف شمال الأطلسي (الناتو)","تأسس عام 1949 بـ12 دولة، ويضم اليوم 32 دولة بعد انضمام فنلندا 2023 والسويد 2024. ومبدؤه الأساسي في المادة الخامسة: الهجوم على عضو هجوم على الجميع.","حلف الناتو (nato.int)"],["q","متى تأسس الاتحاد الأوروبي؟","بمعاهدة ماستريخت التي دخلت حيز التنفيذ في 1 نوفمبر 1993، وأصله الجماعة الأوروبية للفحم والصلب 1951. وخرجت بريطانيا منه في 31 يناير 2020.","الاتحاد الأوروبي (europa.eu)"],["f","اليورو","العملة الموحدة لعدد من دول الاتحاد الأوروبي، طُرحت إلكترونيًا عام 1999 ونقديًا عام 2002.","البنك المركزي الأوروبي"],["q","ما الحرب الباردة؟","صراع سياسي واقتصادي وعسكري غير مباشر بين الولايات المتحدة والاتحاد السوفيتي من نحو 1947 إلى 1991، دون حرب مباشرة بينهما، وانتهت بتفكك الاتحاد السوفيتي.","Britannica"],["f","الأمين العام للأمم المتحدة","يُعيَّن بقرار من الجمعية العامة بناءً على توصية مجلس الأمن، لولاية مدتها 5 سنوات قابلة للتجديد.","ميثاق الأمم المتحدة، المادة 97"],["q","ما وكالات الأمم المتحدة المتخصصة الشهيرة؟","منها منظمة الصحة العالمية (WHO) في جنيف، واليونسكو في باريس، ومنظمة الأغذية والزراعة (فاو) في روما، وصندوق النقد والبنك الدوليان في واشنطن.","الأمم المتحدة (un.org)"],["f","صندوق النقد الدولي والبنك الدولي","تأسسا في مؤتمر بريتون وودز عام 1944. الصندوق يدعم استقرار العملات والاقتصاد الكلي، والبنك يمول مشاريع التنمية.","صندوق النقد الدولي (imf.org)؛ البنك الدولي"],["q","ما منظمة التجارة العالمية؟","تأسست عام 1995 خلفًا لاتفاقية «الجات»، مقرها جنيف، وتضع قواعد التجارة بين الدول وتفصل في نزاعاتها. وانضمت السعودية إليها عام 2005.","منظمة التجارة العالمية (wto.org)"],["f","الديمقراطية المباشرة وغير المباشرة","في المباشرة يصوت الشعب بنفسه على القرارات، كما في بعض الاستفتاءات السويسرية. وفي غير المباشرة ينتخب الشعب ممثلين يقررون عنه، وهي الأكثر شيوعًا.","Britannica"],["q","ما المجمع الانتخابي الأمريكي؟","آلية لانتخاب الرئيس الأمريكي فيها 538 ناخبًا موزعين على الولايات حسب عدد سكانها، ويحتاج المرشح 270 صوتًا للفوز، فقد يفوز مرشح وهو خاسر في مجموع الأصوات الشعبية.","الأرشيف الوطني الأمريكي (archives.gov)"],["f","مدة الرئاسة الأمريكية","4 سنوات، ولا يجوز انتخاب الشخص أكثر من مرتين بموجب التعديل الثاني والعشرين للدستور (1951).","دستور الولايات المتحدة، التعديل 22"],["q","ما مجلس اللوردات البريطاني؟","الغرفة العليا في البرلمان البريطاني، أعضاؤه غير منتخبين، يُعيَّن أغلبهم مدى الحياة، ويراجع التشريعات دون أن يملك إسقاط إرادة مجلس العموم نهائيًا.","البرلمان البريطاني (parliament.uk)"],["f","اتفاقيات جنيف","أربع اتفاقيات عام 1949 مع بروتوكولاتها، تشكل أساس القانون الدولي الإنساني، وتحمي الجرحى والأسرى والمدنيين في الحروب، وصادقت عليها كل دول العالم.","اللجنة الدولية للصليب الأحمر (ICRC)"],["q","ما الإعلان العالمي لحقوق الإنسان؟","وثيقة اعتمدتها الجمعية العامة للأمم المتحدة في 10 ديسمبر 1948، فيها 30 مادة، وهي ليست معاهدة ملزمة بذاتها.","الأمم المتحدة"],["f","الحياد السويسري","اعترفت القوى الأوروبية بحياد سويسرا الدائم في مؤتمر فيينا عام 1815، ولم تنضم للأمم المتحدة إلا عام 2002.","الحكومة السويسرية؛ Britannica"],["q","ما معنى «القوة الناعمة»؟","مصطلح صاغه جوزيف ناي: قدرة الدولة على التأثير بالجذب والإقناع، عبر الثقافة والقيم والإعلام والتعليم، بدل الإكراه العسكري أو الاقتصادي.","Nye J., Soft Power 2004"],["f","مؤتمر يالطا","اجتمع روزفلت وتشرشل وستالين في فبراير 1945 قرب نهاية الحرب العالمية الثانية، ورسموا ملامح أوروبا بعد الحرب وتأسيس الأمم المتحدة.","Britannica"],["q","ما حق تقرير المصير؟","مبدأ في القانون الدولي يعطي الشعوب حق اختيار وضعها السياسي، ونص عليه ميثاق الأمم المتحدة في المادة الأولى.","ميثاق الأمم المتحدة، المادة 1"],["f","أوبك بلس","تحالف تأسس أواخر 2016 بين دول أوبك ودول منتجة أخرى أبرزها روسيا، لتنسيق مستويات إنتاج النفط.","منظمة أوبك (opec.org)"],["q","ما الفرق بين الاتحاد الفيدرالي والكونفدرالي؟","الفيدرالي دولة واحدة بحكومة مركزية قوية وولايات لها صلاحيات، مثل الولايات المتحدة والإمارات. والكونفدرالي اتحاد دول مستقلة تحتفظ بسيادتها وتنسق في مجالات محددة.","Britannica"],["f","الإمارات العربية المتحدة","تأسست في 2 ديسمبر 1971 اتحادًا من 6 إمارات، وانضمت رأس الخيمة في فبراير 1972 فصارت سبعًا.","Britannica؛ حكومة الإمارات"],["q","ما الفرق بين الحكومة والدولة؟","الدولة كيان دائم يتكون من شعب وأرض وسلطة وسيادة. والحكومة هي الجهاز الذي يدير الدولة وقد يتغير.","Britannica"],["f","أركان الدولة في القانون الدولي","حسب اتفاقية مونتيفيديو 1933: سكان دائمون، وإقليم محدد، وحكومة، وقدرة على إقامة علاقات مع الدول الأخرى.","اتفاقية مونتيفيديو 1933"],["q","ما الدبلوماسية؟","إدارة العلاقات بين الدول بالتفاوض والحوار عبر السفراء والمبعوثين، بدل القوة.","Britannica"],["f","الفرق بين السفارة والقنصلية","السفارة تمثل الدولة سياسيًا وتكون عادة في العاصمة، والقنصلية تقدم خدمات للمواطنين كالجوازات والتأشيرات وقد تكون في مدن أخرى.","اتفاقية فيينا للعلاقات القنصلية 1963"],["q","ما الجمعية العامة للأمم المتحدة؟","الجهاز الذي تُمثل فيه كل الدول الأعضاء بصوت متساوٍ، وتجتمع في دورة سنوية تبدأ في سبتمبر، وقراراتها غير ملزمة غالبًا.","ميثاق الأمم المتحدة، الفصل الرابع"],["f","الفصل السابع من ميثاق الأمم المتحدة","يجيز لمجلس الأمن اتخاذ إجراءات ملزمة، منها العقوبات واستخدام القوة، عند تهديد السلم والأمن الدوليين.","ميثاق الأمم المتحدة، المواد 39–51"],["q","ما مبدأ الدفاع عن النفس في القانون الدولي؟","تنص المادة 51 من ميثاق الأمم المتحدة على حق الدول الطبيعي في الدفاع عن نفسها فرديًا أو جماعيًا إذا تعرضت لهجوم مسلح.","ميثاق الأمم المتحدة، المادة 51"],["f","مجموعة السبع","منتدى لأكبر الاقتصادات الصناعية الغربية: الولايات المتحدة، اليابان، ألمانيا، بريطانيا، فرنسا، إيطاليا، كندا، ويشارك الاتحاد الأوروبي.","Britannica؛ G7"],["q","ما مجموعة بريكس؟","تكتل اقتصادي بدأ بالبرازيل وروسيا والهند والصين ثم جنوب أفريقيا، وتوسع منذ 2024 ليضم دولًا منها مصر والإمارات وإثيوبيا وإيران.","BRICS؛ Reuters 2024"],["f","التحالف الإسلامي العسكري","أُعلن تأسيسه في الرياض في ديسمبر 2015 لمحاربة الإرهاب، ويضم أكثر من 40 دولة.","التحالف الإسلامي العسكري لمحاربة الإرهاب (imctc.org)"],["q","ما رابطة العالم الإسلامي؟","منظمة إسلامية شعبية غير حكومية تأسست عام 1962 في مكة المكرمة، ومقرها فيها.","رابطة العالم الإسلامي (themwl.org)"],["f","مجلس الوزراء السعودي","يرأسه الملك أو ولي العهد بتفويض، ويتولى رسم السياسة الداخلية والخارجية والمالية والاقتصادية وغيرها. وعُين ولي العهد الأمير محمد بن سلمان رئيسًا لمجلس الوزراء عام 2022.","نظام مجلس الوزراء؛ الأمر الملكي (أ/117) 1444هـ"],["q","ما مجالس المناطق في السعودية؟","مجالس في كل منطقة إدارية يرأسها أمير المنطقة، وتدرس احتياجات المنطقة ومشاريعها التنموية، وصدر نظامها عام 1412هـ.","نظام المناطق (1412هـ)"],["f","الانتخابات البلدية في السعودية","أُجريت أول انتخابات بلدية عام 2005، وشاركت المرأة ناخبة ومرشحة لأول مرة في انتخابات 2015.","وزارة الشؤون البلدية والقروية والإسكان؛ Reuters"]],"psychology":[["f","هرم ماسلو للحاجات","اقترح أبراهام ماسلو (1943) أن حاجات الإنسان مرتبة: الحاجات الجسدية، ثم الأمان، ثم الانتماء والحب، ثم التقدير، ثم تحقيق الذات. والأبحاث الحديثة لا تؤيد الترتيب الصارم، لكن الفكرة ما زالت مؤثرة.","Maslow A.H., Psychological Review 1943"],["q","ما الفرق بين الاكتئاب والحزن العادي؟","الحزن شعور طبيعي مؤقت مرتبط بموقف. أما الاكتئاب الجسيم فيستمر أسبوعين فأكثر معظم اليوم، ومعه فقدان الاهتمام والمتعة وتغير في النوم والشهية والطاقة والتركيز، ويؤثر على الحياة اليومية.","DSM-5، الجمعية الأمريكية للطب النفسي"],["f","الاكتئاب منتشر","تقدّر منظمة الصحة العالمية أن نحو 5% من البالغين في العالم يعانون الاكتئاب، وهو من أكبر أسباب الإعاقة عالميًا، ويمكن علاجه بالعلاج النفسي والأدوية.","منظمة الصحة العالمية (WHO)"],["q","ما العلاج المعرفي السلوكي؟","علاج نفسي قصير ومنظم يساعد الشخص على اكتشاف الأفكار السلبية غير الواقعية وتعديلها وتغيير السلوكيات المرتبطة بها. وهو من أكثر العلاجات دعمًا بالأدلة للقلق والاكتئاب.","المعهد الوطني للتميز في الرعاية الصحية البريطاني (NICE)"],["f","اضطراب ما بعد الصدمة","قد يحدث بعد التعرض لحدث صادم شديد، ومن أعراضه استرجاع الحدث كأنه يتكرر، والكوابيس، وتجنب ما يذكّر به، واليقظة الزائدة، لمدة تزيد على شهر.","DSM-5؛ المعهد الوطني للصحة النفسية (NIMH)"],["q","ما اضطراب الوسواس القهري؟","أفكار متكررة مزعجة لا يريدها الشخص (وساوس)، يقابلها سلوك متكرر لتخفيف القلق (أفعال قهرية) مثل الغسل أو التأكد المتكرر. ويستهلك وقتًا ويؤثر على الحياة، ويُعالج بالعلاج السلوكي والأدوية.","DSM-5؛ NIMH"],["f","تأثير الدواء الوهمي (البلاسيبو)","قد يتحسن المريض بعد تناول حبة لا تحتوي أي مادة فعالة، لأنه يتوقع التحسن. ولهذا تُقارن الأدوية الجديدة دائمًا بدواء وهمي.","Kaptchuk & Miller, NEJM 2015"],["q","ما تأثير «النوسيبو»؟","عكس البلاسيبو: الشخص الذي يتوقع آثارًا جانبية سيئة قد يشعر بها فعلًا حتى لو أخذ دواء وهميًا.","Colloca & Barsky, NEJM 2020"],["f","الانحياز التأكيدي","نميل إلى البحث عن المعلومات التي تؤيد ما نعتقده مسبقًا، ونتجاهل ما يخالفه أو نقلل من أهميته.","Nickerson R.S., Review of General Psychology 1998"],["q","ما مغالطة التكلفة الغارقة؟","أن نستمر في شيء خاسر فقط لأننا صرفنا عليه وقتًا أو مالًا، مثل إكمال فيلم ممل لأنك دفعت التذكرة، مع أن ما صُرف لن يعود في الحالتين.","Arkes & Blumer, Organizational Behavior and Human Decision Processes 1985"],["f","أثر الإرساء","أول رقم نسمعه يؤثر على تقديراتنا التالية. في تجربة كانمان وتفيرسكي أثّر رقم عشوائي من عجلة على تقدير الناس لعدد الدول الأفريقية في الأمم المتحدة.","Tversky & Kahneman, Science 1974"],["q","ما «النظامان» في التفكير عند كانمان؟","النظام الأول سريع وتلقائي وعاطفي، والنظام الثاني بطيء ومتأنٍ ومنطقي. وأغلب أخطائنا في الحكم تأتي من الاعتماد على الأول في مواقف تحتاج الثاني.","Kahneman D., Thinking, Fast and Slow 2011"],["f","النفور من الخسارة","ألم خسارة 100 ريال أقوى نفسيًا من فرحة كسب 100 ريال، بنحو الضعف تقريبًا. وهذا من أساسيات «نظرية الاحتمالات» التي نال بها كانمان نوبل الاقتصاد 2002.","Kahneman & Tversky, Econometrica 1979؛ مؤسسة نوبل"],["q","ما متلازمة المحتال؟","شعور الشخص الناجح بأنه لا يستحق نجاحه وأنه «سيُكشف» قريبًا، ويرجع نجاحه للحظ. وصفته كلانس وآيمز عام 1978، وهي ليست تشخيصًا مرضيًا رسميًا.","Clance & Imes, Psychotherapy 1978"],["f","قاعدة الـ21 يومًا لتكوين العادة غير دقيقة","وجدت دراسة في كلية لندن الجامعية أن تكوين عادة جديدة استغرق في المتوسط 66 يومًا، ويتراوح بين 18 و254 يومًا حسب الشخص والعادة.","Lally et al., European Journal of Social Psychology 2010"],["q","ما «التدفق» (Flow)؟","حالة انغماس كامل في نشاط ممتع ومناسب الصعوبة، ينسى فيها الإنسان الوقت. وصفها ميهاي تشيكسنتميهاي، وتحدث عندما يتوازن التحدي مع المهارة.","Csikszentmihalyi M., Flow 1990"],["f","الذاكرة ليست تسجيلًا","كل مرة نتذكر فيها حدثًا نعيد بناءه، وقد نضيف أو نغير تفاصيل دون أن ندري. ولهذا قد يتذكر شخصان الحدث نفسه بشكل مختلف بثقة.","Schacter D.L., The Seven Sins of Memory 2001"],["q","ما تأثير «الاختبار» في التعلم؟","اختبار نفسك فيما تعلمته، بمحاولة استرجاعه دون النظر، يثبت المعلومة أكثر من إعادة قراءتها مرات. ويسمى «الاستدعاء النشط».","Roediger & Karpicke, Psychological Science 2006"],["f","تعدد المهام وهم","الدماغ لا يؤدي مهمتين تحتاجان انتباهًا في الوقت نفسه، بل يتنقل بينهما بسرعة، وكل تنقل يكلف وقتًا ويزيد الأخطاء.","Rubinstein, Meyer & Evans, Journal of Experimental Psychology 2001"],["q","لماذا نتذكر بداية القائمة ونهايتها؟","بسبب «أثر الأولوية» و«أثر الحداثة»: البداية تأخذ وقتًا أكثر في التكرار فتنتقل للذاكرة الطويلة، والنهاية ما زالت في الذاكرة القصيرة. والوسط يُنسى أكثر.","Murdock B.B., Journal of Experimental Psychology 1962"],["f","الضحك معدٍ","سماع ضحك الآخرين ينشط مناطق في الدماغ تهيئ عضلات الوجه للضحك، ولهذا نضحك أكثر في الجماعة بنحو 30 مرة من الضحك وحدنا.","Provine R., Laughter 2000؛ Warren et al., Journal of Neuroscience 2006"],["q","ما «العجز المكتسب»؟","حين يمر الإنسان أو الحيوان بمواقف سيئة لا يستطيع التحكم فيها مرارًا، قد يتوقف عن المحاولة حتى عندما يصبح الحل ممكنًا. وصفه مارتن سيليغمان في تجارب الستينيات، وربطه بالاكتئاب.","Seligman M., Helplessness 1975"],["f","الامتنان يحسن المزاج","وجدت دراسات إيمونز وماكولو أن من يكتبون كل أسبوع أشياء يشعرون بالامتنان لها كانوا أكثر تفاؤلًا وأقل شكوى من أعراض جسدية مقارنة بغيرهم.","Emmons & McCullough, Journal of Personality and Social Psychology 2003"],["q","هل المال يجلب السعادة؟","يرفع المال الرضا عن الحياة بوضوح عند خروج الشخص من الحاجة، ويستمر أثره بعد ذلك لكن أبطأ. ووجدت دراسة 2023 مشتركة بين كانمان وكيلنغزوورث أن السعادة تزيد مع الدخل عند أغلب الناس.","Killingsworth, Kahneman & Mellers, PNAS 2023"],["f","الوحدة تضر الصحة","وجد تحليل لـ148 دراسة أن ضعف العلاقات الاجتماعية يرفع خطر الوفاة بنحو 50%، وهو أثر يقارب أثر التدخين.","Holt-Lunstad et al., PLOS Medicine 2010"],["q","ما اضطراب فرط الحركة وتشتت الانتباه؟","اضطراب نمائي يظهر في الطفولة، فيه صعوبة مستمرة في الانتباه أو فرط حركة واندفاعية تؤثر على الدراسة والحياة، وقد يستمر للبلوغ، ويُعالج بالعلاج السلوكي والأدوية.","DSM-5؛ NIMH"],["f","طيف التوحد","اضطراب نمائي يؤثر على التواصل والتفاعل الاجتماعي، مع سلوكيات أو اهتمامات متكررة. ويختلف كثيرًا من شخص لآخر، ولهذا يسمى «طيفًا». والتدخل المبكر يحسن النتائج.","DSM-5؛ مراكز السيطرة على الأمراض (CDC)"],["q","هل اللقاحات تسبب التوحد؟","لا. الدراسة التي ادعت ذلك عام 1998 سُحبت لتزوير بياناتها، وشُطب صاحبها من السجل الطبي. ودراسات على ملايين الأطفال لم تجد أي علاقة.","Hviid et al., Annals of Internal Medicine 2019؛ The Lancet 2010 (سحب الدراسة)"],["f","أثر التعرض المجرد","نميل لتفضيل الأشياء والأشخاص الذين نراهم كثيرًا، حتى دون أن ننتبه. وصفه روبرت زايونس عام 1968.","Zajonc R.B., Journal of Personality and Social Psychology 1968"],["q","ما «الإسقاط» في علم النفس؟","آلية دفاعية ينسب فيها الشخص مشاعره أو صفاته غير المقبولة إلى غيره، مثل من يشعر بالغضب فيتهم الآخرين بأنهم غاضبون منه.","APA Dictionary of Psychology"],["f","الرياضة علاج للاكتئاب","وجد تحليل شامل نشر في BMJ عام 2024 أن الرياضة، خصوصًا المشي والجري واليوغا وتمارين القوة، تخفف أعراض الاكتئاب بفعالية تقارب العلاج النفسي.","Noetel et al., BMJ 2024"],["q","ما «اليقظة الذهنية» (Mindfulness)؟","تدريب الانتباه على اللحظة الحاضرة دون حكم، كمراقبة التنفس والأفكار. وتظهر الأبحاث أنها تخفف القلق والتوتر بدرجة متوسطة.","Goyal et al., JAMA Internal Medicine 2014"],["f","الضوء الأزرق والنوم","الشاشات قبل النوم تؤخر إفراز الميلاتونين وتجعل النوم أصعب وأقل جودة. ووجدت دراسة هارفارد أن القراءة من جهاز لوحي ليلًا أخرت ساعة الجسم مقارنة بالكتاب الورقي.","Chang et al., PNAS 2015"],["q","ما «أثر بيغماليون»؟","توقعات الآخرين عنا، كالمعلم أو المدير، قد تغير أداءنا فعلًا لتقترب من توقعاتهم، إيجابيًا أو سلبيًا.","Rosenthal & Jacobson, 1968"],["f","أثر فرانكلين","إذا طلبت من شخص أن يسدي لك معروفًا صغيرًا، يزيد ميله إليك، لأنه يبرر فعله بأنك تستحق. وسُمّي باسم بنجامين فرانكلين الذي وصفه.","Jecker & Landy, Human Relations 1969"],["q","ما الذكاء العاطفي؟","القدرة على فهم مشاعرك وإدارتها، وفهم مشاعر الآخرين والتعامل معها. اشتهر المفهوم بكتاب دانيال جولمان عام 1995، وصاغه علميًا سالوفي وماير عام 1990.","Salovey & Mayer, Imagination, Cognition and Personality 1990"],["f","نظريات الذكاءات المتعددة","اقترح هوارد غاردنر (1983) أن الذكاء أنواع: لغوي، ومنطقي رياضي، ومكاني، وموسيقي، وجسدي حركي، واجتماعي، وذاتي، وطبيعي. وهي مؤثرة في التعليم لكن دعمها التجريبي محدود.","Gardner H., Frames of Mind 1983"],["q","هل «أنماط التعلم» (بصري وسمعي وحركي) صحيحة؟","لا يوجد دليل قوي على أن تدريس الطالب حسب «نمطه» يحسن تعلمه، رغم شيوع الفكرة. والأفضل تنويع الأساليب حسب طبيعة المادة.","Pashler et al., Psychological Science in the Public Interest 2008"],["f","نحن لا نستخدم 10% فقط من الدماغ","هذه خرافة. التصوير الدماغي يظهر أن كل مناطق الدماغ تعمل، وإن لم تعمل كلها في اللحظة نفسها.","Scientific American؛ Beyerstein 1999"],["q","ما الفرق بين الانطوائي والمنفتح؟","المنفتح يستمد طاقته من التواجد مع الناس، والانطوائي يستعيد طاقته بالانفراد. وهي صفة على طيف، وأغلب الناس في الوسط.","Cain S., Quiet 2012؛ نموذج العوامل الخمسة"],["f","العوامل الخمسة الكبرى للشخصية","الانفتاح على الخبرة، ويقظة الضمير، والانبساط، والمقبولية، والعصابية. وهو أكثر نماذج الشخصية قبولًا علميًا.","McCrae & Costa, American Psychologist 1997"],["q","هل اختبار MBTI للشخصية دقيق؟","مشهور جدًا لكنه ضعيف علميًا: كثير من الناس تتغير نتيجتهم عند إعادته، ويقسم الصفات إلى أنواع ثنائية بينما هي متدرجة.","Pittenger D., Consulting Psychology Journal 2005"],["f","أثر الإطار","طريقة عرض المعلومة تغير قرارنا: «نسبة نجاح 90%» تبدو أفضل من «نسبة فشل 10%» مع أنهما المعنى نفسه.","Tversky & Kahneman, Science 1981"],["q","ما وهم التخطيط؟","ميلنا لتقدير وقت إنجاز المهام بأقل من الحقيقة، حتى مع خبرتنا السابقة بالتأخير. ومن علاجه الاعتماد على مدد مشاريع مشابهة سابقة.","Buehler, Griffin & Ross, Journal of Personality and Social Psychology 1994"],["f","تأثير الندرة","نُقدّر الأشياء أكثر إذا كانت نادرة أو محدودة الوقت، ولهذا تكثر عبارات «العرض لفترة محدودة» و«بقيت قطعتان».","Cialdini R., Influence 1984"],["q","ما مبادئ الإقناع الستة عند تشالديني؟","المعاملة بالمثل، والالتزام والثبات، والدليل الاجتماعي، والإعجاب، والسلطة، والندرة. وأضاف لاحقًا مبدأ سابعًا هو الوحدة أو الانتماء.","Cialdini R., Influence 1984 و2021"],["f","الدليل الاجتماعي","نميل لتقليد ما يفعله الآخرون خصوصًا في المواقف الغامضة، ولهذا تؤثر التقييمات و«الأكثر مبيعًا» في قراراتنا.","Cialdini R., Influence 1984"],["q","ما متلازمة استوكهولم؟","تعاطف بعض الرهائن مع خاطفيهم، سُميت بعد حادثة سطو في استوكهولم عام 1973. وهي ليست تشخيصًا رسميًا في الأدلة النفسية.","Britannica؛ APA Dictionary of Psychology"],["f","الذاكرة العاملة","نظام يحفظ المعلومات مؤقتًا ويعالجها، مثل حفظ رقم أثناء طلبه. وصاغ نموذجها باديلي وهيتش عام 1974.","Baddeley & Hitch, 1974"],["q","لماذا ننسى أحلامنا؟","لأن الدماغ أثناء النوم، خاصة نوم حركة العين السريعة، يكون أقل إفرازًا لبعض النواقل المهمة لتثبيت الذاكرة، فننسى أغلب الأحلام خلال دقائق من الاستيقاظ ما لم نسجلها.","Nir & Tononi, Trends in Cognitive Sciences 2010"],["f","التوتر الجيد والسيئ","التوتر المعتدل القصير قد يحسن الأداء، والمزمن يضر الصحة والذاكرة. ويعبر عن ذلك قانون «يركس دودسون»: الأداء يرتفع مع الإثارة حتى حد معين ثم ينخفض.","Yerkes & Dodson, 1908"],["q","ما الاحتراق الوظيفي؟","حالة إنهاك مزمن من ضغط العمل غير المُدار، ومن علاماتها الإرهاق والتبلد تجاه العمل وتراجع الإنجاز. وأدرجتها منظمة الصحة العالمية ظاهرة مهنية في ICD-11.","منظمة الصحة العالمية (WHO) — ICD-11"],["f","قاعدة الدقيقتين","إذا كانت المهمة تستغرق أقل من دقيقتين فافعلها فورًا بدل تأجيلها. وهي من أسلوب ديفيد ألن في إدارة المهام «Getting Things Done».","Allen D., Getting Things Done 2001"],["q","لماذا نؤجل المهام؟","الأبحاث تربط التسويف بتنظيم المشاعر أكثر من الكسل: نهرب من شعور مزعج مرتبط بالمهمة كالملل أو الخوف من الفشل.","Sirois & Pychyl, Social and Personality Psychology Compass 2013"],["f","نية التنفيذ «إذا... فإن»","كتابة خطة محددة مثل «إذا صليت العصر، فإني أقرأ 10 صفحات» ترفع احتمال تنفيذ العادة بشكل واضح.","Gollwitzer & Sheeran, Advances in Experimental Social Psychology 2006"],["f","أثر الهالة العكسي (أثر القرن)","عكس أثر الهالة: صفة سلبية واحدة في شخص، كمظهر غير مرتب، تجعلنا نحكم على باقي صفاته سلبيًا دون دليل.","Thorndike 1920؛ APA Dictionary of Psychology"],["q","ما خطأ الإسناد الأساسي؟","ميلنا لتفسير سلوك الآخرين بشخصياتهم ونسيان ظروفهم. إذا تأخر غيرك قلنا «مستهتر»، وإذا تأخرنا قلنا «الزحمة». وصفه لي روس عام 1977.","Ross L., Advances in Experimental Social Psychology 1977"],["f","انحياز خدمة الذات","ننسب نجاحنا لقدراتنا وجهدنا، وننسب فشلنا للحظ أو الظروف أو الآخرين.","Miller & Ross, Psychological Bulletin 1975"],["q","ما أثر «الإجماع الزائف»؟","ميلنا للاعتقاد بأن أغلب الناس يفكرون ويتصرفون مثلنا أكثر مما هو في الحقيقة.","Ross, Greene & House, Journal of Experimental Social Psychology 1977"],["f","انحياز الإدراك المتأخر","بعد وقوع الحدث نشعر أننا «كنا نعرف أنه سيحدث»، فنبالغ في قدرتنا على التنبؤ.","Fischhoff B., Journal of Experimental Psychology 1975"],["q","ما انحياز التوافر؟","نحكم على احتمال الشيء بسهولة تذكر أمثلة له. فبعد سماع خبر حادث طائرة نبالغ في خطر الطيران، مع أنه أكثر أمانًا من السيارة.","Tversky & Kahneman, Cognitive Psychology 1973"],["f","مغالطة المقامر","الاعتقاد بأن حدثًا عشوائيًا يصبح أرجح لأنه لم يحدث مؤخرًا، مثل توقع «الصورة» بعد خمس رميات «كتابة»، مع أن الاحتمال يبقى 50%.","Tversky & Kahneman, Science 1974"],["q","ما الانحياز للوضع الراهن؟","تفضيلنا لبقاء الأمور كما هي وتجنب التغيير، حتى لو كان البديل أفضل. ولهذا تؤثر «الخيارات الافتراضية» كثيرًا في قراراتنا.","Samuelson & Zeckhauser, Journal of Risk and Uncertainty 1988"],["f","أثر الخيار الافتراضي","في الدول التي تجعل التبرع بالأعضاء هو الخيار الافتراضي (ومن لا يريد ينسحب) تتجاوز نسب الموافقة 90%، بينما تقل كثيرًا في الدول التي تطلب التسجيل.","Johnson & Goldstein, Science 2003"],["q","ما «الوكز» (Nudge)؟","تغيير بسيط في طريقة عرض الخيارات يوجه الناس لقرار أفضل دون منعهم من غيره، مثل وضع الفواكه في مستوى النظر. وصاغه ثالر وسنستين، ونال ثالر نوبل الاقتصاد 2017.","Thaler & Sunstein, Nudge 2008؛ مؤسسة نوبل"],["f","الحسابات الذهنية","نتعامل مع المال بحسب «مصدره» أو «حسابه» في أذهاننا، فنصرف الهدية أو الجائزة بسهولة أكثر من الراتب مع أن الريال هو الريال.","Thaler R., Journal of Behavioral Decision Making 1999"],["q","ما أثر الملكية؟","نقيّم الشيء أعلى إذا امتلكناه. في تجربة شهيرة طلب مالكو الأكواب نحو ضعف السعر الذي يقبل غيرهم دفعه لنفس الكوب.","Kahneman, Knetsch & Thaler, Journal of Political Economy 1990"],["f","مفارقة الاختيار","كثرة الخيارات قد تقلل الرضا وتؤخر القرار. وفي تجربة المربى الشهيرة اشترى الزبائن أكثر عندما عُرض عليهم 6 أنواع بدل 24، وإن كانت الدراسات اللاحقة متفاوتة.","Iyengar & Lepper, Journal of Personality and Social Psychology 2000؛ Schwartz, The Paradox of Choice 2004"],["q","ما «الإرهاق القراري»؟","فكرة أن كثرة القرارات خلال اليوم تضعف جودة القرارات اللاحقة. والدليل عليها مختلط، ونظرية «استنزاف الإرادة» المرتبطة بها فشلت في إعادة كبيرة عام 2016.","Hagger et al., Perspectives on Psychological Science 2016"],["f","أزمة إعادة الإنتاج في علم النفس","حاول مشروع كبير عام 2015 إعادة 100 دراسة نفسية منشورة، فنجحت نحو 36% فقط بنتائج دالة. ودفع ذلك العلماء لمعايير أكثر صرامة مثل التسجيل المسبق للدراسات.","Open Science Collaboration, Science 2015"],["q","ما «التسجيل المسبق» للدراسات؟","أن يعلن الباحث فرضياته وطريقة تحليله قبل جمع البيانات، حتى لا يعدّل التحليل بعد رؤية النتائج ليجد نتيجة «مثيرة».","Nosek et al., PNAS 2018"],["f","الذاكرة الوامضة","ذكريات أحداث صادمة كبرى نشعر بأننا نتذكرها بوضوح شديد، لكن الدراسات أظهرت أنها تتغير مع الوقت كثيرًا رغم ثقتنا العالية بها.","Talarico & Rubin, Psychological Science 2003"],["q","ما فقدان ذاكرة الطفولة؟","عجز أغلب البالغين عن تذكر أحداث قبل سن 3 أو 4 سنوات تقريبًا، ويرتبط بنمو الحُصين واللغة وتكوّن مفهوم الذات.","Bauer P., Annual Review of Psychology 2015"],["f","الذاكرة الإجرائية","ذاكرة المهارات مثل ركوب الدراجة والكتابة على لوحة المفاتيح، تبقى طويلًا حتى عند بعض مرضى فقدان الذاكرة.","Squire L., Neurobiology of Learning and Memory 2004"],["q","من هو المريض H.M.؟","هنري موليسون، أزيل جزء من الحُصين عنده عام 1953 لعلاج الصرع، ففقد القدرة على تكوين ذكريات جديدة طويلة المدى، وصارت حالته أساس فهم دور الحُصين في الذاكرة.","Scoville & Milner, Journal of Neurology, Neurosurgery and Psychiatry 1957"],["f","فينياس غيج","عامل سكك حديد اخترق قضيب حديدي جمجمته عام 1848 فدمّر جزءًا من فصه الجبهي، فنجا لكن شخصيته تغيرت. وصارت حالته دليلًا مبكرًا على دور الفص الجبهي في الشخصية والسلوك.","Harlow J., 1868؛ Damasio et al., Science 1994"],["q","ما وظيفة اللوزة الدماغية؟","منطقة صغيرة عميقة في الدماغ تعالج المشاعر خاصة الخوف، وتساعد على تذكر الأحداث العاطفية.","LeDoux J., The Emotional Brain 1996"],["f","الدوبامين ليس هرمون السعادة فقط","الدوبامين يرتبط أكثر بالتوقع والدافعية والسعي للمكافأة، لا بمتعة الحصول عليها نفسها.","Berridge & Robinson, Brain Research Reviews 1998"],["q","ما السيروتونين؟","ناقل عصبي يشارك في تنظيم المزاج والنوم والشهية. وتعمل كثير من مضادات الاكتئاب على زيادة توفره، لكن نظرية «الاكتئاب = نقص السيروتونين» البسيطة لم تعد مقبولة.","Moncrieff et al., Molecular Psychiatry 2022"],["f","الأوكسيتوسين","هرمون يرتبط بالترابط الاجتماعي والأمومة والثقة، ويُفرز أثناء الولادة والرضاعة والتلامس. لكن آثاره أعقد من لقب «هرمون الحب».","Bartz et al., Trends in Cognitive Sciences 2011"],["q","ما المرونة العصبية؟","قدرة الدماغ على تغيير وصلاته وتكوين وصلات جديدة طوال الحياة بالتعلم والتجربة، وهي أساس التأهيل بعد الجلطات الدماغية.","Kolb & Whishaw, Annual Review of Psychology 1998"],["f","الخلايا المرآتية","خلايا عصبية اكتُشفت عند القرود تنشط عند القيام بفعل وعند مشاهدة غيرك يفعله. ودورها في التعاطف عند الإنسان ما زال محل نقاش علمي.","Rizzolatti & Craighero, Annual Review of Neuroscience 2004"],["q","ما مراحل النمو المعرفي عند بياجيه؟","أربع: الحسية الحركية (0–2 سنة)، وما قبل العمليات (2–7)، والعمليات المحسوسة (7–11)، والعمليات المجردة (من 11 فأكثر).","Piaget J., The Origins of Intelligence in Children 1952"],["f","منطقة النمو القريبة عند فيغوتسكي","المسافة بين ما يستطيع الطفل فعله وحده وما يستطيعه بمساعدة شخص أكبر. والتعليم الأنجح يستهدف هذه المنطقة.","Vygotsky L., Mind in Society 1978"],["q","ما نظرية التعلق؟","صاغها جون بولبي: يحتاج الطفل إلى رابطة آمنة مع من يرعاه، وهذه الرابطة تؤثر على علاقاته لاحقًا. وصنفت ماري إينسورث أنماط التعلق: آمن، وقلق، وتجنبي.","Bowlby J., Attachment 1969؛ Ainsworth et al., 1978"],["f","تجربة «الموقف الغريب»","تجربة لماري إينسورث تراقب ردة فعل الطفل عند خروج أمه ودخول غريب ثم عودتها، لتحديد نمط تعلقه.","Ainsworth et al., Patterns of Attachment 1978"],["q","ما أساليب التربية الأربعة؟","حسب بومريند وتطويرات لاحقة: الحازم (دفء مع قواعد واضحة) وهو الأفضل نتائج غالبًا، والمتسلط (قواعد بلا دفء)، والمتساهل (دفء بلا قواعد)، والمهمل.","Baumrind D., 1966؛ Maccoby & Martin 1983"],["f","مراحل إريكسون النفسية الاجتماعية","ثمان مراحل من الولادة للشيخوخة، لكل منها أزمة، مثل «الثقة مقابل عدم الثقة» في الرضاعة، و«الهوية مقابل تشتت الدور» في المراهقة.","Erikson E., Childhood and Society 1950"],["q","لماذا المراهقون أكثر اندفاعًا؟","لأن مراكز المكافأة في الدماغ تنضج مبكرًا، بينما القشرة الجبهية المسؤولة عن ضبط النفس والتخطيط يستمر نضجها حتى منتصف العشرينات تقريبًا.","Casey, Jones & Hare, Annals of the NYAS 2008"],["f","ضغط الأقران عند المراهقين","وجدت دراسة لاورنس شتاينبرغ أن المراهقين في محاكاة القيادة يخاطرون أكثر بوضوح عندما يراقبهم أصدقاؤهم، بخلاف البالغين.","Gardner & Steinberg, Developmental Psychology 2005"],["q","ما الاكتئاب بعد الولادة؟","اكتئاب يصيب نحو 10–15% من الأمهات بعد الولادة، ويختلف عن «كآبة النفاس» الخفيفة المؤقتة التي تزول خلال أسبوعين. ويحتاج علاجًا ودعمًا.","منظمة الصحة العالمية (WHO)؛ ACOG"],["f","الاضطراب العاطفي الموسمي","نوع من الاكتئاب يتكرر في فصول قلة الضوء كالشتاء في البلدان الشمالية، ومن علاجه التعرض لضوء صناعي قوي صباحًا.","المعهد الوطني للصحة النفسية (NIMH)"],["q","ما اضطراب ثنائي القطب؟","اضطراب تتناوب فيه نوبات اكتئاب ونوبات هوس أو هوس خفيف، فيها طاقة عالية وقلة نوم واندفاع. ويحتاج علاجًا دوائيًا منتظمًا كمثبتات المزاج.","DSM-5؛ NIMH"],["f","الفصام","اضطراب نفسي شديد يؤثر على التفكير والإدراك، من أعراضه الهلاوس والأوهام واضطراب الكلام. ولا يعني «انقسام الشخصية» كما يُظن، ويُعالج بالأدوية والدعم.","DSM-5؛ منظمة الصحة العالمية (WHO)"],["q","ما الفرق بين الطبيب النفسي والأخصائي النفسي؟","الطبيب النفسي طبيب بشري متخصص في الطب النفسي يشخّص ويصف الأدوية. والأخصائي النفسي درس علم النفس ويقدّم العلاج النفسي والاختبارات، ولا يصف الأدوية في أغلب الدول.","الجمعية الأمريكية لعلم النفس (APA)"],["f","نوبة الهلع","نوبة خوف شديد مفاجئة تصل ذروتها خلال دقائق، مع خفقان وضيق نفس ودوخة وشعور بالموت أو فقدان السيطرة. مخيفة لكنها ليست خطيرة جسديًا عادة، وتُعالج بنجاح.","DSM-5؛ NIMH"],["q","ما تقنية التنفس 4-7-8؟","شهيق من الأنف 4 ثوانٍ، وحبس النفس 7، وزفير من الفم 8. ويستخدمها كثيرون للاسترخاء، والدليل العلمي على التنفس البطيء عمومًا أقوى من هذه الأرقام تحديدًا.","Zaccaro et al., Frontiers in Human Neuroscience 2018"],["f","التعرض التدريجي لعلاج الرهاب","يتعرض الشخص لما يخافه تدريجيًا وبأمان، من الأسهل للأصعب، حتى يقل القلق. وهو من أنجح علاجات الرهاب.","المعهد الوطني للتميز في الرعاية الصحية (NICE)"],["q","ما الرهاب الاجتماعي؟","خوف شديد ومستمر من مواقف التعامل مع الناس خوفًا من الإحراج أو التقييم السلبي، يؤدي للتجنب ويؤثر على الحياة. وهو أكثر من الخجل العادي.","DSM-5؛ NIMH"],["f","العلاج بالقبول والالتزام","علاج نفسي حديث لا يحارب الأفكار المزعجة، بل يعلّم تقبلها وملاحظتها دون أن تتحكم في السلوك، والتصرف حسب القيم المهمة للشخص.","Hayes S., Acceptance and Commitment Therapy 1999"],["q","ما «الاجترار» الفكري؟","التفكير المتكرر في المشاكل وأسبابها دون الوصول لحل، ويرتبط بزيادة الاكتئاب والقلق.","Nolen-Hoeksema S., Journal of Abnormal Psychology 1991"],["f","كتابة المشاعر تخفف الضغط","وجد جيمس بينيبيكر أن الكتابة عن التجارب الصعبة 15–20 دقيقة لعدة أيام حسّنت الصحة النفسية وقللت زيارات الطبيب عند المشاركين.","Pennebaker J., Psychological Science 1997"],["q","ما الطبيعة وأثرها على النفس؟","وجدت دراسات أن المشي في الطبيعة 90 دقيقة قلل الاجترار ونشاط منطقة دماغية مرتبطة به مقارنة بالمشي في المدينة.","Bratman et al., PNAS 2015"],["f","التطوع والسعادة","مساعدة الآخرين ترتبط بزيادة السعادة. وفي تجربة دن وزملائها، من صرفوا مبلغًا صغيرًا على غيرهم كانوا أسعد ممن صرفوه على أنفسهم.","Dunn, Aknin & Norton, Science 2008"],["q","ما «التكيف الهيدوني»؟","ميلنا للعودة لمستوى سعادتنا المعتاد بعد الأحداث الكبيرة، السعيدة والحزينة. فالفرحة بسيارة جديدة تتلاشى بعد أشهر.","Brickman et al., Journal of Personality and Social Psychology 1978"],["f","التجارب تسعد أكثر من الأشياء","وجدت دراسات أن صرف المال على التجارب كالسفر والنزهات يسعد أكثر وأطول من صرفه على الأشياء المادية، لأن التجارب تصبح ذكريات وجزءًا من الهوية.","Van Boven & Gilovich, Journal of Personality and Social Psychology 2003"],["q","ما «قاعدة الذروة والنهاية»؟","نتذكر التجربة ونقيّمها حسب أشد لحظاتها ونهايتها، لا حسب متوسطها ومدتها. اكتشفها كانمان في تجارب على الألم.","Kahneman et al., Psychological Science 1993"],["f","أثر الإنجاز الصغير","تتبعت تيريزا أمابيل يوميات مئات الموظفين، فوجدت أن الإحساس بالتقدم في عمل ذي معنى، ولو صغيرًا، هو أقوى ما يرفع دافعيتهم في يومهم.","Amabile & Kramer, The Progress Principle 2011"],["q","ما الدافعية الداخلية والخارجية؟","الداخلية: تفعل الشيء لأنه ممتع أو ذو معنى. والخارجية: تفعله لمكافأة أو تجنب عقاب. ونظرية تقرير الذات تقول إن الاستقلالية والكفاءة والانتماء تغذي الدافعية الداخلية.","Deci & Ryan, American Psychologist 2000"],["f","المكافأة قد تقتل المتعة","في تجارب، أطفال يحبون الرسم قلّ رسمهم بعد أن صاروا يُكافؤون عليه ثم توقفت المكافأة، وتسمى «أثر التبرير المفرط».","Lepper, Greene & Nisbett, Journal of Personality and Social Psychology 1973"],["q","ما «الكفاءة الذاتية» عند باندورا؟","إيمان الشخص بقدرته على إنجاز مهمة معينة، وتؤثر على مدى محاولته وصبره. وتُبنى خاصة بالنجاحات الصغيرة المتكررة.","Bandura A., Psychological Review 1977"],["f","مركز التحكم","الأشخاص ذوو «مركز التحكم الداخلي» يرون أن نتائج حياتهم بأيديهم، وغيرهم يرونها بيد الحظ والظروف. والأول يرتبط بنتائج أفضل في الدراسة والصحة.","Rotter J., Psychological Monographs 1966"],["q","ما «العزيمة» (Grit)؟","مفهوم أنجيلا داكوورث: الجمع بين الشغف والمثابرة على أهداف طويلة المدى. ووجدت تحليلات لاحقة أن أثرها أصغر مما رُوّج وقريب من «يقظة الضمير».","Duckworth et al., 2007؛ Credé et al., Journal of Personality and Social Psychology 2017"],["f","أثر المتفرج وقصة كيتي جينوفيز","اشتهر أثر المتفرج بعد مقتل كيتي جينوفيز في نيويورك عام 1964، وقيل إن 38 شخصًا شاهدوا ولم يتدخلوا. وتبين لاحقًا أن الرقم مبالغ فيه، لكن التجارب أثبتت الظاهرة نفسها.","Manning, Levine & Collins, American Psychologist 2007"],["q","ما «التفكير الجماعي»؟","ميل الجماعات المتماسكة لاتخاذ قرارات سيئة لأن أعضاءها يتجنبون المعارضة للحفاظ على الانسجام. وصفه إيرفينغ جانيس بعد دراسة كوارث سياسية مثل غزو خليج الخنازير.","Janis I., Victims of Groupthink 1972"],["f","استقطاب الجماعة","بعد النقاش داخل مجموعة متشابهة الرأي، يصبح رأيها أكثر تطرفًا في الاتجاه نفسه مما كان عليه أفرادها قبل النقاش.","Myers & Lamm, Psychological Bulletin 1976"],["q","ما «التسكع الاجتماعي»؟","ميل الأفراد لبذل جهد أقل عند العمل في مجموعة مقارنة بالعمل وحدهم، لأن الجهد الفردي لا يظهر. وأثبتته تجربة شد الحبل لرينغلمان.","Latané, Williams & Harkins, Journal of Personality and Social Psychology 1979"],["f","التيسير الاجتماعي","وجود الآخرين يحسن أداءنا في المهام السهلة المتقنة، ويضعفه في المهام الصعبة الجديدة. وأول تجربة نفسية اجتماعية على ذلك لتريبليت عام 1898 على راكبي الدراجات.","Zajonc R., Science 1965؛ Triplett 1898"],["q","ما تجربة «كهف اللصوص»؟","قسّم مظفر شريف عام 1954 أولادًا في مخيم إلى فريقين، فنشأ عداء بينهما بالمنافسة، ثم زال بإعطائهم أهدافًا مشتركة لا تتحقق إلا بالتعاون.","Sherif M. et al., The Robbers Cave Experiment 1961"],["f","فرضية التواصل","التواصل المباشر بين جماعات متنافرة، في ظروف متكافئة وهدف مشترك، يقلل التحيز بينها. وأكدها تحليل لأكثر من 500 دراسة.","Allport G., The Nature of Prejudice 1954؛ Pettigrew & Tropp, 2006"],["q","ما «الجماعة الداخلية والخارجية»؟","نميل لتفضيل جماعتنا ونرى أفرادها متنوعين، ونرى أفراد الجماعات الأخرى متشابهين. ويحدث ذلك حتى مع تقسيم عشوائي تافه كما أظهر هنري تاجفل.","Tajfel H., Scientific American 1970"],["f","التنميط وتهديد الصورة النمطية","تذكير الشخص بصورة نمطية سلبية عن جماعته قبل اختبار قد يضعف أداءه فعلًا. وصفه ستيل وأرونسون عام 1995، والأبحاث اللاحقة وجدت الأثر أصغر وغير ثابت.","Steele & Aronson, Journal of Personality and Social Psychology 1995"],["q","ما «قدم في الباب»؟","طلب شيء صغير أولًا يزيد احتمال موافقة الشخص على طلب أكبر لاحقًا، لأنه يريد البقاء متسقًا مع نفسه.","Freedman & Fraser, Journal of Personality and Social Psychology 1966"],["f","«الباب في الوجه»","طلب شيء كبير يُتوقع رفضه، ثم طلب الأصغر المقصود، فيزيد احتمال القبول لأن الشخص يشعر بأنك تنازلت.","Cialdini et al., Journal of Personality and Social Psychology 1975"],["q","لماذا يكررون الإعلان كثيرًا؟","بسبب «أثر الحقيقة الوهمية»: تكرار العبارة يجعلها تبدو أصدق، حتى لو كنا نعرف أنها خاطئة.","Hasher, Goldstein & Toppino, 1977؛ Fazio et al., 2015"],["f","الأخبار الكاذبة تنتشر أسرع","وجدت دراسة على تويتر بين 2006 و2017 أن الأخبار الكاذبة انتشرت أسرع وأبعد وأوسع من الصحيحة، ويرجح الباحثون أن السبب أنها أكثر إثارة وجِدة.","Vosoughi, Roy & Aral, Science 2018"],["q","ما «غرفة الصدى»؟","بيئة، غالبًا على الإنترنت، لا يسمع فيها الشخص إلا آراء تشبه رأيه، فتتعزز قناعاته ويقل تعرضه للمخالف.","Cinelli et al., PNAS 2021"],["f","أثر دانينغ كروغر في القيادة","أكثر السائقين يقيّمون أنفسهم فوق المتوسط. في دراسة سفينسون 1981، قيّم نحو 93% من الطلاب الأمريكيين أنفسهم أمهر من السائق المتوسط.","Svenson O., Acta Psychologica 1981"],["q","ما «الانحياز التفاؤلي»؟","اعتقادنا بأن الأشياء السيئة تحدث للآخرين أكثر منا، كالأمراض والحوادث والطلاق.","Sharot T., Current Biology 2011؛ Weinstein 1980"],["f","الانحياز السلبي","الأحداث والمعلومات السلبية تؤثر فينا أقوى من الإيجابية المساوية لها، ولهذا يعلق النقد في الذهن أكثر من المديح.","Baumeister et al., Review of General Psychology 2001"],["q","ما نسبة غوتمان في العلاقات؟","وجد جون غوتمان أن الأزواج المستقرين يتبادلون في الخلاف نحو 5 تفاعلات إيجابية مقابل كل تفاعل سلبي.","Gottman J., What Predicts Divorce? 1994"],["f","الفرسان الأربعة عند غوتمان","أربعة سلوكيات تنبئ بانهيار العلاقة الزوجية: النقد الهجومي، والاحتقار، والدفاعية، والانسحاب والصمت. وأخطرها الاحتقار.","Gottman J., The Seven Principles for Making Marriage Work 1999"],["q","هل المتشابهون ينجذبون أم المختلفون؟","تؤكد الأبحاث أن التشابه في القيم والاهتمامات والخلفية يقوي الانجذاب والاستقرار أكثر من الاختلاف.","Montoya, Horton & Kirchner, Journal of Social and Personal Relationships 2008"],["f","أثر القرب","نميل لتكوين صداقات مع من هم قريبون منا مكانيًا. ففي دراسة سكن الطلاب، كان الجيران في نفس الممر أكثر صداقة من البعيدين.","Festinger, Schachter & Back, Social Pressures in Informal Groups 1950"],["q","كم صديقًا مقربًا يستطيع الإنسان الاحتفاظ به؟","اقترح عالم الأنثروبولوجيا روبن دنبار أن الإنسان يحتفظ بنحو 150 علاقة اجتماعية مستقرة، منها نحو 5 مقربين جدًا ونحو 15 مقربين.","Dunbar R., Journal of Human Evolution 1992"],["f","الاستماع الفعال","يقوم على الانتباه الكامل، وإعادة صياغة ما قاله المتحدث، والسؤال لفهمه لا للرد عليه. ويقلل سوء الفهم ويقوي العلاقات.","Rogers & Farson, Active Listening 1957"],["q","ما لغة الجسد الأهم في أول انطباع؟","يكوّن الناس انطباعًا عن الثقة والجدارة من الوجه خلال جزء من الثانية، نحو 100 ملي ثانية، وتتغير قليلًا بالمزيد من الوقت.","Willis & Todorov, Psychological Science 2006"],["f","قاعدة ميهرابيان مفهومة خطأ","يُقال إن 7% فقط من الرسالة كلمات و93% نبرة ولغة جسد، لكن ميهرابيان قصد ذلك في التعبير عن المشاعر والإعجاب فقط في تجارب محددة، لا في كل تواصل.","Mehrabian A., Silent Messages 1971"],["q","هل وضعيات القوة ترفع الثقة؟","ادعت دراسة 2010 أن وقفة القوة لدقيقتين ترفع التستوستيرون، لكن الإعادات لم تجد أثرًا هرمونيًا، وربما يبقى أثر بسيط على الشعور الذاتي فقط.","Ranehill et al., Psychological Science 2015"],["f","كشف الكذب صعب","في تحليل لأكثر من 200 دراسة، كانت قدرة الناس على كشف الكذب نحو 54% فقط، أي قريبة من التخمين.","Bond & DePaulo, Personality and Social Psychology Review 2006"],["q","هل جهاز كشف الكذب دقيق؟","جهاز البوليغراف يقيس النبض والتنفس والتعرق، أي التوتر لا الكذب نفسه، ولهذا قد يخطئ، ولا تقبله كثير من المحاكم دليلًا قاطعًا.","الأكاديمية الوطنية للعلوم الأمريكية، The Polygraph and Lie Detection 2003"],["f","النوم وحل المشكلات","في تجربة شهيرة، المشاركون الذين ناموا كانوا أكثر اكتشافًا لقاعدة مخفية في مسألة رياضية من الذين بقوا مستيقظين بأكثر من الضعف.","Wagner et al., Nature 2004"],["q","هل القيلولة مفيدة؟","قيلولة قصيرة من 10 إلى 20 دقيقة تحسن اليقظة والأداء دون خمول بعدها، أما الطويلة فقد تسبب ثقلًا بعد الاستيقاظ.","Brooks & Lack, Sleep 2006"],["f","الأرق المزمن وعلاجه","العلاج المعرفي السلوكي للأرق (CBT-I) هو الخط العلاجي الأول الموصى به للأرق المزمن قبل الحبوب المنومة، ونتائجه تدوم أطول.","الكلية الأمريكية للأطباء (ACP) 2016"],["q","لماذا يصعب النوم في مكان جديد؟","وجدت دراسة أن نصف الدماغ الأيسر يبقى أكثر يقظة في أول ليلة بمكان جديد، كحارس ليلي، وتسمى «أثر الليلة الأولى».","Tamaki et al., Current Biology 2016"],["f","الأحلام ونوم حركة العين السريعة","أغلب الأحلام الحية تحدث في مرحلة حركة العين السريعة، ويمر بها النائم نحو 4 إلى 6 مرات في الليلة.","المؤسسة الوطنية للنوم؛ Hobson J.A., 2009"],["q","ما شلل النوم؟","حالة يستيقظ فيها الشخص وهو غير قادر على الحركة أو الكلام لثوانٍ أو دقائق، وقد يرى هلاوس، لأن شلل العضلات الطبيعي في الحلم استمر بعد الاستيقاظ. ويُعرف شعبيًا بـ«الجاثوم».","Sharpless & Barber, Sleep Medicine Reviews 2011"],["f","التفكير الإيجابي ليس دائمًا مفيدًا","وجدت غابرييل أوتينغن أن تخيل النجاح فقط قد يقلل الجهد، والأفضل أسلوب WOOP: الرغبة، ثم النتيجة، ثم العقبة، ثم الخطة.","Oettingen G., Rethinking Positive Thinking 2014"],["q","ما «التعاطف» و«الشفقة»؟","التعاطف أن تشعر بما يشعر به الآخر. والشفقة أو الرحمة أن تهتم وترغب في مساعدته. وتشير الأبحاث إلى أن الرحمة أقل إنهاكًا من الإفراط في التعاطف.","Singer & Klimecki, Current Biology 2014"],["f","الرحمة بالذات","معاملة النفس بلطف عند الفشل بدل جلد الذات، وترتبط بقلق واكتئاب أقل، ولا تعني التساهل أو قلة الطموح.","Neff K., Self and Identity 2003"],["q","ما «النمو بعد الصدمة»؟","تغيرات إيجابية يذكرها بعض الناس بعد أزمات كبيرة، كتقدير الحياة أكثر وقوة العلاقات وإيمان أعمق.","Tedeschi & Calhoun, Journal of Traumatic Stress 1996"],["f","المرونة النفسية شائعة","وجدت أبحاث جورج بونانو أن أغلب الناس بعد الفقد أو الصدمة يُظهرون مرونة ويعودون لأدائهم الطبيعي خلال فترة معقولة، ولا يصابون باضطرابات طويلة.","Bonanno G., American Psychologist 2004"],["q","هل مراحل الحزن الخمس صحيحة؟","مراحل كوبلر روس (الإنكار، الغضب، المساومة، الاكتئاب، القبول) وُضعت لمرضى يحتضرون، والأبحاث تظهر أن الحزن لا يسير بمراحل ثابتة ومتتالية عند الجميع.","Stroebe, Schut & Boerner, OMEGA 2017"],["f","الضحك يخفف الألم","وجد روبن دنبار أن الضحك الحقيقي في مجموعة رفع تحمل الألم، ويرجح أنه يحفز إفراز الإندورفين.","Dunbar et al., Proceedings of the Royal Society B 2012"],["q","ما «الإدمان السلوكي»؟","تعلق قهري بسلوك لا بمادة، كالقمار، ويضر بالحياة رغم المحاولات للتوقف. واعترفت منظمة الصحة العالمية باضطراب الألعاب الإلكترونية في ICD-11.","منظمة الصحة العالمية (WHO) — ICD-11"],["f","التعزيز المتقطع","المكافأة غير المنتظمة تجعل السلوك أقوى وأصعب في الإيقاف من المكافأة الثابتة، وهو مبدأ من تجارب سكنر، ويفسر جاذبية القمار وتحديث مواقع التواصل.","Skinner B.F., Schedules of Reinforcement 1957"],["q","من هو سكنر؟","عالم نفس أمريكي (1904–1990) رائد «الإشراط الإجرائي»: السلوك يتكرر إذا تبعته مكافأة ويقل إذا تبعه عقاب، واستخدم «صندوق سكنر» في تجاربه.","Skinner B.F., The Behavior of Organisms 1938"],["f","التعزيز أقوى من العقاب","في تعديل السلوك، مكافأة السلوك الجيد عادة أنجع على المدى الطويل من معاقبة السيئ، لأن العقاب يوقف السلوك مؤقتًا ولا يعلّم البديل.","Gershoff E., Psychological Bulletin 2002؛ APA"],["q","ما الفرق بين التعزيز السلبي والعقاب؟","التعزيز السلبي يزيد السلوك بإزالة شيء مزعج، كإيقاف صوت إنذار السيارة عند ربط الحزام. والعقاب يقلل السلوك. وكثيرًا ما يُخلط بينهما.","APA Dictionary of Psychology"],["f","الضرب في التربية","وجد تحليل لـ75 دراسة على أكثر من 160 ألف طفل أن الضرب يرتبط بزيادة العدوانية ومشاكل السلوك والصحة النفسية، لا بتحسن الطاعة على المدى البعيد.","Gershoff & Grogan-Kaylor, Journal of Family Psychology 2016"],["q","كم وقت الشاشة المناسب للأطفال؟","توصي منظمة الصحة العالمية بعدم تعريض الأطفال تحت سنتين للشاشات، وما لا يزيد على ساعة يوميًا من سن 2 إلى 4 سنوات، والأقل أفضل.","منظمة الصحة العالمية (WHO) 2019"],["f","الملل مفيد أحيانًا","وجدت دراسات أن الملل قد يزيد الإبداع: من أدوا مهمة مملة كانوا أكثر إبداعًا في مهمة لاحقة.","Mann & Cadman, Creativity Research Journal 2014"],["q","ما «التفكير المتشعب»؟","القدرة على توليد أفكار كثيرة ومتنوعة لمشكلة واحدة، وهو من مكونات الإبداع، ويقاس بأسئلة مثل «كم استخدامًا تذكر للطوبة؟».","Guilford J.P., The Nature of Human Intelligence 1967"],["f","المشي يزيد الإبداع","وجدت دراسة في ستانفورد أن المشي زاد إنتاج الأفكار الإبداعية بنحو 60% مقارنة بالجلوس.","Oppezzo & Schwartz, Journal of Experimental Psychology 2014"],["q","ما معدل الذكاء IQ؟","مقياس يقارن أداء الشخص في اختبارات معيارية بأقرانه، متوسطه 100، ونحو ثلثي الناس بين 85 و115.","APA؛ Wechsler Adult Intelligence Scale"],["f","أثر فلين","ارتفعت درجات اختبارات الذكاء في كثير من الدول بنحو 3 نقاط كل عقد خلال القرن العشرين، ويرجح العلماء أسبابًا كالتغذية والتعليم.","Flynn J., Psychological Bulletin 1987"],["q","هل يمكن رفع الذكاء بالألعاب الذهنية؟","ألعاب «تدريب الدماغ» تحسن الأداء في نفس اللعبة غالبًا، لكن الدليل ضعيف على أنها ترفع الذكاء العام أو تنقل الفائدة لمهارات أخرى.","Simons et al., Psychological Science in the Public Interest 2016"],["f","تعلم لغة ثانية","تعلم اللغات مفيد للتواصل والثقافة. أما الادعاء بأن ثنائيي اللغة يتفوقون في التحكم الذهني عمومًا، فالأدلة الحديثة عليه متضاربة.","Paap et al., Cortex 2015"],["q","ما «التعلم المتداخل»؟","خلط أنواع مختلفة من المسائل في التدريب بدل التدرب على نوع واحد متتالٍ، ويحسن التعلم على المدى الطويل رغم أنه يبدو أصعب.","Rohrer & Taylor, Instructional Science 2007"],["f","«الصعوبات المرغوبة»","مفهوم روبرت بيورك: بعض الصعوبات في التعلم، كالاختبار الذاتي والتباعد والتداخل، تبطئ الأداء الآني لكنها تقوي الحفظ الطويل.","Bjork R., 1994؛ Bjork & Bjork 2011"],["q","هل الكتابة باليد أفضل من الحاسوب في الملاحظات؟","وجدت دراسة 2014 أن من كتبوا باليد فهموا المفاهيم أفضل، لأنهم يلخصون بكلماتهم بدل النسخ الحرفي، والإعادات اللاحقة وجدت الفرق أصغر.","Mueller & Oppenheimer, Psychological Science 2014؛ Morehead et al., 2019"],["f","أثر التوليد","المعلومة التي تولّدها بنفسك، كأن تكمل كلمة ناقصة أو تجيب قبل أن تقرأ الجواب، تُتذكر أفضل من التي تقرؤها جاهزة.","Slamecka & Graf, Journal of Experimental Psychology 1978"],["q","ما «تأثير المعلم»؟","شرح المعلومة لغيرك، أو حتى نية شرحها، يجعلك تفهمها وتتذكرها أفضل.","Nestojko et al., Memory & Cognition 2014"],["f","طريقة قصر الذاكرة","من أقدم طرق الحفظ: تتخيل مكانًا تعرفه جيدًا وتضع فيه المعلومات على طريق، ثم تتجول ذهنيًا لاسترجاعها. ويستخدمها أبطال مسابقات الذاكرة.","Dresler et al., Neuron 2017"],["q","هل الموسيقى أثناء المذاكرة مفيدة؟","الموسيقى بكلمات تضعف غالبًا الفهم القرائي والحفظ، أما الهادئة بلا كلمات فأثرها صغير ويختلف بين الأشخاص.","Kämpfe et al., Psychology of Music 2011"],["f","«أثر موزارت» مبالغ فيه","ادعت دراسة 1993 أن سماع موزارت يرفع مؤقتًا الأداء المكاني، فانتشرت فكرة أنه يرفع ذكاء الأطفال. والتحليلات اللاحقة وجدت الأثر ضئيلًا أو معدومًا.","Pietschnig et al., Intelligence 2010"],["q","ما الذي يميز الخبراء؟","وجد أندرس إريكسون أن الخبرة تُبنى بـ«التدرب المتعمد»: تمرين مركز على نقاط الضعف مع تغذية راجعة، لا مجرد تكرار. وقاعدة «10 آلاف ساعة» تبسيط لنتائجه.","Ericsson, Krampe & Tesch-Römer, Psychological Review 1993"],["q","ما «الإسقاط النفسي» و«التبرير» و«الإنكار»؟","آليات دفاعية وصفتها مدرسة التحليل النفسي: الإنكار رفض الاعتراف بحقيقة مؤلمة، والتبرير إعطاء أسباب مقبولة لسلوك دوافعه الحقيقية غير ذلك، والإسقاط نسبة مشاعرنا للآخرين.","Freud A., The Ego and the Mechanisms of Defence 1936"],["f","فرويد ومدرسة التحليل النفسي","سيغموند فرويد (1856–1939) أسس التحليل النفسي، وركز على اللاوعي وخبرات الطفولة. وكثير من نظرياته لم تصمد علميًا، لكن فكرة العمليات النفسية غير الواعية بقيت مؤثرة.","Britannica؛ Westen D., Psychological Bulletin 1998"],["q","من هو أبو علم النفس التجريبي؟","فيلهلم فونت، أسس أول مختبر لعلم النفس التجريبي في جامعة لايبزيغ بألمانيا عام 1879، وهو تاريخ يعتبر بداية علم النفس علمًا مستقلًا.","Britannica؛ APA"],["f","وليام جيمس","يُلقب بأبي علم النفس الأمريكي، وكتابه «مبادئ علم النفس» (1890) من أهم الكتب المؤسسة للعلم.","Britannica"],["q","ما المدرسة السلوكية؟","مدرسة ترى أن على علم النفس دراسة السلوك الظاهر القابل للقياس لا العقل الداخلي، ومن روادها واطسون وسكنر.","Watson J.B., Psychological Review 1913"],["f","تجربة ألبرت الصغير","أجرى واطسون عام 1920 تجربة أثار فيها خوف طفل من فأر أبيض بربطه بصوت مفزع، فصار يخاف الفأر وأشياء شبيهة به. وتُعد اليوم مثالًا لتجربة غير أخلاقية.","Watson & Rayner, Journal of Experimental Psychology 1920"],["q","ما علم النفس الإيجابي؟","فرع أسسه مارتن سيليغمان رسميًا عام 1998، يدرس نقاط القوة والسعادة والمعنى، لا الاضطرابات فقط.","Seligman & Csikszentmihalyi, American Psychologist 2000"],["f","نموذج PERMA للرفاهية","نموذج سيليغمان: المشاعر الإيجابية، والانغماس، والعلاقات، والمعنى، والإنجاز.","Seligman M., Flourish 2011"],["q","ما علم النفس المعرفي؟","فرع يدرس العمليات الذهنية كالانتباه والذاكرة واللغة والتفكير وحل المشكلات، ونشأ في الخمسينيات والستينيات ردًا على المدرسة السلوكية.","Neisser U., Cognitive Psychology 1967"],["f","الانتباه الانتقائي وتجربة الغوريلا","طلب الباحثون من مشاركين عدّ تمريرات كرة في فيديو، فلم يلاحظ نحو نصفهم شخصًا بزي غوريلا يمر وسط اللاعبين. وتسمى «العمى غير المقصود».","Simons & Chabris, Perception 1999"],["q","ما «أثر حفلة الكوكتيل»؟","قدرتنا على التركيز في حديث واحد وسط ضوضاء كثيرة، مع انتباهنا فورًا إذا ذُكر اسمنا في حديث آخر.","Cherry E.C., Journal of the Acoustical Society of America 1953؛ Moray 1959"],["f","عمى التغيير","قد لا نلاحظ تغيرات كبيرة في مشهد أمامنا إذا حدثت خلال لحظة انقطاع، كتغيير الشخص الذي نتحدث معه دون أن ننتبه، كما في تجربة «الباب».","Simons & Levin, Psychonomic Bulletin & Review 1998"],["q","ما أثر ستروب؟","صعوبة قراءة لون الحبر عندما تكون الكلمة اسم لون مختلف، مثل كلمة «أحمر» مكتوبة بالأزرق، لأن القراءة عملية تلقائية تتداخل مع تسمية اللون.","Stroop J.R., Journal of Experimental Psychology 1935"],["f","الخداع البصري لمولر لاير","خطان متساويان يبدوان مختلفي الطول بسبب اتجاه الأسهم في طرفيهما، ويُستخدم لدراسة كيف يفسر الدماغ ما نراه.","Müller-Lyer 1889؛ Gregory R., Eye and Brain 1966"],["q","ما «الجشطالت»؟","مدرسة ألمانية ترى أن الدماغ يدرك الأشياء ككل منظم لا كأجزاء منفصلة، ومن قوانينها: التقارب، والتشابه، والإغلاق، والاستمرارية.","Wertheimer M., 1923؛ Koffka K., Principles of Gestalt Psychology 1935"]],"religion":[["q","كم عدد آيات القرآن الكريم؟","6236 آية حسب العدّ الكوفي المعتمد في مصحف المدينة برواية حفص عن عاصم. ويختلف العدد قليلًا باختلاف مدارس العدّ.","مصحف المدينة النبوية؛ البيان في عد آي القرآن للداني"],["f","عدد أجزاء القرآن وأحزابه","ثلاثون جزءًا، وستون حزبًا، وكل حزب أربعة أرباع.","مصحف المدينة النبوية"],["q","ما السورة التي سُميت باسم امرأة؟","سورة مريم، ومريم عليها السلام هي المرأة الوحيدة المذكورة باسمها في القرآن، وذُكرت فيه أكثر من 30 مرة.","تفسير ابن كثير؛ المعجم المفهرس لألفاظ القرآن"],["f","أكثر الأنبياء ذكرًا في القرآن","موسى عليه السلام، ذُكر اسمه نحو 136 مرة.","المعجم المفهرس لألفاظ القرآن الكريم لمحمد فؤاد عبدالباقي"],["q","ما أعظم آية في القرآن؟","آية الكرسي [البقرة: 255]، كما في حديث أبيّ بن كعب في صحيح مسلم.","صحيح مسلم"],["f","أعظم سورة في القرآن","سورة الفاتحة، لقوله ﷺ لأبي سعيد بن المعلى: «لأعلّمنك سورة هي أعظم السور في القرآن: الحمد لله رب العالمين، هي السبع المثاني والقرآن العظيم». رواه البخاري.","صحيح البخاري"],["q","ما القراءات المتواترة؟","عشر قراءات، أشهرها سبع: نافع، وابن كثير، وأبو عمرو، وابن عامر، وعاصم، وحمزة، والكسائي، وزاد ابن الجزري ثلاثًا: أبا جعفر، ويعقوب، وخلفًا العاشر.","النشر في القراءات العشر لابن الجزري"],["f","رواية حفص عن عاصم","أكثر الروايات انتشارًا في العالم الإسلامي اليوم. ويليها رواية ورش عن نافع في المغرب العربي وأجزاء من أفريقيا.","مجمع الملك فهد لطباعة المصحف الشريف"],["q","ما مجمع الملك فهد لطباعة المصحف؟","مجمع في المدينة المنورة افتُتح عام 1405هـ (1984م)، يطبع المصحف بروايات متعددة وترجمات معانيه بعشرات اللغات، ووزع مئات الملايين من النسخ.","مجمع الملك فهد لطباعة المصحف الشريف"],["f","هجرة الحبشة","أول هجرة في الإسلام كانت إلى الحبشة في السنة الخامسة من البعثة، فرارًا من أذى قريش، وكان ملكها النجاشي عادلًا.","سيرة ابن هشام؛ الرحيق المختوم"],["q","متى كانت الهجرة إلى المدينة؟","في السنة الثالثة عشرة من البعثة، ووصل النبي ﷺ إلى قباء في ربيع الأول، وكان معه أبو بكر الصديق رضي الله عنه.","صحيح البخاري؛ الرحيق المختوم"],["f","أول مسجد بني في الإسلام","مسجد قباء، أسسه النبي ﷺ عند وصوله المدينة، وفي الحديث أن الصلاة فيه كعمرة.","صحيح البخاري؛ سنن ابن ماجه"],["q","متى فُرضت الصلوات الخمس؟","ليلة الإسراء والمعراج قبل الهجرة، وكانت خمسين ثم خُففت إلى خمس في العدد وخمسين في الأجر.","صحيح البخاري ومسلم (حديث المعراج)"],["f","تحويل القبلة","تحولت القبلة من بيت المقدس إلى الكعبة بعد الهجرة بنحو ستة عشر أو سبعة عشر شهرًا، ونزل قوله تعالى: ﴿فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ﴾.","صحيح البخاري؛ سورة البقرة 144"],["q","متى فُرض صيام رمضان؟","في السنة الثانية للهجرة، فصام النبي ﷺ تسع رمضانات.","زاد المعاد لابن القيم"],["f","غزوة أحد","وقعت في شوال سنة 3هـ، واستشهد فيها سبعون من الصحابة منهم حمزة بن عبدالمطلب عم النبي ﷺ، بعد مخالفة الرماة أمره بعدم مغادرة الجبل.","صحيح البخاري؛ سيرة ابن هشام"],["q","ما غزوة الخندق؟","غزوة الأحزاب سنة 5هـ، حفر فيها المسلمون خندقًا حول المدينة بمشورة سلمان الفارسي، وتحالفت فيها قريش وغطفان وغيرهما، ثم تفرقوا بريح شديدة.","صحيح البخاري؛ سورة الأحزاب"],["f","صلح الحديبية","في ذي القعدة سنة 6هـ بين النبي ﷺ وقريش، ومن شروطه وضع الحرب عشر سنين، وسماه الله فتحًا مبينًا.","صحيح البخاري؛ سورة الفتح"],["q","ما آخر غزوة غزاها النبي ﷺ؟","غزوة تبوك في رجب سنة 9هـ، وتسمى «غزوة العسرة»، ولم يقع فيها قتال.","صحيح البخاري؛ زاد المعاد"],["f","حجة الوداع","حج النبي ﷺ مرة واحدة سنة 10هـ، ومعه أكثر من مئة ألف من الصحابة، وخطب فيها خطبته الجامعة في عرفة.","صحيح مسلم (حديث جابر الطويل)"],["q","متى توفي النبي ﷺ؟","يوم الاثنين 12 ربيع الأول سنة 11هـ على المشهور، وعمره ثلاث وستون سنة، ودُفن في حجرة عائشة رضي الله عنها.","صحيح البخاري؛ البداية والنهاية"],["f","زوجات النبي ﷺ","أمهات المؤمنين إحدى عشرة: خديجة، وسودة، وعائشة، وحفصة، وزينب بنت خزيمة، وأم سلمة، وزينب بنت جحش، وجويرية، وأم حبيبة، وصفية، وميمونة رضي الله عنهن.","زاد المعاد لابن القيم"],["q","من أول من أسلم؟","خديجة رضي الله عنها من النساء، وأبو بكر الصديق من الرجال الأحرار، وعلي بن أبي طالب من الصبيان، وزيد بن حارثة من الموالي، وبلال من العبيد.","البداية والنهاية لابن كثير"],["f","العشرة المبشرون بالجنة","أبو بكر، وعمر، وعثمان، وعلي، وطلحة، والزبير، وعبدالرحمن بن عوف، وسعد بن أبي وقاص، وسعيد بن زيد، وأبو عبيدة بن الجراح.","سنن الترمذي؛ سنن أبي داود"],["q","من أول مؤذن في الإسلام؟","بلال بن رباح رضي الله عنه، اختاره النبي ﷺ لحسن صوته بعد رؤيا عبدالله بن زيد للأذان.","سنن أبي داود؛ سنن الترمذي"],["f","الخلفاء الراشدون","أبو بكر (11–13هـ)، ثم عمر (13–23هـ)، ثم عثمان (23–35هـ)، ثم علي (35–40هـ) رضي الله عنهم.","البداية والنهاية لابن كثير؛ تاريخ الخلفاء للسيوطي"],["q","من جمع المصحف على حرف واحد؟","عثمان بن عفان رضي الله عنه، نسخ المصاحف وأرسلها إلى الأمصار، وأمر بإحراق ما سواها لجمع الناس.","صحيح البخاري، كتاب فضائل القرآن"],["f","ليلة القدر","خير من ألف شهر، وتُتحرى في العشر الأواخر من رمضان، وفي أوتارها آكد.","سورة القدر؛ صحيح البخاري"],["q","ما الأشهر الحرم؟","أربعة: ذو القعدة، وذو الحجة، والمحرم، ورجب.","سورة التوبة 36؛ صحيح البخاري"],["f","يوم عرفة","صيامه يكفّر سنة ماضية وسنة باقية لغير الحاج، كما في صحيح مسلم.","صحيح مسلم (حديث أبي قتادة)"],["q","ما فضل صيام عاشوراء؟","يكفّر السنة الماضية، ويُستحب صيام يوم قبله أو بعده مخالفة لليهود.","صحيح مسلم"],["f","الكعبة","بناها إبراهيم وإسماعيل عليهما السلام، وأعادت قريش بناءها قبل البعثة بخمس سنين وشارك النبي ﷺ في وضع الحجر الأسود.","سورة البقرة 127؛ صحيح البخاري"],["q","ما المساجد التي تُشد الرحال إليها؟","ثلاثة: المسجد الحرام، والمسجد النبوي، والمسجد الأقصى.","صحيح البخاري ومسلم"],["f","الصلاة في المسجد الحرام","الصلاة فيه بمئة ألف صلاة فيما سواه، وفي المسجد النبوي بألف صلاة.","مسند أحمد وسنن ابن ماجه (وصححه الألباني)"],["q","ما أطول سورة مكية؟","سورة الأعراف، وعدد آياتها 206.","مصحف المدينة النبوية؛ الإتقان للسيوطي"],["f","السورة التي تختم بسجدتين","سورة الحج فيها سجدتان، الأولى في الآية 18 والثانية في الآية 77 عند من يقول بها.","المغني لابن قدامة"],["q","ما السورة التي تُسمى «عروس القرآن»؟","سورة الرحمن، ورد فيها أثر ضعيف بهذا الوصف، وتتكرر فيها آية ﴿فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ﴾ 31 مرة.","شعب الإيمان للبيهقي (وإسناده ضعيف)؛ مصحف المدينة"],["f","السور المسبحات","سبع سور تبدأ بالتسبيح: الإسراء، والحديد، والحشر، والصف، والجمعة، والتغابن، والأعلى.","تفسير ابن كثير"],["q","ما السبع الطوال؟","البقرة، وآل عمران، والنساء، والمائدة، والأنعام، والأعراف، والسابعة الأنفال مع التوبة أو يونس على خلاف.","الإتقان للسيوطي"],["f","المفصّل","من سورة ق إلى آخر المصحف على الصحيح، وسُمي بذلك لكثرة الفصل بين سوره بالبسملة. وينقسم إلى طوال وأوساط وقصار.","الإتقان للسيوطي"],["q","ما قصة أصحاب الفيل؟","حاول أبرهة الحبشي هدم الكعبة بجيش فيه فيلة في العام الذي وُلد فيه النبي ﷺ، فأهلكهم الله بطير أبابيل ترميهم بحجارة من سجيل.","سورة الفيل؛ سيرة ابن هشام"],["f","أول بيت وُضع للناس","الكعبة، قال تعالى: ﴿إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِي بِبَكَّةَ مُبَارَكًا﴾، وبكة من أسماء مكة.","سورة آل عمران 96"],["q","كم بين بناء المسجد الحرام والمسجد الأقصى؟","أربعون سنة، كما في حديث أبي ذر في الصحيحين.","صحيح البخاري ومسلم"],["f","ماء زمزم","نبع في المسجد الحرام، تفجر لهاجر وابنها إسماعيل عليه السلام، وقال ﷺ: «ماء زمزم لما شُرب له».","صحيح البخاري؛ سنن ابن ماجه"],["q","ما الصلاة الوسطى؟","صلاة العصر على الراجح، لحديث «شغلونا عن الصلاة الوسطى صلاة العصر» في الصحيحين.","صحيح البخاري ومسلم"],["f","آخر آية نزلت في الأحكام","قيل آية الربا، وقيل آية الكلالة في آخر سورة النساء، كما ورد عن البراء في البخاري أن آخر آية نزلت ﴿يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ فِي الْكَلَالَةِ﴾.","صحيح البخاري؛ الإتقان"],["q","من هم الأنبياء من نسل إبراهيم؟","منهم إسماعيل وإسحاق ويعقوب ويوسف وموسى وهارون وداود وسليمان وزكريا ويحيى وعيسى ومحمد ﷺ، ولهذا يسمى إبراهيم أبا الأنبياء.","تفسير ابن كثير؛ قصص الأنبياء لابن كثير"],["f","النبي الذي ابتلعه الحوت","يونس بن متى عليه السلام، وذُكر في القرآن باسم «ذا النون» و«صاحب الحوت»، ودعاؤه: ﴿لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾.","سورة الأنبياء 87"],["q","ما الناقة التي ذُكرت في القرآن؟","ناقة صالح عليه السلام، آية لقوم ثمود، فعقروها فأهلكهم الله.","سورة الشمس؛ سورة هود"],["f","قوم عاد وثمود","عاد قوم هود عليه السلام في الأحقاف جنوب الجزيرة، وثمود قوم صالح عليه السلام في الحِجر شمال غرب الجزيرة.","تفسير ابن كثير؛ قصص الأنبياء لابن كثير"],["q","من هو ذو القرنين؟","ملك صالح ذكره الله في سورة الكهف، بلغ مشرق الأرض ومغربها، وبنى السد على يأجوج ومأجوج.","سورة الكهف 83–98"],["f","قصص سورة الكهف","أربع قصص: أصحاب الكهف، وصاحب الجنتين، وموسى والخضر، وذو القرنين. ويُستحب قراءتها يوم الجمعة.","سورة الكهف؛ سنن الدارمي والحاكم"],["q","ما أطول قصة في القرآن متصلة في سورة واحدة؟","قصة يوسف عليه السلام، وسماها الله «أحسن القصص».","سورة يوسف 3"],["f","لقمان الحكيم","رجل صالح آتاه الله الحكمة، وفي سورة لقمان وصاياه لابنه، أولها: ﴿يَا بُنَيَّ لَا تُشْرِكْ بِاللَّهِ إِنَّ الشِّرْكَ لَظُلْمٌ عَظِيمٌ﴾.","سورة لقمان 13"],["q","ما أول مسجد صلّى فيه النبي ﷺ الجمعة؟","في بني سالم بن عوف في طريق هجرته من قباء إلى المدينة، ويسمى اليوم «مسجد الجمعة».","سيرة ابن هشام؛ زاد المعاد"],["f","عدد غزوات النبي ﷺ","غزا النبي ﷺ بنفسه 27 غزوة على المشهور، قاتل في تسع منها.","زاد المعاد لابن القيم؛ سيرة ابن هشام"],["q","ما الحديبية؟","موضع قرب مكة، فيه بيعة الرضوان تحت الشجرة سنة 6هـ، وصلح الحديبية بين المسلمين وقريش.","صحيح البخاري؛ سورة الفتح 18"],["f","أول شهيد في الإسلام","سمية بنت خياط رضي الله عنها، أم عمار بن ياسر، قتلها أبو جهل في مكة.","الإصابة لابن حجر؛ سيرة ابن هشام"]],"studies":[["f","كيف عرف العالم أن التدخين يسبب السرطان؟","وش سووا: تابع الباحثون أكثر من 34 ألف طبيب بريطاني 50 سنة كاملة، وسجلوا مين يدخن ومين ما يدخن، ومين مات وبأي مرض.\nوش لقوا: المدخنون يموتون بسرطان الرئة أضعافًا كثيرة، ويعيشون أقل بنحو 10 سنوات في المتوسط.\nوش استفدنا: صار التدخين معروفًا كسبب مباشر للسرطان وأمراض القلب، وبدأت حملات منعه في العالم. وأثبتت أن من يترك التدخين قبل الأربعين يرجع خطره قريبًا من غير المدخن.","Doll & Hill — British Doctors Study, BMJ 2004"],["f","من أين عرفنا أن الضغط والكوليسترول يضرون القلب؟","وش سووا: من سنة 1948 تتابع دراسة في مدينة فرامنغهام الأمريكية آلاف السكان، ثم أولادهم وأحفادهم، بفحوصات دورية لعشرات السنين.\nوش لقوا: ارتفاع الضغط والكوليسترول والتدخين والسمنة وقلة الحركة ترفع خطر الجلطات بشكل واضح.\nوش استفدنا: صار الأطباء يقيسون الضغط والكوليسترول للناس الأصحاء ويعالجونهم مبكرًا قبل ما تجيهم جلطة. وهي اللي أوجدت مصطلح «عوامل الخطر».","Framingham Heart Study — NHLBI"],["f","هل الرياضة فعلًا تحمي القلب؟","وش سووا: قارن الباحث جيري موريس سنة 1953 بين سائقي باصات لندن ذات الطابقين، اللي يقعدون طول اليوم، والمحصّلين اللي يطلعون وينزلون الدرج طول اليوم.\nوش لقوا: المحصّلون أصيبوا بجلطات القلب أقل بكثير، وإذا أصيبوا كانت أخف.\nوش استفدنا: هذي أول دراسة تثبت أن الحركة تحمي القلب، ومنها جاءت توصيات الرياضة اليومية الموجودة اليوم.","Morris J.N. et al., The Lancet 1953"],["f","كيف نمنع السكري قبل ما يجي؟","وش سووا: تجربة أمريكية (DPP) على أكثر من 3 آلاف شخص سكرهم مرتفع شوي وقريبين من السكري، قسّموهم ثلاث مجموعات: مجموعة غيّرت أكلها ومشت، ومجموعة أخذت دواء الميتفورمين، ومجموعة ما سوت شي.\nوش لقوا: اللي نزّلوا 7% من وزنهم ومشوا 150 دقيقة في الأسبوع قلّ عندهم خطر السكري 58%، والدواء قلّله 31% بس.\nوش استفدنا: أثبتت أن تغيير نمط الحياة أقوى من الدواء في الوقاية من السكري النوع الثاني، وصار هذا البرنامج يُطبق في دول كثيرة.","Diabetes Prevention Program, NEJM 2002"],["f","ليش يعطون الأسبرين وقت الجلطة؟","وش سووا: تجربة ISIS-2 على أكثر من 17 ألف مريض جاءتهم جلطة قلب، بعضهم أخذ أسبرين، وبعضهم دواء يذيب الجلطة، وبعضهم الاثنين، وبعضهم دواء وهمي.\nوش لقوا: الأسبرين وحده قلّل الوفيات نحو 23%، ومع مذيب الجلطة نحو 42%.\nوش استفدنا: صار الأسبرين أول شي يُعطى لمريض الجلطة في الإسعاف والطوارئ إلى اليوم، وهو دواء رخيص.","ISIS-2 Collaborative Group, The Lancet 1988"],["f","أي أكل يحمي القلب؟ (دراسة PREDIMED)","وش سووا: في إسبانيا قسموا نحو 7,400 شخص معرّضين لأمراض القلب: مجموعة أكلت أكل البحر المتوسط مع زيت زيتون بكر، ومجموعة مع مكسرات، ومجموعة أكل قليل الدهون.\nوش لقوا: مجموعتا زيت الزيتون والمكسرات قلّت عندهم الجلطات والسكتات بنحو 30%.\nوش استفدنا: أثبتت أن الدهون الصحية مثل زيت الزيتون والمكسرات تحمي القلب، وما يلزم تقليل كل الدهون.","Estruch R. et al., NEJM 2013 (وتصحيحها 2018)"],["f","هل الهرمونات بعد سن اليأس آمنة؟","وش سووا: دراسة WHI الأمريكية أعطت آلاف النساء بعد سن اليأس هرمونات أو دواءً وهميًا لسنوات.\nوش لقوا: أُوقفت مبكرًا سنة 2002 لأن الهرمونات المركبة رفعت خطر سرطان الثدي والجلطات.\nوش استفدنا: صار الأطباء يعطون الهرمونات بحذر، بأقل جرعة ولأقصر مدة، وحسب عمر المرأة ووضعها، بعد ما كانت تعطى لملايين النساء بشكل روتيني.","Writing Group for the WHI, JAMA 2002"],["f","من أين جاء غسل اليدين في المستشفيات؟","وش سووا: الطبيب زيملفايس في فيينا سنة 1847 لاحظ أن الأمهات يمتن بحمى بعد الولادة أكثر في القسم اللي يشتغل فيه الأطباء بعد تشريح الجثث. فألزمهم بغسل أيديهم بمحلول الكلور.\nوش لقوا: الوفيات نزلت من نحو 10% إلى أقل من 2%.\nوش استفدنا: هذا أصل تعقيم اليدين في كل مستشفيات العالم اليوم، مع أنه ما انقبل كلامه إلا بعد وفاته.","Semmelweis I., 1861؛ Britannica"],["f","كيف انتهى وباء الكوليرا في لندن؟","وش سووا: الطبيب جون سنو سنة 1854 رسم خريطة لبيوت الموتى بالكوليرا في حي بلندن.\nوش لقوا: الوفيات متجمعة حول مضخة ماء وحدة في شارع برود، فطلب إزالة ذراع المضخة، فتراجع الوباء.\nوش استفدنا: عرف العالم أن الكوليرا تنتقل بالماء الملوث، وبدأت مشاريع تنقية المياه والصرف الصحي، وصار جون سنو أبا علم الأوبئة.","Snow J., On the Mode of Communication of Cholera 1855"],["f","أول تجربة طبية في التاريخ تقريبًا (الإسقربوط)","وش سووا: الطبيب جيمس ليند سنة 1747 أخذ 12 بحارًا مصابين بالإسقربوط (نزيف اللثة وضعف الجسم)، وأعطى كل مجموعة علاجًا مختلفًا.\nوش لقوا: اللي أكلوا برتقال وليمون تحسنوا بسرعة، والباقي لا.\nوش استفدنا: صارت السفن تحمل الحمضيات، واختفى المرض من البحارة. وبعدها بقرن عرفنا أن السبب نقص فيتامين C.","Lind J., A Treatise of the Scurvy 1753"],["f","كيف عالجوا السل؟","وش سووا: مجلس البحوث الطبية البريطاني سنة 1948 أعطى مرضى السل المضاد الحيوي ستربتومايسين، ومجموعة ثانية بدون، واختيار المجموعة كان بالقرعة.\nوش لقوا: المرضى اللي أخذوا الدواء تحسنوا وماتوا أقل بشكل واضح.\nوش استفدنا: فتحت باب علاج السل بالأدوية، وصارت طريقة «القرعة» هذي المعيار لاختبار أي دواء جديد إلى اليوم.","Medical Research Council, BMJ 1948"],["f","كيف اكتُشف أول لقاح؟","وش سووا: الطبيب إدوارد جينر سنة 1796 لاحظ أن حلّابات البقر اللي أصابهن جدري البقر الخفيف ما يصيبهن الجدري القاتل. فأخذ من جدري البقر وطعّم به طفلًا، ثم عرّضه للجدري.\nوش لقوا: الطفل ما مرض.\nوش استفدنا: بداية علم اللقاحات كله. وبالتطعيم انتهى الجدري من العالم نهائيًا سنة 1980، وهو المرض البشري الوحيد اللي قُضي عليه.","منظمة الصحة العالمية (WHO)؛ Britannica"],["f","كيف اكتُشف البنسلين؟","وش سووا: ألكسندر فلمنج سنة 1928 رجع من إجازة ولقى عفنًا نبت في طبق بكتيريا نساه.\nوش لقوا: البكتيريا حول العفن ماتت كلها.\nوش استفدنا: من هذا العفن جاء البنسلين، أول مضاد حيوي، وأنقذ ملايين الأرواح من التهابات كانت قاتلة، مثل التهاب الجروح والرئة.","مؤسسة نوبل (NobelPrize.org)"],["f","من اكتشف سبب قرحة المعدة؟","وش سووا: الطبيبان الأستراليان مارشال ووارن لاحظوا بكتيريا اسمها الملوية البوابية في معدة مرضى القرحة، والأطباء كانوا يقولون إن السبب التوتر والأكل الحار. فشرب مارشال البكتيريا بنفسه سنة 1984.\nوش لقوا: أصيب بالتهاب في المعدة، وشُفي بالمضاد الحيوي.\nوش استفدنا: صارت القرحة تُعالج بمضاد حيوي لأسبوعين وتُشفى، بدل ما تبقى مرضًا مزمنًا. ونالا نوبل 2005.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف بدأ علاج السكري بالأنسولين؟","وش سووا: بانتنج وبست في جامعة تورنتو سنة 1921 استخلصوا الأنسولين من بنكرياس الحيوانات.\nوش لقوا: لما أعطوه لأول مريض، طفل عمره 14 سنة كان يموت من السكري سنة 1922، نزل سكره وتحسن.\nوش استفدنا: السكري النوع الأول كان قاتلًا خلال أشهر، وصار المرضى يعيشون حياة طبيعية. ونالوا نوبل 1923.","مؤسسة نوبل (NobelPrize.org)"],["f","هل ضبط السكر يمنع مضاعفاته؟","وش سووا: دراسة UKPDS البريطانية تابعت آلاف مرضى السكري النوع الثاني نحو 20 سنة، بعضهم بعلاج مكثف وبعضهم بعلاج عادي.\nوش لقوا: ضبط السكر والضغط بدقة قلّل مضاعفات العيون والكلى والأعصاب بشكل واضح.\nوش استفدنا: صار هدف علاج السكري ضبط السكر التراكمي والضغط، وعليها بُنيت إرشادات العلاج في العالم.","UKPDS, The Lancet 1998"],["f","كم ساعة نوم تكفي فعلًا؟","وش سووا: في تجربة سنة 2003 خلوا ناس ينامون 4 أو 6 أو 8 ساعات كل ليلة لأسبوعين، واختبروا تركيزهم يوميًا.\nوش لقوا: اللي ناموا 6 ساعات تراجع تركيزهم بقدر من سهر ليلة أو ليلتين كاملة، وهم يحسبون نفسهم بخير.\nوش استفدنا: النقص البسيط في النوم يتراكم ويضر بدون ما تحس. ولهذا التوصية 7 ساعات فأكثر للبالغ.","Van Dongen et al., Sleep 2003"],["f","هل الجوال وقت السواقة خطير حتى بالسماعة؟","وش سووا: في جهاز محاكاة القيادة قارنوا السائق اللي يكلم بالجوال بالسائق اللي شارب كحول فوق الحد المسموح.\nوش لقوا: المتكلم بالجوال، حتى بالسماعة، تأخر رد فعله بقدر مشابه للسكران، وصار يصدم أكثر.\nوش استفدنا: المشكلة في انشغال المخ نفسه مو في اليد. ومنها جاءت قوانين منع الجوال أثناء القيادة.","Strayer, Drews & Crouch, Human Factors 2006"],["f","وش أكثر شي يخليك سعيد وصحي في الكبر؟","وش سووا: جامعة هارفارد تتابع من سنة 1938 مئات الرجال وأسرهم طول حياتهم، أكثر من 80 سنة، بمقابلات وفحوصات.\nوش لقوا: أقوى شي يتنبأ بالسعادة والصحة في الكبر هو جودة العلاقات القريبة، مع الزوجة والأهل والأصحاب، أكثر من الفلوس والشهرة.\nوش استفدنا: الوحدة تضر الصحة مثل التدخين تقريبًا، والاهتمام بالعلاقات استثمار في صحتك.","Harvard Study of Adult Development؛ Waldinger & Schulz 2023"],["f","هل الشغل المرهق يمرّضك؟ (دراسة وايتهول)","وش سووا: تابعوا آلاف موظفي الحكومة البريطانية من سنة 1967، من الوزير إلى الساعي.\nوش لقوا: كل ما نزلت رتبة الموظف زادت أمراض القلب والوفاة، حتى بعد احتساب التدخين والأكل. والسبب الأكبر: الضغط النفسي وقلة التحكم في شغله.\nوش استفدنا: الإحساس بالسيطرة على شغلك وحياتك يحمي قلبك، وصارت بيئة العمل جزءًا من الصحة العامة.","Marmot M. et al., The Lancet 1991"],["f","هل الدماغ يتغير إذا تعلمت؟ (سائقو تاكسي لندن)","وش سووا: صوّروا أدمغة سائقي تاكسي لندن اللي يحفظون آلاف الشوارع عن ظهر قلب، وقارنوها بغيرهم.\nوش لقوا: جزء الذاكرة المكانية في الدماغ، الحُصين، أكبر عندهم، ويكبر كل ما زادت سنوات خبرتهم.\nوش استفدنا: الدماغ مثل العضلة، يتغير ويكبر بالتمرين والتعلم حتى في الكبر.","Maguire E.A. et al., PNAS 2000"],["f","هل الشاهد يتذكر صح دائمًا؟","وش سووا: عرضت لوفتس على ناس فيديو حادث سيارتين، وسألت بعضهم «كم كانت السرعة لما تحطمت السيارتان؟» وبعضهم «لما اصطدمت؟».\nوش لقوا: اللي سمعوا «تحطمت» قدّروا سرعة أعلى، وبعد أسبوع تذكر بعضهم زجاجًا مكسورًا ما كان موجودًا أصلًا.\nوش استفدنا: الذاكرة تتأثر بطريقة السؤال، فصارت المحاكم والشرطة في دول كثيرة تحذر من الأسئلة الموجهة للشهود.","Loftus & Palmer, 1974"],["f","ليش الناس يطيعون أوامر غلط؟ (تجربة ميلغرام)","وش سووا: سنة 1961 طلبوا من ناس يعطون «صدمات كهربائية» لشخص آخر كل ما غلط، والصدمات وهمية والشخص ممثل يصرخ.\nوش لقوا: نحو 65% استمروا إلى أعلى صدمة، 450 فولت، لأن الباحث بلبس رسمي قال لهم «كمّل».\nوش استفدنا: فهمنا قوة الطاعة للسلطة، وكيف يسوي ناس عاديون أشياء ضد ضميرهم. وغيرت قواعد أخلاقيات البحث العلمي.","Milgram S., 1963"],["f","ليش نوافق الجماعة حتى لو غلطانة؟ (تجربة آش)","وش سووا: سنة 1951 حطوا شخصًا وسط مجموعة متفقين سرًا، وطلبوا منهم يقارنون أطوال خطوط واضحة جدًا. والمجموعة تجاوب غلط عمدًا.\nوش لقوا: ثلاثة أرباع المشاركين وافقوا الجماعة على الجواب الغلط مرة على الأقل.\nوش استفدنا: ضغط الجماعة قوي حتى في الأشياء الواضحة. ولو وُجد شخص واحد يخالف الجماعة، قلّت الموافقة على الغلط كثيرًا.","Asch S.E., 1956"],["f","هل الأطفال يقلدون العنف اللي يشوفونه؟","وش سووا: باندورا سنة 1961 خلّى أطفالًا يشوفون شخصًا كبيرًا يضرب دمية كبيرة، وأطفالًا ثانيين يشوفونه يلعب بهدوء.\nوش لقوا: اللي شافوا الضرب قلّدوه بنفس الحركات والكلمات.\nوش استفدنا: الأطفال يتعلمون بالملاحظة والتقليد، وهذا أساس الحذر من محتوى العنف أمام الأطفال وأهمية القدوة.","Bandura, Ross & Ross, 1961"],["f","هل الحنان أهم من الأكل؟ (قرود هارلو)","وش سووا: في الخمسينيات أعطى هارلو صغار قرود «أمّين» صناعيتين: وحدة من سلك تعطي حليب، ووحدة من قماش ناعم ما تعطي شي.\nوش لقوا: الصغار قضوا أغلب وقتهم متعلقين بأم القماش، ويروحون لأم السلك بس وقت الرضاعة.\nوش استفدنا: الحنان والتلامس حاجة أساسية للطفل مثل الأكل. وغيرت طريقة رعاية الأطفال في المستشفيات ودور الأيتام.","Harlow H.F., American Psychologist 1958"],["f","هل توقعات المعلم تغيّر الطالب؟","وش سووا: سنة 1968 قالوا لمعلمين إن طلابًا معينين «بيتفوقون هالسنة»، وهم في الحقيقة مختارين عشوائيًا.\nوش لقوا: هؤلاء الطلاب تحسنت درجاتهم فعلًا، لأن المعلم صار يهتم فيهم أكثر.\nوش استفدنا: توقعاتنا من الناس تأثر فيهم. والدراسات اللاحقة لقت الأثر موجود لكنه أصغر من الدراسة الأولى.","Rosenthal & Jacobson, 1968"],["f","هل تقدر تطور ذكاءك؟ (عقلية النمو)","وش سووا: دراسات كارول دويك، وتجربة وطنية أمريكية على 12 ألف طالب سنة 2019، علّمت الطلاب في جلسة قصيرة أن الذكاء ينمو بالجهد.\nوش لقوا: تحسنت درجات الطلاب الضعاف تحسنًا صغيرًا لكنه حقيقي، وزاد إقبالهم على المواد الصعبة.\nوش استفدنا: طريقة نظرتك لقدراتك تأثر على تعلمك. ومدح الجهد أفضل من مدح الذكاء.","Yeager et al., Nature 2019"],["f","هل القراءة والكتابة تحمي من الزهايمر؟ (دراسة الراهبات)","وش سووا: من سنة 1986 تابعوا 678 راهبة أمريكية لسنوات، وقرأوا رسائل كتبنها في شبابهن، وفحصوا أدمغتهن بعد الوفاة.\nوش لقوا: اللي كانت كتاباتهن في الشباب غنية بالأفكار أصيبن بالزهايمر أقل في الكبر. وبعضهن كان في دماغهن علامات المرض لكن بدون أعراض.\nوش استفدنا: النشاط العقلي طول العمر قد يبني «احتياطًا» يحمي من أعراض الخرف.","Snowdon D.A., JAMA 1996"],["f","كيف عرفنا شكل الحمض النووي DNA؟","وش سووا: روزاليند فرانكلين صوّرت الحمض النووي بالأشعة السينية سنة 1952، واستخدم واطسون وكريك صورتها وبياناتها.\nوش لقوا: الـDNA شكله سلم ملتوي «حلزون مزدوج»، وكل درجة فيه زوج من الحروف الوراثية.\nوش استفدنا: فهمنا كيف تنتقل الصفات وكيف تتضاعف الخلايا. ومنها جاء الطب الجيني وتحاليل البصمة الوراثية وتعديل الجينات.","Watson & Crick, Nature 1953؛ Franklin & Gosling, Nature 1953"],["f","مشروع قراءة جينات الإنسان كاملة","وش سووا: مشروع دولي بدأ سنة 1990 بمشاركة مئات العلماء، لقراءة الحروف الوراثية للإنسان كلها، نحو 3 مليارات حرف.\nوش لقوا: انتهى سنة 2003، ولقوا أن عندنا نحو 20 ألف جين بس، أقل بكثير من المتوقع.\nوش استفدنا: صار ممكن اكتشاف أسباب أمراض وراثية كثيرة، وفحص الأجنة والمواليد، وتصميم أدوية للسرطان حسب جينات الورم.","المعهد الوطني لأبحاث الجينوم البشري (NHGRI)"],["f","كيف صار عندنا تعديل الجينات (كريسبر)؟","وش سووا: العالمتان شاربنتييه وداودنا سنة 2012 درسوا كيف تدافع البكتيريا عن نفسها ضد الفيروسات بقص جيناتها.\nوش لقوا: هذا النظام ممكن نوجهه ليقص أي جين نبيه بدقة، مثل المقص.\nوش استفدنا: صار ممكن تعديل الجينات بسهولة. وفي 2023 اعتُمد أول علاج بكريسبر لمرضى فقر الدم المنجلي والثلاسيميا. ونالتا نوبل الكيمياء 2020.","مؤسسة نوبل (NobelPrize.org)؛ FDA 2023"],["f","كيف صُنعت لقاحات كورونا بسرعة؟","وش سووا: الباحثة كاتالين كاريكو وزميلها وايزمان اشتغلوا من التسعينيات على استخدام مادة mRNA في العلاج، وحلّوا مشكلة إن الجسم كان يرفضها.\nوش لقوا: سنة 2005 اكتشفوا تعديلًا بسيطًا يخلي الجسم يتقبل الـmRNA بدون التهاب.\nوش استفدنا: لما جاء كورونا سنة 2020، طُوّر لقاحا فايزر وموديرنا خلال أقل من سنة بهذي التقنية. ونالا نوبل الطب 2023.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف تعلمنا الربط والتعود؟ (كلاب بافلوف)","وش سووا: بافلوف كان يدرس الهضم، ولاحظ أن الكلاب يسيل لعابها قبل الأكل. فصار يرن جرسًا قبل كل وجبة.\nوش لقوا: بعد فترة صار لعاب الكلاب يسيل بمجرد سماع الجرس بدون أكل.\nوش استفدنا: فهمنا كيف نتعلم الربط بين الأشياء، وعليه قامت علاجات الخوف والرهاب، وأساليب في التربية والإعلان.","Pavlov I., Conditioned Reflexes 1927"],["f","هل الأكل الأقل يطوّل العمر؟","وش سووا: تجارب على قرود الريسوس استمرت أكثر من 20 سنة، بعضها أكلت أقل بنحو 30% من سعراتها.\nوش لقوا: القرود اللي أكلت أقل كانت أمراضها أقل، مثل السكري والسرطان. وفي دراسة جامعة ويسكونسن عاشت أطول أيضًا.\nوش استفدنا: تقليل الأكل باعتدال يحسن الصحة، وما زال العلماء يدرسون أثره على عمر الإنسان.","Mattison et al., Nature Communications 2017"],["f","هل المشي اليومي يقلل الوفاة فعلًا؟","وش سووا: تحليل كبير جمع 17 دراسة على أكثر من 226 ألف شخص، وقاسوا عدد خطواتهم اليومية.\nوش لقوا: كل زيادة 1,000 خطوة يوميًا قلّلت خطر الوفاة بنحو 15%، والفائدة تبدأ من نحو 4,000 خطوة.\nوش استفدنا: حتى المشي البسيط يفرق، ومو لازم توصل 10 آلاف خطوة عشان تستفيد.","Banach et al., European Journal of Preventive Cardiology 2023"],["f","هل الملح يرفع الضغط؟ (تجربة DASH)","وش سووا: أعطوا مجموعات من الناس أكلًا محددًا لأسابيع: أكلًا غنيًا بالخضار والفواكه والألبان قليلة الدسم، مع كميات ملح مختلفة.\nوش لقوا: هذا الأكل نزّل الضغط، وكل ما قلّ الملح نزل الضغط أكثر.\nوش استفدنا: صار «نظام DASH» من أهم توصيات علاج الضغط بدون أدوية، مع تقليل الملح إلى أقل من نحو ملعقة صغيرة يوميًا.","Sacks F.M. et al., NEJM 2001"],["f","هل أشعة الشمس تكفي لفيتامين د؟ (دراسة VITAL)","وش سووا: أكثر من 25 ألف أمريكي أخذوا فيتامين د أو أوميغا 3 أو دواءً وهميًا لنحو 5 سنوات.\nوش لقوا: المكملات ما قلّلت السرطان ولا أمراض القلب عند الأصحاء بشكل واضح.\nوش استفدنا: مكملات الفيتامينات مو سحرية للأصحاء. وتؤخذ إذا فيه نقص مثبت بالتحليل.","Manson J.E. et al., NEJM 2019"],["f","أين الطاقة في الذرة؟ (تجربة رذرفورد)","وش سووا: أطلق رذرفورد وزملاؤه سنة 1909 جسيمات صغيرة على ورقة ذهب رقيقة جدًا.\nوش لقوا: أغلبها عبر الورقة، وقليل منها ارتد للخلف.\nوش استفدنا: عرفنا أن الذرة فراغ تقريبًا وفي وسطها نواة صغيرة ثقيلة. ومن هنا بدأ فهم الطاقة النووية والأشعة الطبية وأجهزة الأشعة لعلاج السرطان.","Rutherford E., Philosophical Magazine 1911"],["f","هل حزام الأمان ينقذ الأرواح فعلًا؟","وش سووا: تحليلات الإدارة الوطنية الأمريكية لسلامة المرور (NHTSA) لعشرات الآلاف من الحوادث الحقيقية، قارنت بين الركاب اللي لابسين الحزام واللي ما لابسينه.\nوش لقوا: الحزام يقلل خطر الوفاة لركاب المقاعد الأمامية بنحو 45%، وخطر الإصابة الخطيرة بنحو 50%.\nوش استفدنا: صار الحزام إلزاميًا في أغلب دول العالم، ومنها السعودية، ويُعد أنجح وسيلة لتقليل وفيات الحوادث.","الإدارة الوطنية لسلامة المرور على الطرق السريعة الأمريكية (NHTSA)"],["f","هل لقاح الحصبة آمن وفعال؟","وش سووا: دراسة دنماركية تابعت أكثر من 650 ألف طفل وُلدوا بين 1999 و2010، بعضهم أخذ لقاح الحصبة الثلاثي وبعضهم لا.\nوش لقوا: اللقاح ما رفع خطر التوحد أبدًا، حتى عند الأطفال الأكثر عرضة وراثيًا. واللقاح يحمي من الحصبة بنحو 97% بجرعتين.\nوش استفدنا: أنهت الجدل حول التوحد، ويوصى باللقاح لكل الأطفال لأن الحصبة قد تقتل.","Hviid et al., Annals of Internal Medicine 2019؛ CDC"],["f","هل الأسبرين اليومي يفيد الأصحاء؟","وش سووا: تجربة ASPREE على أكثر من 19 ألف كبير سن صحي في أستراليا وأمريكا، نصفهم أخذ أسبرين يوميًا ونصفهم دواء وهمي لنحو 5 سنوات.\nوش لقوا: الأسبرين ما طوّل العمر ولا قلل الإعاقة، وزاد خطر النزيف.\nوش استفدنا: تغيرت التوصيات؛ ما يُنصح بالأسبرين اليومي للوقاية عند كبار السن الأصحاء إلا بتوصية الطبيب، بعكس مرضى القلب.","McNeil et al., NEJM 2018"],["f","هل خفض الضغط بقوة أفضل؟ (دراسة SPRINT)","وش سووا: أكثر من 9 آلاف مريض ضغط معرضين لأمراض القلب، مجموعة خفضوا ضغطهم لأقل من 120 ومجموعة لأقل من 140.\nوش لقوا: المجموعة اللي خفضت لأقل من 120 قلّت عندهم أمراض القلب بنحو 25% والوفيات بنحو 27%، فأُوقفت الدراسة مبكرًا.\nوش استفدنا: صارت الإرشادات الأمريكية 2017 تعتبر الضغط مرتفعًا من 130/80، وتستهدف أرقامًا أقل من السابق.","SPRINT Research Group, NEJM 2015"],["f","هل أدوية الكوليسترول (الستاتين) تطول العمر؟","وش سووا: دراسة 4S الإسكندنافية أعطت نحو 4,400 مريض قلب دواء سيمفاستاتين أو دواء وهميًا لنحو 5 سنوات.\nوش لقوا: الدواء قلل الوفيات الكلية بنحو 30%، ووفيات القلب بنحو 42%.\nوش استفدنا: صارت أدوية الستاتين من أكثر الأدوية وصفًا في العالم لمرضى القلب ومن عندهم خطر عالٍ.","Scandinavian Simvastatin Survival Study, The Lancet 1994"],["f","هل الرضاعة الطبيعية تفيد الطفل؟","وش سووا: تجربة PROBIT في بيلاروسيا على أكثر من 17 ألف رضيع، شجعوا الأمهات في بعض المستشفيات على الرضاعة الطبيعية الحصرية.\nوش لقوا: انخفضت التهابات الأمعاء والإكزيما عند الأطفال، وكانت درجاتهم في اختبارات الذكاء أعلى قليلًا في سن 6 سنوات.\nوش استفدنا: صارت منظمة الصحة العالمية توصي بالرضاعة الطبيعية الحصرية أول 6 أشهر.","Kramer et al., JAMA 2001؛ Archives of General Psychiatry 2008"],["f","هل التمارين تمنع سقوط كبار السن؟","وش سووا: تحليل كوكرين لأكثر من 100 تجربة على أكثر من 23 ألف كبير سن يعيشون في بيوتهم.\nوش لقوا: تمارين التوازن والقوة قللت السقوط بنحو 23%.\nوش استفدنا: صارت التمارين أهم و
