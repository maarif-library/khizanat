<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>خزانة المعارف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky search header, right-hand index of sections (RTL), reading column of cards. Library index-card feel. */
:root{
  --bg:#F3F4EF; --paper:#FFFFFF; --ink:#18231F; --muted:#5D6B65; --line:#D9DED6;
  --accent:#0F5C55; --accent-soft:#E2EFEC; --gold:#9A6A1E; --gold-soft:#F5ECDC;
  --display:"Amiri", "Traditional Arabic", serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --paper:#18201D; --ink:#E5ECE8; --muted:#9AA9A2; --line:#2A3531;
  --accent:#5CC2B4; --accent-soft:#17312D; --gold:#D9A64E; --gold-soft:#2E2617; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --paper:#18201D; --ink:#E5ECE8; --muted:#9AA9A2; --line:#2A3531;
  --accent:#5CC2B4; --accent-soft:#17312D; --gold:#D9A64E; --gold-soft:#2E2617; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.hwrap{max-width:1100px;margin:0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;font-weight:700;color:var(--accent)}
.brand small{color:var(--muted);font-size:13px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 44px 11px 40px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;right:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.search .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:50%}

.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 60px}

nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);align-self:start}
.side h2{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.side ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.side button{width:100%;display:flex;align-items:center;gap:10px;text-align:right;border:0;background:transparent;color:var(--ink);
  font-size:15.5px;padding:8px 10px;border-radius:10px}
.side button:hover{background:var(--accent-soft)}
.side button[aria-current="true"]{background:var(--accent);color:var(--paper)}
.side button[aria-current="true"] .gl{background:var(--paper);color:var(--accent)}
.gl{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);
  font-family:var(--display);font-size:19px;font-weight:700;line-height:1}
.side .cnt{margin-right:auto;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.side .grp{margin-top:14px}

main{min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-family:var(--display);font-size:38px;line-height:1.1;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--paper)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:14px;padding:5px 14px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;padding:6px 14px;border-radius:999px}
.btn:hover{border-color:var(--accent);color:var(--accent)}

.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card.flash{animation:fl 1.2s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 transparent}}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.tag{padding:1px 10px;border-radius:999px;font-weight:600}
.tag.q{background:var(--gold-soft);color:var(--gold)}
.tag.f{background:var(--accent-soft);color:var(--accent)}
.tag.c{color:var(--muted);font-weight:500;padding:0}
.card h3{margin:0;font-size:18px;line-height:1.6;font-weight:600;text-wrap:pretty}
.ans{color:var(--ink);font-size:16px}
.ans .lead{color:var(--accent);font-weight:700;margin-left:6px}
.reveal{align-self:flex-start;border:1px dashed var(--gold);background:transparent;color:var(--gold);font-size:14px;padding:5px 14px;border-radius:999px}
.src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.src b{font-weight:600}
.ayah{font-family:var(--display);font-size:1.12em}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 2px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:var(--r)}
footer.note{margin-top:26px;font-size:13px;color:var(--muted)}

.tag.ai{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.askbtn{border:0;background:var(--accent);color:var(--paper);font-size:15px;font-weight:600;padding:10px 20px;border-radius:999px}
.btn.gen{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn:disabled{opacity:.6;cursor:wait}
.aibox{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.aibox h3{margin:0;font-size:19px}.aibox p{margin:0}.aibox ul{margin:0;padding-right:20px}
.direct{font-size:24px;font-weight:700;color:var(--accent);line-height:1.4}
.pts{margin:0;padding-right:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 18px}
.ans{white-space:pre-line}
.aihead{font-weight:700;color:var(--accent);font-size:13px}
.chip{border:1px solid var(--accent);background:var(--paper);color:var(--accent);font-size:13px;padding:2px 12px;border-radius:999px}
.muted{color:var(--muted)}
.center{text-align:center}
.card.focus{padding:28px 28px 22px;min-height:260px;border-top:4px solid var(--accent)}
.card.focus h3{font-family:var(--display);font-size:28px;line-height:1.4}
.card.focus .ans{font-size:18px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:4px}
.pager .askbtn{flex:1;max-width:320px;padding:14px 20px;font-size:17px}
.pager .btn{padding:10px 18px}.btn:disabled,.askbtn:disabled{opacity:.5;cursor:default}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.catbtn{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:16px;color:var(--ink);text-align:right}
.catbtn:hover{border-color:var(--accent)}.catbtn .muted{margin-right:auto;font-size:13px}
[hidden]{display:none!important}
.today{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:22px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--gold)}
.today .tl{display:flex;gap:10px;align-items:baseline;font-size:13px}.today .tl span:first-child{color:var(--gold);font-weight:700}
.today h3{margin:0;font-family:var(--display);font-size:26px;line-height:1.35}.today p{margin:0}.today .btn{align-self:flex-start}
@media (max-width:780px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 50px}
  nav.side{position:static}
  .side h2,.side .grp-t{display:none}
  .side ul{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  .side li{flex:none}
  .side button{padding:6px 12px 6px 8px;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:14.5px;white-space:nowrap}
  .side .cnt{display:none}
  .gl{width:24px;height:24px;font-size:15px;border-radius:6px}
  .head h2{font-size:30px}
  .brand h1{font-size:26px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
</style>

<header>
  <div class="hwrap">
    <div class="brand"><h1>خزانة المعارف</h1><small id="total"></small></div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="text" enterkeyhint="search" placeholder="ابحث في كل الأقسام… مثلًا: الطحال، ابن الهيثم، المتواتر" autocomplete="off" aria-label="بحث">
      <button class="clear" id="clr" aria-label="مسح البحث" hidden>×</button>
    </div>
    <button class="askbtn" id="ask" hidden>اسأل</button>
    <div hidden>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="side" aria-label="الأقسام">
    <h2>الأقسام</h2>
    <ul id="nav"></ul>
  </nav>
  <main>
    <section class="today" id="today" aria-label="معلومة اليوم"></section>
    <div class="head">
      <div><h2 id="title"></h2><p id="sub"></p></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="نوع المحتوى">
          <button data-f="all" aria-pressed="true">الكل</button>
          <button data-f="f" aria-pressed="false">معلومات</button>
          <button data-f="q" aria-pressed="false">أسئلة</button>
        </div>
        <button class="btn" id="rnd">سؤال عشوائي</button>
        <button class="btn" id="mode" hidden>عرض الكل كقائمة</button>
        <button class="btn gen" id="gen" hidden>＋ زِد 15 بطاقة جديدة</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <footer class="note">المعلومات مختارة من مراجع متخصصة، ومصدر كل بطاقة مكتوب تحتها. وفي المسائل الشرعية اعتُمد قول جمهور أهل العلم، وذُكر الخلاف حيث يوجد.</footer>
  </main>
</div>

<script>
const CATS = [
{id:"medical", n:"طبية", g:"ط", items:[
 {t:"f", q:"الكبد يعيد بناء نفسه", a:"الكبد هو العضو الداخلي الوحيد القادر على التجدد الحقيقي. يمكن أن يُستأصل منه ما يقارب ثلثيه، فيعود إلى حجمه الطبيعي تقريبًا خلال أسابيع إلى أشهر. ولهذا يمكن التبرع بجزء من الكبد من متبرع حي.", s:"المعاهد الوطنية للصحة الأمريكية (NIH)، ومراجع جراحة زراعة الكبد"},
 {t:"q", q:"ما الفرق بين النوبة القلبية والسكتة القلبية؟", a:"النوبة القلبية مشكلة «دورة دموية»: يُسد شريان تاجي فيموت جزء من عضلة القلب، والقلب غالبًا يستمر بالنبض. أما السكتة القلبية المفاجئة فمشكلة «كهربائية»: يضطرب نظم القلب (غالبًا رجفان بطيني) فيتوقف عن الضخ الفعّال، ويحتاج المصاب إنعاشًا وصدمة كهربائية خلال دقائق.", s:"جمعية القلب الأمريكية (AHA)"},
 {t:"f", q:"الدماغ أكثر الأعضاء استهلاكًا للطاقة", a:"يشكّل الدماغ نحو 2% من وزن الجسم، لكنه يستهلك قرابة 20% من طاقة الجسم وهو في حالة الراحة.", s:"Raichle & Gusnard, PNAS 2002"},
 {t:"q", q:"لماذا لا تفيد المضادات الحيوية في الزكام؟", a:"لأن الزكام سببه فيروسات، والمضادات الحيوية تستهدف تراكيب موجودة في البكتيريا فقط، مثل جدار الخلية البكتيرية وريبوسوماتها. وتناولها بلا حاجة يرفع مقاومة البكتيريا لها، وهذا من أكبر التهديدات الصحية عالميًا.", s:"منظمة الصحة العالمية (WHO)، ومراكز السيطرة على الأمراض (CDC)"},
 {t:"f", q:"المعطي العام يتبدل في البلازما", a:"فصيلة O سالب هي «المعطي العام» لكريات الدم الحمراء، وAB موجب «المستقبل العام». أما في نقل البلازما فينعكس الأمر: بلازما AB هي التي تُعطى للجميع، لأنها لا تحتوي أجسامًا مضادة لـ A ولا لـ B.", s:"الصليب الأحمر الأمريكي، ومراجع طب نقل الدم"},
 {t:"f", q:"الوقت دماغ", a:"في السكتة الدماغية الإقفارية غير المعالجة يخسر المريض في المتوسط نحو 1.9 مليون خلية عصبية في كل دقيقة. ولهذا يُعامل الوقت في أقسام الطوارئ كأهم عامل في العلاج.", s:"Saver JL, «Time is brain—quantified», Stroke 2006"},
 {t:"q", q:"ما وظيفة الطحال؟ وماذا يحتاج من استُؤصل طحاله؟", a:"يرشّح الطحال الدم ويتخلص من كريات الدم الحمراء الهرمة، ويخزّن جزءًا من الصفائح والكريات البيضاء، ويقاوم البكتيريا المغلّفة. لذلك يُنصح من استؤصل طحاله بلقاحات خاصة ضد المكورات الرئوية والمستدمية النزلية (ب) والمكورات السحائية.", s:"مراجع الطب الباطني (Harrison's Principles of Internal Medicine)"},
 {t:"f", q:"فيتامين B12 لا يصنعه نبات ولا حيوان", a:"لا تصنعه إلا بعض البكتيريا والعتائق. الحيوانات تحصل عليه من البكتيريا، ولهذا يحتاج النباتيون الصرف إلى مكمّل أو أغذية مدعّمة.", s:"مكتب المكملات الغذائية، المعاهد الوطنية للصحة (NIH ODS)"},
 {t:"q", q:"ما «منعكس الغوص» عند الإنسان؟", a:"عند غمر الوجه في ماء بارد يتباطأ نبض القلب وتنقبض الأوعية الطرفية، ليتوفر الأكسجين للقلب والدماغ. ويستعمله الأطباء أحيانًا لإيقاف بعض نوبات تسرّع القلب فوق البطيني، خصوصًا عند الرضّع، بوضع الثلج على الوجه.", s:"مراجع طب الطوارئ وقلب الأطفال"},
 {t:"f", q:"القرنية بلا أوعية دموية", a:"القرنية من الأنسجة القليلة الخالية من الأوعية الدموية، وتأخذ أكسجينها مباشرة من الهواء ومن الدمع. وهذا من أسباب انخفاض احتمال رفض الجسم لزراعتها مقارنة بغيرها من الأعضاء.", s:"الأكاديمية الأمريكية لطب العيون"},
 {t:"q", q:"ما «الساعة الذهبية» في الإصابات؟", a:"مفهوم صاغه جراح الإصابات الأمريكي ر. آدامز كاولي، ومعناه أن العلاج السريع في الفترة الأولى بعد الإصابة الخطيرة يرفع فرص النجاة كثيرًا. وهو مبدأ سريري للتعجيل، وليس حدًّا زمنيًا دقيقًا بستين دقيقة.", s:"R Adams Cowley Shock Trauma Center، جامعة ميريلاند"}
]},
{id:"history", n:"تاريخية", g:"ت", items:[
 {t:"f", q:"عين جالوت", a:"في رمضان سنة 658هـ (1260م) هزم المماليك بقيادة السلطان قطز، ومعه الظاهر بيبرس، جيش المغول في عين جالوت بفلسطين. وتُعد من أوائل الهزائم الحاسمة للمغول في معركة مفتوحة، وأوقفت زحفهم نحو مصر.", s:"البداية والنهاية لابن كثير؛ The Cambridge History of Inner Asia"},
 {t:"q", q:"من أول من دوّن الدواوين في الإسلام؟", a:"عمر بن الخطاب رضي الله عنه. أنشأ ديوان العطاء لتسجيل أسماء الجند ومخصصاتهم، مستفيدًا من نظم الدواوين عند الفرس والروم.", s:"تاريخ الطبري؛ الأحكام السلطانية للماوردي"},
 {t:"f", q:"بيت الحكمة في بغداد", a:"ازدهر في عهد المأمون (198–218هـ) مركزًا للترجمة والعلم. وكان من أبرز مترجميه حنين بن إسحاق الذي نقل كتب جالينوس وأبقراط إلى العربية، وتُروى أخبار عن مكافأة المأمون للمترجمين بسخاء كبير.", s:"عيون الأنباء في طبقات الأطباء لابن أبي أصيبعة؛ الفهرست لابن النديم"},
 {t:"q", q:"كم استمرت «حرب المئة عام»؟", a:"نحو 116 سنة، من 1337 إلى 1453م، بين مملكتي إنجلترا وفرنسا، وتخللتها هدنات طويلة.", s:"Encyclopaedia Britannica"},
 {t:"f", q:"أقصر حرب في التاريخ المدوَّن", a:"الحرب الإنجليزية الزنجبارية في 27 أغسطس 1896م، واستمرت ما بين 38 و45 دقيقة تقريبًا قبل استسلام زنجبار.", s:"Encyclopaedia Britannica؛ موسوعة غينيس"},
 {t:"q", q:"لماذا سُمّي «عام الرمادة»؟", a:"هو عام 18هـ في خلافة عمر بن الخطاب. أصاب الجزيرة جدب شديد حتى صار لون الأرض كالرماد. فطلب عمر المدد من الأمصار، وكتب إلى عمرو بن العاص في مصر فأرسل قوافل الطعام، وخرج بالناس للاستسقاء.", s:"تاريخ الطبري؛ الطبقات الكبرى لابن سعد"},
 {t:"f", q:"ابن خلدون وأعمار الدول", a:"قرّر ابن خلدون في «المقدمة» أن الدولة تمر بأطوار تبدأ بالعصبية والقوة وتنتهي بالترف والضعف، وأن عمرها في الغالب ثلاثة أجيال، أي نحو 120 سنة. ويُعد بهذا من أوائل مؤسسي علم الاجتماع.", s:"مقدمة ابن خلدون، الفصل الرابع عشر من الباب الثالث"},
 {t:"q", q:"متى سقطت غرناطة؟", a:"في 2 يناير 1492م (ربيع الأول 897هـ)، حين سلّم أبو عبدالله محمد الثاني عشر مفاتيحها لفرديناند وإيزابيلا، فانتهى آخر حكم إسلامي في الأندلس بعد نحو ثمانية قرون.", s:"نفح الطيب للمقري؛ Encyclopaedia Britannica"},
 {t:"f", q:"سور الصين لا يُرى من القمر", a:"الاعتقاد بأن سور الصين العظيم يُرى من القمر بالعين المجردة خاطئ. فالسور ضيق ولونه قريب من لون الأرض حوله. وقد أكدت ناسا ورواد فضاء أنه لا يُرى من القمر، بل يصعب تمييزه حتى من المدار المنخفض.", s:"وكالة ناسا (NASA)"},
 {t:"q", q:"ما «صلح وستفاليا» ولماذا هو مهم؟", a:"مجموعة معاهدات عُقدت سنة 1648م وأنهت حرب الثلاثين عامًا في أوروبا. ويعدّه كثير من المختصين أساس مفهوم «الدولة ذات السيادة» وعدم التدخل في شؤونها في النظام الدولي الحديث.", s:"Encyclopaedia Britannica؛ كتب مدخل العلاقات الدولية"},
 {t:"f", q:"من الرياض إلى المملكة", a:"استعاد الملك عبدالعزيز الرياض في 5 شوال 1319هـ (15 يناير 1902م). وأُعلن توحيد البلاد باسم «المملكة العربية السعودية» في 17 جمادى الأولى 1351هـ (23 سبتمبر 1932م)، وهو اليوم الوطني.", s:"دارة الملك عبدالعزيز"}
]},
{id:"geography", n:"جغرافية", g:"ج", items:[
 {t:"q", q:"ما أكبر صحراء في العالم؟", a:"القارة القطبية الجنوبية، بمساحة تقارب 14 مليون كم². فالصحراء تُعرَّف بقلة الهطول لا بالحرارة. وأكبر صحراء حارة هي الصحراء الكبرى في أفريقيا.", s:"هيئة المسح الجيولوجي الأمريكية (USGS)؛ Britannica"},
 {t:"f", q:"الربع الخالي", a:"أكبر بحر رملي متصل في العالم، بمساحة تقارب 650 ألف كم²، ويمتد في السعودية وعُمان والإمارات واليمن. وفيه كثبان يتجاوز ارتفاع بعضها 250 مترًا.", s:"Encyclopaedia Britannica"},
 {t:"f", q:"أعمق نقطة في المحيطات", a:"«تشالنجر ديب» في خندق ماريانا بالمحيط الهادئ، بعمق يقارب 10,900 متر. لو وُضع فيه جبل إيفرست لبقي فوق قمته أكثر من كيلومترين من الماء.", s:"الإدارة الوطنية للمحيطات والغلاف الجوي (NOAA)"},
 {t:"q", q:"لماذا البحر الميت بهذه الملوحة؟", a:"لأنه بحيرة مغلقة لا مصرف لها، تقع في أخفض نقطة يابسة على الأرض (نحو 430 مترًا تحت سطح البحر، وتنخفض سنويًا). تدخلها المياه ولا تخرج إلا بالتبخر، فتتركز الأملاح حتى تقارب 34%، أي نحو عشرة أضعاف ملوحة المحيط.", s:"Encyclopaedia Britannica؛ USGS"},
 {t:"q", q:"أي دولة فيها أكبر عدد من المناطق الزمنية؟", a:"فرنسا، بـ12 منطقة زمنية (13 مع مطالبتها في القارة القطبية)، بسبب أقاليمها المنتشرة خارج أوروبا في المحيطات.", s:"Time and Date؛ قاعدة بيانات IANA للمناطق الزمنية"},
 {t:"f", q:"إيفرست ليس أبعد نقطة عن مركز الأرض", a:"الأرض منتفخة عند خط الاستواء، ولذلك قمة جبل تشيمبورازو في الإكوادور أبعد عن مركز الأرض من قمة إيفرست بنحو كيلومترين. أما إيفرست فهو الأعلى قياسًا من مستوى سطح البحر.", s:"NOAA؛ National Geographic"},
 {t:"q", q:"كم نسبة المياه العذبة من مياه الأرض؟", a:"نحو 2.5% فقط. معظمها متجمد في الجليد والأنهار الجليدية أو مخزون في المياه الجوفية، والمياه السطحية (أنهار وبحيرات) تشكل نحو 1% من المياه العذبة.", s:"هيئة المسح الجيولوجي الأمريكية (USGS)"},
 {t:"f", q:"حلقة النار", a:"حزام يحيط بالمحيط الهادئ بطول يقارب 40 ألف كم. يقع فيه نحو 75% من البراكين النشطة، وتحدث فيه قرابة 90% من الزلازل، لأنه يتتبع حدود الصفائح التكتونية.", s:"هيئة المسح الجيولوجي الأمريكية (USGS)"},
 {t:"f", q:"الأمازون أغزر أنهار العالم", a:"يصبّ نهر الأمازون نحو 15–20% من كل المياه العذبة التي تصبها الأنهار في محيطات العالم، أي أكثر من الأنهار السبعة التالية له مجتمعة.", s:"Encyclopaedia Britannica؛ USGS"},
 {t:"q", q:"لماذا يكون الطقس في أبها والسودة باردًا وهي في الجنوب؟", a:"بسبب الارتفاع: جبال السروات ترتفع قرب السودة إلى نحو 3000 متر، والحرارة تنخفض في المتوسط نحو 6.5 درجة مع كل 1000 متر ارتفاع. ويساعد الضباب والأمطار الموسمية على ذلك أيضًا.", s:"مراجع علم المناخ (المعدل البيئي لانخفاض الحرارة)؛ المركز الوطني للأرصاد"}
]},
{id:"physics", n:"فيزياء", g:"ف", items:[
 {t:"q", q:"لماذا السماء زرقاء، ولماذا ليست بنفسجية؟", a:"بسبب «تشتت رايلي»: جزيئات الهواء تشتت الضوء قصير الموجة أكثر بكثير من الطويل، والشدة تتناسب عكسيًا مع القوة الرابعة لطول الموجة. والبنفسجي أقصر من الأزرق، لكن الشمس تبعث منه أقل، والغلاف الجوي يمتص جزءًا منه، وعيوننا أقل حساسية له، فنرى السماء زرقاء.", s:"Feynman Lectures on Physics؛ HyperPhysics، جامعة ولاية جورجيا"},
 {t:"f", q:"ضوء الشمس عمره ثماني دقائق، وطاقتها أقدم بكثير", a:"يقطع الضوء المسافة من سطح الشمس إلى الأرض في نحو 8 دقائق و20 ثانية. لكن الطاقة المتولدة في نواة الشمس تحتاج إلى عشرات آلاف أو مئات آلاف السنين لتشق طريقها إلى سطحها.", s:"وكالة ناسا (NASA)"},
 {t:"f", q:"الـGPS يعمل بفضل النسبية", a:"ساعات أقمار GPS تتقدم نحو 38 ميكروثانية يوميًا مقارنة بساعات الأرض: +45 بسبب الجاذبية الأضعف (النسبية العامة) و−7 بسبب السرعة (النسبية الخاصة). ولو لم تُصحَّح لتراكم خطأ في تحديد الموقع بنحو 10 كم كل يوم.", s:"Ashby N., «Relativity in the Global Positioning System», Living Reviews in Relativity 2003"},
 {t:"q", q:"ما الفرق بين الكتلة والوزن؟", a:"الكتلة مقدار المادة في الجسم وتقاس بالكيلوغرام، ولا تتغير بتغير المكان. أما الوزن فهو قوة جذب الجاذبية للجسم ويقاس بالنيوتن (الكتلة × تسارع الجاذبية). على القمر وزنك نحو سدس وزنك على الأرض، وكتلتك هي نفسها.", s:"المكتب الدولي للأوزان والمقاييس (BIPM)؛ مراجع الفيزياء العامة"},
 {t:"q", q:"هل يتجمد الماء الساخن أسرع من البارد؟", a:"تُعرف الدعوى باسم «ظاهرة مبيمبا». سُجلت في بعض التجارب وتحت ظروف معينة، لكنها غير ثابتة ولا يوجد تفسير متفق عليه. وبعض الدراسات الحديثة الدقيقة لم تجد لها أثرًا حقيقيًا عند ضبط الظروف.", s:"Burridge & Linden, Scientific Reports 2016"},
 {t:"f", q:"ابن الهيثم ومنهج التجربة", a:"أثبت الحسن بن الهيثم (ت نحو 430هـ/1040م) في «كتاب المناظر» أن الإبصار يحدث بدخول الضوء إلى العين، لا بخروج شعاع منها كما كان يُعتقد. واعتمد التجربة المضبوطة والقياس، ولهذا يعدّه مؤرخو العلم من رواد المنهج العلمي.", s:"كتاب المناظر لابن الهيثم؛ A. I. Sabra, The Optics of Ibn al-Haytham"},
 {t:"q", q:"لماذا لا يُصعق الطائر الواقف على سلك الكهرباء؟", a:"لأن قدميه على السلك نفسه، وفرق الجهد بينهما صغير جدًا، فلا يمر في جسمه تيار يُذكر. ويقع الخطر إذا لمس سلكين مختلفين أو لمس السلك وجسمًا متصلًا بالأرض في الوقت نفسه.", s:"مراجع الكهرباء العامة؛ HyperPhysics"},
 {t:"f", q:"الصفر المطلق", a:"أدنى درجة حرارة ممكنة نظريًا: −273.15 °م (صفر كلفن). ولا يمكن الوصول إليه تمامًا، وهذا ما ينص عليه القانون الثالث للديناميكا الحرارية. وقد وصل العلماء إلى أجزاء من المليار من الدرجة فوقه.", s:"المعهد الوطني للمعايير والتقنية (NIST)"},
 {t:"q", q:"ما «أفق الحدث» للثقب الأسود؟", a:"الحد الذي إذا تجاوزه أي شيء، حتى الضوء، لا يستطيع الإفلات. ونصف قطره يتناسب طرديًا مع الكتلة، بنحو 3 كم لكل كتلة شمسية. فلو ضُغطت الشمس إلى ثقب أسود لكان نصف قطرها نحو 3 كم فقط.", s:"وكالة ناسا (NASA)؛ مراجع النسبية العامة"},
 {t:"f", q:"أول صورة لثقب أسود", a:"نشرها فريق «تلسكوب أفق الحدث» في 10 أبريل 2019 لثقب أسود في مركز مجرة M87، تقدَّر كتلته بنحو 6.5 مليار كتلة شمسية، ويبعد عنا نحو 55 مليون سنة ضوئية.", s:"Event Horizon Telescope Collaboration, ApJ Letters 2019"}
]},
{id:"general", n:"عامة", g:"ع", items:[
 {t:"f", q:"«الجبر» و«الخوارزمية» من أصل عربي", a:"كلمة Algebra مأخوذة من كتاب محمد بن موسى الخوارزمي «المختصر في حساب الجبر والمقابلة». وكلمة Algorithm مشتقة من اسمه «الخوارزمي» بعد نقله إلى اللاتينية.", s:"Encyclopaedia Britannica؛ تاريخ الرياضيات (Boyer)"},
 {t:"q", q:"من وضع علم العروض؟", a:"الخليل بن أحمد الفراهيدي (ت 170هـ). استنبط أوزان الشعر العربي وحصرها في خمسة عشر بحرًا، ثم زاد تلميذه الأخفش بحرًا سمّاه «المتدارك».", s:"الوافي في العروض والقوافي للتبريزي"},
 {t:"f", q:"قصة النقط والتشكيل", a:"كُتبت المصاحف الأولى بلا نقط ولا شكل. وضع أبو الأسود الدؤلي نقاط الإعراب، ثم أضاف نصر بن عاصم ويحيى بن يعمر نقاط تمييز الحروف المتشابهة (الإعجام)، ثم وضع الخليل بن أحمد الحركات التي نستعملها اليوم.", s:"المحكم في نقط المصاحف لأبي عمرو الداني"},
 {t:"q", q:"ماذا كانت كلمة «قهوة» تعني قديمًا؟", a:"كانت في العربية الفصحى القديمة من أسماء الخمر، وسُميت بذلك لأنها «تُقهي» أي تُذهب شهوة الطعام. ثم انتقل الاسم إلى مشروب البن في القرن التاسع والعاشر الهجري.", s:"لسان العرب لابن منظور (مادة: قها)"},
 {t:"f", q:"أقدم جامعة قائمة في العالم", a:"جامعة القرويين في فاس بالمغرب. أسستها فاطمة الفهرية سنة 245هـ (859م)، وتعدّها اليونسكو وموسوعة غينيس أقدم مؤسسة تعليمية قائمة تمنح الشهادات بشكل متواصل.", s:"اليونسكو؛ موسوعة غينيس"},
 {t:"q", q:"لماذا الساعة 60 دقيقة والدائرة 360 درجة؟", a:"هذا موروث من النظام الستيني (أساس 60) عند البابليين في بلاد الرافدين. أما تقسيم اليوم إلى 24 ساعة فأصله من المصريين القدماء.", s:"Scientific American؛ تاريخ الرياضيات (Boyer)"},
 {t:"f", q:"أصل الأرقام", a:"الأرقام ٠١٢٣ المستعملة في المشرق تسمى «الهندية»، والأرقام 0123 المستعملة في المغرب وأوروبا تسمى «العربية» أو «الغبارية». وأصلها جميعًا هندي، والمسلمون هم من طوّرها ونقلها إلى أوروبا.", s:"Encyclopaedia Britannica (Hindu-Arabic numerals)"},
 {t:"q", q:"لماذا ترتيب لوحة المفاتيح QWERTY؟", a:"صممه كريستوفر شولز للآلات الكاتبة في سبعينيات القرن التاسع عشر. والتفسير المشهور أنه أبعد الحروف الشائعة عن بعضها لتقليل اشتباك أذرع الآلة، وبعض المؤرخين يربطه بمتطلبات عمال التلغراف. وبقي الترتيب بحكم العادة.", s:"Smithsonian Magazine؛ Yasuoka & Yasuoka, Kyoto University 2011"},
 {t:"f", q:"العسل الحقيقي لا يفسد تقريبًا", a:"قلة الماء فيه، وحموضته، وإنتاجه بيروكسيد الهيدروجين بفعل إنزيم يضيفه النحل، كلها تمنع نمو الميكروبات. وقد عُثر على عسل محفوظ في مقابر مصرية قديمة.", s:"Smithsonian Magazine؛ مراجع كيمياء الغذاء"},
 {t:"q", q:"كم تقصر السنة الهجرية عن الميلادية؟", a:"السنة الهجرية قمرية، وطولها 354 أو 355 يومًا، فهي أقصر من الميلادية بنحو 11 يومًا. ولذلك كل 33 سنة هجرية تعادل تقريبًا 32 سنة ميلادية، وتدور المواسم كرمضان على فصول السنة كلها.", s:"مراجع علم الفلك والتقاويم"}
]},
{id:"biology", n:"أحياء", g:"ح", items:[
 {t:"q", q:"هل البكتيريا في جسمك عشرة أضعاف خلاياك؟", a:"هذا رقم قديم شائع لكنه غير صحيح. أحدث تقدير (Sender وزملاؤه، 2016) يقول إن النسبة تقارب واحدًا إلى واحد: نحو 38 تريليون بكتيريا مقابل نحو 30 تريليون خلية بشرية.", s:"Sender, Fuchs & Milo, PLOS Biology 2016"},
 {t:"f", q:"لغة النحل الراقصة", a:"تؤدي النحلة العاملة «رقصة الاهتزاز» فتدل أخواتها على اتجاه الغذاء بالنسبة للشمس، وعلى بُعده من مدة الرقصة. فكّ عالم الحيوان كارل فون فريش رموز هذه الرقصة ونال بها جائزة نوبل سنة 1973.", s:"مؤسسة نوبل (NobelPrize.org)"},
 {t:"f", q:"مترا DNA في كل خلية", a:"لو فُرد الحمض النووي الموجود في نواة خلية بشرية واحدة لبلغ طوله نحو مترين، ومع ذلك يُطوى بإحكام داخل نواة قطرها بضعة ميكرومترات.", s:"Alberts, Molecular Biology of the Cell"},
 {t:"q", q:"لماذا لا تتجمد أسماك القطب الجنوبي؟", a:"لأنها تنتج بروتينات سكرية «مضادة للتجمد» ترتبط ببلورات الثلج الدقيقة فور تكوّنها وتمنعها من النمو. فيبقى دمها سائلًا في ماء تحت الصفر.", s:"DeVries AL, Science 1971؛ مراجع فسيولوجيا الأحياء البحرية"},
 {t:"f", q:"الأخطبوط: ثلاثة قلوب ودم أزرق", a:"للأخطبوط قلبان يضخان الدم إلى الخياشيم وقلب ثالث يضخه إلى الجسم. ودمه أزرق لأنه يعتمد على صبغة الهيموسيانين القائمة على النحاس بدل الهيموغلوبين القائم على الحديد.", s:"Smithsonian Ocean؛ مراجع علم الحيوان"},
 {t:"q", q:"لماذا ترث الميتوكوندريا من أمك فقط؟", a:"الميتوكوندريا هي «محطة الطاقة» في الخلية، ولها حمض نووي خاص بها. وميتوكوندريا الحيوان المنوي تُعلَّم وتُهضم داخل البويضة بعد الإخصاب، فتبقى ميتوكوندريا الأم وحدها. ولهذا يُستعمل الحمض النووي الميتوكوندري في تتبع الأنساب من جهة الأم.", s:"Alberts, Molecular Biology of the Cell"},
 {t:"f", q:"نصف أكسجين الأرض من البحر", a:"العوالق النباتية المجهرية في المحيطات تنتج بالتمثيل الضوئي نحو نصف الأكسجين على الأرض، ومنها كائن واحد اسمه «بروكلوروكوكس».", s:"الإدارة الوطنية للمحيطات والغلاف الجوي (NOAA)"},
 {t:"q", q:"لماذا يطوي نبات «الميموزا الخجول» أوراقه عند لمسه؟", a:"عند اللمس تنتقل إشارة كهربائية، فتفقد خلايا في قاعدة الورقة (الوسادة الورقية) ماءها بسرعة، فتنهار الورقة وتنطوي خلال ثوانٍ. ثم تعود بعد دقائق حين تمتلئ الخلايا بالماء من جديد.", s:"Taiz & Zeiger, Plant Physiology"},
 {t:"f", q:"الكلاب لا ترى بالأبيض والأسود", a:"رؤية الكلاب ثنائية اللون: تميّز الأزرق والأصفر جيدًا، ويختلط عليها الأحمر والأخضر، فتراهما قريبين من البني أو الرمادي.", s:"Neitz, Geist & Jacobs, Visual Neuroscience 1989"},
 {t:"q", q:"لماذا تتلون أوراق الشجر في الخريف؟", a:"يتوقف النبات عن إنتاج الكلوروفيل الأخضر ويتحلل الموجود منه، فتظهر صبغات الكاروتينات الصفراء والبرتقالية الموجودة أصلًا في الورقة. وتصنع بعض الأشجار صبغات الأنثوسيانين الحمراء في هذا الوقت.", s:"خدمة الغابات الأمريكية (USDA Forest Service)"},
 {t:"f", q:"«القنديل الخالد»", a:"قنديل البحر Turritopsis dohrnii يستطيع عند الإجهاد أو الإصابة أن يعكس دورة حياته، فيعود من الطور البالغ إلى طور «البوليب» ويبدأ من جديد. ولهذا يوصف بأنه خالد بيولوجيًا، نظريًا.", s:"Piraino et al., Biological Bulletin 1996؛ American Museum of Natural History"}
]},
{id:"politics", n:"سياسية", g:"س", items:[
 {t:"q", q:"كيف يعمل «الفيتو» في مجلس الأمن؟", a:"للدول الخمس دائمة العضوية (الولايات المتحدة، روسيا، الصين، بريطانيا، فرنسا) أن تُسقط أي قرار في المسائل الموضوعية باعتراض واحد، ولو وافقت بقية الدول. أما امتناع الدائمة العضوية عن التصويت فلا يُعد نقضًا، حسب الممارسة المستقرة للمجلس.", s:"ميثاق الأمم المتحدة، المادة 27؛ موقع مجلس الأمن"},
 {t:"f", q:"تأسيس الأمم المتحدة", a:"دخل ميثاق الأمم المتحدة حيز التنفيذ في 24 أكتوبر 1945، والسعودية من الدول الخمسين المؤسسة التي وقّعت الميثاق في مؤتمر سان فرانسيسكو.", s:"الأمم المتحدة (un.org)"},
 {t:"f", q:"جامعة الدول العربية أقدم من الأمم المتحدة", a:"تأسست في 22 مارس 1945 في القاهرة بسبع دول: مصر، العراق، السعودية، سوريا، لبنان، شرق الأردن، اليمن. أي قبل الأمم المتحدة بسبعة أشهر.", s:"جامعة الدول العربية؛ Encyclopaedia Britannica"},
 {t:"q", q:"ما الفرق بين النظام الرئاسي والبرلماني؟", a:"في الرئاسي يُنتخب الرئيس مستقلًا عن البرلمان ويرأس الحكومة، ولا يستطيع البرلمان إسقاطه بسحب الثقة (مثل الولايات المتحدة). وفي البرلماني تنبثق الحكومة من أغلبية البرلمان وتبقى ما دامت تملك ثقته، ويمكن إسقاطها (مثل بريطانيا).", s:"مراجع النظم السياسية المقارنة؛ Encyclopaedia Britannica"},
 {t:"f", q:"تأسيس أوبك", a:"تأسست منظمة الدول المصدرة للبترول (أوبك) في مؤتمر بغداد في سبتمبر 1960، بخمس دول: السعودية، العراق، إيران، الكويت، فنزويلا. ومقرها اليوم في فيينا.", s:"منظمة أوبك (opec.org)"},
 {t:"q", q:"ما مصدر «الحصانة الدبلوماسية»؟", a:"اتفاقية فيينا للعلاقات الدبلوماسية 1961. تمنع توقيف الدبلوماسي أو محاكمته جنائيًا في الدولة المضيفة، ومقار البعثات لا تُدخل إلا بإذن. وللدولة المضيفة أن تعلن أي دبلوماسي «شخصًا غير مرغوب فيه» دون ذكر الأسباب.", s:"اتفاقية فيينا للعلاقات الدبلوماسية 1961، المواد 9 و22 و29 و31"},
 {t:"f", q:"تأسيس مجلس التعاون الخليجي", a:"تأسس مجلس التعاون لدول الخليج العربية في 25 مايو 1981 في أبوظبي، ويضم ست دول، ومقر أمانته العامة في الرياض.", s:"الأمانة العامة لمجلس التعاون (gcc-sg.org)"},
 {t:"q", q:"ما «معضلة السجين» ولماذا تهم السياسة؟", a:"نموذج في «نظرية الألعاب» يُظهر أن طرفين عقلانيين قد لا يتعاونان حتى لو كان التعاون أنفع لهما، لأن كل منهما يخاف أن يغدر به الآخر. ويستعمله المختصون لتفسير سباقات التسلح وصعوبة الاتفاقات الدولية.", s:"Stanford Encyclopedia of Philosophy (Prisoner's Dilemma)"},
 {t:"f", q:"كتاب «الأمير»", a:"كتبه نيكولو ميكافيلي سنة 1513، ولم يُنشر إلا سنة 1532 بعد وفاته. وصار اسمه وصفًا لكل سياسة تقدّم المصلحة على الأخلاق («الميكافيلية»).", s:"Encyclopaedia Britannica"},
 {t:"q", q:"ما «توازن القوى» في العلاقات الدولية؟", a:"فكرة أن الدول تمنع قيام قوة مهيمنة واحدة، إما بزيادة قوتها الذاتية أو بالتحالف ضدها. ومن أبرز من نظّر لها هانز مورغنثاو في كتابه «السياسة بين الأمم».", s:"Morgenthau, Politics Among Nations, 1948"}
]},
{id:"fiqh", n:"فقه", g:"ق", items:[
 {t:"f", q:"القواعد الفقهية الخمس الكبرى", a:"الأمور بمقاصدها. اليقين لا يزول بالشك. المشقة تجلب التيسير. الضرر يزال. العادة محكَّمة. وعليها تُبنى أكثر مسائل الفقه.", s:"الأشباه والنظائر للسيوطي"},
 {t:"q", q:"مثال على قاعدة «اليقين لا يزول بالشك»", a:"من تيقّن أنه متوضئ ثم شك هل انتقض وضوؤه، فهو على طهارته. وأصلها قول النبي ﷺ فيمن يجد شيئًا في صلاته: «فلا ينصرف حتى يسمع صوتًا أو يجد ريحًا».", s:"متفق عليه (البخاري ومسلم)؛ الأشباه والنظائر للسيوطي"},
 {t:"q", q:"ما الفرق بين الركن والواجب في الصلاة؟", a:"الركن لا تصح الصلاة بدونه ولا يجبره سجود السهو، بل لا بد من الإتيان به. والواجب إن تُرك سهوًا جبره سجود السهو، وإن تُرك عمدًا بطلت الصلاة. وهذا التقسيم معتمد عند الحنابلة.", s:"الروض المربع للبهوتي"},
 {t:"f", q:"مقاصد الشريعة الضرورية", a:"خمسة: حفظ الدين، والنفس، والعقل، والنسل، والمال. أشار إليها الغزالي في «المستصفى»، وفصّلها الشاطبي في «الموافقات».", s:"المستصفى للغزالي؛ الموافقات للشاطبي"},
 {t:"f", q:"نصاب زكاة الذهب والفضة", a:"نصاب الذهب عشرون مثقالًا، أي نحو 85 غرامًا. ونصاب الفضة مئتا درهم، أي نحو 595 غرامًا. والواجب فيهما ربع العشر (2.5%) إذا حال عليهما الحول.", s:"فتاوى اللجنة الدائمة للبحوث العلمية والإفتاء"},
 {t:"q", q:"ما الفرق بين «الفرض» و«الواجب» عند الحنفية؟", a:"عند الحنفية: الفرض ما ثبت بدليل قطعي، ويكفر جاحده. والواجب ما ثبت بدليل ظني، ولا يكفر جاحده. أما الجمهور فالفرض والواجب عندهم بمعنى واحد غالبًا.", s:"أصول السرخسي؛ روضة الناظر لابن قدامة"},
 {t:"f", q:"أسباب سجود السهو", a:"ثلاثة: الزيادة في الصلاة، والنقص منها، والشك فيها.", s:"الروض المربع للبهوتي؛ المغني لابن قدامة"},
 {t:"q", q:"ما الفرق بين الأداء والقضاء؟", a:"الأداء فعل العبادة في وقتها المحدد شرعًا. والقضاء فعلها بعد خروج وقتها. وتسمى الصلاة المعادة في وقتها لخلل في الأولى «إعادة».", s:"روضة الناظر لابن قدامة؛ شرح الكوكب المنير"},
 {t:"f", q:"أركان الحج", a:"عند الحنابلة والمالكية أربعة: الإحرام، والوقوف بعرفة، وطواف الإفاضة، والسعي. ويزيد الشافعية الحلق أو التقصير والترتيب. ومن فاته الوقوف بعرفة فاته الحج، لقوله ﷺ: «الحج عرفة».", s:"المغني لابن قدامة؛ حديث «الحج عرفة» رواه أبو داود والترمذي والنسائي وابن ماجه وصححه الألباني"},
 {t:"q", q:"ما شروط وجوب الحج؟", a:"الإسلام، والعقل، والبلوغ، والحرية، والاستطاعة. ويُشترط للمرأة المَحرم عند الحنابلة والحنفية. ويرى المالكية والشافعية جواز حجّها الواجب مع رفقة مأمونة.", s:"المغني لابن قدامة؛ الفقه على المذاهب الأربعة"}
]},
{id:"hadith", n:"حديث", g:"د", items:[
 {t:"q", q:"ما تعريف الحديث الصحيح؟", a:"هو ما اتصل سنده بنقل العدل الضابط عن مثله إلى منتهاه، من غير شذوذ ولا علة. فشروطه خمسة: اتصال السند، وعدالة الرواة، وضبطهم، وانتفاء الشذوذ، وانتفاء العلة.", s:"مقدمة ابن الصلاح؛ نزهة النظر لابن حجر"},
 {t:"f", q:"أول حديث وآخر حديث في صحيح البخاري", a:"أوله: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى». وآخره: «كلمتان خفيفتان على اللسان، ثقيلتان في الميزان، حبيبتان إلى الرحمن: سبحان الله وبحمده، سبحان الله العظيم».", s:"صحيح البخاري"},
 {t:"f", q:"عدد أحاديث صحيح البخاري", a:"نحو 7563 حديثًا بالمكرر حسب الترقيم المشهور، ونحو 2600 حديث بلا تكرار تقريبًا. وجمهور العلماء على أنه أصح كتاب بعد كتاب الله، ثم صحيح مسلم.", s:"فتح الباري لابن حجر؛ مقدمة ابن الصلاح"},
 {t:"q", q:"ما الفرق بين القرآن والحديث القدسي؟", a:"القرآن لفظه ومعناه من الله، ويُتعبد بتلاوته، ويُقرأ في الصلاة، ومعجز، ومنقول بالتواتر. أما الحديث القدسي فيرويه النبي ﷺ عن ربه، ولا يُتعبد بتلاوته ولا يُقرأ في الصلاة، وفيه الصحيح والحسن والضعيف.", s:"مناهل العرفان للزرقاني؛ قواعد التحديث للقاسمي"},
 {t:"f", q:"الحديث المتواتر ومثاله", a:"المتواتر ما رواه جمع يستحيل في العادة تواطؤهم على الكذب، عن مثلهم، إلى منتهاه. ومن أشهر أمثلته: «من كذب عليّ متعمدًا فليتبوأ مقعده من النار»، وقد رواه جمع كبير من الصحابة، يُذكر أنهم أكثر من ستين.", s:"نزهة النظر لابن حجر؛ تدريب الراوي للسيوطي"},
 {t:"q", q:"من أكثر الصحابة رواية للحديث؟", a:"أبو هريرة رضي الله عنه، ثم عبدالله بن عمر، ثم أنس بن مالك، ثم عائشة أم المؤمنين، ثم عبدالله بن عباس، ثم جابر بن عبدالله، ثم أبو سعيد الخدري رضي الله عنهم.", s:"تدريب الراوي للسيوطي؛ الإصابة لابن حجر"},
 {t:"q", q:"ما معنى «متفق عليه»؟", a:"في الاصطلاح المشهور: الحديث الذي رواه البخاري ومسلم كلاهما من رواية الصحابي نفسه.", s:"نزهة النظر لابن حجر"},
 {t:"f", q:"الكتب الستة", a:"صحيح البخاري، وصحيح مسلم، وسنن أبي داود، وسنن الترمذي (الجامع)، وسنن النسائي (المجتبى)، وسنن ابن ماجه.", s:"مقدمة ابن الصلاح؛ الرسالة المستطرفة للكتاني"},
 {t:"f", q:"الموطأ وكلمة الشافعي فيه", a:"ألّف الإمام مالك «الموطأ»، وهو من أقدم كتب الحديث المصنفة التي وصلتنا. قال فيه الشافعي: «ما على ظهر الأرض كتاب بعد كتاب الله أصح من كتاب مالك»، وقد قالها قبل تأليف الصحيحين.", s:"مقدمة ابن الصلاح؛ تدريب الراوي"},
 {t:"q", q:"ما علم «الجرح والتعديل»؟", a:"علم يبحث في أحوال الرواة من حيث قبول روايتهم أو ردها. ومن أشهر كتبه: «تهذيب الكمال» للمزي، و«ميزان الاعتدال» للذهبي، و«تقريب التهذيب» لابن حجر.", s:"الرسالة المستطرفة للكتاني"}
]},
{id:"tawhid", n:"توحيد", g:"و", items:[
 {t:"f", q:"أقسام التوحيد", a:"عند أهل السنة ثلاثة: توحيد الربوبية (إفراد الله بالخلق والملك والتدبير)، وتوحيد الألوهية (إفراده بالعبادة)، وتوحيد الأسماء والصفات (إثبات ما أثبته لنفسه من غير تحريف ولا تعطيل ولا تكييف ولا تمثيل).", s:"شرح العقيدة الطحاوية لابن أبي العز؛ القول المفيد لابن عثيمين"},
 {t:"q", q:"لماذا لا يكفي الإقرار بالربوبية وحده؟", a:"لأن مشركي العرب كانوا يقرّون بأن الله هو الخالق، كما قال تعالى: <span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ﴾</span> [لقمان: 25]. ومع ذلك لم يدخلوا في الإسلام، لأنهم لم يفردوه بالعبادة.", s:"القرآن الكريم؛ كشف الشبهات لمحمد بن عبدالوهاب"},
 {t:"f", q:"معنى «لا إله إلا الله» وركناها", a:"معناها: لا معبود بحق إلا الله. ولها ركنان: النفي «لا إله» ينفي العبادة عن كل ما سوى الله، والإثبات «إلا الله» يثبتها لله وحده.", s:"فتح المجيد لعبدالرحمن بن حسن"},
 {t:"q", q:"ما شروط «لا إله إلا الله»؟", a:"سبعة على المشهور: العلم المنافي للجهل، واليقين المنافي للشك، والقبول المنافي للرد، والانقياد المنافي للترك، والصدق المنافي للكذب، والإخلاص المنافي للشرك، والمحبة المنافية للبغض. ويزيد بعض العلماء: الكفر بما يُعبد من دون الله.", s:"معارج القبول لحافظ الحكمي"},
 {t:"q", q:"ما الفرق بين الشرك الأكبر والأصغر؟", a:"الشرك الأكبر يُخرج من الملة ويحبط العمل كله، كصرف العبادة لغير الله. والأصغر لا يخرج من الملة لكنه من أعظم الذنوب، ومن أمثلته يسير الرياء والحلف بغير الله.", s:"القول المفيد على كتاب التوحيد لابن عثيمين"},
 {t:"f", q:"حق الله على العباد", a:"قال النبي ﷺ لمعاذ: «حق الله على العباد أن يعبدوه ولا يشركوا به شيئًا، وحق العباد على الله ألا يعذب من لا يشرك به شيئًا».", s:"متفق عليه (البخاري ومسلم)"},
 {t:"q", q:"ما معنى أن أسماء الله «توقيفية»؟", a:"أي لا يُثبت لله اسم إلا بدليل من القرآن أو السنة الصحيحة، فلا يُسمى الله بما لم يسمِّ به نفسه ولا سماه به رسوله ﷺ، لأن العقل لا يستقل بمعرفة ذلك.", s:"القواعد المثلى لابن عثيمين"},
 {t:"f", q:"حديث التسعة والتسعين اسمًا", a:"الحديث «إن لله تسعة وتسعين اسمًا، مائة إلا واحدًا، من أحصاها دخل الجنة» متفق عليه. أما سرد الأسماء المشهور الوارد عند الترمذي، فالراجح عند المحققين كابن تيمية وابن حجر أنه مدرج من بعض الرواة وليس من كلام النبي ﷺ.", s:"صحيح البخاري ومسلم؛ مجموع الفتاوى لابن تيمية؛ فتح الباري"},
 {t:"q", q:"ما أنواع التوسل المشروع؟", a:"ثلاثة: التوسل إلى الله بأسمائه وصفاته، والتوسل بالعمل الصالح كما في قصة أصحاب الغار، والتوسل بدعاء الرجل الصالح الحي كما توسل الصحابة بدعاء العباس رضي الله عنه في الاستسقاء.", s:"قاعدة جليلة في التوسل والوسيلة لابن تيمية؛ قصة الغار والعباس في صحيح البخاري"},
 {t:"f", q:"الإيمان يزيد وينقص", a:"قول أهل السنة والجماعة أن الإيمان قول وعمل، يزيد بالطاعة وينقص بالمعصية. وبوّب عليه البخاري في كتاب الإيمان من صحيحه، ونقل الإجماع عليه جمع من الأئمة.", s:"صحيح البخاري، كتاب الإيمان؛ شرح أصول اعتقاد أهل السنة للالكائي"}
]},
{id:"religion", n:"دينية عامة", g:"ن", items:[
 {t:"f", q:"الأطول والأقصر في القرآن", a:"أطول سورة: البقرة (286 آية). وأقصر سورة: الكوثر (3 آيات). وأطول آية: آية الدَّين [البقرة: 282].", s:"البرهان في علوم القرآن للزركشي؛ مصحف المدينة"},
 {t:"q", q:"ما السورة التي لا تبدأ بالبسملة؟ وما السورة التي فيها بسملتان؟", a:"سورة التوبة (براءة) لا تبدأ بالبسملة. وسورة النمل فيها بسملتان: في أولها، وفي الآية 30 ضمن كتاب سليمان عليه السلام.", s:"الإتقان في علوم القرآن للسيوطي"},
 {t:"q", q:"كيف جُمع القرآن في مصحف واحد؟", a:"بعد استشهاد كثير من القراء في معركة اليمامة أشار عمر على أبي بكر رضي الله عنهما بجمع القرآن، فكلّف زيد بن ثابت بذلك. ثم في عهد عثمان رضي الله عنه نُسخت المصاحف ووُحّد الناس عليها، وأُرسلت إلى الأمصار.", s:"صحيح البخاري، كتاب فضائل القرآن"},
 {t:"f", q:"الصحابي الوحيد المذكور باسمه في القرآن", a:"زيد بن حارثة رضي الله عنه، في قوله تعالى: <span class=\"ayah\">﴿فَلَمَّا قَضَىٰ زَيْدٌ مِّنْهَا وَطَرًا﴾</span> [الأحزاب: 37].", s:"القرآن الكريم؛ تفسير ابن كثير"},
 {t:"q", q:"ما السورة التي تعدل ثلث القرآن؟", a:"سورة الإخلاص <span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾</span>، لقول النبي ﷺ: «والذي نفسي بيده إنها لتعدل ثلث القرآن».", s:"صحيح البخاري"},
 {t:"f", q:"غزوة بدر", a:"وقعت في 17 رمضان من السنة الثانية للهجرة. وكان عدد المسلمين بضعة عشر وثلاثمائة، وعدد المشركين قرابة الألف. وسماها الله «يوم الفرقان».", s:"صحيح البخاري؛ سيرة ابن هشام"},
 {t:"q", q:"كم سنة استمر نزول القرآن؟", a:"نحو ثلاث وعشرين سنة: ثلاث عشرة في مكة، وعشر في المدينة.", s:"الإتقان للسيوطي؛ صحيح البخاري"},
 {t:"f", q:"أول ما نزل وآخر ما نزل", a:"أول ما نزل: <span class=\"ayah\">﴿اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ﴾</span> في غار حراء. وآخر ما نزل على أرجح الأقوال، وهو قول ابن عباس: <span class=\"ayah\">﴿وَاتَّقُوا يَوْمًا تُرْجَعُونَ فِيهِ إِلَى اللَّهِ﴾</span> [البقرة: 281].", s:"صحيح البخاري؛ الإتقان للسيوطي"},
 {t:"q", q:"كم سورة افتُتحت بالحروف المقطعة؟", a:"تسع وعشرون سورة، مثل «الم» و«حم» و«ق» و«ن». وأرجح أقوال العلماء في حكمتها: بيان إعجاز القرآن، فهو مركب من هذه الحروف نفسها ولم يستطع العرب الإتيان بمثله.", s:"البرهان للزركشي؛ تفسير ابن كثير (أول سورة البقرة)"},
 {t:"f", q:"المكي والمدني", a:"عدد سور القرآن 114 سورة، منها 86 مكية و28 مدنية على المشهور. والمعتمد في التقسيم الزمن: فما نزل قبل الهجرة مكي ولو نزل خارج مكة، وما نزل بعدها مدني.", s:"الإتقان للسيوطي؛ مناهل العرفان للزرقاني"}
]},
{id:"law", n:"قانون سعودي", g:"ق", items:[
 {t:"f", q:"النظام الأساسي للحكم", a:"صدر بالأمر الملكي رقم (أ/90) وتاريخ 27/8/1412هـ (1992م). وتنص مادته الأولى على أن المملكة دولة عربية إسلامية ذات سيادة تامة، دينها الإسلام، ودستورها كتاب الله تعالى وسنة رسوله ﷺ.", s:"النظام الأساسي للحكم، المادة 1 — هيئة الخبراء بمجلس الوزراء"},
 {t:"q", q:"كم ساعات العمل النظامية في القطاع الخاص؟", a:"8 ساعات في اليوم أو 48 ساعة في الأسبوع. وفي رمضان تُخفض للعاملين المسلمين إلى 6 ساعات يوميًا أو 36 ساعة أسبوعيًا.", s:"نظام العمل، المادة 98"},
 {t:"q", q:"كم مدة الإجازة السنوية للعامل؟", a:"21 يومًا مدفوعة الأجر، وتزيد إلى 30 يومًا إذا أمضى العامل خمس سنوات متصلة لدى صاحب العمل.", s:"نظام العمل، المادة 109"},
 {t:"q", q:"كيف تُحسب مكافأة نهاية الخدمة؟", a:"أجر نصف شهر عن كل سنة من السنوات الخمس الأولى، وأجر شهر كامل عن كل سنة بعدها. وتُحسب على آخر أجر، ويستحق العامل عن أجزاء السنة بنسبة ما قضاه منها.", s:"نظام العمل، المادة 84"},
 {t:"q", q:"كم يستحق العامل من المكافأة إذا استقال؟", a:"لا شيء إذا كانت خدمته أقل من سنتين. ثلث المكافأة من سنتين إلى أقل من خمس. ثلثاها من خمس إلى أقل من عشر. والمكافأة كاملة إذا بلغت عشر سنوات فأكثر.", s:"نظام العمل، المادة 85"},
 {t:"f", q:"فترة التجربة", a:"لا تزيد فترة التجربة على 90 يومًا، ويجوز تمديدها باتفاق مكتوب بين الطرفين على ألا يتجاوز مجموعها 180 يومًا. ولا تدخل فيها إجازتا العيدين والإجازة المرضية.", s:"نظام العمل، المادة 53 بعد تعديلاته الأخيرة"},
 {t:"q", q:"كم مدة الاعتراض على الحكم القضائي؟", a:"30 يومًا لطلب الاستئناف أو التدقيق، و10 أيام في القضايا المستعجلة. وإذا لم يعترض المحكوم عليه خلالها سقط حقه في الاعتراض.", s:"نظام المرافعات الشرعية، المادة 187"},
 {t:"f", q:"عقوبة التحرش", a:"السجن مدة لا تزيد على سنتين، وغرامة لا تزيد على 100 ألف ريال، أو بإحدى هاتين العقوبتين. وتُشدد العقوبة في حالات منها العود، أو أن تكون الضحية طفلًا أو من ذوي الإعاقة.", s:"نظام مكافحة جريمة التحرش (1439هـ)، المادة 6"},
 {t:"f", q:"التصوير والتشهير عبر الجوال", a:"المساس بالحياة الخاصة بإساءة استخدام الجوال المزوّد بكاميرا، أو التشهير بالآخرين وإلحاق الضرر بهم عبر وسائل التقنية، عقوبته السجن مدة لا تزيد على سنة، وغرامة لا تزيد على 500 ألف ريال، أو بإحداهما.", s:"نظام مكافحة الجرائم المعلوماتية (1428هـ)، المادة 3"},
 {t:"f", q:"نظام حماية البيانات الشخصية", a:"صدر عام 1442هـ، وبدأ العمل به في 14 سبتمبر 2023م، والجهة المشرفة عليه الهيئة السعودية للبيانات والذكاء الاصطناعي (سدايا). ويعطي الشخص حق العلم بجمع بياناته، والاطلاع عليها، وطلب تصحيحها أو إتلافها.", s:"نظام حماية البيانات الشخصية — سدايا"},
 {t:"f", q:"نظام الأحوال الشخصية", a:"صدر بالمرسوم الملكي رقم (م/73) عام 1443هـ (2022م)، وهو أول نظام مقنّن شامل لأحكام الزواج والطلاق والنفقة والحضانة والوصية والإرث في المملكة.", s:"نظام الأحوال الشخصية — هيئة الخبراء بمجلس الوزراء"},
 {t:"q", q:"ما أعلى محكمة في المملكة؟", a:"المحكمة العليا، ومقرها الرياض. تراقب سلامة تطبيق أحكام الشريعة والأنظمة في أحكام محاكم الاستئناف، وتنظر في أحكام القتل والقطع والرجم والقصاص فيما دون النفس.", s:"نظام القضاء (1428هـ)، المادتان 10 و11"}
]},
{id:"studies", n:"دراسات عالمية", g:"ر", items:[]},
{id:"psychology", n:"علم نفس", g:"ن", items:[
 {t:"f", q:"تأثير دانينغ–كروغر", a:"أظهرت دراسة دانينغ وكروغر (1999) أن قليلي الكفاءة في مجال ما يميلون إلى تقدير مهارتهم بأعلى من حقيقتها، لأنهم يفتقدون المهارة نفسها التي تجعلهم يرون أخطاءهم. بينما يميل الأكفاء إلى تقدير أنفسهم أقل قليلًا من الحقيقة.", s:"Kruger & Dunning, Journal of Personality and Social Psychology 1999"},
 {t:"q", q:"ما «منحنى النسيان» وكيف تتغلب عليه؟", a:"اكتشف هيرمان إبنغهاوس (1885) أننا ننسى جزءًا كبيرًا مما نتعلمه خلال الساعات والأيام الأولى. وأفضل علاج له «التكرار المتباعد»: مراجعة المعلومة على فترات تطول تدريجيًا (بعد يوم، ثم ثلاثة، ثم أسبوع…).", s:"Ebbinghaus, Memory 1885؛ Cepeda et al., Psychological Bulletin 2006"},
 {t:"f", q:"تجربة ميلغرام في الطاعة", a:"في تجارب ستانلي ميلغرام (1961–1963) طُلب من المشاركين توجيه «صدمات كهربائية» وهمية لشخص آخر. فاستمر نحو 65% منهم حتى أعلى مستوى (450 فولت) لمجرد أن الباحث أمرهم بذلك. وتُعد من أشهر التجارب التي كشفت قوة الطاعة للسلطة.", s:"Milgram, Journal of Abnormal and Social Psychology 1963"},
 {t:"q", q:"ما «تأثير الهالة»؟", a:"أن يمتد انطباع إيجابي عن صفة واحدة في شخص، كالمظهر أو الثقة، إلى الحكم على صفاته الأخرى، كالذكاء والأمانة، دون دليل. وصفه عالم النفس إدوارد ثورندايك سنة 1920.", s:"Thorndike, Journal of Applied Psychology 1920"},
 {t:"f", q:"كم شيئًا تستطيع ذاكرتك القصيرة حمله؟", a:"اشتهر رقم جورج ميلر «7 زائد أو ناقص 2» (1956). لكن الأبحاث اللاحقة، وأبرزها أبحاث نيلسون كوان (2001)، تقدّر السعة الحقيقية بنحو 4 وحدات فقط. ولهذا نقسّم أرقام الجوال إلى مجموعات.", s:"Miller, Psychological Review 1956؛ Cowan, Behavioral and Brain Sciences 2001"},
 {t:"q", q:"ما الفرق بين الخوف والقلق؟", a:"الخوف استجابة انفعالية لتهديد حاضر ومحدد. والقلق ترقّب لتهديد مستقبلي غير مؤكد، ويصاحبه توتر ويقظة زائدة وتجنب.", s:"الدليل التشخيصي والإحصائي للاضطرابات النفسية (DSM-5)، الجمعية الأمريكية للطب النفسي"},
 {t:"f", q:"تأثير المتفرج", a:"كلما زاد عدد الحاضرين في حالة طارئة، قلّ احتمال أن يتدخل أي واحد منهم، لأن المسؤولية تتوزع بينهم. أثبته دارلي ولاتانيه سنة 1968. ولهذا يُنصح في الطوارئ بتكليف شخص بعينه: «أنت يا صاحب القميص الأزرق، اتصل بالإسعاف».", s:"Darley & Latané, Journal of Personality and Social Psychology 1968"},
 {t:"q", q:"ما «التنافر المعرفي»؟", a:"نظرية ليون فستنغر (1957): نشعر بتوتر داخلي حين تتعارض أفعالنا مع قناعاتنا، فنغيّر أحدهما لنرتاح. وغالبًا نعدّل القناعة لتبرير الفعل، كمن يشتري شيئًا غاليًا ثم يبالغ في مدحه.", s:"Festinger, A Theory of Cognitive Dissonance, 1957"},
 {t:"f", q:"النوم يثبّت ما تعلمته", a:"أثناء النوم يعيد الدماغ «تشغيل» ما تعلمناه في النهار، وينقل الذكريات من الحُصين إلى القشرة الدماغية للتخزين طويل المدى. ولهذا السهر قبل الاختبار يضعف التذكر بدل أن يقويه.", s:"Walker, Why We Sleep 2017؛ Diekelmann & Born, Nature Reviews Neuroscience 2010"},
 {t:"q", q:"هل تجربة «حلوى المارشملو» تتنبأ فعلًا بالنجاح؟", a:"ربطت تجارب والتر ميشيل في جامعة ستانفورد (منذ أواخر الستينيات) قدرة الطفل على تأجيل أكل الحلوى بنجاحه لاحقًا. لكن إعادة أوسع للتجربة سنة 2018 وجدت أن الأثر أضعف بكثير بعد احتساب الخلفية الأسرية والاقتصادية للطفل.", s:"Mischel et al., Science 1989؛ Watts, Duncan & Quan, Psychological Science 2018"},
 {t:"f", q:"تأثير زايغارنيك", a:"نميل إلى تذكّر المهام التي قُطعت قبل اكتمالها أكثر من المهام المكتملة، وهي التي تظل «تشغل البال». وصفته بلوما زايغارنيك سنة 1927، ونتائج إعادة التجربة متفاوتة.", s:"Zeigarnik, Psychologische Forschung 1927؛ APA Dictionary of Psychology"}
]}
];
const EXTRA={"biology":[["q","كم عدد الكروموسومات في الخلية البشرية؟","46 كروموسومًا، أي 23 زوجًا: نصفها من الأم ونصفها من الأب. والزوج الثالث والعشرون يحدد الجنس (XX للأنثى وXY للذكر).","المعهد الوطني لأبحاث الجينوم البشري (NHGRI)"],["f","الأب يحدد جنس المولود","البويضة تحمل دائمًا كروموسوم X، والحيوان المنوي يحمل X أو Y. فإن حمل Y كان المولود ذكرًا، وإن حمل X كانت أنثى.","NHGRI؛ Alberts, Molecular Biology of the Cell"],["q","ما الفرق بين DNA وRNA؟","DNA شريطان ملتفان يحفظان المعلومات الوراثية في النواة، وسكره ديوكسي رايبوز. RNA غالبًا شريط واحد ينقل المعلومة لصنع البروتين، وفيه اليوراسيل بدل الثايمين.","Alberts, Molecular Biology of the Cell"],["f","أحرف الوراثة الأربعة","الحمض النووي مكتوب بأربعة «أحرف» كيميائية: A أدينين، T ثايمين، C سايتوسين، G جوانين. ويرتبط A مع T دائمًا، وC مع G.","NHGRI"],["q","من هو أبو علم الوراثة؟","غريغور مندل، راهب نمساوي أجرى تجاربه على نبات البازلاء ونشرها عام 1866، واكتشف قوانين انتقال الصفات بين الأجيال.","Britannica؛ NHGRI"],["f","الصفة السائدة والمتنحية","الصفة السائدة تظهر إذا ورث الشخص نسخة واحدة منها، والمتنحية لا تظهر إلا إذا ورث نسختين، واحدة من كل والد.","NHGRI"],["q","ما التمثيل الضوئي؟","عملية تصنع فيها النباتات غذاءها (الجلوكوز) من ثاني أكسيد الكربون والماء باستخدام طاقة الشمس، وتطلق الأكسجين، وتحدث في البلاستيدات الخضراء.","Taiz & Zeiger, Plant Physiology"],["f","لماذا النباتات خضراء","لأن الكلوروفيل يمتص الضوء الأحمر والأزرق ويعكس الأخضر، فنراها خضراء.","Taiz & Zeiger, Plant Physiology"],["q","ما أكبر حيوان عاش على الأرض؟","الحوت الأزرق، يصل طوله إلى نحو 30 مترًا ووزنه إلى نحو 150–190 طنًا، وهو أكبر من أي ديناصور معروف.","NOAA Fisheries؛ Smithsonian"],["f","قلب الحوت الأزرق","يزن قلب الحوت الأزرق نحو 180 كغم، ويمكن سماع نبضه من على بعد أكثر من 3 كم تحت الماء.","Goldbogen et al., PNAS 2019؛ NOAA"],["q","ما أسرع حيوان على اليابسة؟","الفهد (الشيتا)، يصل إلى نحو 100–110 كم/س في عدو قصير لا يتجاوز بضع مئات من الأمتار.","Smithsonian's National Zoo"],["f","أسرع كائن على الإطلاق","صقر الشاهين أسرع حيوان، يتجاوز 300 كم/س عند انقضاضه على فريسته من الأعلى.","Smithsonian؛ National Geographic"],["q","كم عمر السلحفاة العملاقة؟","تعيش سلاحف الأرض العملاقة أكثر من 100 سنة، وأشهرها «جوناثان» في جزيرة سانت هيلانة يُقدّر عمره بنحو 190 سنة، وتعده غينيس أكبر حيوان بري حي سنًا.","موسوعة غينيس"],["f","الإبل وسنام الدهون","سنام الجمل يخزن الدهون لا الماء. وعند الحاجة يحرق الدهون فيحصل على طاقة وماء أيضًا. ويستطيع الجمل شرب أكثر من 100 لتر في نحو عشر دقائق.","Schmidt-Nielsen K., Desert Animals 1964؛ Britannica"],["q","لماذا لا يجف الجمل في الصحراء؟","كريات دمه بيضاوية تتحرك بسهولة حتى مع نقص الماء، وكليتاه تركزان البول، وتتغير حرارة جسمه نحو 6 درجات خلال اليوم فيقل تعرقه.","Schmidt-Nielsen K., Desert Animals 1964"],["f","النمل يحمل أضعاف وزنه","يستطيع بعض النمل حمل ما يزيد على 10 إلى 50 ضعف وزنه، بسبب صغر حجمه وقوة عضلاته نسبةً إلى وزنه.","Smithsonian؛ Nguyen et al., Journal of Biomechanics 2014"],["q","كيف تتنفس الأسماك؟","بالخياشيم التي تستخلص الأكسجين المذاب في الماء، إذ يمر الماء عليها والدم في اتجاه معاكس فيزيد امتصاص الأكسجين.","Britannica؛ مراجع علم الحيوان"],["f","الدلافين تنام بنصف دماغ","الدلافين تنام بنصف دماغها في كل مرة، بينما يبقى النصف الآخر يقظًا للتنفس ومراقبة الخطر، وتبقى عين واحدة مفتوحة.","Rattenborg et al., Neuroscience & Biobehavioral Reviews 2000"],["q","كيف ترى الخفافيش في الظلام؟","بتحديد الموقع بالصدى: تطلق أصواتًا عالية التردد وتسمع ارتدادها، فتعرف مكان الأجسام وحجمها وحركتها.","Smithsonian؛ Britannica"],["f","عيون النسور","حدة بصر النسور والعقبان أعلى من الإنسان بنحو 4 إلى 8 مرات، وتستطيع رؤية أرنب من على بعد كيلومترات.","Smithsonian؛ Jones et al., Journal of Experimental Biology"],["q","ما الكائن الذي يستطيع العيش في الفضاء؟","دب الماء (التارديغراد)، حيوان مجهري نجا من التعرض للفراغ والإشعاع الفضائي في تجربة على قمر صناعي أوروبي عام 2007.","Jönsson et al., Current Biology 2008"],["f","النحل والعسل","لصنع نصف كيلو عسل تزور النحلات نحو مليوني زهرة، وتطير ما يعادل أكثر من دورة حول الأرض.","المجلس الوطني للعسل الأمريكي (National Honey Board)"],["q","كم تعيش النحلة العاملة؟","نحو 5 إلى 6 أسابيع في موسم النشاط، أما الملكة فتعيش سنوات.","المجلس الوطني للعسل؛ Britannica"],["f","التكاثر بلا ذكر","بعض الكائنات تتكاثر دون تزاوج، كبعض أنواع السحالي وسمك القرش وتنين كومودو، وتسمى هذه الظاهرة «التوالد البكري».","Watts et al., Nature 2006"],["q","ما أطول شجرة في العالم؟","شجرة سكويا الساحل «هايبريون» في كاليفورنيا، طولها نحو 116 مترًا.","National Park Service الأمريكية"],["f","أقدم شجرة حية معروفة","شجرة صنوبر «بريسلكون» في كاليفورنيا يقدر عمرها بأكثر من 4,800 سنة، ويُخفى موقعها لحمايتها.","هيئة الغابات الأمريكية (USDA Forest Service)"],["q","كم نوعًا من الكائنات الحية في العالم؟","وُصف نحو مليوني نوع علميًا حتى الآن، وتقدّر دراسة شهيرة العدد الكلي بنحو 8.7 مليون نوع، أغلبها لم يُكتشف.","Mora et al., PLOS Biology 2011"],["f","الحشرات أكثر الحيوانات تنوعًا","وُصف نحو مليون نوع من الحشرات، وهي أكثر من نصف أنواع الكائنات المعروفة، والخنافس وحدها نحو 400 ألف نوع.","Smithsonian؛ Britannica"],["q","ما وظيفة الريبوسوم في الخلية؟","مصنع البروتين: يقرأ تعليمات الـRNA المرسال ويركّب الأحماض الأمينية بالترتيب لصنع البروتين.","Alberts, Molecular Biology of the Cell"],["f","الخلايا الجذعية","خلايا غير متخصصة تستطيع الانقسام والتحول إلى أنواع أخرى من الخلايا. ونال ياماناكا نوبل 2012 لإثباته إمكانية إعادة خلايا الجلد البالغة إلى خلايا جذعية.","مؤسسة نوبل (NobelPrize.org)"],["q","ما تقنية كريسبر؟","أداة لتعديل الجينات بدقة، تشبه «مقصًا جزيئيًا» يقطع الحمض النووي في موضع محدد. ونالت مخترعتاها شاربنتييه وداودنا جائزة نوبل في الكيمياء 2020.","مؤسسة نوبل (NobelPrize.org)"],["f","البصمة الوراثية","كل إنسان له تسلسل DNA فريد إلا التوائم المتطابقة، ولهذا يستخدم في تحديد الهوية والنسب. وطوّر أليك جيفريز تقنية البصمة الوراثية عام 1984.","Jeffreys A.J., Nature 1985"],["q","لماذا لا يتطابق التوأمان المتطابقان في البصمات؟","لأن بصمات الأصابع تتشكل في الرحم بتأثير عوامل كضغط السائل وموضع الجنين، لا بالجينات وحدها.","Britannica؛ Jain et al., Pattern Recognition 2002"],["f","الخلايا تتجدد","تتجدد خلايا بطانة المعدة كل بضعة أيام، وخلايا الجلد كل نحو شهر، وكريات الدم الحمراء كل نحو 4 أشهر، بينما تبقى أغلب خلايا الدماغ مدى الحياة.","Spalding et al., Cell 2005؛ Alberts"],["q","ما الفيروس؟","جزيء من مادة وراثية داخل غلاف بروتيني، لا يتكاثر إلا داخل خلية حية يستولي على أجهزتها. ولهذا يختلف العلماء في تصنيفه ككائن حي.","Britannica؛ CDC"],["f","البكتيريا المفيدة","في أمعاء الإنسان تريليونات البكتيريا تساعد في الهضم وصنع فيتامينات مثل K وبعض فيتامينات B وتدريب المناعة.","المعاهد الوطنية للصحة (Human Microbiome Project)"],["q","ما أكبر خلية في جسم الإنسان؟","البويضة، قطرها نحو 0.1 ملم، ويمكن رؤيتها بالعين المجردة بالكاد. وأصغرها الحيوان المنوي.","Alberts, Molecular Biology of the Cell"],["f","الأخطبوط ذكي","للأخطبوط نحو 500 مليون خلية عصبية، ثلثاها في أذرعه، ويستطيع فتح الأوعية وحل الألغاز والتمويه بتغيير لونه في أجزاء من الثانية.","Hochner B., Current Biology 2012"],["q","كيف تغير الحرباء لونها؟","بتغيير ترتيب بلورات نانوية في خلايا جلدها فتنعكس ألوان مختلفة، لا بصبغات فقط. وتغير لونها غالبًا للتواصل وتنظيم الحرارة أكثر من التمويه.","Teyssier et al., Nature Communications 2015"],["f","ضب الصحراء","الضب حيوان صحراوي في الجزيرة العربية يعيش في جحور، ويستطيع العيش دون شرب ماء تقريبًا، إذ يحصل على الماء من غذائه النباتي.","المركز الوطني لتنمية الحياة الفطرية؛ Wilms et al., 2009"],["q","ما المها العربي؟","ظبي أبيض كبير من شبه الجزيرة العربية، انقرض في البرية عام 1972 تقريبًا، ثم أُعيد إطلاقه من برامج الإكثار، وانتقل في القائمة الحمراء من «منقرض في البرية» إلى «معرض للانقراض» عام 2011.","الاتحاد الدولي لحماية الطبيعة (IUCN)"],["q","ما الفرق بين الخلية النباتية والحيوانية؟","الخلية النباتية فيها جدار خلوي من السليلوز، وبلاستيدات خضراء للتمثيل الضوئي، وفجوة عصارية كبيرة، وكلها غير موجودة في الخلية الحيوانية.","Campbell Biology"],["f","الانقسام المتساوي والمنصف","الانقسام المتساوي ينتج خليتين متطابقتين للنمو والتعويض. والمنصف ينتج أربع خلايا جنسية في كل منها نصف عدد الكروموسومات.","Campbell Biology"],["q","ما الإنزيم؟","بروتين يسرّع التفاعلات الكيميائية في الجسم دون أن يُستهلك، مثل الأميليز في اللعاب الذي يبدأ هضم النشا.","Campbell Biology"],["f","التنفس الخلوي","تحرق الخلايا الجلوكوز بالأكسجين داخل الميتوكوندريا لتنتج طاقة ATP، ويخرج ثاني أكسيد الكربون والماء.","Campbell Biology"],["q","ما السلسلة الغذائية؟","تسلسل انتقال الطاقة بين الكائنات: منتجات (نباتات) ثم مستهلكات أولية (آكلات أعشاب) ثم مستهلكات ثانوية (آكلات لحوم) ثم محللات (بكتيريا وفطريات).","Campbell Biology"],["f","10% فقط تنتقل","في كل مستوى من السلسلة الغذائية تنتقل نحو 10% فقط من الطاقة للمستوى التالي، والباقي يُستهلك في الحياة ويضيع حرارة، ولهذا المفترسات الكبيرة قليلة العدد.","Lindeman R., Ecology 1942؛ Campbell Biology"],["q","ما الفطريات؟","مملكة مستقلة ليست نباتات ولا حيوانات، لا تقوم بالتمثيل الضوئي، وتتغذى بامتصاص المواد العضوية. ومنها الخمائر والعفن والفطر.","Campbell Biology"],["f","أكبر كائن حي","فطر عسلي في غابة مالهور بولاية أوريغون الأمريكية يمتد تحت الأرض على نحو 9 كم²، ويقدر عمره بآلاف السنين.","هيئة الغابات الأمريكية (USDA Forest Service)"],["q","كيف تتنفس النباتات؟","تأخذ ثاني أكسيد الكربون وتطلق الأكسجين في التمثيل الضوئي نهارًا، وتتنفس كباقي الكائنات طوال الوقت فتستهلك الأكسجين، لكن ما تطلقه نهارًا أكثر بكثير.","Taiz & Zeiger, Plant Physiology"],["f","النخلة","النخلة من ذوات الفلقة الواحدة، وجذعها ليس خشبًا حقيقيًا، وتنقسم إلى أشجار ذكور وإناث، ويُلقّح الإناث يدويًا عادة لزيادة الإنتاج.","منظمة الأغذية والزراعة (FAO)"],["q","كم صنف تمر في السعودية؟","أكثر من 400 صنف، وتُعد السعودية من أكبر منتجي التمور في العالم، ومن أشهر أصنافها السكري والخلاص والعجوة والصقعي والبرحي.","المركز الوطني للنخيل والتمور؛ FAO"],["f","الأحافير","بقايا أو آثار كائنات قديمة حُفظت في الصخور. ويُقدّر عمرها بتقنيات منها التأريخ الإشعاعي للصخور المحيطة.","المتحف البريطاني للتاريخ الطبيعي"],["q","ما الكائنات المهددة بالانقراض في السعودية؟","منها النمر العربي، والمها العربي، والغزال، والوعل النوبي، والحبارى. وتعمل برامج للإكثار وإعادة التوطين لحمايتها.","المركز الوطني لتنمية الحياة الفطرية؛ IUCN"],["f","النمر العربي","أصغر سلالات النمور، مهدد بالانقراض بشدة، ويُقدر عدده في البرية بأقل من 200. وأطلقت السعودية برنامجًا لإكثاره في العلا.","الهيئة الملكية لمحافظة العلا؛ IUCN"],["q","كيف يهاجر الطيور مسافات طويلة دون أن تضيع؟","تستخدم الشمس والنجوم والمجال المغناطيسي للأرض والمعالم والروائح. وطائر الخرشنة القطبية يهاجر نحو 70 ألف كم في السنة.","Egevang et al., PNAS 2010"],["f","السعودية ممر للطيور المهاجرة","تمر عبر المملكة ملايين الطيور المهاجرة بين أوروبا وآسيا وأفريقيا كل سنة، خصوصًا على سواحل البحر الأحمر.","المركز الوطني لتنمية الحياة الفطرية؛ BirdLife International"],["q","ما الشعاب المرجانية؟","مستعمرات من حيوانات صغيرة تسمى البوليبات تبني هياكل كلسية، وتعيش معها طحالب تمدها بالغذاء. وتغطي أقل من 1% من قاع البحر لكنها مأوى لنحو ربع الأحياء البحرية.","NOAA"],["f","ابيضاض المرجان","عند ارتفاع حرارة البحر تطرد المرجانيات الطحالب الملونة فتبيض، وإن استمر الارتفاع قد تموت.","NOAA"],["q","لماذا تموت الأسماك إذا خرجت من الماء؟","لأن خياشيمها تنهار في الهواء وتلتصق ببعضها، فتفقد مساحتها ولا تستطيع امتصاص الأكسجين.","مراجع علم الحيوان؛ Britannica"],["f","القرش لا يملك عظامًا","هيكل القرش من الغضاريف لا العظام، وهو أخف وأكثر مرونة، ويستطيع بعض القروش استبدال آلاف الأسنان طوال حياته.","Smithsonian Ocean"],["q","ما أطول حيوان عمرًا؟","قرش غرينلاند، قُدّر عمر بعض أفراده بنحو 272 إلى 400 سنة باستخدام التأريخ الإشعاعي لعدسة العين.","Nielsen et al., Science 2016"],["f","البطريق لا يعيش في القطب الشمالي","البطاريق تعيش في نصف الكرة الجنوبي فقط، أما الدببة القطبية ففي القطب الشمالي فقط، فلا يلتقيان طبيعيًا.","National Geographic"],["q","لماذا الفيل يملك أذنين كبيرتين؟","لتبريد جسمه: فيها أوعية دموية كثيرة، وتحريكها يبرد الدم المار فيها.","Smithsonian's National Zoo"],["f","الزرافة ورقبتها","للزرافة سبع فقرات في رقبتها، مثل الإنسان تمامًا، لكن كل فقرة قد يصل طولها 25 سم.","Smithsonian؛ Britannica"],["q","هل الطماطم فاكهة أم خضار؟","علميًا فاكهة لأنها ثمرة تحمل البذور، لكنها تُصنف في الطبخ والتجارة خضارًا.","Britannica"],["f","البذرة الأكبر في العالم","ثمرة نخلة «كوكو دي مير» في جزر سيشل أكبر بذرة في عالم النبات، وقد يصل وزن الثمرة إلى نحو 25 كغم.","اليونسكو؛ موسوعة غينيس"]],"fiqh":[["q","كم عدد أركان الصلاة؟","14 ركنًا عند الحنابلة: القيام مع القدرة، تكبيرة الإحرام، قراءة الفاتحة، الركوع، الرفع منه، الاعتدال قائمًا، السجود على الأعضاء السبعة، الرفع منه، الجلوس بين السجدتين، الطمأنينة في الكل، التشهد الأخير، الجلوس له، الصلاة على النبي ﷺ فيه، التسليمتان، والترتيب.","الروض المربع للبهوتي؛ آداب المشي إلى الصلاة لمحمد بن عبدالوهاب"],["q","كم عدد واجبات الصلاة؟","8 عند الحنابلة: التكبيرات غير تكبيرة الإحرام، قول «سمع الله لمن حمده» للإمام والمنفرد، «ربنا ولك الحمد»، «سبحان ربي العظيم» في الركوع، «سبحان ربي الأعلى» في السجود، «رب اغفر لي» بين السجدتين، التشهد الأول، والجلوس له.","الروض المربع للبهوتي"],["q","ما شروط الصلاة؟","تسعة: الإسلام، والعقل، والتمييز، ورفع الحدث، وإزالة النجاسة، وستر العورة، ودخول الوقت، واستقبال القبلة، والنية.","شروط الصلاة وأركانها وواجباتها لمحمد بن عبدالوهاب"],["q","ما فروض الوضوء؟","ستة عند الحنابلة: غسل الوجه ومنه المضمضة والاستنشاق، وغسل اليدين إلى المرفقين، ومسح الرأس كله ومنه الأذنان، وغسل الرجلين إلى الكعبين، والترتيب، والموالاة. والأربعة الأولى منصوصة في آية المائدة 6.","الروض المربع؛ سورة المائدة الآية 6"],["q","ما نواقض الوضوء؟","عند الحنابلة: الخارج من السبيلين، وخروج النجاسة الكثيرة من البدن، وزوال العقل بنوم ونحوه، ومس الفرج باليد بلا حائل، وأكل لحم الإبل، والردة. وفي بعضها خلاف بين المذاهب.","الروض المربع؛ المغني لابن قدامة"],["f","أكل لحم الإبل ينقض الوضوء","هذا مذهب الحنابلة، لحديث جابر بن سمرة أن رجلًا سأل النبي ﷺ: أنتوضأ من لحوم الإبل؟ قال: «نعم». رواه مسلم. والجمهور على أنه لا ينقض.","صحيح مسلم؛ المغني لابن قدامة"],["q","ما موجبات الغسل؟","خروج المني بلذة، والتقاء الختانين، وإسلام الكافر، والموت، والحيض، والنفاس.","الروض المربع؛ عمدة الفقه لابن قدامة"],["q","ما شروط التيمم؟","عدم الماء أو العجز عن استعماله لمرض ونحوه، ودخول الوقت عند الجمهور، وأن يكون بتراب طهور له غبار عند الحنابلة والشافعية، والنية.","المغني لابن قدامة؛ سورة النساء 43"],["f","مسح الخفين","مدة المسح يوم وليلة للمقيم، وثلاثة أيام بلياليها للمسافر، وتبدأ من أول مسح بعد الحدث على الصحيح، ويُشترط لبسهما على طهارة.","صحيح مسلم (حديث علي)؛ الشرح الممتع لابن عثيمين"],["q","كم ركعة في صلاة المسافر الرباعية؟","ركعتان، وهو القصر. ويجوز قصر الظهر والعصر والعشاء، ولا تُقصر المغرب ولا الفجر.","صحيح البخاري ومسلم؛ المغني لابن قدامة"],["f","مسافة القصر","الجمهور (المالكية والشافعية والحنابلة) قدّروها بأربعة بُرُد، أي نحو 80 كم تقريبًا. ورأى ابن تيمية أن المرجع ما يسميه الناس سفرًا عرفًا.","المغني لابن قدامة؛ مجموع الفتاوى لابن تيمية"],["q","ما أوقات النهي عن صلاة النافلة؟","بعد صلاة الفجر حتى ترتفع الشمس قيد رمح، وعند قيامها في وسط السماء حتى تزول، وبعد صلاة العصر حتى تغرب. ويُستثنى ذوات الأسباب على الراجح كتحية المسجد.","صحيح مسلم (حديث عقبة بن عامر)؛ الشرح الممتع"],["q","كم عدد تكبيرات صلاة العيد؟","سبع تكبيرات في الركعة الأولى مع تكبيرة الإحرام، وخمس في الثانية سوى تكبيرة القيام، على المشهور عند الحنابلة والمالكية.","سنن أبي داود؛ المغني لابن قدامة"],["f","صلاة الجنازة","أربع تكبيرات: بعد الأولى الفاتحة، وبعد الثانية الصلاة على النبي ﷺ، وبعد الثالثة الدعاء للميت، وبعد الرابعة يسكت قليلًا ثم يسلّم. وليس فيها ركوع ولا سجود.","الروض المربع؛ المغني لابن قدامة"],["q","ما حكم صلاة الجماعة للرجال؟","واجبة على الرجال القادرين عند الحنابلة، وسنة مؤكدة عند الجمهور. واستدل الحنابلة بحديث همّ النبي ﷺ بتحريق بيوت المتخلفين عنها.","صحيح البخاري ومسلم؛ المغني لابن قدامة"],["q","ما مقدار زكاة الفطر؟","صاع من غالب قوت البلد عن كل مسلم، والصاع نحو 3 كغم من الأرز تقريبًا حسب فتوى اللجنة الدائمة. وتُخرج قبل صلاة العيد، ويجوز قبله بيوم أو يومين.","صحيح البخاري (حديث ابن عمر)؛ فتاوى اللجنة الدائمة"],["f","مصارف الزكاة الثمانية","الفقراء، والمساكين، والعاملون عليها، والمؤلفة قلوبهم، وفي الرقاب، والغارمون، وفي سبيل الله، وابن السبيل.","سورة التوبة، الآية 60"],["q","ما نصاب زكاة الإبل؟","خمس من الإبل، وفيها شاة. وفي عشر شاتان، وفي خمس عشرة ثلاث شياه، وفي عشرين أربع، وفي خمس وعشرين بنت مخاض.","صحيح البخاري (كتاب أبي بكر في الصدقة)"],["q","ما نصاب زكاة الغنم؟","أربعون شاة، وفيها شاة واحدة حتى مئة وعشرين. فإذا زادت ففيها شاتان حتى مئتين.","صحيح البخاري (كتاب أبي بكر في الصدقة)"],["f","زكاة الحبوب والثمار","نصابها خمسة أوسق، نحو 612 كغم تقريبًا. والواجب العشر فيما سُقي بلا كلفة، ونصف العشر فيما سُقي بكلفة.","صحيح البخاري؛ فتاوى اللجنة الدائمة"],["q","ما مفطرات الصيام؟","الأكل والشرب عمدًا، والجماع، وإنزال المني بشهوة، والقيء عمدًا، وخروج دم الحيض والنفاس، وما في معنى الأكل كالإبر المغذية. وفي الحجامة خلاف، والحنابلة يرونها مفطرة.","الروض المربع؛ مجالس شهر رمضان لابن عثيمين"],["f","كفارة الجماع في نهار رمضان","عتق رقبة، فإن لم يجد فصيام شهرين متتابعين، فإن لم يستطع فإطعام ستين مسكينًا، مع قضاء ذلك اليوم.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ما حكم من أكل أو شرب ناسيًا وهو صائم؟","صومه صحيح ولا قضاء عليه، لقوله ﷺ: «من نسي وهو صائم فأكل أو شرب فليتم صومه فإنما أطعمه الله وسقاه».","صحيح البخاري ومسلم"],["q","ما أنواع النسك في الحج؟","ثلاثة: التمتع، وهو عمرة ثم حج في عام واحد مع هدي. والقران، أي الإحرام بهما معًا مع هدي. والإفراد، أي الإحرام بالحج وحده بلا هدي.","صحيح مسلم (حديث عائشة)؛ المغني لابن قدامة"],["q","ما واجبات الحج؟","عند الحنابلة سبعة: الإحرام من الميقات، والوقوف بعرفة إلى الغروب لمن وقف نهارًا، والمبيت بمزدلفة، والمبيت بمنى ليالي التشريق، ورمي الجمار، والحلق أو التقصير، وطواف الوداع.","الروض المربع؛ المغني لابن قدامة"],["f","مواقيت الحج المكانية","خمسة: ذو الحليفة لأهل المدينة، والجحفة لأهل الشام، وقرن المنازل لأهل نجد، ويلملم لأهل اليمن، وذات عرق لأهل العراق.","صحيح البخاري ومسلم (حديث ابن عباس)"],["q","ما محظورات الإحرام؟","حلق الشعر، وتقليم الأظفار، والطيب، وتغطية الرأس للرجل، ولبس المخيط للرجل، وقتل الصيد، وعقد النكاح، والجماع، والمباشرة. وتمنع المرأة من النقاب والقفازين.","صحيح البخاري؛ الروض المربع"],["f","أركان النكاح","ثلاثة عند الحنابلة: الزوجان الخاليان من الموانع، والإيجاب من الولي، والقبول من الزوج. ومن شروطه الولي والشاهدان ورضا الزوجين.","الروض المربع؛ المغني لابن قدامة"],["q","ما الفرق بين الطلاق الرجعي والبائن؟","الرجعي: يجوز للزوج إرجاع زوجته في العدة دون عقد جديد. البائن بينونة صغرى: بعد انتهاء العدة يحتاج عقدًا ومهرًا جديدين. والبائن بينونة كبرى: بعد الطلقة الثالثة لا تحل له حتى تنكح زوجًا غيره.","سورة البقرة 229–230؛ المغني لابن قدامة"],["f","عدة المتوفى عنها زوجها","أربعة أشهر وعشرة أيام لغير الحامل، والحامل عدتها وضع الحمل.","سورة البقرة 234؛ سورة الطلاق 4"],["q","ما عدة المطلقة؟","ثلاثة قروء لمن تحيض، وثلاثة أشهر للصغيرة والآيسة، ووضع الحمل للحامل.","سورة البقرة 228؛ سورة الطلاق 4"],["f","الربا نوعان","ربا الفضل: زيادة في مبادلة جنس ربوي بجنسه، كذهب بذهب متفاضلًا. وربا النسيئة: تأخير القبض فيما يشترط فيه التقابض. والأصناف الستة المنصوصة: الذهب والفضة والبر والشعير والتمر والملح.","صحيح مسلم (حديث عبادة بن الصامت)"],["q","ما شروط البيع؟","سبعة عند الحنابلة: التراضي، وأهلية المتعاقدين، وأن يكون المبيع مالًا مباحًا، ومملوكًا للبائع أو مأذونًا له فيه، ومقدورًا على تسليمه، ومعلومًا، والثمن معلومًا.","الروض المربع؛ زاد المستقنع"],["f","خيار المجلس","لكل من البائع والمشتري حق فسخ البيع ما داما في مجلس العقد لم يتفرقا، لحديث «البيّعان بالخيار ما لم يتفرقا». وهو مذهب الشافعية والحنابلة.","صحيح البخاري ومسلم"],["q","ما الفرق بين الهبة والوصية؟","الهبة تمليك في الحياة تنفذ في الحال. والوصية تمليك مضاف لما بعد الموت، ولا تجوز لوارث، ولا تزيد على الثلث إلا بإجازة الورثة.","صحيح البخاري (حديث سعد)؛ سنن الترمذي «لا وصية لوارث»"],["f","أصحاب الفروض في الميراث","من يرثون بنصيب محدد في القرآن، وهي ستة فروض: النصف، والربع، والثمن، والثلثان، والثلث، والسدس.","سورة النساء 11–12 و176"],["q","ما نصيب الزوجة من الميراث؟","الربع إن لم يكن للزوج ولد، والثمن إن كان له ولد منها أو من غيرها. وإن تعددت الزوجات اشتركن فيه.","سورة النساء، الآية 12"],["f","حكم الأضحية","سنة مؤكدة عند الجمهور، وواجبة على القادر عند الحنفية. ووقت ذبحها من بعد صلاة العيد إلى آخر أيام التشريق على الراجح.","المغني لابن قدامة؛ صحيح البخاري"],["q","ما أقل سن للأضحية؟","الجذع من الضأن ما أتم ستة أشهر، والثني من المعز سنة، ومن البقر سنتان، ومن الإبل خمس سنين.","صحيح مسلم؛ الروض المربع"],["f","الأيمان ثلاثة أنواع","اللغو: ما يجري على اللسان بلا قصد، ولا كفارة فيه. والغموس: الحلف كذبًا عمدًا، وهي من الكبائر. والمنعقدة: على أمر مستقبل، وفيها الكفارة إن حنث.","سورة المائدة 89؛ المغني لابن قدامة"],["q","ما كفارة اليمين؟","إطعام عشرة مساكين، أو كسوتهم، أو تحرير رقبة. فمن لم يجد فصيام ثلاثة أيام.","سورة المائدة، الآية 89"],["q","ما سنن الوضوء؟","منها: التسمية، والسواك، وغسل الكفين ثلاثًا في أوله، والمبالغة في المضمضة والاستنشاق لغير الصائم، وتخليل اللحية والأصابع، والتيامن، والغسلة الثانية والثالثة، والدعاء بعده.","الروض المربع؛ عمدة الفقه"],["f","الدعاء بعد الوضوء","«أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمدًا عبده ورسوله»، ومن قالها فُتحت له أبواب الجنة الثمانية يدخل من أيها شاء.","صحيح مسلم (حديث عمر)"],["q","ما حكم قراءة الفاتحة للمأموم؟","فيها خلاف: الشافعية يوجبونها في كل الصلوات، والحنابلة والمالكية يرون أن قراءة الإمام تكفي في الجهرية وتستحب في السرية، والحنفية لا يرونها للمأموم.","المغني لابن قدامة؛ المجموع للنووي"],["f","سجود التلاوة","سنة للقارئ والمستمع عند الجمهور، وعدد مواضعه في المصحف 15 موضعًا على المشهور عند الحنابلة.","المغني لابن قدامة"],["q","ما الصلاة التي لا ركوع فيها ولا سجود؟","صلاة الجنازة.","الروض المربع"],["f","صلاة الاستخارة","ركعتان من غير الفريضة ثم الدعاء المأثور: «اللهم إني أستخيرك بعلمك وأستقدرك بقدرتك...» ويذكر حاجته.","صحيح البخاري (حديث جابر)"],["q","كم ركعة صلاة الوتر؟","أقلها ركعة واحدة، وأكثرها إحدى عشرة ركعة على الصحيح، وأدنى الكمال ثلاث.","صحيح البخاري ومسلم؛ الروض المربع"],["f","السنن الرواتب","عشر ركعات في حديث ابن عمر: ركعتان قبل الظهر وركعتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل الفجر. وفي حديث أم حبيبة ثنتا عشرة بجعل أربع قبل الظهر.","صحيح البخاري؛ صحيح مسلم"],["q","ما آكد السنن الرواتب؟","ركعتا الفجر، قال ﷺ: «ركعتا الفجر خير من الدنيا وما فيها». رواه مسلم.","صحيح مسلم (حديث عائشة)"],["f","صلاة الضحى","وقتها من ارتفاع الشمس قيد رمح إلى قبيل الزوال، وأفضلها حين ترمض الفصال أي يشتد الحر. وأقلها ركعتان.","صحيح مسلم؛ زاد المعاد"],["q","ما شروط صحة صلاة الجمعة؟","دخول الوقت، وأن تكون في قرية مستوطنة، وأن يحضرها العدد المعتبر (أربعون عند الحنابلة والشافعية، وخلاف لغيرهم)، وأن يتقدمها خطبتان.","الروض المربع؛ المغني"],["f","الإنصات للخطبة","يجب الإنصات في خطبة الجمعة، قال ﷺ: «إذا قلت لصاحبك يوم الجمعة أنصت والإمام يخطب فقد لغوت».","صحيح البخاري ومسلم"],["q","ما حكم الجمع بين الصلاتين للمطر؟","يجوز الجمع بين المغرب والعشاء للمطر الذي يبل الثياب عند الحنابلة والمالكية والشافعية، وفي الظهر والعصر خلاف.","المغني لابن قدامة"],["f","صلاة الكسوف","سنة مؤكدة، ركعتان في كل ركعة ركوعان وقيامان وقراءتان طويلتان، كما صلاها النبي ﷺ.","صحيح البخاري ومسلم (حديث عائشة)"],["q","متى تجب زكاة عروض التجارة؟","إذا بلغت قيمتها نصاب الذهب أو الفضة وحال عليها الحول، فتُقوّم بسعر السوق في نهاية الحول ويخرج ربع العشر.","المغني لابن قدامة؛ فتاوى اللجنة الدائمة"],["f","زكاة الدَّين","الدين على مليء باذل يُزكى كل سنة عند الجمهور أو عند قبضه لما مضى، والدين على معسر أو جاحد يُزكى إذا قُبض لسنة واحدة على قول.","المغني لابن قدامة؛ الشرح الممتع"],["q","ما حكم زكاة الحلي الملبوس؟","خلاف مشهور: الجمهور (المالكية والشافعية والحنابلة) لا يوجبونها في الحلي المعد للاستعمال، والحنفية يوجبونها، ورجّح الوجوب الشيخ ابن باز والشيخ ابن عثيمين.","المغني؛ فتاوى ابن باز"],["f","من يُباح لهم الفطر في رمضان","المريض، والمسافر، والحامل والمرضع إذا خافتا، والكبير العاجز. والأخير يطعم عن كل يوم مسكينًا ولا قضاء عليه.","سورة البقرة 184–185؛ المغني"],["q","ما حكم السحور؟","سنة مؤكدة، قال ﷺ: «تسحروا فإن في السحور بركة». ويستحب تأخيره وتعجيل الفطر.","صحيح البخاري ومسلم"],["f","الاعتكاف","لزوم المسجد لطاعة الله، وأفضله في العشر الأواخر من رمضان، ولا يصح إلا في مسجد تقام فيه الجماعة للرجل.","صحيح البخاري؛ المغني"],["q","ما الفرق بين العمرة والحج في الأركان؟","أركان العمرة ثلاثة عند الحنابلة: الإحرام، والطواف، والسعي. والحج يزيد عليها الوقوف بعرفة.","الروض المربع"],["f","طواف الوداع","واجب على الحاج عند الجمهور قبل خروجه من مكة، ويسقط عن الحائض والنفساء.","صحيح البخاري ومسلم (حديث ابن عباس)"],["q","ما الهدي والفدية في الحج؟","الهدي: ما يذبحه المتمتع والقارن شكرًا. والفدية: تجب بفعل محظور أو ترك واجب، كذبح شاة أو صيام أو إطعام حسب نوع المخالفة.","المغني؛ سورة البقرة 196"],["f","العقيقة","سنة مؤكدة عند الجمهور: شاتان عن الغلام وشاة عن الجارية، تُذبح في اليوم السابع، ويُسمى فيه المولود ويحلق رأسه.","سنن الترمذي وأبي داود؛ زاد المعاد"],["q","ما حكم الوشم والنمص؟","محرمان، لحديث «لعن الله الواشمات والمستوشمات والنامصات والمتنمصات والمتفلجات للحسن المغيرات خلق الله». متفق عليه.","صحيح البخاري ومسلم (حديث ابن مسعود)"],["f","آداب الطعام","التسمية في أوله، والأكل باليمين، ومما يليه، والحمد في آخره. ومن نسي التسمية قال: «بسم الله أوله وآخره».","صحيح البخاري ومسلم؛ سنن أبي داود"],["q","ما حكم الأكل من ذبائح أهل الكتاب؟","حلال إذا ذُكّيت ذكاة شرعية، لقوله تعالى: ﴿وَطَعَامُ الَّذِينَ أُوتُوا الْكِتَابَ حِلٌّ لَّكُمْ﴾.","سورة المائدة 5؛ المغني"],["f","شروط الذكاة","أن يكون الذابح عاقلًا مسلمًا أو كتابيًا، وأن تكون الآلة محددة تنهر الدم، وقطع الحلقوم والمريء، والتسمية عند الذبح.","الروض المربع؛ المغني"],["q","ما حكم اللقطة؟","يعرّفها الملتقط سنة كاملة في مجامع الناس، فإن جاء صاحبها دفعها إليه، وإلا ملكها مع الضمان إن جاء صاحبها بعد ذلك. والشيء التافه لا يعرّف.","صحيح البخاري ومسلم (حديث زيد بن خالد)"],["f","الوقف","حبس الأصل وتسبيل المنفعة، وأصله حديث عمر لما أصاب أرضًا بخيبر فقال له النبي ﷺ: «إن شئت حبست أصلها وتصدقت بها».","صحيح البخاري ومسلم"]],"general":[["q","كم عدد حروف الهجاء العربية؟","28 حرفًا، وبعض اللغويين يعدها 29 بإضافة الهمزة حرفًا مستقلًا.","الكتاب لسيبويه؛ مجمع اللغة العربية بالقاهرة"],["f","أكثر اللغات تحدثًا","الإنجليزية أكثر لغة متحدثة إجمالًا مع المتعلمين، والماندرين الصينية أكثر لغة أم. والعربية من أكثر عشر لغات انتشارًا، ويتحدثها نحو 400 مليون.","Ethnologue 2024"],["q","متى اليوم العالمي للغة العربية؟","18 ديسمبر من كل عام، وهو اليوم الذي اعتُمدت فيه العربية لغة رسمية في الأمم المتحدة عام 1973.","اليونسكو؛ الأمم المتحدة"],["f","اللغات الرسمية في الأمم المتحدة","ست لغات: العربية، والصينية، والإنجليزية، والفرنسية، والروسية، والإسبانية.","الأمم المتحدة (un.org)"],["q","من صاحب أول معجم عربي؟","الخليل بن أحمد الفراهيدي، ألّف «كتاب العين» ورتبه حسب مخارج الحروف، وبدأ بحرف العين لأنه أعمقها مخرجًا عنده.","كتاب العين للخليل؛ المعجم العربي لحسين نصار"],["f","أكبر معجم عربي قديم","«لسان العرب» لابن منظور (ت 711هـ)، فيه نحو 80 ألف مادة، وجمع فيه خمسة معاجم سابقة.","لسان العرب؛ Britannica"],["q","من هو سيبويه؟","عالم النحو الأشهر عمرو بن عثمان (ت 180هـ تقريبًا)، فارسي الأصل، صاحب «الكتاب» أقدم كتاب نحو عربي متكامل وصلنا.","سير أعلام النبلاء؛ Britannica"],["f","المعلقات","قصائد جاهلية طويلة تُعد من أجود الشعر العربي، أشهرها معلقة امرئ القيس «قفا نبك من ذكرى حبيب ومنزل». واختُلف في عددها بين سبع وعشر.","شرح المعلقات السبع للزوزني"],["q","من لُقّب بأمير الشعراء؟","أحمد شوقي، الشاعر المصري، بويع بلقب أمير الشعراء عام 1927.","Britannica"],["f","المتنبي","أبو الطيب أحمد بن الحسين المتنبي (ت 354هـ)، من أعظم شعراء العربية، ومن أبياته: «الخيل والليل والبيداء تعرفني ... والسيف والرمح والقرطاس والقلم».","ديوان المتنبي؛ Britannica"],["q","من أول عربي نال جائزة نوبل في الأدب؟","نجيب محفوظ عام 1988، وهو العربي الوحيد الذي نالها في الأدب حتى الآن.","مؤسسة نوبل (NobelPrize.org)"],["f","ألف ليلة وليلة","مجموعة حكايات شعبية جُمعت عبر قرون من أصول فارسية وهندية وعربية، وترجمها أنطوان غالان إلى الفرنسية أوائل القرن الثامن عشر. وقصتا علاء الدين وعلي بابا أضافهما غالان ولا توجد في المخطوطات العربية القديمة المعروفة.","Britannica؛ Irwin R., The Arabian Nights: A Companion"],["q","من مؤلف «كليلة ودمنة» بالعربية؟","عبدالله بن المقفع، ترجمه من الفارسية في القرن الثاني الهجري، وأصله هندي يسمى «البانجاتنترا».","Britannica"],["f","الجاحظ","أبو عثمان عمرو بن بحر الجاحظ (ت 255هـ)، من أعلام الأدب العربي، صاحب «البيان والتبيين» و«الحيوان» و«البخلاء».","Britannica؛ سير أعلام النبلاء"],["q","من هو أبو الجراحة؟","أبو القاسم الزهراوي الأندلسي (ت نحو 404هـ/1013م)، صاحب كتاب «التصريف لمن عجز عن التأليف»، ووصف فيه أكثر من 200 أداة جراحية.","Britannica"],["f","الرازي","أبو بكر الرازي (ت 313هـ)، طبيب وكيميائي، أول من فرّق بين الجدري والحصبة في رسالة مستقلة، وصاحب «الحاوي» في الطب.","Britannica"],["q","من هو جابر بن حيان؟","عالم كيمياء في القرن الثاني الهجري، يُنسب إليه تطوير عمليات التقطير والتبلور. وتُنسب إليه كتب كثيرة يرى بعض المؤرخين أن أغلبها كُتب بعده.","Britannica"],["f","البيروني","أبو الريحان البيروني (ت 440هـ تقريبًا) حسب نصف قطر الأرض بدقة قريبة من القياس الحديث باستخدام قمة جبل والأفق.","Britannica"],["q","ما أول جامعة سعودية؟","جامعة الملك سعود في الرياض، تأسست عام 1377هـ (1957م).","جامعة الملك سعود"],["f","عملة السعودية","الريال السعودي، ومثبت أمام الدولار الأمريكي بسعر 3.75 ريال للدولار منذ عام 1986.","البنك المركزي السعودي (ساما)"],["q","ما أطول برج في العالم؟","برج خليفة في دبي بارتفاع 828 مترًا منذ 2010. ويُبنى في جدة «برج جدة» المصمم ليتجاوز ألف متر.","Council on Tall Buildings and Urban Habitat (CTBUH)"],["f","ساعة مكة","برج الساعة في مكة المكرمة فيه أكبر واجهة ساعة في العالم، قطرها 43 مترًا، وارتفاع البرج نحو 601 متر.","CTBUH؛ موسوعة غينيس"],["q","كم ثانية في اليوم؟","86,400 ثانية.","الحساب المباشر: 24 × 60 × 60"],["f","السنة الكبيسة","تضاف فيها يوم 29 فبراير كل 4 سنوات تقريبًا، لأن السنة الشمسية نحو 365.2422 يوم. وتُستثنى السنوات المئوية إلا إذا قبلت القسمة على 400، كسنة 2000.","المرصد الملكي غرينتش؛ Britannica"],["q","لماذا سُمّي شهر رمضان بهذا الاسم؟","من «الرمضاء» وهي شدة الحر، لأنه وافق عند تسمية الشهور زمن الحر.","لسان العرب لابن منظور"],["f","أسماء الأيام","«الأحد» من الواحد لأنه أول أيام الأسبوع عند العرب، ثم الاثنين والثلاثاء والأربعاء والخميس على العدد، و«الجمعة» لاجتماع الناس فيها، و«السبت» من السَّبْت بمعنى القطع والراحة.","لسان العرب لابن منظور"],["q","ما أكثر رياضة شعبية في العالم؟","كرة القدم، ويتابعها نحو 3.5 إلى 4 مليارات مشجع حسب تقديرات الفيفا.","الاتحاد الدولي لكرة القدم (FIFA)"],["f","أول كأس عالم","أُقيمت في الأوروغواي عام 1930 وفازت بها الأوروغواي. وتستضيف السعودية كأس العالم 2034.","الاتحاد الدولي لكرة القدم (FIFA)"],["q","ما أول مشاركة سعودية في كأس العالم؟","كأس العالم 1994 في الولايات المتحدة، ووصل المنتخب السعودي لدور الـ16، وسجل فيها سعيد العويران هدفه الشهير ضد بلجيكا.","الاتحاد الدولي لكرة القدم (FIFA)"],["f","فوز السعودية على الأرجنتين","في كأس العالم 2022 بقطر فازت السعودية على الأرجنتين 2–1 في 22 نوفمبر، وهي من أكبر المفاجآت في تاريخ البطولة، وكانت الأرجنتين البطل لاحقًا.","الاتحاد الدولي لكرة القدم (FIFA)"],["q","ما الألعاب الأولمبية الحديثة؟","أعاد إحياءها الفرنسي بيير دي كوبرتان، وأقيمت أول دورة في أثينا عام 1896.","اللجنة الأولمبية الدولية (olympics.com)"],["f","الحلقات الأولمبية الخمس","ترمز إلى القارات الخمس المأهولة المتحدة في الرياضة، وصممها بيير دي كوبرتان عام 1913.","اللجنة الأولمبية الدولية"],["q","ما أول شركة تجاوزت قيمتها السوقية تريليوني دولار؟","أرامكو السعودية عند طرحها في السوق في ديسمبر 2019، لفترة قصيرة، وتلتها أبل وغيرها.","Reuters؛ تداول السعودية"],["f","الإنترنت","بدأ أصله بشبكة «أربانت» العسكرية الأمريكية عام 1969، وابتكر تيم بيرنرز لي «الشبكة العنكبوتية العالمية» (www) عام 1989 في سيرن.","CERN؛ Britannica"],["q","متى أُرسلت أول رسالة بريد إلكتروني؟","أرسلها راي توملينسون عام 1971، وهو من اختار علامة @ لفصل اسم المستخدم عن اسم الجهاز.","Britannica؛ Smithsonian"],["f","أول جوال","أجرى مارتن كوبر من شركة موتورولا أول مكالمة من جوال محمول في 3 أبريل 1973 في نيويورك.","Britannica"],["q","من اخترع المصباح الكهربائي؟","طوره عدد من المخترعين، أشهرهم توماس إديسون الذي صنع عام 1879 مصباحًا عمليًا يدوم طويلًا، وسبقه جوزيف سوان في بريطانيا بنموذج مشابه.","Britannica؛ Smithsonian"],["q","من اخترع الهاتف؟","يُنسب لألكسندر غراهام بيل الذي حصل على براءة اختراعه عام 1876، مع جدل تاريخي حول إسهام أنطونيو ميوتشي وإليشا غراي.","Britannica؛ مكتبة الكونغرس"],["f","الأخوان رايت","أول طيران بمحرك يمكن التحكم فيه، في 17 ديسمبر 1903، استمر 12 ثانية وقطع نحو 37 مترًا.","Smithsonian National Air and Space Museum"],["q","ما أول طائرة نفاثة تجارية؟","دي هافيلاند كوميت البريطانية، بدأت رحلاتها عام 1952.","Britannica"],["f","الخطوط السعودية","تأسست عام 1945 بطائرة داكوتا DC-3 أهداها الرئيس الأمريكي روزفلت للملك عبدالعزيز.","الخطوط الجوية العربية السعودية"],["q","ما أقدم مكتبة باقية في العالم؟","مكتبة جامعة القرويين في فاس، تأسست مع الجامع سنة 859م، وأعيد ترميمها وافتتاحها عام 2016.","اليونسكو؛ Britannica"],["f","مكتبة الإسكندرية القديمة","من أعظم مكتبات العالم القديم في عهد البطالمة، واندثرت تدريجيًا. وافتُتحت مكتبة الإسكندرية الجديدة عام 2002.","Britannica؛ مكتبة الإسكندرية"],["q","ما أكثر كتاب طُبع في التاريخ بعد الكتب الدينية؟","لا يوجد رقم مؤكد، وتذكر التقديرات أن «دون كيخوته» و«قصة مدينتين» و«الأمير الصغير» من أكثر الكتب مبيعًا بعشرات الملايين.","موسوعة غينيس؛ Britannica"],["f","أول رواية عرب
