,"رواه ابن ماجه والدارقطني وغيرهما، وحسّنه النووي، وصار قاعدة فقهية كبرى: الضرر يُزال.","سنن ابن ماجه؛ جامع العلوم والحكم لابن رجب"],["f","حديث «إذا مات ابن آدم»","قال ﷺ: «إذا مات الإنسان انقطع عنه عمله إلا من ثلاثة: إلا من صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له». رواه مسلم.","صحيح مسلم (حديث أبي هريرة)"],["q","ما حديث «السبعة الذين يظلهم الله»؟","إمام عادل، وشاب نشأ في عبادة الله، ورجل قلبه معلق بالمساجد، ورجلان تحابا في الله، ورجل دعته امرأة ذات منصب وجمال فقال إني أخاف الله، ورجل تصدق بصدقة فأخفاها، ورجل ذكر الله خاليًا ففاضت عيناه. متفق عليه.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["f","حديث الكبائر السبع","قال ﷺ: «اجتنبوا السبع الموبقات»: الشرك بالله، والسحر، وقتل النفس التي حرم الله إلا بالحق، وأكل الربا، وأكل مال اليتيم، والتولي يوم الزحف، وقذف المحصنات الغافلات المؤمنات. متفق عليه.","صحيح البخاري ومسلم (حديث أبي هريرة)"],["q","ما معنى «صحيح على شرط الشيخين»؟","أن رجال الإسناد ممن روى لهم البخاري ومسلم في صحيحيهما بالطريقة نفسها، ولم يخرجاه. ويكثر هذا الوصف في «المستدرك» للحاكم.","تدريب الراوي للسيوطي"],["f","أطول حديث في صحيح البخاري","من أطولها حديث كعب بن مالك في قصة تخلفه عن غزوة تبوك وتوبة الله عليه.","صحيح البخاري، كتاب المغازي"],["q","ما علم «العلل»؟","علم يبحث في الأسباب الخفية القادحة في صحة الحديث مع أن ظاهره السلامة، وهو أدق علوم الحديث، ومن كتبه «العلل» للدارقطني و«علل الحديث» لابن أبي حاتم.","مقدمة ابن الصلاح"],["f","الإسناد من الدين","قال عبدالله بن المبارك: «الإسناد من الدين، ولولا الإسناد لقال من شاء ما شاء». رواه مسلم في مقدمة صحيحه.","مقدمة صحيح مسلم"],["q","ما «الصحيفة الصادقة»؟","صحيفة كتبها عبدالله بن عمرو بن العاص من حديث النبي ﷺ في حياته بإذنه، وهي من أقدم ما دُوّن من الحديث.","سنن أبي داود؛ تقييد العلم للخطيب البغدادي"],["f","تدوين السنة رسميًا","أمر الخليفة عمر بن عبدالعزيز (ت 101هـ) بجمع الحديث وتدوينه رسميًا خشية ضياعه، وكتب بذلك إلى أبي بكر بن حزم والإمام الزهري.","صحيح البخاري (كتاب العلم، معلقًا)؛ فتح الباري"]],"history":[["f","بداية التاريخ الهجري","جعل عمر بن الخطاب رضي الله عنه هجرة النبي ﷺ بداية للتقويم الإسلامي سنة 17هـ تقريبًا بمشورة الصحابة، وجعلوا أول السنة شهر المحرم.","تاريخ الطبري؛ البداية والنهاية لابن كثير"],["q","متى فُتحت مكة؟","في رمضان من السنة الثامنة للهجرة (630م)، ودخلها النبي ﷺ بعشرة آلاف من أصحابه، وعفا عن أهلها.","سيرة ابن هشام؛ صحيح البخاري"],["f","معركة اليرموك","وقعت سنة 15هـ (636م) بقيادة خالد بن الوليد ثم أبي عبيدة بن الجراح ضد الروم البيزنطيين، وفتحت الشام للمسلمين.","تاريخ الطبري؛ فتوح البلدان للبلاذري"],["q","ما معركة القادسية؟","معركة بين المسلمين بقيادة سعد بن أبي وقاص والفرس الساسانيين سنة 15هـ تقريبًا (636م)، قُتل فيها قائد الفرس رستم، وفتحت العراق.","تاريخ الطبري"],["f","فتح الأندلس","عبر طارق بن زياد المضيق سنة 92هـ (711م)، فسُمّي الجبل باسمه «جبل طارق»، ثم لحقه موسى بن نصير.","نفح الطيب للمقري؛ Britannica"],["q","من مؤسس الدولة الأموية؟","معاوية بن أبي سفيان رضي الله عنه سنة 41هـ (661م)، وجعل دمشق عاصمة لها، واستمرت حتى 132هـ.","تاريخ الطبري؛ البداية والنهاية"],["f","سقوط الدولة الأموية وقيام العباسية","سقطت الدولة الأموية سنة 132هـ (750م) بعد معركة الزاب، وقامت الدولة العباسية وأول خلفائها أبو العباس السفاح، ونجا عبدالرحمن الداخل إلى الأندلس وأسس فيها دولة أموية.","تاريخ الطبري؛ Britannica"],["q","من بنى مدينة بغداد؟","الخليفة العباسي أبو جعفر المنصور، بدأ بناءها سنة 145هـ (762م) وسماها «مدينة السلام»، وكانت مدورة الشكل.","تاريخ بغداد للخطيب البغدادي"],["f","سقوط بغداد بيد المغول","دخل هولاكو بغداد سنة 656هـ (1258م)، وقتل الخليفة المستعصم بالله، وانتهت الخلافة العباسية في بغداد، ودُمرت مكتباتها.","البداية والنهاية لابن كثير؛ Britannica"],["q","من حرر القدس من الصليبيين؟","صلاح الدين الأيوبي بعد انتصاره في معركة حطين، ودخل القدس في 27 رجب 583هـ (2 أكتوبر 1187م).","النوادر السلطانية لابن شداد؛ Britannica"],["f","فتح القسطنطينية","فتحها السلطان العثماني محمد الثاني (الفاتح) في 20 جمادى الأولى 857هـ (29 مايو 1453م)، وكان عمره نحو 21 سنة، وأنهى الدولة البيزنطية.","Britannica؛ تاريخ الدولة العلية العثمانية لمحمد فريد بك"],["q","متى أُلغيت الخلافة العثمانية؟","ألغاها المجلس الوطني التركي في 3 مارس 1924م، بعد إلغاء السلطنة عام 1922.","Britannica"],["f","الدولة السعودية الأولى","أسسها الإمام محمد بن سعود حين تولى الحكم في الدرعية سنة 1139هـ (1727م)، ثم تحالف مع الشيخ محمد بن عبدالوهاب سنة 1157هـ (1744م)، وانتهت سنة 1233هـ (1818م) بسقوط الدرعية.","دارة الملك عبدالعزيز"],["q","متى يوم التأسيس في السعودية؟","22 فبراير من كل عام، ذكرى تأسيس الإمام محمد بن سعود للدولة السعودية الأولى عام 1727م، وأُقرّ بأمر ملكي عام 2022.","دارة الملك عبدالعزيز؛ الأمر الملكي (أ/371) 1443هـ"],["f","الدولة السعودية الثانية","أسسها الإمام تركي بن عبدالله سنة 1240هـ (1824م) وجعل الرياض عاصمتها، وانتهت سنة 1309هـ (1891م).","دارة الملك عبدالعزيز"],["q","متى اكتُشف النفط في السعودية؟","في بئر الدمام رقم 7 عام 1938م، بعد سنوات من الحفر، وكانت بداية الإنتاج التجاري للنفط في المملكة.","أرامكو السعودية"],["f","الحضارة السومرية","يُعد السومريون في جنوب العراق أصحاب أقدم كتابة معروفة، وهي الكتابة المسمارية، نحو 3200 قبل الميلاد.","Britannica؛ The British Museum"],["q","ما أقدم قانون مكتوب معروف كاملًا تقريبًا؟","شريعة حمورابي ملك بابل، نحو 1754 قبل الميلاد، فيها 282 مادة منقوشة على مسلة محفوظة في متحف اللوفر.","متحف اللوفر؛ Britannica"],["f","الأهرامات","هرم خوفو الأكبر في الجيزة بني نحو 2560 قبل الميلاد، وكان أعلى بناء صنعه الإنسان لنحو 3800 سنة، وهو الوحيد الباقي من عجائب الدنيا السبع القديمة.","Britannica؛ اليونسكو"],["q","من فك رموز الهيروغليفية؟","الفرنسي جان فرانسوا شامبليون عام 1822م، اعتمادًا على حجر رشيد الذي يحمل النص نفسه بالهيروغليفية والديموطيقية واليونانية.","المتحف البريطاني"],["f","مدائن صالح (الحِجر)","أول موقع سعودي يُسجَّل في قائمة اليونسكو للتراث العالمي عام 2008، وفيه أكثر من 100 مقبرة منحوتة في الصخر من الحضارة النبطية.","اليونسكو"],["q","ما حضارة الأنباط؟","حضارة عربية ازدهرت بين القرن الرابع قبل الميلاد والقرن الأول الميلادي، عاصمتها البتراء في الأردن، ومن مدنها الحِجر في العلا، وأتقنوا نحت الصخر وإدارة المياه.","اليونسكو؛ Britannica"],["f","الحرب العالمية الأولى","بدأت عام 1914 بعد اغتيال ولي عهد النمسا فرانز فرديناند في سراييفو، وانتهت عام 1918، وقُتل فيها نحو 15 إلى 20 مليون إنسان.","Britannica؛ Imperial War Museum"],["q","متى بدأت الحرب العالمية الثانية وانتهت؟","بدأت في 1 سبتمبر 1939 بغزو ألمانيا لبولندا، وانتهت في 2 سبتمبر 1945 باستسلام اليابان. وهي أكثر الحروب دموية، بأكثر من 60 مليون قتيل.","Britannica؛ National WWII Museum"],["f","القنبلة الذرية","أُلقيت أول قنبلة ذرية على هيروشيما في 6 أغسطس 1945، والثانية على ناغازاكي في 9 أغسطس، وهما الاستخدام الوحيد للسلاح النووي في الحروب.","Britannica"],["q","متى سقط جدار برلين؟","في 9 نوفمبر 1989م، وتوحدت ألمانيا رسميًا في 3 أكتوبر 1990م.","Britannica"],["f","تفكك الاتحاد السوفيتي","انتهى رسميًا في 26 ديسمبر 1991م، وانقسم إلى 15 دولة مستقلة.","Britannica"],["q","متى وصل الإنسان إلى القمر؟","في 20 يوليو 1969م بمركبة أبولو 11، وكان نيل آرمسترونغ أول من مشى عليه، ثم باز ألدرين.","وكالة ناسا (NASA)"],["f","أول رائد فضاء عربي ومسلم","الأمير سلطان بن سلمان بن عبدالعزيز، شارك في رحلة المكوك ديسكفري في يونيو 1985م.","وكالة ناسا (NASA)؛ هيئة الفضاء السعودية"],["q","من أول إنسان صعد إلى الفضاء؟","السوفيتي يوري غاغارين في 12 أبريل 1961م على المركبة فوستوك 1، ودار حول الأرض مرة واحدة في نحو 108 دقائق.","Britannica؛ ESA"],["f","الثورة الصناعية","بدأت في بريطانيا في أواخر القرن الثامن عشر، وكان من أبرز محركاتها تحسين جيمس واط للمحرك البخاري عام 1769م.","Britannica"],["q","متى اختُرعت الطباعة بالحروف المتحركة في أوروبا؟","نحو عام 1440م على يد يوهان غوتنبرغ في ألمانيا، وأول كتاب كبير طبعه كان نحو 1455م.","Britannica"],["f","الصين سبقت بالطباعة","عرفت الصين الطباعة بالألواح الخشبية قبل غوتنبرغ بقرون، وأقدم كتاب مطبوع مؤرخ معروف هو «سوترا الماس» عام 868م، محفوظ في المكتبة البريطانية.","المكتبة البريطانية (British Library)"],["q","ما طريق الحرير؟","شبكة طرق تجارية ربطت الصين بالشرق الأوسط وأوروبا منذ القرن الثاني قبل الميلاد تقريبًا، ونُقل عبرها الحرير والتوابل والورق والأفكار.","اليونسكو؛ Britannica"],["f","الورق انتقل للعالم الإسلامي من الصين","عرف المسلمون صناعة الورق بعد معركة طلاس سنة 751م، وأُسس أول مصنع ورق في بغداد في عهد هارون الرشيد، ومنها انتقل إلى أوروبا عبر الأندلس.","Bloom J., Paper Before Print 2001؛ Britannica"],["q","من أول خليفة عباسي في القاهرة؟","بعد سقوط بغداد أحيا الظاهر بيبرس الخلافة العباسية في القاهرة سنة 659هـ (1261م) بمبايعة المستنصر بالله أحمد، وكانت خلافة رمزية.","البداية والنهاية لابن كثير"],["f","الدولة الأيوبية","أسسها صلاح الدين الأيوبي في مصر سنة 567هـ (1171م) بعد إنهاء الدولة الفاطمية، وامتدت إلى الشام واليمن.","Britannica؛ النوادر السلطانية"],["q","من هو ابن بطوطة؟","رحالة مغربي من طنجة (ت 779هـ/1377م)، قطع نحو 120 ألف كم في نحو 30 سنة، ودوّن رحلته في كتاب «تحفة النظار في غرائب الأمصار».","رحلة ابن بطوطة؛ Britannica"],["f","الإدريسي وخريطة العالم","رسم الشريف الإدريسي سنة 1154م خريطة للعالم لملك صقلية روجر الثاني، مع كتابه «نزهة المشتاق في اختراق الآفاق»، وظلت مرجعًا لقرون.","Britannica؛ المكتبة الوطنية الفرنسية"],["q","متى وصل كولومبوس إلى أمريكا؟","في 12 أكتوبر 1492م، في السنة نفسها التي سقطت فيها غرناطة.","Britannica"],["f","الثورة الفرنسية","بدأت عام 1789م باقتحام سجن الباستيل في 14 يوليو، وأنهت الملكية المطلقة في فرنسا.","Britannica"],["q","متى استقلت الولايات المتحدة؟","أُعلن استقلالها عن بريطانيا في 4 يوليو 1776م، واعترفت بريطانيا به في معاهدة باريس 1783م.","Britannica؛ الأرشيف الوطني الأمريكي"],["f","قناة السويس","افتُتحت عام 1869م، وتربط البحر المتوسط بالبحر الأحمر بطول نحو 193 كم، وأممتها مصر عام 1956م.","هيئة قناة السويس؛ Britannica"],["q","متى افتُتحت قناة بنما؟","عام 1914م، وتربط المحيط الأطلسي بالهادئ بطول نحو 82 كم.","هيئة قناة بنما؛ Britannica"],["f","الإمبراطورية البريطانية","وصلت في ذروتها بعد الحرب العالمية الأولى إلى نحو ربع مساحة اليابسة وربع سكان العالم، ولهذا قيل «الإمبراطورية التي لا تغيب عنها الشمس».","Britannica"]],"law":[["q","كم ساعة العمل الإضافي يُدفع عنها؟","يدفع صاحب العمل للعامل عن ساعات العمل الإضافية أجرًا إضافيًا يوازي أجر الساعة مضافًا إليه 50% من أجره الأساسي.","نظام العمل، المادة 107"],["q","كم مدة إجازة الوضع للمرأة العاملة؟","12 أسبوعًا بأجر كامل حسب نظام العمل بعد تعديلاته، توزعها كيف تشاء بحد أقصى 4 أسابيع قبل التاريخ المرجح للولادة.","نظام العمل، المادة 151 بعد التعديل"],["f","إجازة الزواج والوفاة","يستحق العامل إجازة بأجر كامل 5 أيام عند زواجه، و5 أيام عند وفاة زوجه أو أحد أصوله أو فروعه، وأيامًا عند ولادة مولود له (رُفعت إلى 3 أيام في التعديلات الأخيرة).","نظام العمل، المادة 113"],["q","كم مدة إجازة المرض للعامل؟","30 يومًا بأجر كامل، ثم 60 يومًا بثلاثة أرباع الأجر، ثم 30 يومًا بدون أجر، خلال السنة الواحدة سواء كانت متصلة أو متقطعة.","نظام العمل، المادة 117"],["f","إجازة الحج","يستحق العامل إجازة بأجر كامل لأداء الحج مرة واحدة طوال خدمته، مدتها لا تقل عن 10 أيام ولا تزيد على 15 يومًا، بشرط أن يكون أمضى سنتين متصلتين على الأقل في الخدمة.","نظام العمل، المادة 114"],["q","كم يوم راحة أسبوعية للعامل؟","يوم كامل بأجر على الأقل في الأسبوع، والأصل أن يكون الجمعة، ويجوز إبداله بيوم آخر بعد إبلاغ مكتب العمل.","نظام العمل، المادة 104"],["f","مدة إشعار إنهاء العقد غير المحدد","60 يومًا إذا كان أجر العامل شهريًا، و30 يومًا لغيره، ما لم يتفق على مدة أطول.","نظام العمل، المادة 75"],["q","متى يحق لصاحب العمل فسخ العقد بلا مكافأة؟","في حالات محددة حصرًا، منها: الاعتداء على صاحب العمل أو رؤسائه أثناء العمل، والإخلال بالالتزامات الجوهرية رغم الإنذار، والتزوير للحصول على العمل، والغياب بلا سبب مشروع أكثر من المدد المحددة في النظام بعد الإنذار، وإفشاء أسرار العمل.","نظام العمل، المادة 80"],["f","سن الحدث في العمل","لا يجوز تشغيل من يقل عمره عن 15 سنة، ولا يُسمح بدخولهم أماكن العمل، ويجوز بقرار من الوزير السماح لمن بين 13 و15 سنة بأعمال خفيفة بشروط.","نظام العمل، المادة 162"],["f","قطع الإشارة الحمراء","مخالفة مرورية عقوبتها غرامة من 3000 إلى 6000 ريال، مع إمكانية حجز المركبة، وتُعد من المخالفات الجسيمة.","نظام المرور، جدول المخالفات رقم 6"],["q","ما عقوبة استخدام الجوال أثناء القيادة؟","غرامة من 500 إلى 900 ريال.","نظام المرور، جدول المخالفات؛ الإدارة العامة للمرور"],["f","حزام الأمان","عدم ربط حزام الأمان مخالفة غرامتها من 150 إلى 300 ريال، ويُلزم بها السائق والراكب في المقعد الأمامي.","نظام المرور؛ الإدارة العامة للمرور"],["q","ما عقوبة التفحيط؟","في المرة الأولى: حجز المركبة 15 يومًا وغرامة 20 ألف ريال وإحالة للمحكمة. وتتضاعف في الثانية والثالثة وقد تصل إلى مصادرة المركبة والسجن.","نظام المرور، المادة 69 مكرر"],["f","نظام مكافحة التستر التجاري","يُعاقب المتستر والمتستر عليه بالسجن حتى 5 سنوات، وغرامة حتى 5 ملايين ريال، أو بإحداهما، مع مصادرة الأموال غير المشروعة.","نظام مكافحة التستر (1442هـ)، المادة 9"],["q","ما مدة تقادم الدعاوى العمالية؟","لا تُسمع أمام المحاكم العمالية الدعاوى المتعلقة بالمطالبة بحقوق نظام العمل بعد مضي 12 شهرًا من تاريخ انتهاء علاقة العمل.","نظام العمل، المادة 222"],["f","المحاكم العمالية","بدأت المحاكم العمالية المتخصصة العمل في المملكة عام 1440هـ (2018م)، بعد أن كانت القضايا تُنظر في هيئات تسوية الخلافات العمالية.","وزارة العدل"],["q","ما محكمة الأحوال الشخصية؟","محكمة متخصصة تنظر في قضايا الزواج والطلاق والخلع والنفقة والحضانة والزيارة والإرث وإثبات الوفاة والنسب والوصاية.","نظام المرافعات الشرعية، المادة 33؛ وزارة العدل"],["f","سن الرشد في الأحوال الشخصية","حدد نظام الأحوال الشخصية سن الرشد بتمام 18 سنة هجرية لمن كان عاقلًا غير محجور عليه.","نظام الأحوال الشخصية (1443هـ)"],["q","ما ديوان المظالم؟","جهة القضاء الإداري المستقلة في المملكة، تنظر في الدعاوى ضد الجهات الحكومية، مثل إلغاء القرارات الإدارية ودعاوى التعويض والعقود الإدارية.","نظام ديوان المظالم (1428هـ)"],["f","هيئة التحقيق والادعاء العام صارت النيابة العامة","تحول اسمها إلى «النيابة العامة» بأمر ملكي عام 1438هـ (2017م)، وارتبطت مباشرة بالملك، وتتولى التحقيق في الجرائم والادعاء أمام المحاكم الجزائية.","الأمر الملكي (أ/240) 1438هـ"],["q","ما مدة التوقيف للتحقيق؟","للمحقق توقيف المتهم 5 أيام، ويجوز التمديد بأوامر مسببة حتى 40 يومًا، ثم يحتاج الإحالة للمحكمة أو الإفراج، ولا تتجاوز 6 أشهر إلا بأمر قضائي.","نظام الإجراءات الجزائية، المواد 113 و114"],["f","حق المتهم في محامٍ","للمتهم حق الاستعانة بوكيل أو محامٍ للدفاع عنه في مرحلتي التحقيق والمحاكمة.","نظام الإجراءات الجزائية، المادة 4"],["q","ما عقوبة الشيك بدون رصيد؟","السجن مدة لا تزيد على 5 سنوات، وغرامة لا تزيد على 500 ألف ريال، أو بإحداهما.","نظام الأوراق التجارية، المادة 118"],["f","حماية المستهلك وضمان المنتج","وزارة التجارة تتولى حماية المستهلك، ويحق للمستهلك تقديم البلاغات عبر تطبيق «بلاغ تجاري» أو الرقم 1900.","وزارة التجارة"],["q","ما مدة حق المستهلك في الاستبدال والاسترجاع؟","وفق ضوابط وزارة التجارة: 7 أيام للاسترجاع و15 يومًا للاستبدال من تاريخ الشراء، ما لم يكن المنتج مستخدمًا أو من المستثنيات.","وزارة التجارة — ضوابط الاستبدال والاسترجاع"],["f","نظام التجارة الإلكترونية","صدر عام 1440هـ (2019م)، ويلزم المتاجر الإلكترونية بالإفصاح عن هويتها وعنوانها وتفاصيل المنتج والسعر، ويعطي المستهلك حق فسخ العقد خلال 7 أيام من الاستلام إذا لم يستخدم المنتج.","نظام التجارة الإلكترونية، المادة 13"],["q","ما عقوبة الرشوة؟","السجن حتى 10 سنوات، وغرامة حتى مليون ريال، أو بإحداهما، للموظف العام الذي يطلب أو يقبل رشوة.","نظام مكافحة الرشوة، المادة 1"],["f","هيئة الرقابة ومكافحة الفساد (نزاهة)","تأسست عام 1432هـ (2011م)، ودُمجت معها هيئة الرقابة والتحقيق عام 1441هـ، وتستقبل البلاغات عن الفساد عبر الرقم 980.","هيئة الرقابة ومكافحة الفساد"],["q","ما عقوبة غسل الأموال؟","السجن من 2 إلى 10 سنوات، وغرامة حتى 5 ملايين ريال، أو بإحداهما، وتشدد في حالات منها الجريمة المنظمة.","نظام مكافحة غسل الأموال (1439هـ)، المادة 26"],["f","حماية الطفل","صدر نظام حماية الطفل عام 1436هـ، ويعرّف الطفل بمن لم يتجاوز 18 سنة، ويجرم إيذاءه وإهماله، ويلزم كل من يطلع على حالة إيذاء بالإبلاغ.","نظام حماية الطفل (1436هـ)"],["q","ما رقم الإبلاغ عن العنف الأسري؟","1919، رقم مركز بلاغات العنف الأسري التابع لوزارة الموارد البشرية والتنمية الاجتماعية.","وزارة الموارد البشرية والتنمية الاجتماعية"],["f","نظام الحماية من الإيذاء","صدر عام 1434هـ، ويعاقب على الإيذاء الجسدي أو النفسي أو الجنسي بالسجن من شهر إلى سنة، وغرامة من 5 آلاف إلى 50 ألف ريال، أو بإحداهما.","نظام الحماية من الإيذاء، المادة 13"],["q","ما وثيقة نظام الإثبات؟","نظام صدر عام 1443هـ (2022م) ينظم وسائل الإثبات أمام المحاكم: الإقرار، والاستجواب، والشهادة، والكتابة، والدليل الرقمي، والقرائن، والخبرة، واليمين، والمعاينة.","نظام الإثبات (1443هـ)"],["f","الدليل الرقمي","اعتبر نظام الإثبات الدليل الرقمي، مثل الرسائل الإلكترونية والمحادثات، وسيلة إثبات ذات حجية كالكتابة الرسمية أو العادية بحسب مصدرها.","نظام الإثبات، المواد 53 إلى 58"],["q","ما نظام المعاملات المدنية؟","أول نظام مدني مقنن في المملكة، صدر عام 1444هـ (2023م) وبدأ العمل به في ديسمبر 2023، ينظم العقود والالتزامات والتعويض والملكية.","نظام المعاملات المدنية — هيئة الخبراء بمجلس الوزراء"],["f","الإقامة المميزة","نظام يتيح لغير السعوديين الإقامة الطويلة بمزايا خاصة، أُطلق عام 2019، وتوسع لاحقًا بمنتجات منها إقامة الكفاءات الاستثنائية والموهوبين والمستثمرين.","المركز السعودي للإقامة المميزة"],["q","ما نظام نزع ملكية العقارات للمنفعة العامة؟","يجيز للدولة نزع ملكية عقار للمصلحة العامة مقابل تعويض عادل يقدر بقيمة السوق، ويُصرف قبل الإخلاء.","نظام نزع ملكية العقارات للمنفعة العامة (1424هـ)"]],"medical":[["f","أكبر عضو في جسم الإنسان","الجلد هو أكبر عضو في الجسم، مساحته عند البالغ نحو 1.5 إلى 2 متر مربع، ووزنه نحو 15% من وزن الجسم تقريبًا مع طبقاته.","Gray's Anatomy"],["q","كم عظمة في جسم الإنسان البالغ؟","206 عظمة عند البالغ. ويولد الطفل بنحو 270 إلى 300 عظمة، يلتحم بعضها مع النمو.","Gray's Anatomy"],["f","أصغر عظمة في الجسم","الرِّكاب في الأذن الوسطى هي أصغر عظمة في الجسم، طولها نحو 3 ملم، وتنقل اهتزازات الصوت إلى الأذن الداخلية.","Gray's Anatomy"],["q","ما أطول عظمة في جسم الإنسان؟","عظمة الفخذ، وطولها نحو ربع طول الجسم، وهي أيضًا أقوى عظمة فيه.","Gray's Anatomy"],["f","كمية الدم في الجسم","يحتوي جسم البالغ على نحو 5 لترات من الدم، أي قرابة 7% إلى 8% من وزن الجسم.","Guyton and Hall Textbook of Medical Physiology"],["q","كم يعيش كريّة الدم الحمراء؟","نحو 120 يومًا، ثم يزيلها الطحال والكبد، ويصنع نخاع العظم بدلها باستمرار.","Guyton and Hall Textbook of Medical Physiology"],["f","ما الذي يعطي الدم لونه الأحمر","الهيموغلوبين، وهو بروتين يحتوي على الحديد ويرتبط بالأكسجين وينقله من الرئتين إلى الأنسجة.","Guyton and Hall Textbook of Medical Physiology"],["q","ما معدل نبض القلب الطبيعي للبالغ في الراحة؟","من 60 إلى 100 نبضة في الدقيقة. وقد يكون أقل عند الرياضيين المدربين دون أن يكون مرضًا.","جمعية القلب الأمريكية (AHA)"],["q","ما ضغط الدم الطبيعي؟","أقل من 120/80 ملم زئبق. ويبدأ تشخيص ارتفاع الضغط عند 130/80 فأعلى حسب الإرشادات الأمريكية لعام 2017.","الكلية الأمريكية لأمراض القلب وجمعية القلب الأمريكية (ACC/AHA) 2017"],["f","الرقم الأعلى والأدنى في ضغط الدم","الرقم الأعلى (الانقباضي) هو الضغط وقت انقباض القلب، والأدنى (الانبساطي) هو الضغط وقت ارتخائه بين النبضات.","جمعية القلب الأمريكية (AHA)"],["q","ما معدل السكر الطبيعي في الدم وأنت صائم؟","من 70 إلى 99 ملغم/دسل. ومن 100 إلى 125 يعد مرحلة ما قبل السكري، و126 فأكثر في قياسين يشخَّص سكريًا.","الجمعية الأمريكية للسكري (ADA)"],["f","فحص التراكمي HbA1c","يعطي متوسط السكر في الدم خلال الشهرين أو الثلاثة الماضية تقريبًا، لأن السكر يلتصق بكريات الدم الحمراء طوال عمرها. ويُشخَّص السكري إذا كان 6.5% فأعلى.","الجمعية الأمريكية للسكري (ADA)"],["q","ما الفرق بين السكري من النوع الأول والثاني؟","النوع الأول: الجهاز المناعي يدمر خلايا البنكرياس المنتجة للأنسولين، فيحتاج المريض الأنسولين دائمًا. النوع الثاني: الجسم يقاوم الأنسولين أو لا ينتج ما يكفي، ويرتبط غالبًا بالوزن والوراثة، ويعالج بالغذاء والرياضة والأدوية.","منظمة الصحة العالمية (WHO)"],["f","البنكرياس غدتان في عضو واحد","البنكرياس يفرز الإنزيمات الهاضمة إلى الأمعاء (وظيفة خارجية)، ويفرز الأنسولين والجلوكاغون إلى الدم من جزر لانغرهانس (وظيفة داخلية).","Gray's Anatomy؛ Guyton and Hall"],["q","أين يُمتص معظم الغذاء؟","في الأمعاء الدقيقة، وطولها عند الإنسان نحو 6 إلى 7 أمتار، وجدارها مليء بالزغابات التي تضاعف مساحة الامتصاص.","Gray's Anatomy"],["f","حمض المعدة","حمض المعدة هو حمض الهيدروكلوريك، ودرجة حموضته بين 1.5 و3.5. وتحمي المعدة نفسها منه بطبقة مخاط سميكة تتجدد باستمرار.","Guyton and Hall Textbook of Medical Physiology"],["q","ما البكتيريا المسببة لأغلب قرح المعدة؟","الملوية البوابية (Helicobacter pylori). اكتشف دورها مارشال ووارن، ونالا جائزة نوبل في الطب عام 2005.","مؤسسة نوبل (NobelPrize.org)"],["f","أول مضاد حيوي","اكتشف ألكسندر فلمنج البنسلين عام 1928 مصادفة حين لاحظ أن عفن البنسيليوم قتل البكتيريا في طبق مختبره، ونال نوبل عام 1945 مع فلوري وتشين.","مؤسسة نوبل (NobelPrize.org)"],["q","من اكتشف الدورة الدموية الصغرى (الرئوية)؟","ابن النفيس (ت 687هـ/1288م) وصفها في «شرح تشريح القانون» قبل ويليام هارفي بنحو ثلاثة قرون.","شرح تشريح القانون لابن النفيس؛ Encyclopaedia Britannica"],["f","القانون في الطب","كتاب ابن سينا «القانون في الطب» ظل مرجعًا أساسيًا لتدريس الطب في جامعات أوروبا لعدة قرون بعد ترجمته إلى اللاتينية في القرن الثاني عشر.","Encyclopaedia Britannica"],["q","ما أول لقاح في التاريخ؟","لقاح الجدري الذي طوّره إدوارد جينر عام 1796 باستخدام جدري البقر. وأعلنت منظمة الصحة العالمية القضاء على الجدري عام 1980.","منظمة الصحة العالمية (WHO)"],["f","المرض الوحيد الذي قُضي عليه","الجدري هو المرض البشري الوحيد الذي استُؤصل تمامًا من العالم، وأعلنت ذلك منظمة الصحة العالمية رسميًا عام 1980.","منظمة الصحة العالمية (WHO)"],["q","ما الفرق بين الشريان والوريد؟","الشريان يحمل الدم من القلب إلى الجسم وجداره سميك مرن، والوريد يعيد الدم إلى القلب وفيه صمامات تمنع رجوعه. والشريان الرئوي استثناء: يحمل دمًا فقير الأكسجين إلى الرئتين.","Gray's Anatomy"],["f","عدد غرف القلب","للقلب أربع غرف: أذينان في الأعلى يستقبلان الدم، وبطينان في الأسفل يضخانه. والبطين الأيسر أسمك جدارًا لأنه يضخ الدم إلى الجسم كله.","Gray's Anatomy"],["q","كم مرة ينبض القلب في اليوم؟","نحو 100 ألف مرة يوميًا تقريبًا، ويضخ في اليوم ما يقارب 7 آلاف لتر من الدم.","جمعية القلب الأمريكية (AHA)"],["f","الكليتان مرشح الجسم","ترشّح الكليتان نحو 180 لترًا من الدم يوميًا، ويُعاد امتصاص معظمه، ويخرج منه نحو 1 إلى 2 لتر بولًا.","المؤسسة الوطنية للكلى (NKF)؛ Guyton and Hall"],["q","ما الوحدة الوظيفية في الكلية؟","النفرون، وفي كل كلية نحو مليون نفرون، كل واحد يرشّح الدم ويعيد امتصاص المفيد منه.","Guyton and Hall Textbook of Medical Physiology"],["f","الرئتان ليستا متساويتين","الرئة اليمنى ثلاثة فصوص، واليسرى فصّان فقط، لأنها تترك مكانًا للقلب.","Gray's Anatomy"],["q","كم حويصلة هوائية في الرئتين؟","نحو 300 إلى 500 مليون حويصلة، ومساحتها لو فُردت تقارب ملعب تنس، نحو 70 مترًا مربعًا.","Guyton and Hall Textbook of Medical Physiology"],["f","الغدة الدرقية","تقع أسفل مقدمة الرقبة على شكل فراشة، وتفرز هرمونات تتحكم في سرعة الأيض (الحرق) في الجسم، وتحتاج اليود لإنتاجها.","جمعية الغدة الدرقية الأمريكية (ATA)"],["q","لماذا يضاف اليود إلى ملح الطعام؟","لمنع نقص اليود الذي يسبب تضخم الغدة الدرقية (الدراق) وضعف النمو العقلي عند الأطفال. وتوصي به منظمة الصحة العالمية واليونيسف عالميًا.","منظمة الصحة العالمية (WHO)"],["f","فيتامين د يصنعه الجلد","يصنع الجلد فيتامين د عند تعرضه للأشعة فوق البنفسجية (UVB) من الشمس، وهو ضروري لامتصاص الكالسيوم وصحة العظام.","المعاهد الوطنية للصحة، مكتب المكملات الغذائية (NIH ODS)"],["q","ما الفيتامين الذي يسبب نقصه الإسقربوط؟","فيتامين C. نقصه يسبب نزف اللثة وضعف التئام الجروح. وكان يصيب البحارة قديمًا حتى أثبت جيمس ليند عام 1747 أن الحمضيات تعالجه.","المعاهد الوطنية للصحة (NIH ODS)؛ Britannica"],["f","فيتامين ك والتجلط","فيتامين K ضروري لتصنيع عوامل تخثر الدم في الكبد، ولهذا يُعطى للمواليد حقنة منه بعد الولادة لمنع النزيف.","الأكاديمية الأمريكية لطب الأطفال (AAP)"],["q","ما الفرق بين الحساسية وعدم التحمل الغذائي؟","الحساسية رد فعل من جهاز المناعة قد يكون خطيرًا كصدمة الحساسية. أما عدم التحمل، كعدم تحمل اللاكتوز، فمشكلة في الهضم لا علاقة لها بالمناعة، وأعراضه هضمية غالبًا.","المعهد الوطني للحساسية والأمراض المعدية (NIAID)"],["f","صدمة الحساسية","تفاعل تحسسي شديد مفاجئ قد يهدد الحياة، وعلاجه الأول حقنة الأدرينالين (الإبينفرين) في العضل فورًا ثم الإسعاف.","الأكاديمية الأمريكية للحساسية والربو والمناعة (AAAAI)"],["q","ما الأعراض السريعة للسكتة الدماغية؟","اختصارها BE FAST: اختلال التوازن، مشكلة في الرؤية، ميلان الوجه، ضعف الذراع، صعوبة الكلام، والوقت يعني الاتصال بالإسعاف فورًا.","جمعية السكتة الدماغية الأمريكية (ASA)"],["f","الإنعاش القلبي الرئوي","يُضغط على منتصف الصدر بعمق 5 إلى 6 سم وبمعدل 100 إلى 120 ضغطة في الدقيقة، مع ترك الصدر يرتد كاملًا بين الضغطات.","إرشادات جمعية القلب الأمريكية للإنعاش (AHA CPR Guidelines)"],["q","ما مناورة هايمليك؟","إسعاف لمن يختنق بجسم عالق في مجرى التنفس: تقف خلفه وتلف يديك حول بطنه فوق السرة وتضغط بقوة للداخل والأعلى حتى يخرج الجسم.","الصليب الأحمر الأمريكي"],["f","الصداع النصفي","الشقيقة ليست صداعًا عاديًا، بل اضطراب عصبي قد يسبقه «أورة» بصرية، ويصاحبه غثيان وحساسية للضوء والصوت، وتصيب النساء نحو ثلاثة أضعاف الرجال.","منظمة الصحة العالمية (WHO)"],["q","ما الفرق بين الفيروس والبكتيريا في العلاج؟","البكتيريا تعالج بالمضادات الحيوية، أما الفيروسات فلا تتأثر بها، ولبعضها أدوية مضادة للفيروسات خاصة، والأهم الوقاية باللقاحات.","مراكز السيطرة على الأمراض (CDC)"],["f","الأنسولين أُعطي لأول مرة 1922","استُخلص الأنسولين في جامعة تورنتو على يد بانتنج وبست، وأُعطي لأول مريض سكري عام 1922، ونال بانتنج وماكلاود نوبل عام 1923.","مؤسسة نوبل (NobelPrize.org)"],["q","ما وظيفة الزائدة الدودية؟","كان يُظن أنها بلا فائدة، لكن الدراسات تشير إلى أنها مخزن للبكتيريا النافعة يعيد تعمير الأمعاء بعد الإسهال الشديد، وفيها نسيج لمفاوي مناعي.","Bollinger et al., Journal of Theoretical Biology 2007"],["f","العين ترى مقلوبًا","العدسة تكوّن صورة مقلوبة على الشبكية، والدماغ هو الذي يقلبها لتبدو معتدلة.","الأكاديمية الأمريكية لطب العيون (AAO)"],["q","ما الفرق بين قصر النظر وطوله؟","قصر النظر: ترى القريب بوضوح والبعيد مشوشًا، لأن الصورة تتكون أمام الشبكية. طول النظر: العكس، والصورة تتكون خلفها.","الأكاديمية الأمريكية لطب العيون (AAO)"],["f","البقعة العمياء","في كل عين نقطة لا ترى فيها شيئًا، وهي مكان خروج العصب البصري من الشبكية، ولا نلاحظها لأن الدماغ يملأ الفراغ والعين الأخرى تعوّضه.","الأكاديمية الأمريكية لطب العيون (AAO)"],["q","لماذا تفرقع الأصابع؟","الصوت ناتج عن تكوّن فقاعة غاز داخل سائل المفصل عند شده، كما أظهر تصوير الرنين المغناطيسي سنة 2015. ولا يوجد دليل قوي على أنه يسبب التهاب المفاصل.","Kawchuk et al., PLOS ONE 2015"],["f","التثاؤب","سبب التثاؤب غير محسوم علميًا، ومن أقوى الفرضيات أنه يساعد على تبريد الدماغ. وهو «معدٍ» بين البشر وبعض الحيوانات.","Gallup & Gallup, Evolutionary Psychology 2007"],["q","كم ساعة نوم يحتاج البالغ؟","7 ساعات فأكثر كل ليلة حسب توصية الأكاديمية الأمريكية لطب النوم، والمراهقون من 8 إلى 10 ساعات.","الأكاديمية الأمريكية لطب النوم (AASM)"],["f","الماء في الجسم","يشكّل الماء نحو 60% من وزن جسم الرجل البالغ، وأقل قليلًا عند المرأة، وأكثر عند الرضع.","Guyton and Hall Textbook of Medical Physiology"]],"physics":[["q","كم سرعة الضوء في الفراغ؟","299,792,458 مترًا في الثانية بالضبط، أي نحو 300 ألف كم في الثانية. وهي ثابتة بالتعريف منذ 1983، ويُعرَّف المتر على أساسها.","المكتب الدولي للأوزان والمقاييس (BIPM)"],["f","كم يحتاج ضوء القمر ليصلنا","نحو 1.3 ثانية، لأن القمر يبعد عنا نحو 384 ألف كم في المتوسط.","وكالة ناسا (NASA)"],["q","ما سرعة الصوت في الهواء؟","نحو 343 مترًا في الثانية عند 20 °م، وتزيد مع ارتفاع الحرارة. وهي في الماء أسرع بنحو أربع مرات، وفي الحديد أسرع بنحو 15 مرة.","HyperPhysics؛ مراجع الفيزياء العامة"],["f","لماذا نرى البرق قبل سماع الرعد","لأن الضوء أسرع من الصوت بنحو مليون مرة. وكل 3 ثوانٍ بين البرق والرعد تعني تقريبًا كيلومترًا واحدًا من المسافة.","المنظمة العالمية للأرصاد الجوية (WMO)؛ NOAA"],["q","ما قوانين نيوتن الثلاثة للحركة؟","الأول: الجسم يبقى ساكنًا أو متحركًا بسرعة ثابتة ما لم تؤثر عليه قوة. الثاني: القوة = الكتلة × التسارع. الثالث: لكل فعل رد فعل مساوٍ له في المقدار ومعاكس في الاتجاه.","Newton, Principia 1687؛ مراجع الفيزياء العامة"],["f","تسارع الجاذبية الأرضية","نحو 9.8 متر/ثانية² عند سطح الأرض، أي أن سرعة الجسم الساقط تزيد نحو 9.8 م/ث كل ثانية إذا أُهملت مقاومة الهواء.","المكتب الدولي للأوزان والمقاييس (BIPM)؛ NIST"],["q","هل يسقط الجسم الثقيل أسرع من الخفيف؟","في غياب مقاومة الهواء يسقطان معًا بالتسارع نفسه. وأثبت ذلك رائد الفضاء ديفيد سكوت على القمر عام 1971 حين أسقط مطرقة وريشة فوصلتا معًا.","وكالة ناسا (NASA)، رحلة أبولو 15"],["f","معادلة أينشتاين E=mc²","تعني أن الكتلة يمكن أن تتحول إلى طاقة هائلة: الطاقة = الكتلة × مربع سرعة الضوء. وغرام واحد من المادة لو تحول كله لطاقة يعادل نحو 21 كيلوطن من مادة TNT.","Einstein A., Annalen der Physik 1905"],["q","ما الفرق بين الانشطار والاندماج النووي؟","الانشطار: نواة ثقيلة كاليورانيوم تنقسم لنوى أصغر وتطلق طاقة، ويستخدم في المفاعلات. الاندماج: نوى خفيفة كالهيدروجين تندمج لنواة أثقل، وهو مصدر طاقة الشمس والنجوم.","الوكالة الدولية للطاقة الذرية (IAEA)"],["f","الشمس تحرق 4 ملايين طن في الثانية","تحول الشمس في نواتها نحو 600 مليون طن من الهيدروجين إلى هيليوم كل ثانية، ويتحول من ذلك نحو 4 ملايين طن من الكتلة إلى طاقة.","وكالة ناسا (NASA)"],["q","لماذا يطفو الجليد على الماء؟","لأن الماء عند تجمده يتمدد وتقل كثافته بنحو 9%، فالجليد أخف من الماء السائل. وهذا نادر في المواد، ويحمي الحياة في البحيرات لأن الجليد يبقى فوق والماء تحته سائل.","USGS؛ مراجع الكيمياء العامة"],["f","مبدأ أرخميدس","الجسم المغمور في سائل يدفعه السائل لأعلى بقوة تساوي وزن السائل الذي أزاحه. ولهذا تطفو السفن الحديدية الضخمة.","مراجع الفيزياء العامة؛ HyperPhysics"],["q","ما الفرق بين الحرارة ودرجة الحرارة؟","درجة الحرارة مقياس لمتوسط حركة جزيئات الجسم، والحرارة كمية الطاقة المنتقلة بسبب فرق درجة الحرارة. فكوب ماء مغلي حرارته أعلى درجة، لكن حوض سباحة دافئ يحمل طاقة حرارية أكبر بكثير.","مراجع الديناميكا الحرارية"],["f","لماذا يغلي الماء أسرع في الجبال","لأن الضغط الجوي أقل، فيغلي الماء بدرجة أقل من 100 °م. على قمة إيفرست يغلي عند نحو 70 °م، ولهذا يصعب طهي الطعام هناك.","HyperPhysics؛ USGS"],["q","ما مبدأ عمل قدر الضغط؟","يحبس البخار فيرتفع الضغط داخله، فيغلي الماء عند نحو 120 °م بدل 100، فينضج الطعام أسرع.","مراجع الفيزياء العامة"],["f","الانحناء في الماء (الانكسار)","القلم في كوب الماء يبدو مكسورًا لأن الضوء يغير سرعته واتجاهه عند انتقاله من الماء للهواء. وهذا ما يسمى انكسار الضوء.","HyperPhysics"],["q","كيف يتكون قوس قزح؟","ضوء الشمس يدخل قطرات المطر فينكسر ويرتد داخلها ثم يخرج، وكل لون ينكسر بزاوية مختلفة قليلًا، فيتفرق الضوء الأبيض لألوانه. ويظهر دائمًا في الجهة المقابلة للشمس.","NOAA؛ HyperPhysics"],["f","ألوان الطيف","الضوء الأبيض مزيج من ألوان: الأحمر والبرتقالي والأصفر والأخضر والأزرق والنيلي والبنفسجي. أثبت نيوتن ذلك بالمنشور عام 1666 تقريبًا، وسبقه ابن الهيثم في دراسة انكسار الضوء.","Newton, Opticks 1704؛ Britannica"],["q","لماذا تبدو الشمس حمراء وقت الغروب؟","لأن ضوءها يقطع مسافة أطول في الغلاف الجوي، فيتشتت الأزرق والبنفسجي ولا يصلنا إلا الأحمر والبرتقالي.","NOAA؛ HyperPhysics"],["f","الكهرباء الساكنة","عند فرك جسمين تنتقل إلكترونات من أحدهما للآخر فيُشحنان، ولهذا قد تصعقك قبضة الباب في الجو الجاف. والبرق شرارة كهرباء ساكنة ضخمة.","NOAA؛ HyperPhysics"],["q","كم حرارة البرق؟","نحو 30,000 °م، أي أسخن من سطح الشمس بنحو خمس مرات، لكنه يدوم جزءًا من الثانية.","الإدارة الوطنية للمحيطات والغلاف الجوي (NOAA)"],["f","قانون أوم","الجهد = التيار × المقاومة (V = I × R). يربط بين الفولت والأمبير والأوم، ووضعه جورج أوم عام 1827.","مراجع الكهرباء العامة؛ Britannica"],["q","ما الفرق بين التيار المستمر والمتردد؟","المستمر (DC) يسير في اتجاه واحد مثل البطاريات. المتردد (AC) يغير اتجاهه عشرات المرات في الثانية، 60 مرة في السعودية، ويستخدم في شبكات الكهرباء لسهولة نقله لمسافات طويلة.","الشركة السعودية للكهرباء؛ مراجع الكهرباء العامة"],["f","جهد الكهرباء في بيوت السعودية","اعتمدت المملكة جهد 230 فولت بتردد 60 هرتز للمنازل، مع بقاء 127 فولت في بعض المباني القديمة.","الهيئة السعودية للمواصفات والمقاييس والجودة؛ الشركة السعودية للكهرباء"],["q","لماذا تشير البوصلة إلى الشمال؟","لأن الأرض مغناطيس ضخم، وإبرة البوصلة المغناطيسية تتجه مع مجالها نحو القطب الشمالي المغناطيسي، وهو يختلف قليلًا عن القطب الجغرافي ويتحرك سنويًا.","NOAA؛ British Geological Survey"],["f","المجال المغناطيسي يحمي الأرض","يصدّ المجال المغناطيسي الأرضي معظم الجسيمات المشحونة القادمة من الشمس، ومن تفاعلها قرب القطبين يتكون الشفق القطبي.","وكالة ناسا (NASA)"],["q","ما الفرق بين الذرة والجزيء؟","الذرة أصغر وحدة من العنصر، مثل ذرة أكسجين. والجزيء مجموعة ذرات مترابطة، مثل جزيء الماء H₂O من ذرتي هيدروجين وذرة أكسجين.","IUPAC؛ مراجع الكيمياء العامة"],["f","حجم الذرة","قطر الذرة نحو عُشر نانومتر، والنواة أصغر منها بنحو 100 ألف مرة. لو كبرت الذرة لحجم ملعب كرة قدم لكانت النواة بحجم حبة بازلاء في وسطه.","CERN؛ مراجع الفيزياء الذرية"],["q","ما أكثر عنصر في الكون؟","الهيدروجين، يشكل نحو 74% من كتلة المادة العادية في الكون، ثم الهيليوم نحو 24%.","وكالة ناسا (NASA)"],["f","أكثر عنصر في القشرة الأرضية","الأكسجين، يشكل نحو 46% من وزن القشرة الأرضية، ثم السيليكون نحو 28%.","هيئة المسح الجيولوجي الأمريكية (USGS)"],["q","كم عدد العناصر في الجدول الدوري؟","118 عنصرًا معترفًا بها رسميًا، آخرها أوغانيسون (118) الذي اعتُمد اسمه عام 2016.","الاتحاد الدولي للكيمياء البحتة والتطبيقية (IUPAC)"],["f","مندلييف والجدول الدوري","رتب ديمتري مندلييف العناصر عام 1869 حسب أوزانها وخصائصها، وترك فراغات لعناصر لم تكتشف، وتنبأ بخصائصها، ثم اكتُشفت فعلًا.","IUPAC؛ Britannica"],["q","ما الفرق بين السرعة والتسارع؟","السرعة مقدار تغير المكان مع الزمن. والتسارع مقدار تغير السرعة مع الزمن. فالسيارة على سرعة ثابتة 100 كم/س تسارعها صفر.","مراجع الفيزياء العامة"],["f","انعدام الوزن في محطة الفضاء","رواد محطة الفضاء ليسوا بلا جاذبية، فالجاذبية هناك نحو 90% من الأرض، لكنهم في سقوط حر مستمر حول الأرض، فيشعرون بانعدام الوزن.","وكالة ناسا (NASA)"],["q","كم سرعة محطة الفضاء الدولية؟","نحو 28,000 كم/س، وتدور حول الأرض كل نحو 90 دقيقة، فيرى روادها نحو 16 شروقًا و16 غروبًا كل يوم.","وكالة ناسا (NASA)"],["f","الثقب الأسود في مركز مجرتنا","في مركز درب التبانة ثقب أسود هائل اسمه «القوس A*» كتلته نحو 4 ملايين كتلة شمسية. وصُوّر لأول مرة عام 2022، ونال غينزل وغيز نوبل 2020 لإثبات وجوده.","Event Horizon Telescope 2022؛ مؤسسة نوبل"],["q","كم عمر الكون؟","نحو 13.8 مليار سنة حسب قياسات القمر الصناعي بلانك لإشعاع الخلفية الكونية.","Planck Collaboration, Astronomy & Astrophysics 2020"],["f","السنة الضوئية مسافة لا زمن","السنة الضوئية هي المسافة التي يقطعها الضوء في سنة، نحو 9.46 تريليون كم.","الاتحاد الفلكي الدولي (IAU)"],["q","ما أقرب نجم إلى الأرض بعد الشمس؟","بروكسيما سنتوري، على بعد نحو 4.24 سنة ضوئية.","وكالة ناسا (NASA)؛ ESO"],["f","المادة المظلمة","نحو 85% من مادة الكون «مظلمة»: لا نراها ولا تبعث ضوءًا، لكن نعرف وجودها من أثر جاذبيتها على حركة المجرات. وطبيعتها ما زالت لغزًا.","وكالة ناسا (NASA)؛ CERN"],["q","ما الطاقة المظلمة؟","قوة غامضة تشكل نحو 68% من طاقة الكون وتسرّع تمدده. اكتُشف تسارع التمدد عام 1998 ونال مكتشفوه نوبل 2011.","مؤسسة نوبل (NobelPrize.org)؛ NASA"],["f","مبدأ عدم التحديد لهايزنبرغ","لا يمكن معرفة موقع الجسيم وسرعته بدقة تامة في الوقت نفسه؛ كلما زادت دقة أحدهما قلت دقة الآخر. وهي خاصية في الطبيعة لا عيب في أجهزة القياس.","Heisenberg W., Zeitschrift für Physik 1927"]],"politics":[["q","كم عدد أعضاء مجلس الأمن؟","15 عضوًا: 5 دائمون لهم حق النقض، و10 غير دائمين تنتخبهم الجمعية العامة لمدة سنتين.","ميثاق الأمم المتحدة، المادة 23"],["f","مقر الأمم المتحدة","يقع المقر الرئيسي في نيويورك، ولها مكاتب رئيسية في جنيف وفيينا ونيروبي. ومحكمة العدل الدولية في لاهاي.","الأمم المتحدة (un.org)"],["q","ما محكمة العدل الدولية؟","الجهاز القضائي الرئيسي للأمم المتحدة، مقرها لاهاي في هولندا، وتتكون من 15 قاضيًا، وتفصل في النزاعات بين الدول لا الأفراد.","النظام الأساسي لمحكمة العدل الدولية"],["f","الفرق بين محكمة العدل الدولية والمحكمة الجنائية الدولية","الأولى تفصل بين الدول وهي جهاز أممي. والثانية تحاكم الأفراد على جرائم الإبادة والحرب والجرائم ضد الإنسانية، وأُنشئت بنظام روما 1998، وليست كل الدول أعضاء فيها.","المحكمة الجنائية الدولية؛ الأمم المتحدة"],["q","كم عدد الدول الأعضاء في جامعة الدول العربية؟","22 دولة، ومقرها القاهرة.","جامعة الدول العربية"],["f","منظمة التعاون الإسلامي","تأسست عام 1969 في الرباط، ومقر أمانتها العامة في جدة، وتضم 57 دولة، وهي ثاني أكبر منظمة حكومية دولية بعد الأمم المتحدة.","منظمة التعاون الإسلامي (oic-oci.org)"],["q","ما مجموعة العشرين؟","منتدى لأكبر 19 اقتصادًا في العالم مع الاتحاد الأوروبي، وانضم الاتحاد الأفريقي عام 2023. والسعودية العضو العربي الوحيد، واستضافت قمتها عام 2020.","مجموعة العشرين (G20)"],["f","مجلس الشورى السعودي","يتكون من رئيس و150 عضوًا يعينهم الملك لمدة أربع سنوات، ويدرس الأنظمة واللوائح ويبدي الرأي فيها. وتشارك فيه المرأة منذ 2013 بنسبة لا تقل عن 20%.","نظام مجلس الشورى؛ مجلس الشورى"],["q","ما هيئة البيعة؟","هيئة أُنشئت عام 1427هـ (2006م) بنظام هيئة البيعة، تضم أبناء الملك المؤسس وأحفاده، وتشارك في اختيار ولي العهد.","نظام هيئة البيعة (1427هـ)"],["f","رؤية السعودية 2030","أُعلنت في 25 أبريل 2016، وتقوم على ثلاثة محاور: مجتمع حيوي، واقتصاد مزدهر، ووطن طموح، وتهدف إلى تنويع الاقتصاد بعيدًا عن النفط.","رؤية المملكة 2030 (vision2030.gov.sa)"],["q","ما الفرق بين الملكية المطلقة والدستورية؟","في الملكية الدستورية يملك الملك رمزيًا وتحكم حكومة منتخبة، مثل بريطانيا واليابان. وفي الملكية التي يجمع فيها الملك السلطات يكون هو مرجع السلطات التنفيذية والتنظيمية والقضائية.","Britannica"],["f","فصل السلطات","فكرة صاغها مونتسكيو في كتابه «روح القوانين» عام 1748: تقسيم السلطة إلى تشريعية وتنفيذية وقضائية لمنع الاستبداد.","Montesquieu, The Spirit of the Laws 1748؛ Britannica"],["q","ما العقد الاجتماعي؟","نظرية تقول إن الحكومة تقوم على اتفاق بين الناس للتنازل عن بعض حرياتهم مقابل الحماية والنظام. ومن أبرز منظريها هوبز ولوك وروسو.","Stanford Encyclopedia of Philosophy"],["f","حلف شمال الأطلسي (الناتو)","تأسس عام 1949 بـ12 دولة، ويضم اليوم 32 دولة بعد انضمام فنلندا 2023 والسويد 2024. ومبدؤه الأساسي في المادة الخامسة: الهجوم على عضو هجوم على الجميع.","حلف الناتو (nato.int)"],["q","متى تأسس الاتحاد الأوروبي؟","بمعاهدة ماستريخت التي دخلت حيز التنفيذ في 1 نوفمبر 1993، وأصله الجماعة الأوروبية للفحم والصلب 1951. وخرجت بريطانيا منه في 31 يناير 2020.","الاتحاد الأوروبي (europa.eu)"],["f","اليورو","العملة الموحدة لعدد من دول الاتحاد الأوروبي، طُرحت إلكترونيًا عام 1999 ونقديًا عام 2002.","البنك المركزي الأوروبي"],["q","ما الحرب الباردة؟","صراع سياسي واقتصادي وعسكري غير مباشر بين الولايات المتحدة والاتحاد السوفيتي من نحو 1947 إلى 1991، دون حرب مباشرة بينهما، وانتهت بتفكك الاتحاد السوفيتي.","Britannica"],["f","الأمين العام للأمم المتحدة","يُعيَّن بقرار من الجمعية العامة بناءً على توصية مجلس الأمن، لولاية مدتها 5 سنوات قابلة للتجديد.","ميثاق الأمم المتحدة، المادة 97"],["q","ما وكالات الأمم المتحدة المتخصصة الشهيرة؟","منها منظمة الصحة العالمية (WHO) في جنيف، واليونسكو في باريس، ومنظمة الأغذية والزراعة (فاو) في روما، وصندوق النقد والبنك الدوليان في واشنطن.","الأمم المتحدة (un.org)"],["f","صندوق النقد الدولي والبنك الدولي","تأسسا في مؤتمر بريتون وودز عام 1944. الصندوق يدعم استقرار العملات والاقتصاد الكلي، والبنك يمول مشاريع التنمية.","صندوق النقد الدولي (imf.org)؛ البنك الدولي"],["q","ما منظمة التجارة العالمية؟","تأسست عام 1995 خلفًا لاتفاقية «الجات»، مقرها جنيف، وتضع قواعد التجارة بين الدول وتفصل في نزاعاتها. وانضمت السعودية إليها عام 2005.","منظمة التجارة العالمية (wto.org)"],["f","الديمقراطية المباشرة وغير المباشرة","في المباشرة يصوت الشعب بنفسه على القرارات، كما في بعض الاستفتاءات السويسرية. وفي غير المباشرة ينتخب الشعب ممثلين يقررون عنه، وهي الأكثر شيوعًا.","Britannica"],["q","ما المجمع الانتخابي الأمريكي؟","آلية لانتخاب الرئيس الأمريكي فيها 538 ناخبًا موزعين على الولايات حسب عدد سكانها، ويحتاج المرشح 270 صوتًا للفوز، فقد يفوز مرشح وهو خاسر في مجموع الأصوات الشعبية.","الأرشيف الوطني الأمريكي (archives.gov)"],["f","مدة الرئاسة الأمريكية","4 سنوات، ولا يجوز انتخاب الشخص أكثر من مرتين بموجب التعديل الثاني والعشرين للدستور (1951).","دستور الولايات المتحدة، التعديل 22"],["q","ما مجلس اللوردات البريطاني؟","الغرفة العليا في البرلمان البريطاني، أعضاؤه غير منتخبين، يُعيَّن أغلبهم مدى الحياة، ويراجع التشريعات دون أن يملك إسقاط إرادة مجلس العموم نهائيًا.","البرلمان البريطاني (parliament.uk)"],["f","اتفاقيات جنيف","أربع اتفاقيات عام 1949 مع بروتوكولاتها، تشكل أساس القانون الدولي الإنساني، وتحمي الجرحى والأسرى والمدنيين في الحروب، وصادقت عليها كل دول العالم.","اللجنة الدولية للصليب الأحمر (ICRC)"],["q","ما الإعلان العالمي لحقوق الإنسان؟","وثيقة اعتمدتها الجمعية العامة للأمم المتحدة في 10 ديسمبر 1948، فيها 30 مادة، وهي ليست معاهدة ملزمة بذاتها.","الأمم المتحدة"],["f","الحياد السويسري","اعترفت القوى الأوروبية بحياد سويسرا الدائم في مؤتمر فيينا عام 1815، ولم تنضم للأمم المتحدة إلا عام 2002.","الحكومة السويسرية؛ Britannica"],["q","ما معنى «القوة الناعمة»؟","مصطلح صاغه جوزيف ناي: قدرة الدولة على التأثير بالجذب والإقناع، عبر الثقافة والقيم والإعلام والتعليم، بدل الإكراه العسكري أو الاقتصادي.","Nye J., Soft Power 2004"],["f","مؤتمر يالطا","اجتمع روزفلت وتشرشل وستالين في فبراير 1945 قرب نهاية الحرب العالمية الثانية، ورسموا ملامح أوروبا بعد الحرب وتأسيس الأمم المتحدة.","Britannica"],["q","ما حق تقرير المصير؟","مبدأ في القانون الدولي يعطي الشعوب حق اختيار وضعها السياسي، ونص عليه ميثاق الأمم المتحدة في المادة الأولى.","ميثاق الأمم المتحدة، المادة 1"],["f","أوبك بلس","تحالف تأسس أواخر 2016 بين دول أوبك ودول منتجة أخرى أبرزها روسيا، لتنسيق مستويات إنتاج النفط.","منظمة أوبك (opec.org)"],["q","ما الفرق بين الاتحاد الفيدرالي والكونفدرالي؟","الفيدرالي دولة واحدة بحكومة مركزية قوية وولايات لها صلاحيات، مثل الولايات المتحدة والإمارات. والكونفدرالي اتحاد دول مستقلة تحتفظ بسيادتها وتنسق في مجالات محددة.","Britannica"],["f","الإمارات العربية المتحدة","تأسست في 2 ديسمبر 1971 اتحادًا من 6 إمارات، وانضمت رأس الخيمة في فبراير 1972 فصارت سبعًا.","Britannica؛ حكومة الإمارات"]],"psychology":[["f","هرم ماسلو للحاجات","اقترح أبراهام ماسلو (1943) أن حاجات الإنسان مرتبة: الحاجات الجسدية، ثم الأمان، ثم الانتماء والحب، ثم التقدير، ثم تحقيق الذات. والأبحاث الحديثة لا تؤيد الترتيب الصارم، لكن الفكرة ما زالت مؤثرة.","Maslow A.H., Psychological Review 1943"],["q","ما الفرق بين الاكتئاب والحزن العادي؟","الحزن شعور طبيعي مؤقت مرتبط بموقف. أما الاكتئاب الجسيم فيستمر أسبوعين فأكثر معظم اليوم، ومعه فقدان الاهتمام والمتعة وتغير في النوم والشهية والطاقة والتركيز، ويؤثر على الحياة اليومية.","DSM-5، الجمعية الأمريكية للطب النفسي"],["f","الاكتئاب منتشر","تقدّر منظمة الصحة العالمية أن نحو 5% من البالغين في العالم يعانون الاكتئاب، وهو من أكبر أسباب الإعاقة عالميًا، ويمكن علاجه بالعلاج النفسي والأدوية.","منظمة الصحة العالمية (WHO)"],["q","ما العلاج المعرفي السلوكي؟","علاج نفسي قصير ومنظم يساعد الشخص على اكتشاف الأفكار السلبية غير الواقعية وتعديلها وتغيير السلوكيات المرتبطة بها. وهو من أكثر العلاجات دعمًا بالأدلة للقلق والاكتئاب.","المعهد الوطني للتميز في الرعاية الصحية البريطاني (NICE)"],["f","اضطراب ما بعد الصدمة","قد يحدث بعد التعرض لحدث صادم شديد، ومن أعراضه استرجاع الحدث كأنه يتكرر، والكوابيس، وتجنب ما يذكّر به، واليقظة الزائدة، لمدة تزيد على شهر.","DSM-5؛ المعهد الوطني للصحة النفسية (NIMH)"],["q","ما اضطراب الوسواس القهري؟","أفكار متكررة مزعجة لا يريدها الشخص (وساوس)، يقابلها سلوك متكرر لتخفيف القلق (أفعال قهرية) مثل الغسل أو التأكد المتكرر. ويستهلك وقتًا ويؤثر على الحياة، ويُعالج بالعلاج السلوكي والأدوية.","DSM-5؛ NIMH"],["f","تأثير الدواء الوهمي (البلاسيبو)","قد يتحسن المريض بعد تناول حبة لا تحتوي أي مادة فعالة، لأنه يتوقع التحسن. ولهذا تُقارن الأدوية الجديدة دائمًا بدواء وهمي.","Kaptchuk & Miller, NEJM 2015"],["q","ما تأثير «النوسيبو»؟","عكس البلاسيبو: الشخص الذي يتوقع آثارًا جانبية سيئة قد يشعر بها فعلًا حتى لو أخذ دواء وهميًا.","Colloca & Barsky, NEJM 2020"],["f","الانحياز التأكيدي","نميل إلى البحث عن المعلومات التي تؤيد ما نعتقده مسبقًا، ونتجاهل ما يخالفه أو نقلل من أهميته.","Nickerson R.S., Review of General Psychology 1998"],["q","ما مغالطة التكلفة الغارقة؟","أن نستمر في شيء خاسر فقط لأننا صرفنا عليه وقتًا أو مالًا، مثل إكمال فيلم ممل لأنك دفعت التذكرة، مع أن ما صُرف لن يعود في الحالتين.","Arkes & Blumer, Organizational Behavior and Human Decision Processes 1985"],["f","أثر الإرساء","أول رقم نسمعه يؤثر على تقديراتنا التالية. في تجربة كانمان وتفيرسكي أثّر رقم عشوائي من عجلة على تقدير الناس لعدد الدول الأفريقية في الأمم المتحدة.","Tversky & Kahneman, Science 1974"],["q","ما «النظامان» في التفكير عند كانمان؟","النظام الأول سريع وتلقائي وعاطفي، والنظام الثاني بطيء ومتأنٍ ومنطقي. وأغلب أخطائنا في الحكم تأتي من الاعتماد على الأول في مواقف تحتاج الثاني.","Kahneman D., Thinking, Fast and Slow 2011"],["f","النفور من الخسارة","ألم خسارة 100 ريال أقوى نفسيًا من فرحة كسب 100 ريال، بنحو الضعف تقريبًا. وهذا من أساسيات «نظرية الاحتمالات» التي نال بها كانمان نوبل الاقتصاد 2002.","Kahneman & Tversky, Econometrica 1979؛ مؤسسة نوبل"],["q","ما متلازمة المحتال؟","شعور الشخص الناجح بأنه لا يستحق نجاحه وأنه «سيُكشف» قريبًا، ويرجع نجاحه للحظ. وصفته كلانس وآيمز عام 1978، وهي ليست تشخيصًا مرضيًا رسميًا.","Clance & Imes, Psychotherapy 1978"],["f","قاعدة الـ21 يومًا لتكوين العادة غير دقيقة","وجدت دراسة في كلية لندن الجامعية أن تكوين عادة جديدة استغرق في المتوسط 66 يومًا، ويتراوح بين 18 و254 يومًا حسب الشخص والعادة.","Lally et al., European Journal of Social Psychology 2010"],["q","ما «التدفق» (Flow)؟","حالة انغماس كامل في نشاط ممتع ومناسب الصعوبة، ينسى فيها الإنسان الوقت. وصفها ميهاي تشيكسنتميهاي، وتحدث عندما يتوازن التحدي مع المهارة.","Csikszentmihalyi M., Flow 1990"],["f","الذاكرة ليست تسجيلًا","كل مرة نتذكر فيها حدثًا نعيد بناءه، وقد نضيف أو نغير تفاصيل دون أن ندري. ولهذا قد يتذكر شخصان الحدث نفسه بشكل مختلف بثقة.","Schacter D.L., The Seven Sins of Memory 2001"],["q","ما تأثير «الاختبار» في التعلم؟","اختبار نفسك فيما تعلمته، بمحاولة استرجاعه دون النظر، يثبت المعلومة أكثر من إعادة قراءتها مرات. ويسمى «الاستدعاء النشط».","Roediger & Karpicke, Psychological Science 2006"],["f","تعدد المهام وهم","الدماغ لا يؤدي مهمتين تحتاجان انتباهًا في الوقت نفسه، بل يتنقل بينهما بسرعة، وكل تنقل يكلف وقتًا ويزيد الأخطاء.","Rubinstein, Meyer & Evans, Journal of Experimental Psychology 2001"],["q","لماذا نتذكر بداية القائمة ونهايتها؟","بسبب «أثر الأولوية» و«أثر الحداثة»: البداية تأخذ وقتًا أكثر في التكرار فتنتقل للذاكرة الطويلة، والنهاية ما زالت في الذاكرة القصيرة. والوسط يُنسى أكثر.","Murdock B.B., Journal of Experimental Psychology 1962"],["f","الضحك معدٍ","سماع ضحك الآخرين ينشط مناطق في الدماغ تهيئ عضلات الوجه للضحك، ولهذا نضحك أكثر في الجماعة بنحو 30 مرة من الضحك وحدنا.","Provine R., Laughter 2000؛ Warren et al., Journal of Neuroscience 2006"],["q","ما «العجز المكتسب»؟","حين يمر الإنسان أو الحيوان بمواقف سيئة لا يستطيع التحكم فيها مرارًا، قد يتوقف عن المحاولة حتى عندما يصبح الحل ممكنًا. وصفه مارتن سيليغمان في تجارب الستينيات، وربطه بالاكتئاب.","Seligman M., Helplessness 1975"],["f","الامتنان يحسن المزاج","وجدت دراسات إيمونز وماكولو أن من يكتبون كل أسبوع أشياء يشعرون بالامتنان لها كانوا أكثر تفاؤلًا وأقل شكوى من أعراض جسدية مقارنة بغيرهم.","Emmons & McCullough, Journal of Personality and Social Psychology 2003"],["q","هل المال يجلب السعادة؟","يرفع المال الرضا عن الحياة بوضوح عند خروج الشخص من الحاجة، ويستمر أثره بعد ذلك لكن أبطأ. ووجدت دراسة 2023 مشتركة بين كانمان وكيلنغزوورث أن السعادة تزيد مع الدخل عند أغلب الناس.","Killingsworth, Kahneman & Mellers, PNAS 2023"],["f","الوحدة تضر الصحة","وجد تحليل لـ148 دراسة أن ضعف العلاقات الاجتماعية يرفع خطر الوفاة بنحو 50%، وهو أثر يقارب أثر التدخين.","Holt-Lunstad et al., PLOS Medicine 2010"],["q","ما اضطراب فرط الحركة وتشتت الانتباه؟","اضطراب نمائي يظهر في الطفولة، فيه صعوبة مستمرة في الانتباه أو فرط حركة واندفاعية تؤثر على الدراسة والحياة، وقد يستمر للبلوغ، ويُعالج بالعلاج السلوكي والأدوية.","DSM-5؛ NIMH"],["f","طيف التوحد","اضطراب نمائي يؤثر على التواصل والتفاعل الاجتماعي، مع سلوكيات أو اهتمامات متكررة. ويختلف كثيرًا من شخص لآخر، ولهذا يسمى «طيفًا». والتدخل المبكر يحسن النتائج.","DSM-5؛ مراكز السيطرة على الأمراض (CDC)"],["q","هل اللقاحات تسبب التوحد؟","لا. الدراسة التي ادعت ذلك عام 1998 سُحبت لتزوير بياناتها، وشُطب صاحبها من السجل الطبي. ودراسات على ملايين الأطفال لم تجد أي علاقة.","Hviid et al., Annals of Internal Medicine 2019؛ The Lancet 2010 (سحب الدراسة)"],["f","أثر التعرض المجرد","نميل لتفضيل الأشياء والأشخاص الذين نراهم كثيرًا، حتى دون أن ننتبه. وصفه روبرت زايونس عام 1968.","Zajonc R.B., Journal of Personality and Social Psychology 1968"],["q","ما «الإسقاط» في علم النفس؟","آلية دفاعية ينسب فيها الشخص مشاعره أو صفاته غير المقبولة إلى غيره، مثل من يشعر بالغضب فيتهم الآخرين بأنهم غاضبون منه.","APA Dictionary of Psychology"],["f","الرياضة علاج للاكتئاب","وجد تحليل شامل نشر في BMJ عام 2024 أن الرياضة، خصوصًا المشي والجري واليوغا وتمارين القوة، تخفف أعراض الاكتئاب بفعالية تقارب العلاج النفسي.","Noetel et al., BMJ 2024"],["q","ما «اليقظة الذهنية» (Mindfulness)؟","تدريب الانتباه على اللحظة الحاضرة دون حكم، كمراقبة التنفس والأفكار. وتظهر الأبحاث أنها تخفف القلق والتوتر بدرجة متوسطة.","Goyal et al., JAMA Internal Medicine 2014"],["f","الضوء الأزرق والنوم","الشاشات قبل النوم تؤخر إفراز الميلاتونين وتجعل النوم أصعب وأقل جودة. ووجدت دراسة هارفارد أن القراءة من جهاز لوحي ليلًا أخرت ساعة الجسم مقارنة بالكتاب الورقي.","Chang et al., PNAS 2015"],["q","ما «أثر بيغماليون»؟","توقعات الآخرين عنا، كالمعلم أو المدير، قد تغير أداءنا فعلًا لتقترب من توقعاتهم، إيجابيًا أو سلبيًا.","Rosenthal & Jacobson, 1968"],["f","أثر فرانكلين","إذا طلبت من شخص أن يسدي لك معروفًا صغيرًا، يزيد ميله إليك، لأنه يبرر فعله بأنك تستحق. وسُمّي باسم بنجامين فرانكلين الذي وصفه.","Jecker & Landy, Human Relations 1969"]],"religion":[["q","كم عدد آيات القرآن الكريم؟","6236 آية حسب العدّ الكوفي المعتمد في مصحف المدينة برواية حفص عن عاصم. ويختلف العدد قليلًا باختلاف مدارس العدّ.","مصحف المدينة النبوية؛ البيان في عد آي القرآن للداني"],["f","عدد أجزاء القرآن وأحزابه","ثلاثون جزءًا، وستون حزبًا، وكل حزب أربعة أرباع.","مصحف المدينة النبوية"],["q","ما السورة التي سُميت باسم امرأة؟","سورة مريم، ومريم عليها السلام هي المرأة الوحيدة المذكورة باسمها في القرآن، وذُكرت فيه أكثر من 30 مرة.","تفسير ابن كثير؛ المعجم المفهرس لألفاظ القرآن"],["f","أكثر الأنبياء ذكرًا في القرآن","موسى عليه السلام، ذُكر اسمه نحو 136 مرة.","المعجم المفهرس لألفاظ القرآن الكريم لمحمد فؤاد عبدالباقي"],["q","ما أعظم آية في القرآن؟","آية الكرسي [البقرة: 255]، كما في حديث أبيّ بن كعب في صحيح مسلم.","صحيح مسلم"],["f","أعظم سورة في القرآن","سورة الفاتحة، لقوله ﷺ لأبي سعيد بن المعلى: «لأعلّمنك سورة هي أعظم السور في القرآن: الحمد لله رب العالمين، هي السبع المثاني والقرآن العظيم». رواه البخاري.","صحيح البخاري"],["q","ما القراءات المتواترة؟","عشر قراءات، أشهرها سبع: نافع، وابن كثير، وأبو عمرو، وابن عامر، وعاصم، وحمزة، والكسائي، وزاد ابن الجزري ثلاثًا: أبا جعفر، ويعقوب، وخلفًا العاشر.","النشر في القراءات العشر لابن الجزري"],["f","رواية حفص عن عاصم","أكثر الروايات انتشارًا في العالم الإسلامي اليوم. ويليها رواية ورش عن نافع في المغرب العربي وأجزاء من أفريقيا.","مجمع الملك فهد لطباعة المصحف الشريف"],["q","ما مجمع الملك فهد لطباعة المصحف؟","مجمع في المدينة المنورة افتُتح عام 1405هـ (1984م)، يطبع المصحف بروايات متعددة وترجمات معانيه بعشرات اللغات، ووزع مئات الملايين من النسخ.","مجمع الملك فهد لطباعة المصحف الشريف"],["f","هجرة الحبشة","أول هجرة في الإسلام كانت إلى الحبشة في السنة الخامسة من البعثة، فرارًا من أذى قريش، وكان ملكها النجاشي عادلًا.","سيرة ابن هشام؛ الرحيق المختوم"],["q","متى كانت الهجرة إلى المدينة؟","في السنة الثالثة عشرة من البعثة، ووصل النبي ﷺ إلى قباء في ربيع الأول، وكان معه أبو بكر الصديق رضي الله عنه.","صحيح البخاري؛ الرحيق المختوم"],["f","أول مسجد بني في الإسلام","مسجد قباء، أسسه النبي ﷺ عند وصوله المدينة، وفي الحديث أن الصلاة فيه كعمرة.","صحيح البخاري؛ سنن ابن ماجه"],["q","متى فُرضت الصلوات الخمس؟","ليلة الإسراء والمعراج قبل الهجرة، وكانت خمسين ثم خُففت إلى خمس في العدد وخمسين في الأجر.","صحيح البخاري ومسلم (حديث المعراج)"],["f","تحويل القبلة","تحولت القبلة من بيت المقدس إلى الكعبة بعد الهجرة بنحو ستة عشر أو سبعة عشر شهرًا، ونزل قوله تعالى: ﴿فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ﴾.","صحيح البخاري؛ سورة البقرة 144"],["q","متى فُرض صيام رمضان؟","في السنة الثانية للهجرة، فصام النبي ﷺ تسع رمضانات.","زاد المعاد لابن القيم"],["f","غزوة أحد","وقعت في شوال سنة 3هـ، واستشهد فيها سبعون من الصحابة منهم حمزة بن عبدالمطلب عم النبي ﷺ، بعد مخالفة الرماة أمره بعدم مغادرة الجبل.","صحيح البخاري؛ سيرة ابن هشام"],["q","ما غزوة الخندق؟","غزوة الأحزاب سنة 5هـ، حفر فيها المسلمون خندقًا حول المدينة بمشورة سلمان الفارسي، وتحالفت فيها قريش وغطفان وغيرهما، ثم تفرقوا بريح شديدة.","صحيح البخاري؛ سورة الأحزاب"],["f","صلح الحديبية","في ذي القعدة سنة 6هـ بين النبي ﷺ وقريش، ومن شروطه وضع الحرب عشر سنين، وسماه الله فتحًا مبينًا.","صحيح البخاري؛ سورة الفتح"],["q","ما آخر غزوة غزاها النبي ﷺ؟","غزوة تبوك في رجب سنة 9هـ، وتسمى «غزوة العسرة»، ولم يقع فيها قتال.","صحيح البخاري؛ زاد المعاد"],["f","حجة الوداع","حج النبي ﷺ مرة واحدة سنة 10هـ، ومعه أكثر من مئة ألف من الصحابة، وخطب فيها خطبته الجامعة في عرفة.","صحيح مسلم (حديث جابر الطويل)"],["q","متى توفي النبي ﷺ؟","يوم الاثنين 12 ربيع الأول سنة 11هـ على المشهور، وعمره ثلاث وستون سنة، ودُفن في حجرة عائشة رضي الله عنها.","صحيح البخاري؛ البداية والنهاية"],["f","زوجات النبي ﷺ","أمهات المؤمنين إحدى عشرة: خديجة، وسودة، وعائشة، وحفصة، وزينب بنت خزيمة، وأم سلمة، وزينب بنت جحش، وجويرية، وأم حبيبة، وصفية، وميمونة رضي الله عنهن.","زاد المعاد لابن القيم"],["q","من أول من أسلم؟","خديجة رضي الله عنها من النساء، وأبو بكر الصديق من الرجال الأحرار، وعلي بن أبي طالب من الصبيان، وزيد بن حارثة من الموالي، وبلال من العبيد.","البداية والنهاية لابن كثير"],["f","العشرة المبشرون بالجنة","أبو بكر، وعمر، وعثمان، وعلي، وطلحة، والزبير، وعبدالرحمن بن عوف، وسعد بن أبي وقاص، وسعيد بن زيد، وأبو عبيدة بن الجراح.","سنن الترمذي؛ سنن أبي داود"],["q","من أول مؤذن في الإسلام؟","بلال بن رباح رضي الله عنه، اختاره النبي ﷺ لحسن صوته بعد رؤيا عبدالله بن زيد للأذان.","سنن أبي داود؛ سنن الترمذي"],["f","الخلفاء الراشدون","أبو بكر (11–13هـ)، ثم عمر (13–23هـ)، ثم عثمان (23–35هـ)، ثم علي (35–40هـ) رضي الله عنهم.","البداية والنهاية لابن كثير؛ تاريخ الخلفاء للسيوطي"],["q","من جمع المصحف على حرف واحد؟","عثمان بن عفان رضي الله عنه، نسخ المصاحف وأرسلها إلى الأمصار، وأمر بإحراق ما سواها لجمع الناس.","صحيح البخاري، كتاب فضائل القرآن"],["f","ليلة القدر","خير من ألف شهر، وتُتحرى في العشر الأواخر من رمضان، وفي أوتارها آكد.","سورة القدر؛ صحيح البخاري"],["q","ما الأشهر الحرم؟","أربعة: ذو القعدة، وذو الحجة، والمحرم، ورجب.","سورة التوبة 36؛ صحيح البخاري"],["f","يوم عرفة","صيامه يكفّر سنة ماضية وسنة باقية لغير الحاج، كما في صحيح مسلم.","صحيح مسلم (حديث أبي قتادة)"],["q","ما فضل صيام عاشوراء؟","يكفّر السنة الماضية، ويُستحب صيام يوم قبله أو بعده مخالفة لليهود.","صحيح مسلم"],["f","الكعبة","بناها إبراهيم وإسماعيل عليهما السلام، وأعادت قريش بناءها قبل البعثة بخمس سنين وشارك النبي ﷺ في وضع الحجر الأسود.","سورة البقرة 127؛ صحيح البخاري"],["q","ما المساجد التي تُشد الرحال إليها؟","ثلاثة: المسجد الحرام، والمسجد النبوي، والمسجد الأقصى.","صحيح البخاري ومسلم"],["f","الصلاة في المسجد الحرام","الصلاة فيه بمئة ألف صلاة فيما سواه، وفي المسجد النبوي بألف صلاة.","مسند أحمد وسنن ابن ماجه (وصححه الألباني)"],["q","ما أطول سورة مكية؟","سورة الأعراف، وعدد آياتها 206.","مصحف المدينة النبوية؛ الإتقان للسيوطي"],["f","السورة التي تختم بسجدتين","سورة الحج فيها سجدتان، الأولى في الآية 18 والثانية في الآية 77 عند من يقول بها.","المغني لابن قدامة"]],"studies":[["f","كيف عرف العالم أن التدخين يسبب السرطان؟","وش سووا: تابع الباحثون أكثر من 34 ألف طبيب بريطاني 50 سنة كاملة، وسجلوا مين يدخن ومين ما يدخن، ومين مات وبأي مرض.\nوش لقوا: المدخنون يموتون بسرطان الرئة أضعافًا كثيرة، ويعيشون أقل بنحو 10 سنوات في المتوسط.\nوش استفدنا: صار التدخين معروفًا كسبب مباشر للسرطان وأمراض القلب، وبدأت حملات منعه في العالم. وأثبتت أن من يترك التدخين قبل الأربعين يرجع خطره قريبًا من غير المدخن.","Doll & Hill — British Doctors Study, BMJ 2004"],["f","من أين عرفنا أن الضغط والكوليسترول يضرون القلب؟","وش سووا: من سنة 1948 تتابع دراسة في مدينة فرامنغهام الأمريكية آلاف السكان، ثم أولادهم وأحفادهم، بفحوصات دورية لعشرات السنين.\nوش لقوا: ارتفاع الضغط والكوليسترول والتدخين والسمنة وقلة الحركة ترفع خطر الجلطات بشكل واضح.\nوش استفدنا: صار الأطباء يقيسون الضغط والكوليسترول للناس الأصحاء ويعالجونهم مبكرًا قبل ما تجيهم جلطة. وهي اللي أوجدت مصطلح «عوامل الخطر».","Framingham Heart Study — NHLBI"],["f","هل الرياضة فعلًا تحمي القلب؟","وش سووا: قارن الباحث جيري موريس سنة 1953 بين سائقي باصات لندن ذات الطابقين، اللي يقعدون طول اليوم، والمحصّلين اللي يطلعون وينزلون الدرج طول اليوم.\nوش لقوا: المحصّلون أصيبوا بجلطات القلب أقل بكثير، وإذا أصيبوا كانت أخف.\nوش استفدنا: هذي أول دراسة تثبت أن الحركة تحمي القلب، ومنها جاءت توصيات الرياضة اليومية الموجودة اليوم.","Morris J.N. et al., The Lancet 1953"],["f","كيف نمنع السكري قبل ما يجي؟","وش سووا: تجربة أمريكية (DPP) على أكثر من 3 آلاف شخص سكرهم مرتفع شوي وقريبين من السكري، قسّموهم ثلاث مجموعات: مجموعة غيّرت أكلها ومشت، ومجموعة أخذت دواء الميتفورمين، ومجموعة ما سوت شي.\nوش لقوا: اللي نزّلوا 7% من وزنهم ومشوا 150 دقيقة في الأسبوع قلّ عندهم خطر السكري 58%، والدواء قلّله 31% بس.\nوش استفدنا: أثبتت أن تغيير نمط الحياة أقوى من الدواء في الوقاية من السكري النوع الثاني، وصار هذا البرنامج يُطبق في دول كثيرة.","Diabetes Prevention Program, NEJM 2002"],["f","ليش يعطون الأسبرين وقت الجلطة؟","وش سووا: تجربة ISIS-2 على أكثر من 17 ألف مريض جاءتهم جلطة قلب، بعضهم أخذ أسبرين، وبعضهم دواء يذيب الجلطة، وبعضهم الاثنين، وبعضهم دواء وهمي.\nوش لقوا: الأسبرين وحده قلّل الوفيات نحو 23%، ومع مذيب الجلطة نحو 42%.\nوش استفدنا: صار الأسبرين أول شي يُعطى لمريض الجلطة في الإسعاف والطوارئ إلى اليوم، وهو دواء رخيص.","ISIS-2 Collaborative Group, The Lancet 1988"],["f","أي أكل يحمي القلب؟ (دراسة PREDIMED)","وش سووا: في إسبانيا قسموا نحو 7,400 شخص معرّضين لأمراض القلب: مجموعة أكلت أكل البحر المتوسط مع زيت زيتون بكر، ومجموعة مع مكسرات، ومجموعة أكل قليل الدهون.\nوش لقوا: مجموعتا زيت الزيتون والمكسرات قلّت عندهم الجلطات والسكتات بنحو 30%.\nوش استفدنا: أثبتت أن الدهون الصحية مثل زيت الزيتون والمكسرات تحمي القلب، وما يلزم تقليل كل الدهون.","Estruch R. et al., NEJM 2013 (وتصحيحها 2018)"],["f","هل الهرمونات بعد سن اليأس آمنة؟","وش سووا: دراسة WHI الأمريكية أعطت آلاف النساء بعد سن اليأس هرمونات أو دواءً وهميًا لسنوات.\nوش لقوا: أُوقفت مبكرًا سنة 2002 لأن الهرمونات المركبة رفعت خطر سرطان الثدي والجلطات.\nوش استفدنا: صار الأطباء يعطون الهرمونات بحذر، بأقل جرعة ولأقصر مدة، وحسب عمر المرأة ووضعها، بعد ما كانت تعطى لملايين النساء بشكل روتيني.","Writing Group for the WHI, JAMA 2002"],["f","من أين جاء غسل اليدين في المستشفيات؟","وش سووا: الطبيب زيملفايس في فيينا سنة 1847 لاحظ أن الأمهات يمتن بحمى بعد الولادة أكثر في القسم اللي يشتغل فيه الأطباء بعد تشريح الجثث. فألزمهم بغسل أيديهم بمحلول الكلور.\nوش لقوا: الوفيات نزلت من نحو 10% إلى أقل من 2%.\nوش استفدنا: هذا أصل تعقيم اليدين في كل مستشفيات العالم اليوم، مع أنه ما انقبل كلامه إلا بعد وفاته.","Semmelweis I., 1861؛ Britannica"],["f","كيف انتهى وباء الكوليرا في لندن؟","وش سووا: الطبيب جون سنو سنة 1854 رسم خريطة لبيوت الموتى بالكوليرا في حي بلندن.\nوش لقوا: الوفيات متجمعة حول مضخة ماء وحدة في شارع برود، فطلب إزالة ذراع المضخة، فتراجع الوباء.\nوش استفدنا: عرف العالم أن الكوليرا تنتقل بالماء الملوث، وبدأت مشاريع تنقية المياه والصرف الصحي، وصار جون سنو أبا علم الأوبئة.","Snow J., On the Mode of Communication of Cholera 1855"],["f","أول تجربة طبية في التاريخ تقريبًا (الإسقربوط)","وش سووا: الطبيب جيمس ليند سنة 1747 أخذ 12 بحارًا مصابين بالإسقربوط (نزيف اللثة وضعف الجسم)، وأعطى كل مجموعة علاجًا مختلفًا.\nوش لقوا: اللي أكلوا برتقال وليمون تحسنوا بسرعة، والباقي لا.\nوش استفدنا: صارت السفن تحمل الحمضيات، واختفى المرض من البحارة. وبعدها بقرن عرفنا أن السبب نقص فيتامين C.","Lind J., A Treatise of the Scurvy 1753"],["f","كيف عالجوا السل؟","وش سووا: مجلس البحوث الطبية البريطاني سنة 1948 أعطى مرضى السل المضاد الحيوي ستربتومايسين، ومجموعة ثانية بدون، واختيار المجموعة كان بالقرعة.\nوش لقوا: المرضى اللي أخذوا الدواء تحسنوا وماتوا أقل بشكل واضح.\nوش استفدنا: فتحت باب علاج السل بالأدوية، وصارت طريقة «القرعة» هذي المعيار لاختبار أي دواء جديد إلى اليوم.","Medical Research Council, BMJ 1948"],["f","كيف اكتُشف أول لقاح؟","وش سووا: الطبيب إدوارد جينر سنة 1796 لاحظ أن حلّابات البقر اللي أصابهن جدري البقر الخفيف ما يصيبهن الجدري القاتل. فأخذ من جدري البقر وطعّم به طفلًا، ثم عرّضه للجدري.\nوش لقوا: الطفل ما مرض.\nوش استفدنا: بداية علم اللقاحات كله. وبالتطعيم انتهى الجدري من العالم نهائيًا سنة 1980، وهو المرض البشري الوحيد اللي قُضي عليه.","منظمة الصحة العالمية (WHO)؛ Britannica"],["f","كيف اكتُشف البنسلين؟","وش سووا: ألكسندر فلمنج سنة 1928 رجع من إجازة ولقى عفنًا نبت في طبق بكتيريا نساه.\nوش لقوا: البكتيريا حول العفن ماتت كلها.\nوش استفدنا: من هذا العفن جاء البنسلين، أول مضاد حيوي، وأنقذ ملايين الأرواح من التهابات كانت قاتلة، مثل التهاب الجروح والرئة.","مؤسسة نوبل (NobelPrize.org)"],["f","من اكتشف سبب قرحة المعدة؟","وش سووا: الطبيبان الأستراليان مارشال ووارن لاحظوا بكتيريا اسمها الملوية البوابية في معدة مرضى القرحة، والأطباء كانوا يقولون إن السبب التوتر والأكل الحار. فشرب مارشال البكتيريا بنفسه سنة 1984.\nوش لقوا: أصيب بالتهاب في المعدة، وشُفي بالمضاد الحيوي.\nوش استفدنا: صارت القرحة تُعالج بمضاد حيوي لأسبوعين وتُشفى، بدل ما تبقى مرضًا مزمنًا. ونالا نوبل 2005.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف بدأ علاج السكري بالأنسولين؟","وش سووا: بانتنج وبست في جامعة تورنتو سنة 1921 استخلصوا الأنسولين من بنكرياس الحيوانات.\nوش لقوا: لما أعطوه لأول مريض، طفل عمره 14 سنة كان يموت من السكري سنة 1922، نزل سكره وتحسن.\nوش استفدنا: السكري النوع الأول كان قاتلًا خلال أشهر، وصار المرضى يعيشون حياة طبيعية. ونالوا نوبل 1923.","مؤسسة نوبل (NobelPrize.org)"],["f","هل ضبط السكر يمنع مضاعفاته؟","وش سووا: دراسة UKPDS البريطانية تابعت آلاف مرضى السكري النوع الثاني نحو 20 سنة، بعضهم بعلاج مكثف وبعضهم بعلاج عادي.\nوش لقوا: ضبط السكر والضغط بدقة قلّل مضاعفات العيون والكلى والأعصاب بشكل واضح.\nوش استفدنا: صار هدف علاج السكري ضبط السكر التراكمي والضغط، وعليها بُنيت إرشادات العلاج في العالم.","UKPDS, The Lancet 1998"],["f","كم ساعة نوم تكفي فعلًا؟","وش سووا: في تجربة سنة 2003 خلوا ناس ينامون 4 أو 6 أو 8 ساعات كل ليلة لأسبوعين، واختبروا تركيزهم يوميًا.\nوش لقوا: اللي ناموا 6 ساعات تراجع تركيزهم بقدر من سهر ليلة أو ليلتين كاملة، وهم يحسبون نفسهم بخير.\nوش استفدنا: النقص البسيط في النوم يتراكم ويضر بدون ما تحس. ولهذا التوصية 7 ساعات فأكثر للبالغ.","Van Dongen et al., Sleep 2003"],["f","هل الجوال وقت السواقة خطير حتى بالسماعة؟","وش سووا: في جهاز محاكاة القيادة قارنوا السائق اللي يكلم بالجوال بالسائق اللي شارب كحول فوق الحد المسموح.\nوش لقوا: المتكلم بالجوال، حتى بالسماعة، تأخر رد فعله بقدر مشابه للسكران، وصار يصدم أكثر.\nوش استفدنا: المشكلة في انشغال المخ نفسه مو في اليد. ومنها جاءت قوانين منع الجوال أثناء القيادة.","Strayer, Drews & Crouch, Human Factors 2006"],["f","وش أكثر شي يخليك سعيد وصحي في الكبر؟","وش سووا: جامعة هارفارد تتابع من سنة 1938 مئات الرجال وأسرهم طول حياتهم، أكثر من 80 سنة، بمقابلات وفحوصات.\nوش لقوا: أقوى شي يتنبأ بالسعادة والصحة في الكبر هو جودة العلاقات القريبة، مع الزوجة والأهل والأصحاب، أكثر من الفلوس والشهرة.\nوش استفدنا: الوحدة تضر الصحة مثل التدخين تقريبًا، والاهتمام بالعلاقات استثمار في صحتك.","Harvard Study of Adult Development؛ Waldinger & Schulz 2023"],["f","هل الشغل المرهق يمرّضك؟ (دراسة وايتهول)","وش سووا: تابعوا آلاف موظفي الحكومة البريطانية من سنة 1967، من الوزير إلى الساعي.\nوش لقوا: كل ما نزلت رتبة الموظف زادت أمراض القلب والوفاة، حتى بعد احتساب التدخين والأكل. والسبب الأكبر: الضغط النفسي وقلة التحكم في شغله.\nوش استفدنا: الإحساس بالسيطرة على شغلك وحياتك يحمي قلبك، وصارت بيئة العمل جزءًا من الصحة العامة.","Marmot M. et al., The Lancet 1991"],["f","هل الدماغ يتغير إذا تعلمت؟ (سائقو تاكسي لندن)","وش سووا: صوّروا أدمغة سائقي تاكسي لندن اللي يحفظون آلاف الشوارع عن ظهر قلب، وقارنوها بغيرهم.\nوش لقوا: جزء الذاكرة المكانية في الدماغ، الحُصين، أكبر عندهم، ويكبر كل ما زادت سنوات خبرتهم.\nوش استفدنا: الدماغ مثل العضلة، يتغير ويكبر بالتمرين والتعلم حتى في الكبر.","Maguire E.A. et al., PNAS 2000"],["f","هل الشاهد يتذكر صح دائمًا؟","وش سووا: عرضت لوفتس على ناس فيديو حادث سيارتين، وسألت بعضهم «كم كانت السرعة لما تحطمت السيارتان؟» وبعضهم «لما اصطدمت؟».\nوش لقوا: اللي سمعوا «تحطمت» قدّروا سرعة أعلى، وبعد أسبوع تذكر بعضهم زجاجًا مكسورًا ما كان موجودًا أصلًا.\nوش استفدنا: الذاكرة تتأثر بطريقة السؤال، فصارت المحاكم والشرطة في دول كثيرة تحذر من الأسئلة الموجهة للشهود.","Loftus & Palmer, 1974"],["f","ليش الناس يطيعون أوامر غلط؟ (تجربة ميلغرام)","وش سووا: سنة 1961 طلبوا من ناس يعطون «صدمات كهربائية» لشخص آخر كل ما غلط، والصدمات وهمية والشخص ممثل يصرخ.\nوش لقوا: نحو 65% استمروا إلى أعلى صدمة، 450 فولت، لأن الباحث بلبس رسمي قال لهم «كمّل».\nوش استفدنا: فهمنا قوة الطاعة للسلطة، وكيف يسوي ناس عاديون أشياء ضد ضميرهم. وغيرت قواعد أخلاقيات البحث العلمي.","Milgram S., 1963"],["f","ليش نوافق الجماعة حتى لو غلطانة؟ (تجربة آش)","وش سووا: سنة 1951 حطوا شخصًا وسط مجموعة متفقين سرًا، وطلبوا منهم يقارنون أطوال خطوط واضحة جدًا. والمجموعة تجاوب غلط عمدًا.\nوش لقوا: ثلاثة أرباع المشاركين وافقوا الجماعة على الجواب الغلط مرة على الأقل.\nوش استفدنا: ضغط الجماعة قوي حتى في الأشياء الواضحة. ولو وُجد شخص واحد يخالف الجماعة، قلّت الموافقة على الغلط كثيرًا.","Asch S.E., 1956"],["f","هل الأطفال يقلدون العنف اللي يشوفونه؟","وش سووا: باندورا سنة 1961 خلّى أطفالًا يشوفون شخصًا كبيرًا يضرب دمية كبيرة، وأطفالًا ثانيين يشوفونه يلعب بهدوء.\nوش لقوا: اللي شافوا الضرب قلّدوه بنفس الحركات والكلمات.\nوش استفدنا: الأطفال يتعلمون بالملاحظة والتقليد، وهذا أساس الحذر من محتوى العنف أمام الأطفال وأهمية القدوة.","Bandura, Ross & Ross, 1961"],["f","هل الحنان أهم من الأكل؟ (قرود هارلو)","وش سووا: في الخمسينيات أعطى هارلو صغار قرود «أمّين» صناعيتين: وحدة من سلك تعطي حليب، ووحدة من قماش ناعم ما تعطي شي.\nوش لقوا: الصغار قضوا أغلب وقتهم متعلقين بأم القماش، ويروحون لأم السلك بس وقت الرضاعة.\nوش استفدنا: الحنان والتلامس حاجة أساسية للطفل مثل الأكل. وغيرت طريقة رعاية الأطفال في المستشفيات ودور الأيتام.","Harlow H.F., American Psychologist 1958"],["f","هل توقعات المعلم تغيّر الطالب؟","وش سووا: سنة 1968 قالوا لمعلمين إن طلابًا معينين «بيتفوقون هالسنة»، وهم في الحقيقة مختارين عشوائيًا.\nوش لقوا: هؤلاء الطلاب تحسنت درجاتهم فعلًا، لأن المعلم صار يهتم فيهم أكثر.\nوش استفدنا: توقعاتنا من الناس تأثر فيهم. والدراسات اللاحقة لقت الأثر موجود لكنه أصغر من الدراسة الأولى.","Rosenthal & Jacobson, 1968"],["f","هل تقدر تطور ذكاءك؟ (عقلية النمو)","وش سووا: دراسات كارول دويك، وتجربة وطنية أمريكية على 12 ألف طالب سنة 2019، علّمت الطلاب في جلسة قصيرة أن الذكاء ينمو بالجهد.\nوش لقوا: تحسنت درجات الطلاب الضعاف تحسنًا صغيرًا لكنه حقيقي، وزاد إقبالهم على المواد الصعبة.\nوش استفدنا: طريقة نظرتك لقدراتك تأثر على تعلمك. ومدح الجهد أفضل من مدح الذكاء.","Yeager et al., Nature 2019"],["f","هل القراءة والكتابة تحمي من الزهايمر؟ (دراسة الراهبات)","وش سووا: من سنة 1986 تابعوا 678 راهبة أمريكية لسنوات، وقرأوا رسائل كتبنها في شبابهن، وفحصوا أدمغتهن بعد الوفاة.\nوش لقوا: اللي كانت كتاباتهن في الشباب غنية بالأفكار أصيبن بالزهايمر أقل في الكبر. وبعضهن كان في دماغهن علامات المرض لكن بدون أعراض.\nوش استفدنا: النشاط العقلي طول العمر قد يبني «احتياطًا» يحمي من أعراض الخرف.","Snowdon D.A., JAMA 1996"],["f","كيف عرفنا شكل الحمض النووي DNA؟","وش سووا: روزاليند فرانكلين صوّرت الحمض النووي بالأشعة السينية سنة 1952، واستخدم واطسون وكريك صورتها وبياناتها.\nوش لقوا: الـDNA شكله سلم ملتوي «حلزون مزدوج»، وكل درجة فيه زوج من الحروف الوراثية.\nوش استفدنا: فهمنا كيف تنتقل الصفات وكيف تتضاعف الخلايا. ومنها جاء الطب الجيني وتحاليل البصمة الوراثية وتعديل الجينات.","Watson & Crick, Nature 1953؛ Franklin & Gosling, Nature 1953"],["f","مشروع قراءة جينات الإنسان كاملة","وش سووا: مشروع دولي بدأ سنة 1990 بمشاركة مئات العلماء، لقراءة الحروف الوراثية للإنسان كلها، نحو 3 مليارات حرف.\nوش لقوا: انتهى سنة 2003، ولقوا أن عندنا نحو 20 ألف جين بس، أقل بكثير من المتوقع.\nوش استفدنا: صار ممكن اكتشاف أسباب أمراض وراثية كثيرة، وفحص الأجنة والمواليد، وتصميم أدوية للسرطان حسب جينات الورم.","المعهد الوطني لأبحاث الجينوم البشري (NHGRI)"],["f","كيف صار عندنا تعديل الجينات (كريسبر)؟","وش سووا: العالمتان شاربنتييه وداودنا سنة 2012 درسوا كيف تدافع البكتيريا عن نفسها ضد الفيروسات بقص جيناتها.\nوش لقوا: هذا النظام ممكن نوجهه ليقص أي جين نبيه بدقة، مثل المقص.\nوش استفدنا: صار ممكن تعديل الجينات بسهولة. وفي 2023 اعتُمد أول علاج بكريسبر لمرضى فقر الدم المنجلي والثلاسيميا. ونالتا نوبل الكيمياء 2020.","مؤسسة نوبل (NobelPrize.org)؛ FDA 2023"],["f","كيف صُنعت لقاحات كورونا بسرعة؟","وش سووا: الباحثة كاتالين كاريكو وزميلها وايزمان اشتغلوا من التسعينيات على استخدام مادة mRNA في العلاج، وحلّوا مشكلة إن الجسم كان يرفضها.\nوش لقوا: سنة 2005 اكتشفوا تعديلًا بسيطًا يخلي الجسم يتقبل الـmRNA بدون التهاب.\nوش استفدنا: لما جاء كورونا سنة 2020، طُوّر لقاحا فايزر وموديرنا خلال أقل من سنة بهذي التقنية. ونالا نوبل الطب 2023.","مؤسسة نوبل (NobelPrize.org)"],["f","كيف تعلمنا الربط والتعود؟ (كلاب بافلوف)","وش سووا: بافلوف كان يدرس الهضم، ولاحظ أن الكلاب يسيل لعابها قبل الأكل. فصار يرن جرسًا قبل كل وجبة.\nوش لقوا: بعد فترة صار لعاب الكلاب يسيل بمجرد سماع الجرس بدون أكل.\nوش استفدنا: فهمنا كيف نتعلم الربط بين الأشياء، وعليه قامت علاجات الخوف والرهاب، وأساليب في التربية والإعلان.","Pavlov I., Conditioned Reflexes 1927"],["f","هل الأكل الأقل يطوّل العمر؟","وش سووا: تجارب على قرود الريسوس استمرت أكثر من 20 سنة، بعضها أكلت أقل بنحو 30% من سعراتها.\nوش لقوا: القرود اللي أكلت أقل كانت أمراضها أقل، مثل السكري والسرطان. وفي دراسة جامعة ويسكونسن عاشت أطول أيضًا.\nوش استفدنا: تقليل الأكل باعتدال يحسن الصحة، وما زال العلماء يدرسون أثره على عمر الإنسان.","Mattison et al., Nature Communications 2017"],["f","هل المشي اليومي يقلل الوفاة فعلًا؟","وش سووا: تحليل كبير جمع 17 دراسة على أكثر من 226 ألف شخص، وقاسوا عدد خطواتهم اليومية.\nوش لقوا: كل زيادة 1,000 خطوة يوميًا قلّلت خطر الوفاة بنحو 15%، والفائدة تبدأ من نحو 4,000 خطوة.\nوش استفدنا: حتى المشي البسيط يفرق، ومو لازم توصل 10 آلاف خطوة عشان تستفيد.","Banach et al., European Journal of Preventive Cardiology 2023"],["f","هل الملح يرفع الضغط؟ (تجربة DASH)","وش سووا: أعطوا مجموعات من الناس أكلًا محددًا لأسابيع: أكلًا غنيًا بالخضار والفواكه والألبان قليلة الدسم، مع كميات ملح مختلفة.\nوش لقوا: هذا الأكل نزّل الضغط، وكل ما قلّ الملح نزل الضغط أكثر.\nوش استفدنا: صار «نظام DASH» من أهم توصيات علاج الضغط بدون أدوية، مع تقليل الملح إلى أقل من نحو ملعقة صغيرة يوميًا.","Sacks F.M. et al., NEJM 2001"],["f","هل أشعة الشمس تكفي لفيتامين د؟ (دراسة VITAL)","وش سووا: أكثر من 25 ألف أمريكي أخذوا فيتامين د أو أوميغا 3 أو دواءً وهميًا لنحو 5 سنوات.\nوش لقوا: المكملات ما قلّلت السرطان ولا أمراض القلب عند الأصحاء بشكل واضح.\nوش استفدنا: مكملات الفيتامينات مو سحرية للأصحاء. وتؤخذ إذا فيه نقص مثبت بالتحليل.","Manson J.E. et al., NEJM 2019"],["f","أين الطاقة في الذرة؟ (تجربة رذرفورد)","وش سووا: أطلق رذرفورد وزملاؤه سنة 1909 جسيمات صغيرة على ورقة ذهب رقيقة جدًا.\nوش لقوا: أغلبها عبر الورقة، وقليل منها ارتد للخلف.\nوش استفدنا: عرفنا أن الذرة فراغ تقريبًا وفي وسطها نواة صغيرة ثقيلة. ومن هنا بدأ فهم الطاقة النووية والأشعة الطبية وأجهزة الأشعة لعلاج السرطان.","Rutherford E., Philosophical Magazine 1911"]],"tawhid":[["q","ما أركان الإيمان؟","ستة: الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، والقدر خيره وشره.","صحيح مسلم (حديث جبريل)"],["q","ما مراتب القدر؟","أربع: العلم، أي أن الله علم كل شيء. والكتابة، أي أنه كتبه في اللوح المحفوظ. والمشيئة، أي أنه لا يكون شيء إلا بمشيئته. والخلق، أي أنه خالق كل شيء.","شفاء العليل لابن القيم؛ شرح العقيدة الواسطية لابن عثيمين"],["f","العبادة","عرّفها ابن تيمية بأنها اسم جامع لكل ما يحبه الله ويرضاه من الأقوال والأعمال الظاهرة والباطنة.","العبودية لابن تيمية"],["q","ما شرطا قبول العبادة؟","الإخلاص لله، والمتابعة للنبي ﷺ. ودليل الأول حديث «إنما الأعمال بالنيات»، والثاني حديث «من عمل عملًا ليس عليه أمرنا فهو رد».","صحيح البخاري ومسلم؛ جامع العلوم والحكم لابن رجب"],["f","الأصول الثلاثة","رسالة للشيخ محمد بن عبدالوهاب تقوم على ثلاثة أسئلة في القبر: من ربك؟ وما دينك؟ ومن نبيك؟","ثلاثة الأصول لمحمد بن عبدالوهاب"],["q","ما أنواع التوحيد التي دعا إليها الرسل؟","أصل دعوة الرسل توحيد الألوهية، أي إفراد الله بالعبادة، لقوله تعالى: ﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾.","سورة النحل 36؛ كتاب التوحيد لمحمد بن عبدالوهاب"],["f","الطاغوت","قال ابن القيم: الطاغوت ما تجاوز به العبد حده من معبود أو متبوع أو مطاع.","إعلام الموقعين لابن القيم"],["q","ما نواقض الإسلام العشرة؟","رسالة للشيخ محمد بن عبدالوهاب ذكر فيها عشرة نواقض، أعظمها الشرك في عبادة الله، ومنها السحر، والاستهزاء بالدين، وبغض شيء مما جاء به الرسول ﷺ.","نواقض الإسلام لمحمد بن عبدالوهاب"],["f","الولاء والبراء","محبة المؤمنين ونصرتهم، والبراءة من الشرك وأهله، وهو من لوازم «لا إله إلا الله» عند أهل السنة، مع العدل والإحسان لغير المحاربين.","سورة الممتحنة 4 و8؛ الولاء والبراء لمحمد القحطاني"],["q","ما الفرق بين الإسلام والإيمان والإحسان؟","الإسلام: الأعمال الظاهرة كالشهادتين والصلاة. والإيمان: الاعتقاد الباطن بالأركان الستة. والإحسان: أن تعبد الله كأنك تراه، فإن لم تكن تراه فإنه يراك. وهي مراتب متصاعدة.","صحيح مسلم (حديث جبريل)"],["f","الإيمان بالملائكة","من الإيمان بهم: الإيمان بوجودهم، وبمن عُلم اسمه كجبريل وميكائيل وإسرافيل ومالك، وبما عُلم من صفاتهم وأعمالهم كالموكلين بالوحي والمطر والموت.","شرح ثلاثة الأصول لابن عثيمين"],["q","كم عدد الرسل المذكورين في القرآن؟","خمسة وعشرون نبيًا ورسولًا، ذكر منهم ثمانية عشر في سورة الأنعام في الآيات 83 إلى 86.","تفسير ابن كثير؛ سورة الأنعام 83–86"],["f","أولو العزم من الرسل","خمسة: نوح، وإبراهيم، وموسى، وعيسى، ومحمد ﷺ، وذُكروا مجتمعين في سورة الأحزاب الآية 7 وسورة الشورى الآية 13.","تفسير ابن كثير"],["q","ما الكتب السماوية المذكورة في القرآن؟","صحف إبراهيم وموسى، والتوراة على موسى، والزبور على داود، والإنجيل على عيسى، والقرآن على محمد ﷺ، وهو الناسخ لما قبله والمهيمن عليه.","سورة الأعلى 19؛ سورة المائدة 48"],["f","الإيمان باليوم الآخر","يشمل الإيمان بفتنة القبر ونعيمه وعذابه، والبعث، والحشر، والحساب، والميزان، والصراط، والحوض، والشفاعة، والجنة والنار.","شرح العقيدة الواسطية لابن عثيمين"],["q","ما أنواع الشفاعة يوم القيامة؟","أعظمها الشفاعة العظمى للنبي ﷺ في فصل القضاء، وهي المقام المحمود. ومنها الشفاعة لأهل الجنة في دخولها، والشفاعة في أهل الكبائر من الموحدين أن يخرجوا من النار.","صحيح البخاري ومسلم؛ شرح العقيدة الطحاوية"],["f","شروط الشفاعة","إذن الله للشافع، ورضاه عن المشفوع له، لقوله تعالى: ﴿مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ﴾ وقوله: ﴿وَلَا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَىٰ﴾.","سورة البقرة 255؛ سورة الأنبياء 28"],["q","ما حكم تعليق التمائم؟","حرام، وهو من الشرك الأصغر إذا اعتقد أنها سبب، ومن الأكبر إن اعتقد أنها تنفع بذاتها، لحديث «من علق تميمة فقد أشرك». والخلاف بين العلماء في التمائم من القرآن، والأحوط تركها.","مسند أحمد؛ فتح المجيد }
function hl(html){
  if(!query)return html;
  // highlight on plain text segments only (outside tags), matching normalized query loosely by words
  const words=query.trim().split(/\s+/).filter(w=>w.length>1);
  if(!words.length)return html;
  return html.replace(/(^|>)([^<]+)(?=<|$)/g,(m,p,txt)=>{
    let out=txt;
    words.forEach(w=>{
      const re=new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(ch=>{
        if("اأإآٱ".includes(ch))return"[اأإآٱ]"; if("هة".includes(ch))return"[هة]"; if("يىئ".includes(ch))return"[يىئ]"; if("وؤ".includes(ch))return"[وؤ]"; return ch;
      }).join("[\\u064B-\\u0652\\u0640]*")+")","gi");
      out=out.replace(re,"<mark>$1</mark>");
    });
    return p+out;
  });
}
function card(it,showCat){

}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function orderFor(c){
  const keys=c.all.filter(i=>filt==="all"||i.t===filt).map(i=>i.key);
  const k=c.id+"|"+filt;let o=ord[k];

  else{shuffle(keys.filter(x=>!o.includes(x))).forEach(x=>o.push(x))}
  return k;
}
